name = "retrogames"
main = "worker.js"
compatibility_date = "2026-10-01"

# Free tier guards live in worker.js/core.js: MAX_ROOMS 120, 512B msgs,
# rate window 240/s per room, 90s idle alarm.

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "Room" },
  { name = "REGISTRY", class_name = "Registry" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Registry"]

# SESSION STORE (#1711): private R2 bucket for consented human recordings.
# Bucket `retrogames-sessions` created by Jon 2026-11-11 (issue #1711); the
# only step left is `wrangler deploy` from relay/ (or the merge-driven
# deploy-relay workflow). Reads are locked (#1711 S8): JON_KEY must be set as
# a worker secret for any admin read to succeed; until then reads fail closed.
[[r2_buckets]]
binding = "SESSIONS"
bucket_name = "retrogames-sessions"
