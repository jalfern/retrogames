name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Don't burn minutes on a stack of pushes to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, deterministic, no browser. Gates every PR.
  #
  # NB `lint:mario` is deliberately scoped. Repo-wide `npm run lint` currently
  # reports ~740 pre-existing errors in the DOS/IF titles (js-dos + ifvms
  # adapters) that are not touched by Mario work; scoping the gate keeps it
  # meaningful instead of permanently red. Fix those per-game and widen the
  # list as they go green.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # npm >=11 REQUIRED. package-lock.json was generated by npm 11, which prunes
          # the nested React-18 peer tree that js-dos's bundled react-redux@8 asks for
          # (its peers cap at react ^18; the app is react 19). npm 10 instead tries to
          # install that second React and aborts:
          #   "npm ci ... Missing: react-dom@18.3.1 from lock file"
          # Same major as the dev box (node 25 / npm 11).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:mario
      # Second scoped gate: the raycaster shares components/utils/scripts with Mario,
      # so both scopes are linted instead of the ~740-error DOS/IF tail.
      - run: npm run lint:fps
      # Third scoped gate: the AI spine (src/ai), Zork, King's Quest, and the
      # scripts/ harness. These were outside every gate before, which is how the
      # dead Hetzner AI proxy survived a whole rewrite.
      - run: npm run lint:ai
      # Browser-free AI gates: the spine's contract, then the real Zork I story
      # booted in Node. Both are fast enough to block merges; the Chrome suite is
      # not, so it stays manual.
      - run: npm run aicheck
      - run: npm run zorkcheck
      - run: npm run build

  # The self-verifying suite: real Chrome driving window.__marioTest.
  # Manual for now — it needs the dev server, real Chrome, and a working audio
  # analyser, which is the flakiest thing to run headless on a shared runner.
  # Run it from the Actions tab; promote to `pull_request` once it's been green
  # a handful of times. Locally it is just `npm run verify`.
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # npm >=11, see the note in the static job
          cache: npm
      - run: npm ci

      - name: Start dev server
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/retrogames/mario > /dev/null \
               && curl -sf http://localhost:5173/retrogames/ironkeep > /dev/null; then
              echo "dev server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "dev server never came up"; cat /tmp/vite.log; exit 1

      - name: Run the self-verifying suite
        run: npm run verify -- --full

      - name: Upload captured frames (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mario-frames
          path: scripts/.shots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Dev server log (on failure)
        if: failure()
        run: cat /tmp/vite.log
