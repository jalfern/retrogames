name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Don't burn minutes on a stack of pushes to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, deterministic, no browser. Gates every PR.
  #
  # NB `lint:mario` is deliberately scoped. Repo-wide `npm run lint` currently
  # reports ~740 pre-existing errors in the DOS/IF titles (js-dos + ifvms
  # adapters) that are not touched by Mario work; scoping the gate keeps it
  # meaningful instead of permanently red. Fix those per-game and widen the
  # list as they go green.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # npm >=11 REQUIRED. package-lock.json was generated by npm 11, which prunes
          # the nested React-18 peer tree that js-dos's bundled react-redux@8 asks for
          # (its peers cap at react ^18; the app is react 19). npm 10 instead tries to
          # install that second React and aborts:
          #   "npm ci ... Missing: react-dom@18.3.1 from lock file"
          # Same major as the dev box (node 25 / npm 11).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:mario
      # Second scoped gate: the raycaster shares components/utils/scripts with Mario,
      # so both scopes are linted instead of the ~740-error DOS/IF tail.
      - run: npm run lint:fps
      # Third scoped gate: the AI spine (src/ai), Zork, King's Quest, and the
      # scripts/ harness. These were outside every gate before, which is how the
      # dead Hetzner AI proxy survived a whole rewrite.
      - run: npm run lint:ai
      # Browser-free AI gates: the spine's contract, then the real Zork I story
      # booted in Node. Both are fast enough to block merges; the Chrome suite is
      # not, so it stays manual.
      - run: npm run aicheck
      - run: npm run zorkcheck
      # Shared VirtualControls direction logic + sliding sequence, in Node (~1s).
      - run: npm run vpadcheck
      # The #431 stick pipeline: radial dead zone + response curve + gain +
      # smoothing, pinned at Jon's constants, at the right seams. In Node (~1s).
      - run: npm run steercheck
      # Shared fitCanvas whole-multiple × dpr scale decision, in Node (~1s).
      - run: npm run fitcanvascheck
      # Fourth scoped gate: the 3D stealth title (engine/world/art/levels/stealth +
      # its two harnesses).
      - run: npm run lint:heist
      # Browser-free level audit: reachability, patrol walkability, cover near the
      # money, and proof that every locked door locks something. ~1 s, blocks merges.
      - run: npm run heistcheck
      # Fifth scoped gate + Node audit for BEEZEE: the flier's garden must be
      # provably flyable (autopilot banks a load in every garden) before merge.
      - run: npm run lint:bee
      - run: npm run beecheck
      # Sixth scoped gate for LEMMINGS-LITE: the solver must clear every level
      # with its own skill supply AND lose when a load-bearing skill is removed
      # — a level nobody can clear cannot ship.
      - run: npm run lint:lem
      - run: npm run lemcheck
      - run: npm run lint:zelda
      - run: npm run zeldacheck
      # Seventh scoped gate for BOULDER DASH: the real planner must clear every
      # cave with its hazards live (winnability + reachability + determinism), and
      # a mutation harness proves each cellular-automata rule is load-bearing.
      - run: npm run lint:dash
      - run: npm run dashcheck
      # Eighth scoped gate for SONAR ABYSS: the audit is of the INFORMATION
      # PIPELINE itself — every lit cell must equal a recomputed wavefront
      # arrival, occlusion and decay and "hidden eel" must all be provable,
      # and six mutants prove each rule load-bearing.
      - run: npm run lint:sonar
      - run: npm run sonarcheck
      - run: npm run lint:metroid
      - run: npm run metroidcheck
      # Ninth scoped gate for MOMENTUM RUNNER: the autopilot must clear every
      # pit with >=24px of proven landing margin, enter the loop at >=1.25x the
      # centripetal need, and pass every spike holding rings — then eight
      # mutants prove each physics rule is load-bearing.
      - run: npm run lint:runner
      - run: npm run runnercheck
      # Tenth scoped gate for ICE CLIMBER CO-OP: the autopilot must bore all
      # three mountains (69 real tile removals), win THE STACK by standing on
      # a partner, and every rule — dig, shoulder, climb, jump, key paths —
      # must have a mutant that dies proving it is load-bearing.
      - run: npm run lint:ice
      - run: npm run icecheck
      # Twelfth scoped gate: GALAGA. The path library is sampled offline and
      # every dive is audited live (step size, band honesty, tree order, the
      # capture/rescue chain, determinism) — scripted enemies are only
      # "readable and dodgeable" if a harness proves the paths exist per tick.
      - run: npm run lint:galaga
      - run: npm run galactcheck
      # Eleventh scoped gate: /forge's factory floor. forgecheck renders the real
      # component in Node and proves the animation cannot lie about the data
      # (queue card count, gate color, anvil freshness, cart flips). ~1 s.
      - run: npm run lint:forge
      - run: npm run forgecheck
      # Thirteenth scoped gate: POLARITY. The volley rhythm promise, a per-tick
      # fairness scan through the same step() the player drives, the muscle pins,
      # and six mutants all run in Node in seconds — the same proof that makes
      # the attract demo an honest replay instead of theatre.
      - run: npm run lint:polar
      - run: npm run polarcheck
      # Fourteenth scoped gate: MISSILE BATTLE. Script audit + frozen random +
      # the slack rule (every wave re-solved with one fewer interceptor per
      # battery) + six mutants, all in Node.
      - run: npm run lint:missile
      - run: npm run missilecheck
      # Fifteenth scoped gate: SIMCITY-MIN. Ledger conservation to the cent,
      # the job-gated growth curve, the disaster script, and the slack rule
      # (every map re-solved with one fewer plant, one fewer station and
      # $150 less) — plus seven mutants, all in Node in seconds.
      - run: npm run lint:sim
      - run: npm run citycheck
      # Sixteenth scoped gate: OUTPOST. The job-queue contract (claims are
      # one-to-one and RETURN when a dwarf dies), A* proven optimal against
      # BFS, the sealed-beacon generator (a stroll win is a failure), the
      # food ledger to the unit, the slack rule (every seed still clears
      # with one fewer dwarf and one fewer ration) — plus seven mutants.
      - run: npm run lint:outpost
      - run: npm run outpostcheck
      # Seventeenth scoped gate: PAPERS, PLEASE-MIN. The fairness prover grades
      # every generated applicant twice (booth view vs generator truth) and
      # every deny must carry a printed witness; the trap contract pins that a
      # naive eye misjudges EXACTLY the planted traps; the slack rule re-runs
      # each week as the clumsy inspector; seven mutants must die.
      - run: npm run lint:papers
      - run: npm run paperscheck
      # Eighteenth scoped gate: LODE RUNNER-LITE (1983 rules). The no-jump
      # solver must clear all three vaults with guards hunting on the real
      # pathfinder, replay hash-identical from its own command stream, and
      # still clear each vault with one fewer life (the slack rule). Five
      # mutants prove the diagonal dig, the guard chase, the rope catch, the
      # guard-hole fall/climb and the guard's gold steal are each load-bearing.
      - run: npm run lint:lode
      - run: npm run lodecheck -- --mutate
      # Nineteenth scoped gate: ARENA ARCHERY. The 45° closed form and the
      # flat-drop form are pinned to the cell against the integrator the
      # arrows actually fly; the arrow ledger (quiver+fly+stuck+hit+lost ==
      # total+resupply) is asserted every tick of every match; the autopilot
      # must WIN both arenas by the exact win condition; slack (quiver-1 AND
      # the foe gifted the first point) still wins; determinism three ways
      # with a both-players-stamp tick proven. Six mutants — stick, mid-air
      # knockout, pull, arrow gravity, jump contract, clock — must die.
      - run: npm run lint:archery
      - run: npm run archerycheck -- --mutate
      # Twentieth scoped gate: WWI DOGFIGHT. The flight model is pinned to
      # the closed forms (trim = terminal speed, stall drops the nose, the
      # zoom ledger pays in m/s, glides never gain energy); the bullet
      # integrator is held tick-for-tick against an independent integration;
      # the rounds ledger is exact every tick (a NaN belt once silently
      # disarmed the patrol — only per-tick accounting catches that); the
      # autopilot wins both patrols by the gun alone, with slack (20 rounds
      # and 40 m of altitude gone) still winning; seven mutants must die.
      - run: npm run lint:dog
      - run: npm run dogfightcheck -- --mutate
      # Twenty-first scoped gate: MINESWEEPER. The fairness referee IS the
      # generator's gate — so every battery board is re-certified independently:
      # witness audit (every dug cell carries the rule that dug it — the
      # guess-path that poisoned two solver eras dug with no witness),
      # sequential replay (a board the batch solve "wins" but one-cell-at-a-
      # time play stalls on is a lying referee), zero guesses under the SLACK
      # gate (chording forbidden), and a plant-time budget (an honest stall
      # replaced a poisoned fast path; a 12s board is a design failure).
      # Three mutants — guess-dig, nesting check, witness drop — must die.
      - run: npm run lint:sweep
      - run: npm run sweepcheck -- --mutate
      # Twenty-second scoped gate: PAPERBOY. The route DP shares the sim's
      # blocked-geometry; the gate proves every door is throwable at full
      # throttle AND at a crawl with tighter windows and zero spare papers
      # (slack), and six mutants die. ~1 s, blocks merges.
      - run: npm run lint:paper
      - run: npm run papercheck -- --mutate
      # Twenty-third scoped gate: WIZARDRY. The generator may never referee its
      # own maze (an independent BFS re-proves every seeded floor), the round
      # ledger is recomputed from STATE not from the event's own arithmetic,
      # the campaign must be won by the shipped solver — and re-won with one
      # fewer consumed potion, one fewer consumed spring, and every spring
      # deleted (the slack rule). Five mutants must die. ~1 s, blocks merges.
      - run: npm run lint:wiz
      - run: npm run wizcheck -- --mutate
      # Twenty-fourth scoped gate: the arcade menu's attribution (issue #172).
      # The registry imports for real — every entry (incl. hidden) must carry a
      # valid builtBy — and the real GamesList is rendered in Node: one tag per
      # visible card, agreeing with the registry per path. ~1 s, blocks merges.
      - run: npm run builtbycheck
      # PWA escape hatch (#437): manifest start_url in scope, sw cache version
      # past v1, ARCADE/PAUSE chrome on every game route and nowhere else, and
      # the synthetic '?' still speaking both pause dialects. ~1 s, blocks merges.
      - run: npm run navcheck
      # Registry audit (#379): every entry's visibility is absent (='private')
      # or exactly 'public'/'private', nothing is 'public' before Jon's first
      # promotion, no code outside the registry reads the field, and the docs
      # carry the contract. ~1 s, blocks merges.
      - run: npm run visibilitycheck
      # Twenty-fifth scoped gate: SPY HUNTER. The two stages are audited as
      # DATA before anyone drives them (oil may never seal three lanes,
      # nothing spawns off-road, every scripted car reaches the driving row);
      # the score ledger is recomputed from the events the machine booked;
      # the slack rule re-wins the campaign with fewer missiles per crate,
      # with no missiles at all, and with one fewer life; six mutants die.
      - run: npm run lint:hunter
      - run: npm run huntercheck -- --mutate
      # Twenty-sixth scoped gate: EXCITEBIKE. The carved heightmap is audited for
      # jump-recoverability (every ramp a rider can actually land), the whole race
      # ledger is recomputed from the events the machine booked, the slack rule
      # re-wins with a colder engine budget, and nine mutants — boost, water stall,
      # the immortal engine, a free nose-down landing, frictionless mud, an
      # un-feathery brake, the mash-out, a free over-rotation and a gate that never
      # lifts — must all die. ~20 s in Node, blocks merges.
      - run: npm run lint:excite
      - run: npm run excitecheck -- --mutate
      # Twenty-seventh scoped gate: SUPER MARIO KART. The circuit is audited as
      # DATA before anyone drives it (minimum radius, no road self-crossing,
      # every feature on asphalt); the whole 5-lap GP is then raced in Node by
      # the same autopilot the attract demo replays — it must WIN from last,
      # and still win with every item box deleted (the slack rule); laps must
      # be checkpoint-honest; determinism is hash-for-hash; one mutant (the
      # checkpoint gate) must die. ~3 s, blocks merges.
      - run: npm run lint:kart
      - run: npm run kartcheck
      # Twenty-eighth scoped gate: TETRIS (NES). The NTSC gravity table is pinned
      # against the literal NES numbers (not the sim's own constants — a check that
      # imports the number it audits cannot see the number change), DAS 16/6 and
      # the 2f soft drop are measured tick-exact, the score ledger is recomputed
      # per clear, the RNG is pinned to the LFSR period residues, and the
      # autopilot that drives the attract demo clears lines on every probe seed.
      - run: npm run lint:tetris
      - run: npm run tetrischeck
      # Twenty-ninth scoped gate: JOUST (Williams 1982). The joust rule (the
      # lower lance loses; dead-even kills both), the egg chain (kill -> egg ->
      # collect or hatch into the next-stronger rider), the wrap, the troll
      # hand, crumble timing and the wave ledger are all pinned against
      # literal numbers in the pure sim, and the autopilot that drives the
      # attract demo clears waves 1-2 with the score ledger recomputed.
      - run: npm run lint:joust
      - run: npm run joustcheck
      # Thirtieth scoped gate: Q*BERT (Gottlieb 1982). The 28-cube geometry
      # (symmetric diagonals, the fall-off-the-skirt edges, the disc-at-apex
      # rule), the flip state machines (all-green round 1, 5-colour cycle
      # round 2+), the Coily chase (spawns at flip 9, strictly closes, kills
      # on contact), the disc lure radius (+500, distant snakes stay), the
      # balls/row-runners/slick, the 25/50/100 chain ledger and the pilot
      # (clears round 1 with lives-1 slack on 8 seeds, hash-for-hash) are all
      # pinned against literal numbers in the pure sim.
      - run: npm run lint:qbert
      - run: npm run qbertcheck
      # ARKANOID: geometry flood-check, capsule uniqueness, paddle/silver/gold
      # rule pins, the 15-eye boss ledger, determinism and the pilot's
      # zero-death full clear, all in Node.
      - run: npm run lint:ark
      - run: npm run arkcheck
      # DIG DUG: pump-chain stage pins, depth-scaled payout ledger, ghost/flee
      # rules, rock-crush column math, veggie gating, pilot win + lives-1 slack,
      # determinism, and 4 mutants that must die — all in Node.
      - run: npm run lint:dug
      - run: npm run dugcheck -- --mutate
      # BUBBLE BOBBLE: independent reachability audit of all 100 generated
      # caves, trap/pop/chain ledger, EXTEND letters, water snails, transforms,
      # lightning, von Blubba, the boss and door discipline, win path, pilot +
      # lives-1 slack, determinism, and 3 mutants that must die — all in Node.
      - run: npm run lint:bob
      - run: npm run bobcheck -- --mutate
      # Twentieth scoped gate: MARBLE MADNESS. Determinism (identical inputs,
      # identical stateHash), the six-course connectivity proof, the carry/bank
      # clock contract, void/breakdrop/muncher/steelie rules through the same
      # step() the player drives, and the autopilot six-race WIN replay — all
      # in Node. Mutant it: BREAKDROP=99 in levels.js turns red.
      - run: npm run lint:marble
      - run: npm run marblecheck
      # Twenty-first scoped gate: GAUNTLET. Geometry (stairs key-locked, keys
      # outside the locks), the slam/lock/potion/generator/Death rules through
      # the same step() the player drives, the score ledger, the four-maze
      # autopilot WIN on four seeds plus the slack re-win, and determinism.
      # Mutant it: CFG.drainEvery -> never drains turns red.
      - run: npm run lint:gauntlet
      - run: npm run gauntletcheck -- --mutate
      # MYST: the whole island graph, every puzzle gate (lever, stars, safe,
      # switches, sphere, fireplace), all eight pages, both trap endings and
      # the white-page win. Proven to bite: forcing a locked door open reds it.
      - run: npm run lint:myst
      - run: npm run mystcheck
      # THE BARD'S TALE: independent-BFS floor audit (locked doors are true
      # chokepoints hiding their key), engine pins (potion/ale/heal cost, the
      # tower gate refuses without the key, the Board grants it only once all five
      # tower floors are proven), the attract campaign winning Mangar on the live
      # sim, the slack rule (re-wins with one fewer ale and one fewer potion), and
      # determinism. All in Node.
      - run: npm run lint:bards
      - run: npm run bardscheck
      # SSX: downhill riding pins (gravity/carving/powder/wall), the trick
      # ledger (spin+grab banks, half-done flips bail, chains to x4, OVER
      # doubles), the boost economy (drain, ceiling, crash dumps half), rails,
      # finish/standings bookkeeping, the autopilot WINNING all three heats
      # AND Showoff, the slack rule (0.75x trick economy + chain x3 still
      # wins), hash-for-hash determinism, and the no-Math.random ban on the
      # spine. All in Node. Mutant it: the bail rule off turns red.
      - run: npm run lint:ssx
      - run: npm run ssxcheck
      # PRINCE OF PERSIA: the movement economy (run/skid/careful-step/jump-
      # scaling/hang+climb), the traps (loose tiles, plate-latched spike ports,
      # the seam-free guillotine), the three-height duel (match-height parry,
      # strike-the-open-height), potions and the 60-minute clock, the autopilot
      # WINNING all five screens, the slack rule (0.75x clock + every guard
      # hp-1 still rescues her), hash-for-hash determinism and the
      # no-Math.random ban on the spine. All in Node. Mutant it: the parry
      # height check off turns red.
      - run: npm run lint:pop
      - run: npm run popcheck
      # SMASH TV: geometry of every room, one-hit lethality + the sealed-until-
      # clear exits, the crate->gun ladder and POWER economy, the firebomb tax,
      # the bonus-room clock and combo ledger, the ANNOUNCER win, the pilot WIN
      # on nine seeds plus the slack re-win, the score ledger and determinism.
      # Mutant it: exits opening early turns red.
      - run: npm run lint:smash
      - run: npm run smashcheck -- --mutate
      # OUT RUN: segment-projection perspective + hill crests, the merge-back fork
      # lattice (ids 1-15, five goals), the checkpoint-clock economy, LOW/HIGH gear
      # ceilings, centrifugal force, the traffic-bog vs roadside-flip crash rules, a
      # deathless five-stage autopilot win, and the slack rule (re-wins with 3s off
      # every checkpoint, dies at 4). Four mutants must die — all in Node.
      - run: npm run lint:outrun
      - run: npm run outruncheck -- --mutate
      # LUNAR LANDER: terrain flatness/pad geometry across seeds, gravity/fuel/crash
      # rules through the same step() the player drives, the pad×multiplier + fuel
      # bonus ledger, the dock chain, a deathless five-mission autopilot win on four
      # seeds, and the slack rule (−110 fuel still wins deathless, −115 loses). Four
      # mutants must die — all in Node.
      - run: npm run lint:lander
      - run: npm run landercheck -- --mutate
      - run: npm run landerpolicy
      - run: npm run landerheatcheck
      - run: npm run lint:tempest
      - run: npm run tempestcheck -- --mutate
      # PWA scope gate (#433): lint the SW + contract scripts, then verify the
      # BUILT shell is installable — manifest scope/start_url are /retrogames/,
      # the SW excludes /retrogames/forge, vercel resolves the pwa assets ahead
      # of the SPA catch-all, and every home-screen icon decodes at its size.
      - run: npm run lint:pw
      - run: npm run build
      - run: npm run pwacheck

  # The "a job never rendered" gate. Job 2 shipped having NEVER mounted (an empty
  # fence batch threw inside the mount effect) and both gates were green:
  # heistcheck audits levels/stealth in Node and never touches the renderer, and
  # the suites that do render are the slow manual ones. This job renders each
  # job in a real browser, samples real pixels, and moves the raccoon with a
  # real stick — ~10 s of checking, so it can afford to gate every PR.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # npm >=11, see the note in the static job
          cache: npm
      - run: npm ci
      # Downloaded browser rather than the runner's system Chrome: it is the same
      # pinned binary everywhere and does not depend on which browsers the runner
      # image happens to ship this month. SHOT_CHANNEL tells harness.launch() too.
      # playwright-core ships the browser-install CLI too (verified: `node
      # node_modules/playwright-core/cli.js install` exists), so no second
      # playwright package is needed — same pinned version that launches above.
      - run: npx playwright-core install --with-deps chromium
      - name: Start dev server
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/retrogames/raccoon-heist > /dev/null; then
              echo "dev server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "dev server never came up"; cat /tmp/vite.log; exit 1
      - name: Heist smoke (mount + render + move, all three jobs)
        run: npm run heistsmoke
        env:
          SHOT_CHANNEL: chromium
          HEIST_LITE: "1"
      - name: VPad boot (every #384-step-1 route boots clean; stick zone iff the registry says stick)
        run: npm run vpadboot
        env:
          SHOT_CHANNEL: chromium
      - name: "Tap-to-start (#430): a real touch TAP starts every tapStart-flagged game via the shared shell"
        run: npm run tapstartcheck
        env:
          SHOT_CHANNEL: chromium
          TAP_ONLY: "1"
          TAP_CANVAS: "1"
      - name: Polarity smoke (real keys, pixels graded against physics)
        run: npm run polarplay
        env:
          SHOT_CHANNEL: chromium
      - name: Missile Battle smoke (real keys, lead-aimed shots, pixels vs physics)
        run: npm run missileplay
        env:
          SHOT_CHANNEL: chromium
      - name: SimCity-Min smoke (real keys, pixels vs the road graph, disasters that wait for a city)
        run: npm run cityplay
        env:
          SHOT_CHANNEL: chromium
      - name: Outpost smoke (real keys, pixels vs the job queue, a dwarf digs on camera)
        run: npm run outpostplay
        env:
          SHOT_CHANNEL: chromium
      - name: Papers-Please-Min smoke (real keys at the booth, ink vs verdict, the week ends as the prover says)
        run: npm run papersplay
        env:
          SHOT_CHANNEL: chromium
      - name: Lode Runner-Lite smoke (real keys in the vault, pixels vs the dig, the replay hash-matches in the page)
        run: npm run lodeplay
        env:
          SHOT_CHANNEL: chromium
      - name: Arena Archery smoke (real keys, drawn archer at the logical cell, your arrow loosed by id, live replay hash-matches in the page)
        run: npm run archeryplay
        env:
          SHOT_CHANNEL: chromium
      - name: WWI Dogfight smoke (real keys, instruments read the sim, a bandit is pixels where the sim puts him, a pull drains airspeed into altitude)
        run: npm run dogfightplay
        env:
          SHOT_CHANNEL: chromium
          DOG_LITE: "1"
      - name: Paperboy smoke (real keys, drawn boy sits where the physics projects him, a timed throw scores, a crash pays a life)
        run: npm run paperplay
        env:
          SHOT_CHANNEL: chromium
      - name: Wizardry smoke (real keys walk a seeded maze, the view matches the grid pixel-for-pixel, a stepped-on ambush fights back, the stairs answer SPACE)
        run: npm run wizplay
        env:
          SHOT_CHANNEL: chromium
      - name: Excitebike smoke (real keys — pixels sit where the heightmap projects the bike, an air is won by the lean, the engine boils and a stalled bike pumps out)
        run: npm run exciteplay
        env:
          SHOT_CHANNEL: chromium
      - name: Zelda smoke (real keys — a cell-for-cell walk on the world grid, "?" pause opens and the frozen world ignores a held key, play resumes)
        run: npm run zeldaplay
        env:
          SHOT_CHANNEL: chromium
      - name: Dev server log (on failure)
        if: failure()
        run: cat /tmp/vite.log

  # The self-verifying suite: real Chrome driving window.__marioTest.
  # Manual for now — it needs the dev server, real Chrome, and a working audio
  # analyser, which is the flakiest thing to run headless on a shared runner.
  # Run it from the Actions tab; promote to `pull_request` once it's been green
  # a handful of times. Locally it is just `npm run verify`.
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # npm >=11, see the note in the static job
          cache: npm
      - run: npm ci

      - name: Start dev server
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/retrogames/mario > /dev/null \
               && curl -sf http://localhost:5173/retrogames/ironkeep > /dev/null; then
              echo "dev server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "dev server never came up"; cat /tmp/vite.log; exit 1

      - name: Run the self-verifying suite
        run: npm run verify -- --full

      # TETRIS play-driver: real keys, pixels vs the DAS ledger, honest top-out.
      # It passes 24/24 locally but goes flaky under sustained CDP polling on the
      # shared runner (the tab's rAF starves and the world stalls mid-mash) —
      # until that is debugged it rides the advisory tier, not the PR gate.
      # The deterministic gate is tetrischeck in `static`.
      - name: Tetris smoke (real keys — the drawn piece sits where the DAS says it is, a rotated piece changes shape on screen, soft drop is 2 frames a row, well over, restart clean)
        run: npm run tetrisplay
        env:
          SHOT_CHANNEL: chromium
      # JOUST play-driver: real keys, pixels vs the sim, three honest lava
      # deaths and a clean restart. 12/12 locally; rides the advisory tier.
      # The deterministic gate is joustcheck in `static`.
      - name: Joust smoke (real keys — the drawn rider sits where the sim says it is, flapping climbs, lava takes three lives, restart is clean)
        run: npm run joustdive
        env:
          SHOT_CHANNEL: chromium
      # Q*BERT play-driver: real arrow-pair keys, pixels vs the sim, the
      # balloon rides a snake death, falls burn the lives, restart is clean.
      # 15/15 locally; rides the advisory tier like joustdive/tetrisplay.
      # The deterministic gate is qbertcheck in `static`.
      - name: Q*BERT smoke (real keys — the drawn bird sits where the sim says it is, a diagonal hop flips a cube, balloon, falls, restart clean)
        run: npm run qbertdive
        env:
          SHOT_CHANNEL: chromium
      # BUBBLE BOBBLE play-driver: real keys, pixels vs the sim, a real walker
      # takes a life, two-player seating works. Advisory tier like joustdive.
      # The deterministic gate is bobcheck in `static`.
      - name: Bubble Bobble smoke (real keys — the drawn dragon sits where the sim says it is, SPACE blows a real bubble, a walker takes a life, key 3 seats two players)
        run: npm run bubbleplay
        env:
          SHOT_CHANNEL: chromium
      # The scripted heist: Chrome plays job 1 end to end and asserts it can walk,
      # steal, get spotted, get caught, get rescued and get out.
      - name: Play the heist
        run: npm run heistplay

      # Everything above runs against the DEV server, where the `__*Test` hooks
      # exist and Vite resolves `/retrogames/...` for us. prodsmoke builds and
      # drives the PRODUCTION bundle instead: base-path resolution (the doubled
      # `/retrogames/retrogames/` that broke every DOS title in dev is only
      # visible against a real static server), js-dos fetched on demand and NOT
      # on titles that cannot use it, WebGL readback, and real keyboard input
      # with no test hooks to lean on.
      - name: Production-bundle smoke (builds + previews)
        run: npm run prodsmoke

      - name: Upload captured frames (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mario-frames
          path: scripts/.shots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Dev server log (on failure)
        if: failure()
        run: cat /tmp/vite.log
