  # Advisory (branch protection requires only `static`). Scoped per #601; the
  # full set replays nightly. ~10 s of checking per included game.
  smoke:
    needs: scope
    runs-on: ubuntu-latest
    env:
      KEYS: ${{ needs.scope.outputs.keys }}
      SHOT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: needs.scope.outputs.docs != 'true'
        with:
          node-version: 24   # npm >=11, see the note in the static job
          cache: npm
      - run: npm ci
        if: needs.scope.outputs.docs != 'true'
      - run: npx playwright-core install --with-deps chromium
        if: needs.scope.outputs.docs != 'true'
      - name: Start dev server
        if: needs.scope.outputs.docs != 'true'
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/retrogames/raccoon-heist > /dev/null; then
              echo "dev server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "dev server never came up"; cat /tmp/vite.log; exit 1
      - name: Heist smoke (mount + render + move, all three jobs)
        if: contains(fromJSON(env.KEYS), 'heist')
        run: npm run heistsmoke
        env:
          HEIST_LITE: "1"
      - name: VPad boot (every #384-step-1 route boots clean; stick zone iff the registry says stick)
        if: contains(fromJSON(env.KEYS), 'core')
        run: npm run vpadboot
      - name: "Tap-to-start (#430): a real touch TAP starts every tapStart-flagged game via the shared shell"
        if: contains(fromJSON(env.KEYS), 'core')
        run: npm run tapstartcheck
        env:
          TAP_ONLY: "1"
          TAP_CANVAS: "1"
      # #1099/#1109: help, title and caption text never overflows the viewport
      # or covers the pad/chrome on any game or demo (3 viewports, ~225 gates).
      # Advisory like the rest of this job; it rides `core`, so shared
      # component PRs pay it and game-only PRs do not.
      - name: "Text-fit sweep (#1099): no help/title/caption text overflows or covers pad/chrome, 3 viewports"
        if: contains(fromJSON(env.KEYS), 'core')
        run: npm run textfitcheck
      - name: Polarity smoke (real keys, pixels graded against physics)
        if: contains(fromJSON(env.KEYS), 'polar')
        run: npm run polarplay
      - name: Missile Battle smoke (real keys, lead-aimed shots, pixels vs physics)
        if: contains(fromJSON(env.KEYS), 'missile')
        run: npm run missileplay
      - name: SimCity-Min smoke (real keys, pixels vs the road graph, disasters that wait for a city)
        if: contains(fromJSON(env.KEYS), 'sim')
        run: npm run cityplay
      - name: Outpost smoke (real keys, pixels vs the job queue, a dwarf digs on camera)
        if: contains(fromJSON(env.KEYS), 'outpost')
        run: npm run outpostplay
      - name: Papers-Please-Min smoke (real keys at the booth, ink vs verdict, the week ends as the prover says)
        if: contains(fromJSON(env.KEYS), 'papers')
        run: npm run papersplay
      - name: Lode Runner-Lite smoke (real keys in the vault, pixels vs the dig, the replay hash-matches in the page)
        if: contains(fromJSON(env.KEYS), 'lode')
        run: npm run lodeplay
      - name: Arena Archery smoke (real keys, drawn archer at the logical cell, your arrow loosed by id, live replay hash-matches in the page)
        if: contains(fromJSON(env.KEYS), 'archery')
        run: npm run archeryplay
      - name: WWI Dogfight smoke (real keys, instruments read the sim, a bandit is pixels where the sim puts him, a pull drains airspeed into altitude)
        if: contains(fromJSON(env.KEYS), 'dog')
        run: npm run dogfightplay
        env:
          DOG_LITE: "1"
      - name: Paperboy smoke (real keys, drawn boy sits where the physics projects him, a timed throw scores, a crash pays a life)
        if: contains(fromJSON(env.KEYS), 'paper')
        run: npm run paperplay
      - name: TEN-DEEP smoke (real keys walk a seeded maze, the view matches the grid pixel-for-pixel, a stepped-on ambush fights back, the stairs answer SPACE)
        if: contains(fromJSON(env.KEYS), 'tendeep')
        run: npm run tendeepplay
      - name: Excitebike smoke (real keys — pixels sit where the heightmap projects the bike, an air is won by the lean, the engine boils and a stalled bike pumps out)
        if: contains(fromJSON(env.KEYS), 'excite')
        run: npm run exciteplay
      - name: Zelda smoke (real keys — a cell-for-cell walk on the world grid, "?" pause opens and the frozen world ignores a held key, play resumes)
        if: contains(fromJSON(env.KEYS), 'zelda')
        run: npm run zeldaplay
      - name: Dev server log (on failure)
        if: failure()
        run: cat /tmp/vite.log

  # #887 — ADVISORY, like `smoke` (branch protection still requires only
  # `static`). A PR that touches code every game page loads (scripts/checks.mjs
  # SHARED) pays the nightly play-smoke set right on the PR, so an off-prod
  # break of the #868 kind (relay CORS logging console.error on every page, red
  # three nights running before anyone saw it) shows here instead of freezing
  # merges the next morning. Game-only PRs never see this job (shared=false).
  prsmokes:
    needs: scope
    if: needs.scope.outputs.shared == 'true'
    runs-on: ubuntu-latest
    env:
      SHOT_CHANNEL: chromium
      HEIST_LITE: "1"
      DOG_LITE: "1"
      TAP_ONLY: "1"
      TAP_CANVAS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # npm >=11, see the note in the static job
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Start dev server
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/retrogames/raccoon-heist > /dev/null; then
              echo "dev server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "dev server never came up"; cat /tmp/vite.log; exit 1
      - run: npm run nightlysmokes
      - name: Dev server log (on failure)
        if: failure()
        run: cat /tmp/vite.log

  # The self-verifying suite: real Chrome driving window.__marioTest.
  # Manual for now — it needs the dev server, real Chrome, and a working audio
  # analyser, which is the flakiest thing to run headless on a shared runner.
  # Run it from the Actions tab; promote to `pull_request` once it's been green
  # a handful of times. Locally it is just `npm run verify`.
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # npm >=11, see the note in the static job
          cache: npm
      - run: npm ci

      - name: Start dev server
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/retrogames/mario > /dev/null \
               && curl -sf http://localhost:5173/retrogames/ironkeep > /dev/null; then
              echo "dev server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "dev server never came up"; cat /tmp/vite.log; exit 1

      - name: Run the self-verifying suite
        run: npm run verify -- --full

      # TETRIS play-driver: real keys, pixels vs the DAS ledger, honest top-out.
      # It passes 24/24 locally but goes flaky under sustained CDP polling on the
      # shared runner (the tab's rAF starves and the world stalls mid-mash) —
      # until that is debugged it rides the advisory tier, not the PR gate.
      # The deterministic gate is tetrischeck in `static`.
      - name: Tetris smoke (real keys — the drawn piece sits where the DAS says it is, a rotated piece changes shape on screen, soft drop is 2 frames a row, well over, restart clean)
        run: npm run tetrisplay
        env:
          SHOT_CHANNEL: chromium
      # JOUST play-driver: real keys, pixels vs the sim, three honest lava
      # deaths and a clean restart. 12/12 locally; rides the advisory tier.
      # The deterministic gate is joustcheck in `static`.
      - name: Joust smoke (real keys — the drawn rider sits where the sim says it is, flapping climbs, lava takes three lives, restart is clean)
        run: npm run joustdive
        env:
          SHOT_CHANNEL: chromium
      # Q*BERT play-driver: real arrow-pair keys, pixels vs the sim, the
      # balloon rides a snake death, falls burn the lives, restart is clean.
      # 15/15 locally; rides the advisory tier like joustdive/tetrisplay.
      # The deterministic gate is qbertcheck in `static`.
      - name: Q*BERT smoke (real keys — the drawn bird sits where the sim says it is, a diagonal hop flips a cube, balloon, falls, restart clean)
        run: npm run qbertdive
        env:
          SHOT_CHANNEL: chromium
      # BUBBLE BOBBLE play-driver: real keys, pixels vs the sim, a real walker
      # takes a life, two-player seating works. Advisory tier like joustdive.
      # The deterministic gate is bobcheck in `static`.
      - name: Bubble Bobble smoke (real keys — the drawn dragon sits where the sim says it is, SPACE blows a real bubble, a walker takes a life, key 3 seats two players)
        run: npm run bubbleplay
        env:
          SHOT_CHANNEL: chromium
      # The scripted heist: Chrome plays job 1 end to end and asserts it can walk,
      # steal, get spotted, get caught, get rescued and get out.
      - name: Play the heist
        run: npm run heistplay

      # Everything above runs against the DEV server, where the `__*Test` hooks
      # exist and Vite resolves `/retrogames/...` for us. prodsmoke builds and
      # drives the PRODUCTION bundle instead: base-path resolution (the doubled
      # `/retrogames/retrogames/` that broke every DOS title in dev is only
      # visible against a real static server), js-dos fetched on demand and NOT
      # on titles that cannot use it, WebGL readback, and real keyboard input
      # with no test hooks to lean on.
      - name: Production-bundle smoke (builds + previews)
        run: npm run prodsmoke

      - name: Upload captured frames (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mario-frames
          path: scripts/.shots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Dev server log (on failure)
        if: failure()
        run: cat /tmp/vite.log
