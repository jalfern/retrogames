name: CI

# #601: a PR pays only for what it changed.
#   scope   — git diff -> gate list (scripts/ciscope.mjs + scripts/checks.mjs)
#   static  — REQUIRED check. Scoped lints/checks, no `--mutate` (those run
#             nightly). Docs/scripts-only PRs: selftest + nothing else.
#   smoke   — advisory browser steps, scoped the same way.
#   prsmokes — #887 advisory: shared-code PRs run the nightly play-smoke set.
# Push to main no longer re-runs the PR suite (the merge commit is the tree the
# PR just proved); main gets the FULL suite with mutants every night in
# nightly.yml, and scripts/main-ok.sh freezes merges while that is red.
on:
  pull_request:
  workflow_dispatch:

# Don't burn minutes on a stack of pushes to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.scope.outputs.docs }}
      keys: ${{ steps.scope.outputs.keys }}
      shared: ${{ steps.scope.outputs.shared }}
    steps:
      - uses: actions/checkout@v7
      - name: Changed files -> gate list
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD > /tmp/changed.txt
            cat /tmp/changed.txt
            node scripts/ciscope.mjs /tmp/changed.txt
          else
            node scripts/ciscope.mjs --all
          fi

  # Fast, deterministic, no browser. Gates every PR — scoped per #601.
  # Shared code (components/utils/config/pages/lockfile/workflows) fans out to
  # every scope; an unknown src/games/<Dir> escalates to all, so a new game
  # can never quietly dodge its gates. Repo-wide `npm run lint` stays
  # deliberately unscoped-off (~740 pre-existing DOS/IF errors).
  static:
    needs: scope
    runs-on: ubuntu-latest
    env:
      KEYS: ${{ needs.scope.outputs.keys }}
    steps:
      - uses: actions/checkout@v7
      # Drift detector: every alias in scripts/checks.mjs must exist and the
      # scope fixtures must hold. No install needed; also the whole of a
      # docs-only PR's CI (< 1 min).
      - run: node scripts/ciscope.mjs --selftest
      - uses: actions/setup-node@v7
        if: needs.scope.outputs.docs != 'true'
        with:
          # npm >=11 REQUIRED — see docs/HARNESS.md (js-dos peer tree vs npm 10).
          node-version: 24
          cache: npm
      - run: npm ci
        if: needs.scope.outputs.docs != 'true'
      - run: npm run lint:mario
        if: contains(fromJSON(env.KEYS), 'mario')
      - run: npm run lint:fps
        if: contains(fromJSON(env.KEYS), 'fps')
      - run: npm run lint:ai
        if: contains(fromJSON(env.KEYS), 'ai')
      - run: npm run aicheck
        if: contains(fromJSON(env.KEYS), 'ai')
      - run: npm run zorkcheck
        if: contains(fromJSON(env.KEYS), 'ai')
      - run: npm run vpadcheck
