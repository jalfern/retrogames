# ONLINE 2P RELAY (#531) — deploy the Cloudflare Worker on main only.
# GitHub environment `cloudflare` supplies CLOUDFLARE_API_TOKEN (secret,
# Workers-deploy-only, expires 2027-01-17) and CLOUDFLARE_ACCOUNT_ID
# (variable). The relay forwards pads only; see relay/README.md.
name: deploy-relay

on:
  push:
    branches: [main]
    paths:
      - 'relay/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
