name: Nightly (full suite + mutants)

# #601: the complete deterministic suite with every `--mutate` variant, on main,
# once a night — the tier the PR gate gave up so one-game PRs go green in
# minutes instead of ~18. A red night freezes merges until it is fixed
# (scripts/main-ok.sh, consulted by every lane before `gh pr merge`).
# Nothing in here can block a merge directly; it only sets the freeze signal.

on:
  schedule:
    - cron: '15 6 * * *'   # after heist-nightly (05:30 UTC), quiet hours
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  full-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # npm >=11, see the note in ci.yml's static job
          cache: npm
      - run: npm ci
      - run: node scripts/ciscope.mjs --selftest
      - run: npm run build
      - run: npm run nightlychecks

  full-smoke:
    needs: full-static
    runs-on: ubuntu-latest
    env:
      SHOT_CHANNEL: chromium
      HEIST_LITE: "1"
      DOG_LITE: "1"
      TAP_ONLY: "1"
      TAP_CANVAS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Start dev server
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/retrogames/raccoon-heist > /dev/null; then
              echo "dev server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "dev server never came up"; cat /tmp/vite.log; exit 1
      - run: npm run nightlysmokes
      - name: Dev server log (on failure)
        if: failure()
        run: cat /tmp/vite.log

  shoreperf:
    # #680: quiet-box qhd numbers land nightly on a dedicated runner. The dev
    # boxes all run local LLM inference, so shoreperf's guard always says
    # CONTENDED there and the absolute fps is context, never verdict. The runner
    # must have a real GPU: qhd is 3200x2000 and the Linux CI SwiftShader path
    # boots WebGPU but cannot drive a single counted frame through the sim in the
    # window (n=0, no timestamp-query) — verified 2026-10-22 on ubuntu-latest.
    # macOS runners are quiet and Metal-backed (the known-good combo from local
    # qhd runs), so the nightly series there is the real trend line #680 asks
    # for. Advisory: continue-on-error so a perf blip never freezes merges.
    continue-on-error: true
    runs-on: macos-14
    env:
      # A GitHub-hosted runner is a dedicated box: no local LLM inference and no
      # foreign headless Chrome (the two things quietscan actually screens for).
      # Its loadavg just after checkout/npm-ci reflects Spotlight indexing of the
      # fresh clone + the build, not GPU contention, so the loadavg heuristic lies
      # here — this is the documented "dedicated runners" case for the escape hatch.
      SHOREPERF_ASSUME_QUIET: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # npm >=11, see the note in ci.yml's static job
          cache: npm
      - run: npm ci
      - name: Install headless Chromium (Linux only)
        if: runner.os != 'macOS'
        run: npx playwright-core install --with-deps chromium
      - name: shoreperf qhd
        run: |
          set -o pipefail
          node scripts/shoreperf.mjs --profile qhd --secs 6 2>&1 | tee /tmp/shoreperf-qhd.log
          { echo "## shoreperf qhd (#680)"; echo '```'; cat /tmp/shoreperf-qhd.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shoreperf-qhd
          path: /tmp/shoreperf-qhd.log

  report:
    needs: [full-static, full-smoke]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Report a red night
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="nightly is red ($(date -u +%Y-%m-%d))"
          dup=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "nightly is red in:title" --json number --jq '.[0].number // empty')
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="Nightly full suite failed — **merges are frozen until main is green again** (scripts/main-ok.sh). Run: $url"
          if [ -n "$dup" ]; then
            gh issue comment "$dup" --repo "$GITHUB_REPOSITORY" --body "Another red night: $body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
