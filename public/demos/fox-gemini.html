function dismissAttract() {
  if (screenMode === 'play') return;
  screenMode = 'play';
  attractEl.classList.add('gone');
  audio.unlock();
  updateAudioPill();
}

function updateAudioPill() {
  audioHintEl.textContent = audio.muted ? 'paws muted' : 'paws on';
  audioHintEl.classList.toggle('off', audio.muted);
}

audioHintEl.addEventListener('pointerdown', e => e.stopPropagation());
audioHintEl.addEventListener('click', e => {
  e.stopPropagation();
  audio.unlock();
  audio.setMuted(!audio.muted);
  updateAudioPill();
});

function cycleView(idx) {
  viewIdx = ((idx % VIEWS.length) + VIEWS.length) % VIEWS.length;
  const v = VIEWS[viewIdx];
  cam.tYaw = v.yaw;
  cam.tPitch = v.pitch;
  cam.tDist = v.dist;
  cam.auto = false;
}

function toggleStudy() {
  studySlow = !studySlow;
  timeScale = studySlow ? 0.22 : 1.0;
}

document.getElementById('btn-study').addEventListener('pointerdown', e => e.stopPropagation());
document.getElementById('btn-study').addEventListener('click', e => {
  e.stopPropagation();
  dismissAttract();
  toggleStudy();
});

document.getElementById('btn-view').addEventListener('pointerdown', e => e.stopPropagation());
document.getElementById('btn-view').addEventListener('click', e => {
  e.stopPropagation();
  dismissAttract();
  cycleView(viewIdx + 1);
});

// Pointer orbit + pinch/wheel zoom
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => {
  dismissAttract();
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  cam.auto = false;
  try { canvas.setPointerCapture(e.pointerId); } catch {}
});
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  cam.tYaw -= dx * 0.0075;
  cam.tPitch = clamp(cam.tPitch + dy * 0.0065, -0.05, 1.32);
});
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointercancel', () => { dragging = false; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  dismissAttract();
  cam.tDist = clamp(cam.tDist * Math.exp(e.deltaY * 0.001), 1.05, 4.2);
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') return;
  const wasAttract = screenMode === 'attract';
  dismissAttract();
  if (wasAttract && (e.key === 'Enter' || e.code === 'Space')) {
    e.preventDefault();
    return;
  }
  if (e.code === 'Space') { e.preventDefault(); toggleStudy(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); studySlow = false; timeScale = clamp(timeScale + 0.15, 0.15, 1.75); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); studySlow = false; timeScale = clamp(timeScale - 0.15, 0.15, 1.75); }
  else if (e.key === '1') cycleView(0);
  else if (e.key === '2') cycleView(1);
  else if (e.key === '3') cycleView(2);
  else if (e.key === '4') cycleView(3);
  else if (e.key === 'g' || e.key === 'G') { cam.auto = true; }
  else if (e.key === 'm' || e.key === 'M') { audio.setMuted(!audio.muted); updateAudioPill(); }
});

function resize() {
  const dpr = LITE ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.max(1, Math.floor(window.innerWidth * dpr));
  const ch = Math.max(1, Math.floor(window.innerHeight * dpr));
  if (cw !== W || ch !== H) {
    W = canvas.width = cw;
    H = canvas.height = ch;
  }
}
window.addEventListener('resize', resize);
resize();

// Footfall & breath edge detectors
let prevStance = { LH: false, RH: false, RF: false, LF: false };
let prevBreathGate = false;
let currentState = evaluateFox(strideIndex, phase);

function syncStrideEvents(st, allowAudio) {
  for (const d of LEGS_DEF) {
    const L = st.legs[d.id];
    const was = prevStance[d.id];
    if (!was && L.inStance) {
      spawnPawprint(L.paw, d.side);
      if (allowAudio) audio.playPawStrike(d.fore, d.side);
    } else if (was && !L.inStance) {
      spawnFrostKick(L.paw, d.side);
    }
    prevStance[d.id] = L.inStance;
  }
  const breathNow = st.phi >= 0.53 && st.phi < 0.65;
  if (!prevBreathGate && breathNow) {
    spawnBreathPlume(st.muzzle, st.headFwd);
    if (allowAudio) audio.playBreath();
  }
  prevBreathGate = breathNow;
}

// Pre-seed a few pawprints behind the fox at boot so the frost trail already tells the story
for (let s = -2; s <= -1; s++) {
  for (const d of LEGS_DEF) {
    const aw = anchorWorld(s, d);
    pawprints.push({ x: aw[0], y: aw[1] - PAD_CLEAR + 0.005, z: aw[2], side: d.side, age: (-s) * 0.4 });
  }
}

function updateTelemetry() {
  const gCount = LEGS_DEF.reduce((n, d) => n + (currentState.legs[d.id].inStance ? 1 : 0), 0);
  const gaitPhase = gCount === 0
    ? (currentState.spineExt > 0 ? 'EXTENDED FLIGHT' : 'GATHERED FLIGHT')
    : LEGS_DEF.filter(d => currentState.legs[d.id].inStance).map(d => d.id).join('+');
  const spd = (STRIDE_LEN / STRIDE_PERIOD) * timeScale;
  telemetryEl.textContent = `${gaitPhase} · ${spd.toFixed(1)} M/S`;
}

function renderScene() {
  resize();
  currentState = evaluateFox(strideIndex, phase);
  buildFoxMesh(foxMB, currentState);
  foxGpu.upload(foxMB);

  buildEffectsMesh(fxMB, currentState.rx, worldTime);
  fxGpu.upload(fxMB);

  const aspect = W / H;
  // Generous portrait framing so nose-to-white-brush-tip stays 100% inside 390x844!
  const isPortrait = aspect < 0.86;
  const portraitScale = isPortrait ? (0.86 / Math.max(aspect, 0.42)) * 1.28 : 1.0;
  const effDist = cam.dist * portraitScale;

  const target = [
    currentState.rx + (isPortrait ? -0.06 : 0.00),
    currentState.groundY + 0.27,
    0,
  ];
  // Yaw = 0 views right flank (+Z -> looks from +Z toward 0); yaw rotates around Y
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const eyeOffset = [
    Math.sin(cam.yaw) * cp * effDist,
    sp * effDist,
    Math.cos(cam.yaw) * cp * effDist,
  ];
  const eye = add3(target, eyeOffset);
  const minEyeY = groundHeight(eye[0], eye[2]) + 0.14;
  if (eye[1] < minEyeY) eye[1] = minEyeY;

  const fovY = 0.68; // ~39 deg crisp portrait-friendly lens
  const viewMat = mat4LookAt(eye, target, [0, 1, 0]);
  const projMat = mat4Perspective(fovY, aspect, 0.12, 52.0);
  const vpMat = mat4Mul(projMat, viewMat);

  // Tight directional shadow frustum centered on the running fox
  const lightEye = add3(target, scale3(SUN_DIR, 10.0));
  const lightView = mat4LookAt(lightEye, target, [0, 1, 0]);
  const lightProj = mat4Ortho(-3.2, 3.2, -2.4, 2.4, 1.0, 22.0);
  const lightVP = mat4Mul(lightProj, lightView);

  // Determine which 3 world tiles surround fox's current X
  const centerTile = Math.floor(currentState.rx / WORLD_LEN);
  const zeroOff = [0, 0, 0];

  /* ---- Pass 1: Directional Sun Shadow Map ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFbo);
  gl.viewport(0, 0, SHADOW_RES, SHADOW_RES);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  gl.clear(gl.DEPTH_BUFFER_BIT);

  gl.useProgram(shadowProg);
  gl.uniformMatrix4fv(uShadow.lightVP, false, lightVP);

  // Fox casts crisp self & ground shadows
  gl.uniform3fv(uShadow.offset, zeroOff);
  gl.bindVertexArray(foxGpu.vao);
  gl.drawArrays(gl.TRIANGLES, 0, foxGpu.vertCount);

  // Nearby birch trees & boulders also cast dawn shadows across the glade
  gl.bindVertexArray(propsGpu.vao);
  for (let k = -1; k <= 1; k++) {
    gl.uniform3f(uShadow.offset, (centerTile + k) * WORLD_LEN, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, propsGpu.vertCount);
  }

  /* ---- Pass 2: Main Viewport Sky + Shadowed Glade + Fox ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.clear(gl.DEPTH_BUFFER_BIT);

  // 2a. Boreal Dawn Sky
  const camFwd = norm3(sub3(target, eye));
  const camRight = norm3(cross3(camFwd, [0, 1, 0]));
  const camUp = cross3(camRight, camFwd);
  const tanHalfY = Math.tan(fovY * 0.5);

  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  gl.useProgram(skyProg);
  gl.uniform3fv(uSky.camFwd, camFwd);
  gl.uniform3fv(uSky.camRight, camRight);
  gl.uniform3fv(uSky.camUp, camUp);
  gl.uniform2f(uSky.tanHalfFov, tanHalfY * aspect, tanHalfY);
  gl.uniform3fv(uSky.sunDir, SUN_DIR);
  gl.uniform1f(uSky.worldShift, wrapWorldX(currentState.rx));
  gl.bindVertexArray(emptyVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 2b. Lit 3D World & Fox
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  gl.useProgram(mainProg);
  gl.uniformMatrix4fv(uMain.vp, false, vpMat);
  gl.uniformMatrix4fv(uMain.lightVP, false, lightVP);
  gl.uniform3fv(uMain.camPos, eye);
  gl.uniform3fv(uMain.sunDir, SUN_DIR);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, shadowTex);
  gl.uniform1i(uMain.shadowTex, 0);
  gl.uniform1f(uMain.shadowTexel, 1 / SHADOW_RES);

  // Draw 3 seamless tiles of terrain + birch/spruce scenery
  for (let k = -1; k <= 1; k++) {
    const tx = (centerTile + k) * WORLD_LEN;
    gl.uniform3f(uMain.offset, tx, 0, 0);
    gl.bindVertexArray(terrainGpu.vao);
    gl.drawArrays(gl.TRIANGLES, 0, terrainGpu.vertCount);
    gl.bindVertexArray(propsGpu.vao);
    gl.drawArrays(gl.TRIANGLES, 0, propsGpu.vertCount);
  }

  // Draw the Red Fox!
  gl.uniform3fv(uMain.offset, zeroOff);
  gl.bindVertexArray(foxGpu.vao);
  gl.drawArrays(gl.TRIANGLES, 0, foxGpu.vertCount);

  // Draw pawprints, frost puffs, breath plume & golden birch leaves
  if (fxGpu.vertCount > 0) {
    gl.disable(gl.CULL_FACE);
    gl.bindVertexArray(fxGpu.vao);
    gl.drawArrays(gl.TRIANGLES, 0, fxGpu.vertCount);
    gl.enable(gl.CULL_FACE);
  }

  gl.bindVertexArray(null);
}

/* ---------------- Main Fixed-Bounded rAF Loop ---------------- */

let lastTs = performance.now();
function tick(now) {
  const rawDt = Math.min(0.05, Math.max(0, (now - lastTs) * 0.001));
  lastTs = now;

  if (!paused) {
    const dt = rawDt * timeScale;
    worldTime += dt;
    const dPhi = dt / STRIDE_PERIOD;
    const nextP = phase + dPhi;
    const advStrides = Math.floor(nextP);
    strideIndex += advStrides;
    phase = nextP - advStrides;

    if (cam.auto) {
      // Gentle cinematic lead-angle breathing orbit
      cam.tYaw = 0.42 + 0.24 * Math.sin(worldTime * 0.26);
      cam.tPitch = 0.13 + 0.04 * Math.cos(worldTime * 0.34);
    }
    stepParticles(dt);
  }

  const kLerp = 1 - Math.exp(-rawDt * 8.5);
  cam.yaw += (cam.tYaw - cam.yaw) * kLerp;
  cam.pitch += (cam.tPitch - cam.pitch) * kLerp;
  cam.dist += (cam.tDist - cam.dist) * kLerp;

  renderScene();
  if (!paused) syncStrideEvents(currentState, true);
  updateTelemetry();
  frames++;
  readyFlag = true;
  requestAnimationFrame(tick);
}

/* ============================================================================
 * 9. DEV HARNESS HOOK (window.__foxTest) — GAIT, IK, SEAM & PIXEL AUDIT
 * ========================================================================== */

function auditGait(samplesPerStride = 360, strides = 3) {
  let maxSlipMm = 0;
  let maxIkRatio = 0;
  let minPawY = 1e9;
  let minSwingClearance = 1e9;
  let flightSamples = 0, extSamples = 0, gathSamples = 0;
  let minHeave = 1e9, maxHeave = -1e9;
  let minSpineSpan = 1e9, maxSpineSpan = -1e9;
  let minHeadY = 1e9, maxHeadY = -1e9;
  let minTailY = 1e9, maxTailY = -1e9;

  // 1. Footfall order & suspension phase count over 1 clean stride
  const footfallOrder = [];
  let suspensionPhases = 0;
  const stEnd = evaluateFox(2, (samplesPerStride - 1) / samplesPerStride);
  let prevG = LEGS_DEF.map(d => stEnd.legs[d.id].inStance);
  let prevAllAir = prevG.every(x => !x);

  for (let i = 0; i < samplesPerStride; i++) {
    const phi = i / samplesPerStride;
    const s = evaluateFox(2, phi);
    const g = LEGS_DEF.map(d => s.legs[d.id].inStance);
    for (let k = 0; k < 4; k++) {
      if (!prevG[k] && g[k]) footfallOrder.push(LEGS_DEF[k].id);
    }
    const allAir = g.every(x => !x);
    if (!prevAllAir && allAir) suspensionPhases++;
    prevG = g;
    prevAllAir = allAir;
  }

  // 2. Multi-stride zero-slip, IK reach, clearance & motion ranges
  const anchors = {};
  const totalSamples = samplesPerStride * strides;
  for (let n = 0; n < totalSamples; n++) {
    const sIdx = Math.floor(n / samplesPerStride);
    const phi = (n % samplesPerStride) / samplesPerStride;
    const s = evaluateFox(sIdx, phi);
    const g = LEGS_DEF.map(d => s.legs[d.id].inStance);
    if (g.every(x => !x)) {
      flightSamples++;
      if (s.spineExt > 0) extSamples++;
      else gathSamples++;
    }

    const heaveRel = s.heaveY - s.groundY;
    minHeave = Math.min(minHeave, heaveRel);
    maxHeave = Math.max(maxHeave, heaveRel);
    const trunkSpan = Math.hypot(s.shoulderCenter[0] - s.hipCenter[0], s.shoulderCenter[1] - s.hipCenter[1]);
    minSpineSpan = Math.min(minSpineSpan, trunkSpan);
    maxSpineSpan = Math.max(maxSpineSpan, trunkSpan);
    minHeadY = Math.min(minHeadY, s.muzzle[1] - s.groundY);
    maxHeadY = Math.max(maxHeadY, s.muzzle[1] - s.groundY);
    const tTip = s.tailPts[s.tailPts.length - 1];
    minTailY = Math.min(minTailY, tTip[1] - s.groundY);
    maxTailY = Math.max(maxTailY, tTip[1] - s.groundY);

    for (const d of LEGS_DEF) {
      const L = s.legs[d.id];
      maxIkRatio = Math.max(maxIkRatio, L.ikRatio);
      const relPawY = L.paw[1] - groundHeight(L.paw[0], L.paw[2]);
      minPawY = Math.min(minPawY, relPawY);
      if (L.inStance) {
        const key = `${d.id}:${sIdx}`;
        if (!anchors[key]) anchors[key] = L.paw;
        else {
          const slipMm = Math.hypot(
            L.paw[0] - anchors[key][0],
            L.paw[1] - anchors[key][1],
            L.paw[2] - anchors[key][2]
          ) * 1000;
          if (slipMm > maxSlipMm) maxSlipMm = slipMm;
        }
      } else if (L.wSwing > 0.25 && L.wSwing < 0.75) {
        minSwingClearance = Math.min(minSwingClearance, relPawY - PAD_CLEAR);
      }
    }
  }

  // 3. Extended vs Gathered paw span + 12-stride world loop seam
  const sExt = evaluateFox(2, 0.405);
  const sGath = evaluateFox(2, 0.895);
  const extSpanM = Math.max(sExt.legs.RF.paw[0], sExt.legs.LF.paw[0]) - Math.min(sExt.legs.LH.paw[0], sExt.legs.RH.paw[0]);
  const gathSpanM = Math.min(sGath.legs.RF.paw[0], sGath.legs.LF.paw[0]) - Math.max(sGath.legs.LH.paw[0], sGath.legs.RH.paw[0]);

  const s0 = evaluateFox(0, 0.37);
  const sLoop = evaluateFox(WORLD_STRIDES, 0.37);
  const seamBodyMm = Math.hypot(
    (sLoop.muzzle[0] - WORLD_LEN) - s0.muzzle[0],
    sLoop.muzzle[1] - s0.muzzle[1],
    sLoop.muzzle[2] - s0.muzzle[2]
  ) * 1000;
  const t0 = s0.tailPts[7], tL = sLoop.tailPts[7];
  const seamTailMm = Math.hypot((tL[0] - WORLD_LEN) - t0[0], tL[1] - t0[1], tL[2] - t0[2]) * 1000;

  return {
    footfallOrder,
    suspensionPhases,
    maxSlipMm: +maxSlipMm.toFixed(5),
    flightFraction: +(flightSamples / totalSamples).toFixed(4),
    extFlightFraction: +(extSamples / totalSamples).toFixed(4),
    gathFlightFraction: +(gathSamples / totalSamples).toFixed(4),
    extSpanM: +extSpanM.toFixed(4),
    gathSpanM: +gathSpanM.toFixed(4),
    minSwingClearanceM: +minSwingClearance.toFixed(4),
    minPawY: +minPawY.toFixed(4),
    maxIkRatio: +maxIkRatio.toFixed(4),
    loopSeamMm: +Math.max(seamBodyMm, seamTailMm).toFixed(6),
    ranges: {
      bodyHeaveM: +(maxHeave - minHeave).toFixed(4),
      spineFlexM: +(maxSpineSpan - minSpineSpan).toFixed(4),
      headMuzzleM: +(maxHeadY - minHeadY).toFixed(4),
      tailTipM: +(maxTailY - minTailY).toFixed(4),
    },
  };
}

window.__foxTest = {
  get ready() { return readyFlag; },
  get frames() { return frames; },
  setPose(opts = {}) {
    if (opts.stride !== undefined) strideIndex = opts.stride | 0;
    if (opts.phase !== undefined) phase = wrapPhase(opts.phase);
    if (opts.paused !== undefined) paused = !!opts.paused;
    if (opts.timeScale !== undefined) timeScale = clamp(+opts.timeScale, 0.05, 2.5);
    if (opts.view !== undefined) cycleView(opts.view | 0);
    if (opts.yaw !== undefined) { cam.yaw = cam.tYaw = +opts.yaw; cam.auto = false; }
    if (opts.pitch !== undefined) { cam.pitch = cam.tPitch = +opts.pitch; cam.auto = false; }
    if (opts.dist !== undefined) { cam.dist = cam.tDist = +opts.dist; }
    if (opts.attract === false) {
      attractEl.style.transition = 'none';
      dismissAttract();
    }
    renderScene();
    syncStrideEvents(currentState, false);
    updateTelemetry();
    frames++;
    return this.state();
  },
  audit: auditGait,
  samplePixels(gridX = 32, gridY = 22) {
    const buf = new Uint8Array(W * H * 4);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    let skySamples = 0, russetFoxSamples = 0, whiteFurSamples = 0, darkStockingSamples = 0, frostTurfSamples = 0;
    let lumaSum = 0, hash = 7;

    for (let gy = 0; gy < gridY; gy++) {
      const y = Math.min(H - 1, Math.floor(((gy + 0.5) / gridY) * H)); // WebGL y=0 is bottom
      const inCenterY = gy >= gridY * 0.22 && gy <= gridY * 0.78;
      for (let gx = 0; gx < gridX; gx++) {
        const x = Math.min(W - 1, Math.floor(((gx + 0.5) / gridX) * W));
        const inCenterX = gx >= gridX * 0.20 && gx <= gridX * 0.80;
        const i = (y * W + x) * 4;
        const r = buf[i], g = buf[i + 1], b = buf[i + 2];
        lumaSum += 0.299 * r + 0.587 * g + 0.114 * b;
        hash = ((hash * 31 + r * 3 + g * 5 + b * 7 + gy * 13 + gx) >>> 0);

        if (gy > gridY * 0.62 && (b > 75 || r > 120)) skySamples++;
        if (gy < gridY * 0.36 && g >= r * 0.88 && b >= r * 0.85 && g > 42) frostTurfSamples++;
        if (inCenterX && inCenterY) {
          if (r > 125 && r > g * 1.38 && g > b * 1.25 && (r - b) > 55) russetFoxSamples++;
          if (r > 175 && g > 170 && b > 162 && Math.abs(r - b) < 42) whiteFurSamples++;
          if (r < 54 && g < 52 && b < 58) darkStockingSamples++;
        }
      }
    }
    return {
      width: W,
      height: H,
      meanLuma: +(lumaSum / (gridX * gridY)).toFixed(2),
      skySamples,
      russetFoxSamples,
      whiteFurSamples,
      darkStockingSamples,
      frostTurfSamples,
      hash,
    };
  },
  state() {
    const legs = {};
    for (const d of LEGS_DEF) {
      const L = currentState.legs[d.id];
      legs[d.id] = {
        inStance: L.inStance,
        paw: L.paw.slice(),
        midJoint: (L.fore ? L.carpus : L.hock).slice(),
        upperJoint: (L.fore ? L.elbow : L.stifle).slice(),
        ikRatio: +L.ikRatio.toFixed(4),
      };
    }
    return {
      screenMode,
      phase: +currentState.phi.toFixed(5),
      strideIndex: currentState.strideIndex,
      refX: +currentState.rx.toFixed(4),
      heaveY: +currentState.heaveY.toFixed(4),
      pitch: +currentState.pitch.toFixed(4),
      spineExt: +currentState.spineExt.toFixed(4),
      muzzle: currentState.muzzle.slice(),
      tailTip: currentState.tailPts[currentState.tailPts.length - 1].slice(),
      cam: { yaw: +cam.yaw.toFixed(4), pitch: +cam.pitch.toFixed(4), dist: +cam.dist.toFixed(4), auto: cam.auto },
      foxTris: foxGpu.triCount,
      worldTris: terrainGpu.triCount + propsGpu.triCount,
      pawprints: pawprints.length,
      frostPuffs: frostPuffs.length,
      breathPuffs: breathPuffs.length,
      audioUnlocked: audio.unlocked,
      audioMuted: audio.muted,
      legs,
    };
  },
};

renderScene();
readyFlag = true;
requestAnimationFrame(tick);
</script>

window.DEMO_CREDITS = {

  issues: [2261], span: '~1 h', shipped: '2026-11-14',
  assist: 'solo', note: 'guest build brief: Build a demo of a fox running.',
};
</script>
