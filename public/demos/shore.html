<script type="module">
'use strict';

const qs = new URLSearchParams(location.search);
const SEED = (qs.get('seed') | 0) || 7;
// #702: phone profile picked ONCE at startup (never a live governor, #678).
// coarse pointer or a small viewport => lite grid + reduced-res blit by
// default; ?lite=0/1 and ?rs= still override.
const COARSE = matchMedia('(pointer: coarse)').matches;
const SMALL = Math.min(innerWidth, innerHeight) <= 440;
const AUTO_PHONE = qs.get('lite') === null && (COARSE || SMALL);
const LITE = qs.get('lite') ? qs.get('lite') === '1' : AUTO_PHONE;
// #680 bullet 2 — ?trim=1: the per-pixel shader-trim A/B variant (see the
// WATER shader). Default is the original WGSL; a quiet box runs
// `shoreperf --ab "trim=0|trim=1" --require-quiet` for the verdict.
const TRIM = qs.get('trim') === '1';

const SLOPE = 0.052;            // beach slope (rise per metre inland)
const XS0 = 84;                 // mean shoreline x
const XMIN = 0, XMAX = 190;    // world extent, x = offshore -> inland
const ZMIN = -70, ZSPAN = 140; // alongshore
const G = 9.81;
const GRIDX = LITE ? 128 : 256;
const GRIDZ = LITE ? 96 : 192;

// GPU shallow-water (swash) grid: covers the surf + swash zone, x 50..126 m.
// h,u,v live in one vec4 storage buffer; foam and wet maps in two f32 buffers.
// The old 1D CPU swash lanes are gone: run-up is 2D fluid.
const SX0 = 70, SX1 = 126, SZ0 = -70, SZ1 = 70;
const SDX = LITE ? 0.8 : 0.4;
const NX = Math.round((SX1 - SX0) / SDX) + 1;
const NZ = Math.round((SZ1 - SZ0) / SDX) + 1;
const NC = NX * NZ;
const NSUB = 4;                 // SWE substeps per 1/60 s frame (never lower: CFL edge at dt 1/120)

// travel-time (eikonal) grid for refraction of the primary swells
const TX0 = 38, TX1 = 130, TXS = 1.6;
const TZ0 = -70, TZS = 2.4;
const NTX = Math.round((TX1 - TX0) / TXS) + 1;
const NTZ = Math.round((SZ1 - SZ0) / TZS) + 1;
const NTT = NTX * NTZ;

// primary swells: period s, deep amplitude m, alongshore phase tilt (rad/m)
const SW = [
  { T: 7.4, A: 0.21, tp: 0.010 },
  { T: 5.0, A: 0.13, tp: 0.008 },
  { T: 3.2, A: 0.075, tp: 0.014 },
].map(o => ({ ...o, w: 2 * Math.PI / o.T }));
// directional chop (deep-water wind sea): wavelength, azimuth from offshore, amp
const CHOPN = LITE ? 3 : 6;
const CHOP = (() => {
  const out = [];
  let s = SEED * 7.13 + 3.7;
  const rnd = () => { s = Math.sin(s * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  for (let i = 0; i < CHOPN; i++) {
    const lam = 1.1 + 3.2 * (i / (CHOPN - 1)) + 0.4 * rnd();
    const az = (rnd() - 0.5) * 1.05;
    const a = 0.010 + 0.020 * Math.pow(2.6 / lam, 1.5) * (0.7 + 0.6 * rnd());
    out.push({ lam, az, a, k: 2 * Math.PI / lam, w: Math.sqrt(G * 2 * Math.PI / lam), ph: rnd() * 6.283 });
  }
  return out;
})();

const xsCurve = z => XS0 + 9 * Math.sin(z * 0.043 + 1.7) + 3.5 * Math.sin(z * 0.12 + 0.6);

// piecewise mesh: 25% of points over deep water, 55% over the 50..110 surf
// band, 20% up the back beach.
function fx(u) {
  if (u < 0.25) return XMIN + (u / 0.25) * 50;
  if (u < 0.80) return 50 + ((u - 0.25) / 0.55) * 60;
  return 110 + ((u - 0.80) / 0.20) * (XMAX - 110);
}

// ---- JS mirrors of the WGSL model (warm-start only; the harness senses the
// water through the GPU probe, never through these). ----
function hash1(i) { let x = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453; return x - Math.floor(x); }
function vn2(x, z) {
  const i = Math.floor(x), j = Math.floor(z), fx0 = x - i, fz0 = z - j;
  const u = fx0 * fx0 * fx0 * (fx0 * (fx0 * 6 - 15) + 10), v = fz0 * fz0 * fz0 * (fz0 * (fz0 * 6 - 15) + 10);
  const g = (a, b) => { const h = hash1(a * 31.7 + b * 57.13) * 6.28318; return Math.cos(h) * (x - a) + Math.sin(h) * (z - b); };
  const a = g(i, j) * (1 - u) + g(i + 1, j) * u;
  const b = g(i, j + 1) * (1 - u) + g(i + 1, j + 1) * u;
  return Math.max(0, Math.min(1, (a * (1 - v) + b * v) * 0.75 + 0.5));
}
function fbm2(x, z) { return 0.6 * vn2(x, z) + 0.4 * vn2(x * 2.17 + 13, z * 2.17 + 7); }
// rip channels: two or three deepening slots in the submerged bar. The SWE
// accelerates through a slot (continuity), the breaker line jumps offshore
// over the bar between slots, and the alongshore foam lanes structure.
function ripF(z) {
  const a = 0.5 + 0.5 * Math.sin(z * 0.052 + 0.9);
  const b = 0.5 + 0.5 * Math.sin(z * 0.083 + 2.6);
  const m = Math.max(a, 0.85 * b);
  const s = Math.max(0, Math.min(1, (m - 0.58) / (0.90 - 0.58)));
  return s * s * (3 - 2 * s);
}
function terrain(x, z) {
  const xs = xsCurve(z);
  let h = SLOPE * (x - xs);
  const damp = Math.max(0, Math.min(1, (Math.abs(x - xs) - 0.25) / 1.75));
  h += (0.055 * fbm2(x * 0.31, z * 0.31) + 0.02 * fbm2(x * 1.2, z * 1.05)) * damp;
  h += 0.22 * Math.exp(-Math.pow((x - xs - 2.5) / 2.2, 2));
  h -= 0.16 * Math.exp(-Math.pow((x - xs + 9.0) / 5.0, 2));
  if (x < xs) {
    const k = xs - x;
    h -= 1.2 * (1 - Math.exp(-k / 26)) + 1.6 * (1 - Math.exp(-k / 55));
    h -= 0.15 * ripF(z) * Math.exp(-Math.pow((k - 16.0) / 7.0, 2));
  }
  return h;
}
// local wavenumber for frequency w over depth d: Newton on g*k*tanh(k*d) - w^2
function kDepth(w, d) {
  let k = w * w / G;
  for (let n = 0; n < 12; n++) {
    const th = Math.tanh(k * d);
    const f = G * k * th - w * w;
    const fp = G * (th + k * d * (1 - th * th));
    k -= f / fp;
    if (k < 1e-4) k = 1e-4;
  }
  return k;
}
// Fast-sweeping eikonal solver per component: T = travel time (s),
// |grad T| = 1/c with c(x,z) = w/k(depth). Rays bend toward the shoreline
// normal where depth drops — Snell by dispersion, not a global phase warp.
const ttJS = new Float32Array(3 * NTT);
for (let ci = 0; ci < 3; ci++) {
  const w = SW[ci].w;
  const c0 = G / w;
  const cArr = new Float32Array(NTT);
  for (let i = 0; i < NTX; i++) {
    const x = TX0 + i * TXS;
    for (let j = 0; j < NTZ; j++) {
      const z = TZ0 + j * TZS;
      const d = Math.max(0.02, -terrain(x, z));
      cArr[i * NTZ + j] = Math.min(c0, w / kDepth(w, d));
    }
  }
  const T = ttJS.subarray(ci * NTT, (ci + 1) * NTT);
  T.fill(1e9);
  // boundary: phase ramp tp*z at the offshore edge -> travel-time ramp tp*z/w
  for (let j = 0; j < NTZ; j++) T[j] = (SW[ci].tp * (TZ0 + j * TZS)) / w + 1 - 1;
  for (let sweep = 0; sweep < 40; sweep++) {
    let maxd = 0;
    for (let p = 0; p < 4; p++) {
      const forX = (p & 1) === 0, forZ = (p & 2) === 0;
      for (let n = 0; n < NTX; n++) {
        const i = forX ? n : NTX - 1 - n;
        for (let m = 0; m < NTZ; m++) {
          const j = forZ ? m : NTZ - 1 - m;
          const idx = i * NTZ + j;
          const c = cArr[idx];
          let best = T[idx];
          if (i > 0) best = Math.min(best, T[idx - NTZ] + TXS / c);
          if (i < NTX - 1) best = Math.min(best, T[idx + NTZ] + TXS / c);
          if (j > 0) best = Math.min(best, T[idx - 1] + TZS / c);
          if (j < NTZ - 1) best = Math.min(best, T[idx + 1] + TZS / c);
          maxd = Math.max(maxd, Math.abs(best - T[idx]));
          T[idx] = best;
        }
      }
    }
    if (maxd < 1e-4) break;
  }
}
// analytic deep-water surface elevation (mirror of COMMON etaA; warm-start only)
function etaA(x, z, t) {
  const d0 = Math.max(0.05, -terrain(x, z));
  const m = Math.max(0, Math.min(0.8, 1.15 - d0 * 0.95));
  let e = 0;
  for (let ci = 0; ci < 3; ci++) {
    const c = SW[ci];
    const i = Math.min(NTX - 1, Math.max(0, Math.round((x - TX0) / TXS)));
    const j = Math.min(NTZ - 1, Math.max(0, Math.round((z - TZ0) / TZS)));
    const T = ttJS[ci * NTT + i * NTZ + j];
    const cc = Math.min(G / c.w, Math.sqrt(G * Math.max(d0, 0.15)));
    const a = c.A * Math.min(3.0, Math.pow((G / c.w) / Math.max(cc, 0.4), 0.75));
    const ph = c.w * (t - T);
    e += a * (Math.sin(ph) - 0.5 * m * Math.sin(2 * ph));
  }
  const deepF = Math.max(0, Math.min(1, (d0 - 0.4) / 1.4));
  for (let n = 0; n < CHOPN; n++) {
    const ch = CHOP[n];
    e += ch.a * Math.sin(ch.k * (x * Math.cos(ch.az) + z * Math.sin(ch.az)) - ch.w * t + ch.ph) * deepF;
  }
  return e;
}

const cam = { pos: [40, 3.6, -46], yaw: 0.78, pitch: -0.15, touched: false };
const canvas = document.getElementById('c');
const fatal = document.getElementById('fatal');
const setLbl = document.getElementById('setLbl');
const runLbl = document.getElementById('runLbl');
const foamLbl = document.getElementById('foamLbl');
const perfLbl = document.getElementById('perf');
const FPS_ON = qs.get('fps') === '1';
if (FPS_ON) perfLbl.style.display = 'block';

// #702 slice B — ?diag=1 copy-report overlay (Jon's proposal): one button that
// captures browser+GPU, settings, ~10s of frame times incl hitches, per-pass
// GPU timings where the browser allows them, and the camera pose, so a phone
// user can paste the exact stall instead of reading numbers off a screen.
const DIAG = qs.get('diag') === '1';
const diagTimes = [];
let diagSpan = 0, diagLost = 0;
let diagPanel = null;
if (DIAG) {
  diagPanel = document.createElement('div');
  diagPanel.id = 'diagPanel';
  diagPanel.style.cssText = 'position:fixed;left:8px;top:8px;z-index:9;max-width:min(420px,92vw)' +
    'background:rgba(8,10,16,.88);color:#cfe3ff;font:11px/1.45 ui-monospace,Menlo,monospace' +
    'padding:8px 10px;border-radius:8px;border:1px solid rgba(120,160,255,.35);white-space:pre-wrap';
  const txt = document.createElement('div');
  txt.id = 'diagTxt';
  diagPanel.appendChild(txt);
  const btn = document.createElement('button');
  btn.id = 'diagCopy';
  btn.textContent = 'copy report';
  btn.style.cssText = 'margin-top:6px;background:#2a4f8f;color:#fff;border:0;border-radius:6px' +
    'padding:4px 10px;font:inherit;cursor:pointer';
  btn.addEventListener('click', () => {
    const s = window.__diagReport ? window.__diagReport() : '{}';
    const done = () => { btn.textContent = 'copied ✓'; setTimeout(() => { btn.textContent = 'copy report'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, done);
    else {
      const ta = document.createElement('textarea');
      ta.value = s; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch {}
      ta.remove(); done();
    }
  });
  diagPanel.appendChild(btn);
  document.body.appendChild(diagPanel);
}

if (!navigator.gpu) {
  fatal.style.display = 'grid';
  fatal.textContent = 'WebGPU not available — need Chrome 113+ / Safari 18+ on a GPU device.';
} else {
  boot().catch(e => {
    fatal.style.display = 'grid';
    fatal.textContent = 'WebGPU init failed: ' + e.message;
    console.error(e);
  });
}

// ---------------------------------------------------------------------------
// WGSL. COMMON is the single source of truth for the shore model: sky, sand,
// water, sim and probe all evaluate the SAME terrain/eta functions, so the
// pixel frame, the SWE forcing and the probe readback cannot drift apart.
// ---------------------------------------------------------------------------
const COMMON = `
const SLOPE: f32 = ${SLOPE.toFixed(5)};
const XS0: f32 = ${XS0.toFixed(1)};
const GAG: f32 = 9.81;
const PI: f32 = 3.14159265359;
const SX0F: f32 = ${SX0.toFixed(1)};
const SZ0F: f32 = ${SZ0.toFixed(1)};
const SDXF: f32 = ${SDX.toFixed(3)};
const NXI: i32 = ${NX};
const NZI: i32 = ${NZ};
const TX0F: f32 = ${TX0.toFixed(1)};
const TZ0F: f32 = ${TZ0.toFixed(1)};
const TXSF: f32 = ${TXS.toFixed(3)};
const TZSF: f32 = ${TZS.toFixed(3)};
const NTXI: i32 = ${NTX};
const NTZI: i32 = ${NTZ};
const NTTU: u32 = ${NTT}u;
const W0: f32 = ${SW[0].w.toFixed(5)};
const W1: f32 = ${SW[1].w.toFixed(5)};
const W2: f32 = ${SW[2].w.toFixed(5)};
const A0: f32 = ${SW[0].A.toFixed(5)};
const A1: f32 = ${SW[1].A.toFixed(5)};
const A2: f32 = ${SW[2].A.toFixed(5)};
const QS_IN: f32 = 18.0;   // offshore-distance below which the SWE owns the water
const QS_OUT: f32 = 34.0;  // above which the analytic spectrum owns it
var<private> gT: f32 = 0.0;

fn sq(a: f32) -> f32 { return a * a; }
fn xsCurve(z: f32) -> f32 {
  return XS0 + 9.0 * sin(z * 0.043 + 1.7) + 3.5 * sin(z * 0.12 + 0.6);
}
fn hash21(p: vec2f) -> f32 {
  var q = fract(p * vec2f(127.31, 313.71));
  return fract((q.x + q.y) * q.y);
}
fn gdir(h: f32) -> vec2f { let a = h * 6.28318530718; return vec2f(cos(a), sin(a)); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p);
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let n00 = dot(gdir(hash21(i)), f);
  let n10 = dot(gdir(hash21(i + vec2f(1.0, 0.0))), f - vec2f(1.0, 0.0));
  let n01 = dot(gdir(hash21(i + vec2f(0.0, 1.0))), f - vec2f(0.0, 1.0));
  let n11 = dot(gdir(hash21(i + vec2f(1.0, 1.0))), f - vec2f(1.0, 1.0));
  return clamp(mix(mix(n00, n10, u.x), mix(n01, n11, u.x), u.y) * 0.75 + 0.5, 0.0, 1.0);
}
fn fbm2(p: vec2f) -> f32 {
  return 0.6 * vnoise(p) + 0.4 * vnoise(p * 2.17 + vec2f(13.0, 7.0));
}
// Worley cells for foam lace: F1 distance over unit cells
fn worley(p: vec2f) -> f32 {
  let ip = floor(p); let fp = fract(p);
  var md = 8.0;
  for (var oy: i32 = -1; oy <= 1; oy = oy + 1) {
    for (var ox: i32 = -1; ox <= 1; ox = ox + 1) {
      let o = vec2f(f32(ox), f32(oy));
      let c = o + vec2f(hash21(ip + o), hash21(ip + o + vec2f(7.31, 2.17)));
      md = min(md, length(c - fp));
    }
  }
  return md;
}
// thin ridge network of a Worley field (cell borders, not cell centres)
fn strand(p: vec2f) -> f32 {
  let a = worley(p);
  return smoothstep(0.30, 0.52, a) * (1.0 - 0.6 * smoothstep(0.60, 0.92, a));
}
// churn: two octaves of strand networks at ~0.19 m and ~0.43 m — the size
// spread is what kills the uniform polka-dot read at distance
fn churn(p: vec2f) -> f32 {
  return clamp(strand(p * 5.4) * 0.95 + strand(p * 2.3 + vec2f(31.7, 13.9)) * 0.6, 0.0, 1.0);
}
// rip channels (JS mirror twin): deepening slots in the submerged bar
fn ripF(z: f32) -> f32 {
  let a = 0.5 + 0.5 * sin(z * 0.052 + 0.9);
  let b = 0.5 + 0.5 * sin(z * 0.083 + 2.6);
  let m = max(a, 0.85 * b);
  let s = clamp((m - 0.58) / (0.90 - 0.58), 0.0, 1.0);
  return s * s * (3.0 - 2.0 * s);
}
// dry sand elevation (0 at the still waterline), ripples + berm + offshore bar
fn terrain(xIn: f32, z: f32) -> f32 {
  let xs = xsCurve(z);
  var h = SLOPE * (xIn - xs);
  let damp = smoothstep(0.25, 2.0, abs(xIn - xs));
  h = h + (0.055 * fbm2(vec2f(xIn * 0.31, z * 0.31)) + 0.02 * fbm2(vec2f(xIn * 1.2, z * 1.05))) * damp;
  h = h + 0.22 * exp(-sq((xIn - xs - 2.5) / 2.2));
  h = h - 0.16 * exp(-sq((xIn - xs + 9.0) / 5.0));
  if (xIn < xs) {
    let k = xs - xIn;
    h = h - 1.2 * (1.0 - exp(-k / 26.0)) - 1.6 * (1.0 - exp(-k / 55.0));
    h = h - 0.15 * ripF(z) * exp(-sq((k - 16.0) / 7.0));
  }
  return h;
}
fn ttAt(ci: u32, x: f32, z: f32) -> f32 {
  let fx0 = clamp((x - TX0F) / TXSF, 0.0, f32(NTXI - 1));
  let fz0 = clamp((z - TZ0F) / TZSF, 0.0, f32(NTZI - 1));
  let i = i32(floor(fx0)); let j = i32(floor(fz0));
  let tx = fx0 - f32(i); let tz = fz0 - f32(j);
  let b = ci * NTTU;
  let iu = min(i + 1, NTXI - 1); let ju = min(j + 1, NTZI - 1);
  let a00 = ttBuf.v[b + u32(i * NTZI + j)];
  let a10 = ttBuf.v[b + u32(iu * NTZI + j)];
  let a01 = ttBuf.v[b + u32(i * NTZI + ju)];
  let a11 = ttBuf.v[b + u32(iu * NTZI + ju)];
  return mix(mix(a00, a10, tx), mix(a01, a11, tx), tz);
}
// cnoidal-ish profile: crest narrows/sharpens, trough flattens as m grows
// with shoaling (second harmonic of a steepening cn wave).
fn prof(phi: f32, m: f32) -> f32 { return sin(phi) - 0.5 * m * sin(2.0 * phi); }
fn swellA(a: f32, w: f32, d0: f32) -> f32 {
  let c = min(GAG / w, sqrt(GAG * max(d0, 0.15)));
  return a * clamp(pow((GAG / w) / max(c, 0.4), 0.75), 1.0, 3.0);
}
// refracted primary swell train (no chop) — cheap enough for normal offsets
fn etaSwellD(x: f32, z: f32, d0: f32) -> f32 {
  let m = clamp(1.15 - d0 * 0.95, 0.0, 0.8);
  var e = swellA(A0, W0, d0) * prof(W0 * (gT - ttAt(0u, x, z)), m);
  e += swellA(A1, W1, d0) * prof(W1 * (gT - ttAt(1u, x, z)), m);
  e += swellA(A2, W2, d0) * prof(W2 * (gT - ttAt(2u, x, z)), m);
  return e;
}
fn etaSwell(x: f32, z: f32) -> f32 { return etaSwellD(x, z, max(0.05, -terrain(x, z))); }
// deep-water analytic surface: 3 refracted primary swells + directional chop
fn etaA(x: f32, z: f32) -> f32 {
  let d0 = max(0.05, -terrain(x, z));
  var e = etaSwellD(x, z, d0);
  let deepF = smoothstep(0.4, 1.8, d0);
${CHOP.map(ch => `  e += ${ch.a.toFixed(5)} * sin(${ch.k.toFixed(5)} * (x * ${Math.cos(ch.az).toFixed(5)} + z * ${Math.sin(ch.az).toFixed(5)}) - ${ch.w.toFixed(5)} * gT + ${ch.ph.toFixed(5)}) * deepF;`).join('\n')}
  return e;
}
// analytic whitecaps in the far blend band (SWE foam takes over near shore)
fn foamA(x: f32, z: f32) -> f32 {
  let d0 = max(0.12, -terrain(x, z));
  let H = 2.0 * (swellA(A0, W0, d0) + swellA(A1, W1, d0) + swellA(A2, W2, d0));
  let brk = H / d0;
  return smoothstep(0.72, 1.05, brk) * (0.45 + 0.55 * vnoise(vec2f(x * 0.8 - gT * 1.1, z * 0.55)));
}
// sim-grid index: periodic alongshore, clamped cross-shore
fn si(i: i32, j: i32) -> u32 {
  var jj = j % NZI; if (jj < 0) { jj += NZI; }
  let ii = clamp(i, 0, NXI - 1);
  return u32(ii * NZI + jj);
}
${['hud', 'fof', 'wtf'].map(f => `
fn b_${f}(x: f32, z: f32) -> ${f === 'hud' ? 'vec4f' : 'f32'} {
  let fx0 = clamp((x - SX0F) / SDXF - 0.5, 0.0, f32(NXI - 1));
  let fz0 = clamp((z - SZ0F) / SDXF - 0.5, 0.0, f32(NZI - 1));
  let i = i32(floor(fx0)); let j = i32(floor(fz0));
  let tx = fx0 - f32(i); let tz = fz0 - f32(j);
  let a = mix(s_${f}[si(i, j)], s_${f}[si(i + 1, j)], tx);
  let b = mix(s_${f}[si(i, j + 1)], s_${f}[si(i + 1, j + 1)], tx);
  return mix(a, b, tz);
}`).join('\n')}
// box-smoothed field reads (#538): bilinear over a cell-quantised field makes
// the iso-lines kink once per cell (the scalloped waterline) and the wet map
// read as checkerboard. One 5-tap box across neighbouring cells keeps the edge
// C1 at cell crossings while leaving the sim untouched.
fn sm_h(x: f32, z: f32) -> f32 {
  let c = b_hud(x, z).x;
  let s = b_hud(x + SDXF, z).x + b_hud(x - SDXF, z).x + b_hud(x, z + SDXF).x + b_hud(x, z - SDXF).x;
  return 0.5 * c + 0.125 * s;
}
fn sm_f(x: f32, z: f32) -> f32 {
  let c = b_fof(x, z);
  let s = b_fof(x + SDXF, z) + b_fof(x - SDXF, z) + b_fof(x, z + SDXF) + b_fof(x, z - SDXF);
  return 0.5 * c + 0.125 * s;
}
fn sm_w(x: f32, z: f32) -> f32 {
  let c = b_wtf(x, z);
  let s = b_wtf(x + SDXF, z) + b_wtf(x - SDXF, z) + b_wtf(x, z + SDXF) + b_wtf(x, z - SDXF);
  return 0.5 * c + 0.125 * s;
}
// water surface elevation: SWE near shore, analytic spectrum offshore
fn surfAt(x: f32, z: f32) -> f32 {
  let bed = terrain(x, z);
  let sS = bed + max(sm_h(x, z), 0.0);
  let wa = smoothstep(QS_IN, QS_OUT, xsCurve(z) - x);
  if (wa <= 0.001) { return sS; }
  let sA = etaA(x, z);
  if (wa >= 0.999) { return sA; }
  return mix(sS, sA, wa);
}
struct W { d: f32, foam: f32, wet: f32, cov: f32 };
// bed is passed in (the callers already have it) — one terrain() per pixel,
// not one per call (#680)
fn waterAt(x: f32, z: f32, bed: f32) -> W {
  let wa = smoothstep(QS_IN, QS_OUT, xsCurve(z) - x);
  let hS = max(sm_h(x, z), 0.0);
  var o: W;
  if (wa <= 0.001) {
    o.d = hS;
    o.foam = clamp(b_fof(x, z), 0.0, 1.0);
  } else {
    let dA = max(etaA(x, z) - bed, 0.0);
    let fA2 = clamp(foamA(x, z), 0.0, 1.0);
    o.d = mix(hS, dA, wa);
    o.foam = mix(clamp(b_fof(x, z), 0.0, 1.0), fA2, wa);
  }
  // silhouette coverage of the foam band (smoothed, so the outer edge has no
  // per-cell kinks); the lace texture stays sharp in .foam.
  o.cov = mix(clamp(sm_f(x, z), 0.0, 1.0), clamp(foamA(x, z), 0.0, 1.0), wa);
  o.wet = clamp(sm_w(x, z), 0.0, 1.0);
  return o;
}
// golden-hour sky (ported from /demos/ocean: gradient + sun halo + cirrus)
fn skyBase(d0: vec3f) -> vec3f {
  let up = clamp(d0.y, 0.0, 1.0);
  let zen = vec3f(0.050, 0.100, 0.260);
  let mid = vec3f(0.42, 0.24, 0.30);
  let hor = vec3f(1.12, 0.44, 0.14);
  var col = mix(hor, mix(mid, zen, pow(up, 0.55)), pow(up, 0.32));
  let sd = max(dot(d0, normalize(u.sun.xyz)), 0.0);
  col += vec3f(1.0, 0.72, 0.36) * (pow(sd, 320.0) * 2.6 + pow(sd, 14.0) * 0.55 + pow(sd, 3.0) * 0.16);
  col = mix(vec3f(0.98, 0.66, 0.38), col, smoothstep(0.0, 0.14, d0.y));
  return col;
}
fn skyPal(d0: vec3f) -> vec3f {
  var col = skyBase(d0);
  if (d0.y > 0.005) {
    let bu = vec2f(d0.x / (d0.y + 0.12), d0.z / (d0.y + 0.12));
    var n = fbm2(vec2f(bu.x * 1.6 + gT * 0.012, bu.y * 0.7));
    n = smoothstep(0.50, 0.76, n) * smoothstep(0.02, 0.16, d0.y) * (1.0 - smoothstep(0.5, 0.95, d0.y));
    col = mix(col, mix(vec3f(1.0, 0.78, 0.66), vec3f(0.95, 0.90, 0.94), 0.35), n * 0.7);
  }
  return col;
}
fn tonemap(vIn: vec3f) -> vec3f {
  let v = max(vIn, vec3f(0.0));
  let m = (v * (2.51 * v + 0.03)) / (v * (2.43 * v + 0.59) + 0.14);
  return pow(clamp(m, vec3f(0.0), vec3f(1.0)), vec3f(1.0 / 2.2));
}
// animated sub-sand caustics: two drifting interference lattices
fn caustics(x: f32, z: f32, vu: f32, vv: f32) -> f32 {
  let t1 = gT * 0.7;
  let a = vnoise(vec2f(x * 1.9 + t1 + vu * 2.0, z * 1.6 - t1 * 0.6));
  let b = vnoise(vec2f(x * 2.4 - t1 * 0.8 + vv * 2.0, z * 2.1 + t1 * 0.5));
  let l = pow(1.0 - abs(a - 0.5) * 2.0, 3.0) + pow(1.0 - abs(b - 0.5) * 2.0, 3.0);
  return clamp(l, 0.0, 1.3);
}
`;

const TT_DECL = `
struct TTBuf { v: array<f32, ${NTT * 3}> };
`;
const SIM_DECL = `
@group(1) @binding(0) var<storage, read> s_hud: array<vec4f, ${NC}>;
@group(1) @binding(1) var<storage, read> s_fof: array<f32, ${NC}>;
@group(1) @binding(2) var<storage, read> s_wtf: array<f32, ${NC}>;
@group(1) @binding(3) var<storage, read> bedBuf: array<f32, ${NC}>;
`;

const UNIF = `
struct U {
  vp: mat4x4f,
  camPos_t: vec4f,
  fwd_tan: vec4f,
  right_aspect: vec4f,
  sun: vec4f,
  pars: vec4f,
  pars2: vec4f,

`;
const U0 = `@group(0) @binding(0) var<uniform> u: U;`;

// ---- golden-hour sky ----
const SKY = UNIF + U0 + TT_DECL + `@group(0) @binding(1) var<storage, read> ttBuf: TTBuf;` + SIM_DECL + COMMON + `
struct VOut { @builtin(position) pos: vec4f, @location(0) dir: vec3f };
@vertex
fn vs(@builtin(vertex_index) vi: u32) -> VOut {
  var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  var o: VOut;
  o.pos = vec4f(p[vi], 1.0, 1.0);
  let f = u.fwd_tan.xyz; let r = u.right_aspect.xyz; let uu = cross(r, f);
  o.dir = normalize(f + r * (p[vi].x * u.right_aspect.w * u.fwd_tan.w) + uu * (p[vi].y * u.fwd_tan.w));
  return o;
}
@fragment
fn fs(i: VOut) -> @location(0) vec4f {
  gT = u.pars2.y;
  return vec4f(tonemap(skyPal(normalize(i.dir))), 1.0);
}
`;

// ---- sand: dual-lobe wet/dry PBR, drying map, caustics under thin water ----
const SAND = UNIF + U0 + TT_DECL + `@group(0) @binding(1) var<storage, read> ttBuf: TTBuf;` + SIM_DECL + COMMON + `
struct VOut { @builtin(position) pos: vec4f, @location(0) wp: vec3f };
@vertex
fn vs(@location(0) xz: vec2f) -> VOut {
  var o: VOut;
  let h = terrain(xz.x, xz.y);
  let wp = vec3f(xz.x, h, xz.y);
  o.wp = wp;
  o.pos = u.vp * vec4f(wp, 1.0);
  return o;
}
@fragment
fn fs(i: VOut) -> @location(0) vec4f {
  gT = u.pars2.y;
  let p = i.wp;
  let hv = b_hud(p.x, p.z);
  let wet = clamp(sm_w(p.x, p.z), 0.0, 1.0);
  // dry sand: grain + wind banding + micro-shadowing (rough diffuse lobe)
  var dry = vec3f(0.80, 0.66, 0.44);
  dry = dry * (0.90 + 0.16 * fbm2(vec2f(p.x * 0.9, p.z * 0.55)));
  dry = dry * (0.94 + 0.05 * fbm2(vec2f(p.x * 3.4, p.z * 2.2)) + 0.025 * sin(p.x * 2.6 + fbm2(vec2f(p.x * 0.4, p.z * 0.4)) * 6.0));
  // saturated wet sand: darker albedo + mirror lobe (roughness ~0.05); the
  // wet map drying over ~30 s restores albedo and roughness gradually.
  let wr = wet;
  var col = mix(dry, dry * vec3f(0.42, 0.36, 0.28) + vec3f(0.015, 0.012, 0.008), wr * 0.88);
  let e = 0.6;
  let gxx = (terrain(p.x + e, p.z) - terrain(p.x - e, p.z)) / (2.0 * e);
  let gzz = (terrain(p.x, p.z + e) - terrain(p.x, p.z - e)) / (2.0 * e);
  let nrm = normalize(vec3f(-gxx, 1.0, -gzz));
  let sun = normalize(u.sun.xyz);
  let ndl = max(dot(nrm, sun), 0.0);
  col = col * (0.55 + 0.75 * ndl);
  let Vd = u.camPos_t.xyz - p;
  let hvv = normalize(sun + normalize(Vd));
  let specPow = mix(18.0, 500.0, wr);
  let sheen = pow(max(dot(nrm, hvv), 0.0), specPow) * (0.05 + 0.75 * wr * wr);
  col += vec3f(1.0, 0.75, 0.45) * sheen;
  // broad sky gloss on the film just drained
  let gloss = pow(max(reflect(normalize(-Vd), nrm).y, 0.0), 3.0) * wr * 0.25;
  col += vec3f(0.9, 0.62, 0.40) * gloss;
  // caustics where a thin sheet still covers the bed
  let bed = terrain(p.x, p.z);
  let ds = max(hv.x, 0.0);
  let cover = smoothstep(0.004, 0.05, ds) * smoothstep(1.3, 0.2, ds);
  let shallowBed = exp(-max(bed, 0.0) * 2.5);
  col += vec3f(1.0, 0.82, 0.52) * caustics(p.x, p.z, hv.y, hv.z) * cover * shallowBed * 0.35;
  let dist = length(Vd);
  col = mix(col, vec3f(0.93, 0.74, 0.55), smoothstep(60.0, 190.0, dist));

  let sub = smoothstep(0.0, 1.8, max(xsCurve(p.z) - p.x + 0.16, 0.0)) * step(bed, 0.0);
  col = mix(col, col * vec3f(0.58, 0.66, 0.64) + vec3f(0.012, 0.024, 0.026), sub * 0.8);
  return vec4f(tonemap(col), 1.0);
}
`;

// ---- water: two-stream colour, advected foam with Worley lace, meniscus ----
const WATER = UNIF + U0 + TT_DECL + `@group(0) @binding(1) var<storage, read> ttBuf: TTBuf;` + SIM_DECL + COMMON + `
struct VOut { @builtin(position) pos: vec4f, @location(0) wp: vec3f, @location(1) base: vec2f${TRIM ? `, @location(2) h0: f32` : ``} };
@vertex
fn vs(@location(0) xzIn: vec2f) -> VOut {
  var o: VOut;
  gT = u.pars2.y;
  let s = surfAt(xzIn.x, xzIn.y);
  let wp = vec3f(xzIn.x, s, xzIn.y);
  o.wp = wp;
  o.base = xzIn;${TRIM ? `
  o.h0 = s;` : ``}
  o.pos = u.vp * vec4f(wp, 1.0);
  return o;
}
@fragment
fn fs(i: VOut) -> @location(0) vec4f {
  gT = u.pars2.y;
  let p = i.wp;
  let q = i.base;
  let bed = terrain(q.x, q.y);
  let w = waterAt(q.x, q.y, bed);
  let d = w.d;
  if (d <= 0.0005) { discard; }
  let hv = b_hud(q.x, q.y);
${TRIM ? `  // #680 trims: forward-diff base normal reusing the vertex's surfAt (3
  // samples become 2), detail noise gated out of range — at 160 m the det
  // terms are ~0.012-0.015 normal tilt, below perception
  let e = 0.24;
  var nrm = normalize(vec3f(-(surfAt(q.x + e, q.y) - i.h0) / e * 1.6, 1.0, -(surfAt(q.x, q.y + e) - i.h0) / e * 1.6));
  let dist0 = length(u.camPos_t.xyz - p);
  if (dist0 < 160.0) {
    let det = exp(-dist0 * 0.02);
    nrm.x += (vnoise(vec2f(q.x * 2.3 - gT * 1.4, q.y * 1.7)) - 0.5) * 0.30 * det * smoothstep(0.15, 0.6, d);
    nrm.z += (vnoise(vec2f(q.x * 2.3 - gT * 1.4 + 31.0, q.y * 1.7 + 17.0)) - 0.5) * 0.30 * det * smoothstep(0.15, 0.6, d);
  }
  // mid-scale ripple: breaks the horizon mirror into glitter at distance
  nrm.x += (vnoise(vec2f(q.x * 0.7 - gT * 0.5, q.y * 0.7)) - 0.5) * 0.16 * smoothstep(0.5, 1.5, d);
  nrm.z += (vnoise(vec2f(q.x * 0.7 + 41.0, q.y * 0.7 + gT * 0.4)) - 0.5) * 0.16 * smoothstep(0.5, 1.5, d);
  if (dist0 < 160.0) {
    let detF = exp(-dist0 * 0.012);
    nrm.x += (vnoise(vec2f(q.x * 5.1 - gT * 0.5, q.y * 5.1)) - 0.5) * 0.10 * detF;
    nrm.z += (vnoise(vec2f(q.x * 5.1 - gT * 0.5 + 23.1, q.y * 5.1 + 17.9)) - 0.5) * 0.10 * detF;
  }` : `  // surface normal from the full-model height gradient
  let e = 0.24;
  let sx = surfAt(q.x + e, q.y) - surfAt(q.x - e, q.y);
  let sz = surfAt(q.x, q.y + e) - surfAt(q.x, q.y - e);
  var nrm = normalize(vec3f(-sx / (2.0 * e) * 1.6, 1.0, -sz / (2.0 * e) * 1.6));
  // detail normals ride the chop field at close range only
  let dist0 = length(u.camPos_t.xyz - p);
  let det = exp(-dist0 * 0.02);
  nrm.x += (vnoise(vec2f(q.x * 2.3 - gT * 1.4, q.y * 1.7)) - 0.5) * 0.30 * det * smoothstep(0.15, 0.6, d);
  nrm.z += (vnoise(vec2f(q.x * 2.3 - gT * 1.4 + 31.0, q.y * 1.7 + 17.0)) - 0.5) * 0.30 * det * smoothstep(0.15, 0.6, d);
  // mid-scale ripple: breaks the horizon mirror into glitter at distance
  nrm.x += (vnoise(vec2f(q.x * 0.7 - gT * 0.5, q.y * 0.7)) - 0.5) * 0.16 * smoothstep(0.5, 1.5, d);
  nrm.z += (vnoise(vec2f(q.x * 0.7 + 41.0, q.y * 0.7 + gT * 0.4)) - 0.5) * 0.16 * smoothstep(0.5, 1.5, d);

  // into moving sparkle; a gentler falloff carries it out to the horizon where
  // the swell normals alone paint wide streaks
  let detF = exp(-dist0 * 0.012);
  nrm.x += (vnoise(vec2f(q.x * 5.1 - gT * 0.5, q.y * 5.1)) - 0.5) * 0.10 * detF;
  nrm.z += (vnoise(vec2f(q.x * 5.1 - gT * 0.5 + 23.1, q.y * 5.1 + 17.9)) - 0.5) * 0.10 * detF;`}
  nrm = normalize(nrm);
  let sun = normalize(u.sun.xyz);
  let V = normalize(u.camPos_t.xyz - p);
  let ndv = max(dot(nrm, V), 0.0);

  // (red dies first, so depth reads blue-green); sand shows through the
  // shallows and the body colour saturates with path length
  let path = d / max(ndv, 0.30);
  let at = vec3f(exp(-path * 0.60), exp(-path * 0.20), exp(-path * 0.36));
  let body = vec3f(0.008, 0.068, 0.118);
  let bodyF = 1.0 - exp(-path * 0.34);
  var water = body * bodyF + vec3f(0.62, 0.52, 0.36) * at * (1.0 - bodyF) * 0.78;

  // (low ripF) holds the churning foam band
  let rip = ripF(q.y);
  water *= 1.0 - 0.22 * rip;
  let turb = clamp(w.foam * 0.65, 0.0, 1.0);
  water = mix(water, vec3f(0.55, 0.58, 0.48), turb * exp(-path * 0.5) * 0.45);
  // golden-hour sky reflection: full Fresnel (OCEAN's law) — at a grazing
  // angle the orange sky owns the water; the body colour owns steep views
  let fres = 0.02 + 0.98 * pow(1.0 - ndv, 5.0);
  let R = reflect(-V, nrm);
  let refl = skyBase(R) * mix(0.28, 1.0, smoothstep(0.0, 0.30, R.y));

  // subsurface transmission: sun through crests toward shore
  let sss = pow(max(dot(V, -sun), 0.0), 3.0) * exp(-d * 2.4);
  water += vec3f(0.05, 0.30, 0.25) * sss * clamp(d, 0.0, 1.1) * 1.1;
  // #544: the sun path is a true specular lobe on the REFLECTED direction —
  // the old Blinn-Phong halfway vector smeared it into a solid white river —
  // and a static world-space mask breaks the lobe into glitter (OCEAN's sea):
  // the shimmer comes from the moving ripples, not from flickering the mask

${TRIM ? `  // #680 trim: the mask only modulates the narrow sun lobe — below mu 0.6
  // the glint is <2e-5 pre-tonemap, so the fbm2 is skipped off-lobe
  var gmask = 0.25;
  if (mu > 0.6) { gmask = smoothstep(0.35, 0.72, fbm2(vec2f(q.x * 0.22 + gT * 0.05, q.y * 0.22))); }` : `  let gmask = smoothstep(0.35, 0.72, fbm2(vec2f(q.x * 0.22 + gT * 0.05, q.y * 0.22)));`}
  let glint = pow(mu, 320.0) * 3.0 + pow(mu, 90.0) * 0.35 + pow(mu, 14.0) * 0.02;
  water += vec3f(1.0, 0.78, 0.48) * glint * (0.25 + 0.75 * gmask) * (1.0 - w.foam);
  // foam: advected density * churn lace; the sim field already fades off the
  // breaker crest, the lace only breaks the band into strands
  var fo = w.foam;
  if (fo > 0.02) {
    let cl = churn(vec2f((q.x + gT * 0.35) * 0.7, (q.y - gT * 0.1) * 0.7));
    fo *= 0.10 + 1.12 * cl;

  fo = clamp(fo, 0.0, 1.0);
  // rip cue: the shoal between rips (low ripF) holds the churning foam, the
  // channel itself runs calmer
  fo = clamp(fo * (1.0 + 0.40 * (1.0 - rip)), 0.0, 1.0);
  var col = mix(water, vec3f(0.95, 0.94, 0.90) * (0.55 + 0.55 * max(dot(nrm, sun), 0.0)), fo);
  // capillary meniscus: bright thin rise where water meets wet sand
  if (bed > -0.06 && bed < 0.09) {
    let men = exp(-sq(d / 0.045)) * (0.5 + 0.5 * vnoise(vec2f(q.x * 3.0, q.y * 2.4 + gT)));
    col += vec3f(1.0, 0.88, 0.70) * men * 0.5;
  }
  // analytic distance-to-waterline AA (thin sheets cover part of a pixel)
  let pxw = max(2.0 * u.fwd_tan.w * dist0 * u.pars2.w, 2e-4);
  let filmCov = smoothstep(0.0, pxw * 2.0, d);
  let alpha = clamp((1.0 - exp(-d * 2.2)) * filmCov + max(w.cov, fo * 0.5) * 0.6, 0.0, 0.97);
  col = mix(col, vec3f(0.93, 0.74, 0.55), smoothstep(70.0, 200.0, dist0));
  return vec4f(tonemap(col), alpha);
}
`;

// ---- SWE swash sim: h,u,v + foam injection + wet map, one kernel ----
const SWE = UNIF + U0 + TT_DECL + `@group(3) @binding(0) var<storage, read> ttBuf: TTBuf;
@group(0) @binding(1) var<uniform> su: vec4f;
@group(2) @binding(0) var<storage, read_write> o_hud: array<vec4f, ${NC}>;
@group(2) @binding(1) var<storage, read_write> o_fof: array<f32, ${NC}>;
@group(2) @binding(2) var<storage, read_write> o_wtf: array<f32, ${NC}>;
` + SIM_DECL + COMMON + `
@compute @workgroup_size(8, 8, 1)
fn cs_swe(@builtin(global_invocation_id) gid: vec3<u32>) {
  let i = i32(gid.x); let j = i32(gid.y);
  if (i >= NXI || j >= NZI) { return; }
  gT = su[0];
  let dts = su[1];
  let c = si(i, j);
  let L = si(i - 1, j); let R = si(i + 1, j);
  let D = si(i, j - 1); let U2 = si(i, j + 1);
  let hC = s_hud[c];
  let hL = s_hud[L]; let hR = s_hud[R];
  let hD = s_hud[D]; let hU = s_hud[U2];
  var h = hC.x; var uu = hC.y; var vv = hC.z;
  // free-surface elevation gradient drives the flow
  let eL = bedBuf[si(i - 1, j)] + hL.x;
  let eR = bedBuf[si(i + 1, j)] + hR.x;
  let eD = bedBuf[si(i, j - 1)] + hD.x;
  let eU = bedBuf[si(i, j + 1)] + hU.x;
  uu -= GAG * dts * (eR - eL) / (2.0 * SDXF);
  vv -= GAG * dts * (eU - eD) / (2.0 * SDXF);
  // bed friction, hard in the thin film so run-up stalls and drains like swash
  let fr = 0.012 + 0.45 * exp(-max(h, 0.0) / 0.09);
  let fk = max(0.0, 1.0 - fr * dts);
  uu *= fk; vv *= fk;
  // breaking: McCowan H/d >= ~0.78 (crest over still depth) or the bore limit
  // (flow reaching its own celerity, u >= c). Both inject foam.
  let dLoc = max(0.05, -bedBuf[si(i, j)]);
  let celer2 = sqrt(GAG * max(h, 0.0));
  var inject = smoothstep(0.68, 0.92, (h - dLoc) / dLoc);
  let spd = length(vec2f(uu, vv));
  inject = max(inject, smoothstep(0.97, 1.03, spd / max(celer2, 0.05)));
  if (celer2 > 0.05 && spd > celer2) {
    let k2 = celer2 / spd;
    uu *= k2; vv *= k2;
  }
  // face-upwind fluxes (average face velocity, upwind depth)
  let uRf = 0.5 * (uu + hR.y);
  let uLf = 0.5 * (uu + hL.y);
  let vUf = 0.5 * (vv + hU.z);
  let vDf = 0.5 * (vv + hD.z);
  let FxR = uRf * select(hR.x, h, uRf >= 0.0);
  let FxL = uLf * select(hL.x, h, uLf >= 0.0);
  let FzU = vUf * select(hU.x, h, vUf >= 0.0);
  let FzD = vDf * select(hD.x, h, vDf >= 0.0);
  var hNew = h - dts * ((FxR - FxL) / SDXF + (FzU - FzD) / SDXF);
  // light height diffusion damps the checkerboard of a first-order scheme
  let lap = hL.x + hR.x + hD.x + hU.x - 4.0 * h;
  hNew += 0.03 * lap;
  if (hNew < 0.0) { hNew = 0.0; uu *= 0.5; vv *= 0.5; }
  // open-sponge at the seaward edge: relax towards the analytic swell
  let wx = SX0F + f32(i) * SDXF;
  if (wx < SX0F + 18.0) {
    let k3 = smoothstep(SX0F + 18.0, SX0F + 1.0, wx) * 0.7;
    let dA = max(etaSwellD(wx, SZ0F + f32(j) * SDXF, max(0.05, -bedBuf[si(i, j)])) - bedBuf[si(i, j)], 0.0);
    hNew = mix(hNew, dA, k3);
  }
  o_hud[c] = vec4f(hNew, uu, vv, 0.0);
  o_fof[c] = min(1.0, s_fof[c] + inject * 0.55 * (dts * 60.0));
  // wet map: soft cover instead of a hard per-cell step, plus a little
  // neighbour diffusion so the drying front can't lock into a checkerboard
  let lapW = s_wtf[L] + s_wtf[R] + s_wtf[D] + s_wtf[U2] - 4.0 * s_wtf[c];
  let wDry = max(0.0, s_wtf[c] * (1.0 - dts * 0.023) + 0.28 * lapW * min(1.0, dts * 60.0));
  o_wtf[c] = clamp(max(wDry, smoothstep(0.004, 0.035, hNew)), 0.0, 1.0);
}
`;

// ---- foam advection: semi-Lagrangian along (u,v), ~3 s half-life ----
const FOAMADV = UNIF + U0 + TT_DECL + `@group(3) @binding(0) var<storage, read> ttBuf: TTBuf;
@group(0) @binding(1) var<uniform> su: vec4f;
@group(2) @binding(0) var<storage, read_write> o_hud: array<vec4f, ${NC}>;
@group(2) @binding(1) var<storage, read_write> o_fof: array<f32, ${NC}>;
@group(2) @binding(2) var<storage, read_write> o_wtf: array<f32, ${NC}>;
` + SIM_DECL + COMMON + `
@compute @workgroup_size(8, 8, 1)
fn cs_foam(@builtin(global_invocation_id) gid: vec3<u32>) {
  let i = i32(gid.x); let j = i32(gid.y);
  if (i >= NXI || j >= NZI) { return; }
  gT = su[0];
  let c = si(i, j);
  let hv = s_hud[c];
  let x = SX0F + f32(i) * SDXF; let z = SZ0F + f32(j) * SDXF;
  let decay = exp(-su[1] * 0.28);   // ~2.5 s half-life
  let adv = b_fof(x - hv.y * su[1], z - hv.z * su[1]);
  // freshly injected foam (written by cs_swe this frame) must survive advection
  let cur = s_fof[c];
  o_fof[c] = clamp(max(adv, cur) * decay, 0.0, 1.0);
}
`;

// ---- probe: 64x64 world samples of (x, z, d, foam, wet) for the harness ----
const PROBE = UNIF + U0 + TT_DECL + `@group(0) @binding(1) var<storage, read> ttBuf: TTBuf;` + SIM_DECL + COMMON + `
@group(2) @binding(0) var<storage, read_write> outBuf: array<f32>;
@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
  if (gid.x >= 96u || gid.y >= 64u) { return; }
  let x = 52.0 + f32(gid.x) * (70.0 / 95.0);
  let z = -60.0 + f32(gid.y) * (120.0 / 63.0);
  gT = u.pars2.y;
  let bed = terrain(x, z);
  let w = waterAt(x, z, bed);
  let i = (gid.y * 96u + gid.x) * 5u;
  outBuf[i] = x;
  outBuf[i + 1u] = z;
  outBuf[i + 2u] = w.d;
  outBuf[i + 3u] = w.foam;
  outBuf[i + 4u] = w.wet;
}
`;

function matPerspective(fovY, aspect, near, far) {
  const f = 1 / Math.tan(fovY / 2), nf = 1 / (near - far);
  return new Float32Array([
    f / aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, (far + near) * nf, -1,
    0, 0, 2 * far * near * nf, 0,
  ]);
}
function camBasis() {
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const fwd = [Math.cos(cam.yaw) * cp, sp, Math.sin(cam.yaw) * cp];
  const r = [-fwd[2], 0, fwd[0]];
  const rl = Math.hypot(r[0], r[2]); r[0] /= rl; r[2] /= rl;
  const u = [
    r[1] * fwd[2] - r[2] * fwd[1],
    r[2] * fwd[0] - r[0] * fwd[2],
    r[0] * fwd[1] - r[1] * fwd[0],
  ];
  return { fwd, r, u };
}
function vpMat(eye, r, u, fwd, aspect) {
  const P = matPerspective(31 * Math.PI / 180, aspect, 0.1, 400);
  const V = new Float32Array([
    r[0], u[0], -fwd[0], 0,
    r[1], u[1], -fwd[1], 0,
    r[2], u[2], -fwd[2], 0,
    -(r[0] * eye[0] + r[1] * eye[1] + r[2] * eye[2]),
    -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]),
    (fwd[0] * eye[0] + fwd[1] * eye[1] + fwd[2] * eye[2]),
    1,
  ]);
  const out = new Float32Array(16);
  for (let c = 0; c < 4; c++) {
    for (let ro = 0; ro < 4; ro++) {
      out[c * 4 + ro] = P[ro] * V[c * 4] + P[4 + ro] * V[c * 4 + 1] + P[8 + ro] * V[c * 4 + 2] + P[12 + ro] * V[c * 4 + 3];
    }
  }
  return out;
}

async function boot() {
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) throw new Error('no WebGPU adapter');
  const device = await adapter.requestDevice();
  let GPU_INFO = null;
  try {
    const ai = adapter.info || (adapter.requestAdapterInfo ? await adapter.requestAdapterInfo() : null);
    if (ai) GPU_INFO = { vendor: ai.vendor || '', architecture: ai.architecture || '', device: ai.device || '', description: ai.description || '' };
  } catch {}
  const TS_OK = DIAG && device.features.has('timestamp-query');
  let tsSet = null, tsRes = null, tsBusy = false, tsPass = null, tsHist = null;
  if (TS_OK) {
    tsSet = device.createQuerySet({ type: 'timestamp', count: 8 });
    tsRes = device.createBuffer({ size: 64, usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC });
  }
  const TS_PERIOD = (adapter.limits && adapter.limits.timestampPeriod) || 1;
  const ctx = canvas.getContext('webgpu');
  const FORMAT = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format: FORMAT, alphaMode: 'opaque' });

  // Resolution policy (#668): canvas pinned at CSS×dpr capped at 2 (was
  // uncapped: a dpr-3 phone rendered 2.25x the pixels for no visible gain).
  // The scene renders into offscreen targets sized rs×canvas; rs=1 resolves
  // straight to the canvas, rs<1 upscales via a fullscreen blit (used by
  // ?rs=0.55..0.9 for experiments and by harness determinism locks).
  const DPR_CAP = Math.min(devicePixelRatio || 1, 2);
  const RS_LOCK = qs.get('rs') ? Math.max(0.55, Math.min(1, parseFloat(qs.get('rs')))) : 0;
  let rs = RS_LOCK || (AUTO_PHONE ? 0.75 : 1);
  let nsub = qs.get('nsub') ? Math.max(2, Math.min(NSUB, parseInt(qs.get('nsub'), 10) & ~1)) : NSUB;
  function resize() {
    const w = Math.max(2, Math.min(innerWidth, 1600) * DPR_CAP) | 0;
    const h = Math.max(2, Math.min(innerHeight, 1000) * DPR_CAP) | 0;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  }
  resize();
  addEventListener('resize', resize);

  const posArr = new Float32Array((GRIDX + 1) * (GRIDZ + 1) * 2);
  const idxArr = new Uint32Array(GRIDX * GRIDZ * 6);
  for (let iz = 0; iz <= GRIDZ; iz++) {
    const z = ZMIN + iz / GRIDZ * ZSPAN;
    for (let ix = 0; ix <= GRIDX; ix++) {
      const o = (iz * (GRIDX + 1) + ix) * 2;
      posArr[o] = fx(ix / GRIDX); posArr[o + 1] = z;
    }
  }
  let q = 0;
  for (let iz = 0; iz < GRIDZ; iz++) {
    for (let ix = 0; ix < GRIDX; ix++) {
      const a = iz * (GRIDX + 1) + ix, b = a + 1, c = a + GRIDX + 1, d = c + 1;

  const idxBuf = device.createBuffer({ size: idxArr.byteLength, usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(idxBuf, 0, idxArr);
  const idxCount = GRIDX * GRIDZ * 6;

  const ubuf = device.createBuffer({ size: 16 * 4 + 7 * 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const suBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const ttBuf = device.createBuffer({ size: ttJS.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });

  // warm start: h = analytic depth over bed, so the sim spawns mid-swell

  const hudA = new Float32Array(NC * 4), hudB = new Float32Array(NC * 4);
  const f0 = new Float32Array(NC), f1 = new Float32Array(NC);
  const wA = new Float32Array(NC), wB = new Float32Array(NC);
  for (let i = 0; i < NX; i++) {
    const x = SX0 + i * SDX;
    for (let j = 0; j < NZ; j++) {
      const z = SZ0 + j * SDX;
      const idx = i * NZ + j;
      const d = Math.max(0, etaA(x, z, T0) - terrain(x, z));
      hudA[idx * 4] = d;
      wA[idx] = d > 0.004 ? 1 : 0;
    }
  }
  const bedArr = new Float32Array(NC);
  for (let i = 0; i < NX; i++) {
    const x = SX0 + i * SDX;

  }
  const bedBufG = device.createBuffer({ size: bedArr.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(bedBufG, 0, bedArr);
  const mkSim = size => device.createBuffer({ size, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const bufs = [
    { hud: mkSim(hudA.byteLength), fof: mkSim(f0.byteLength), wtf: mkSim(wA.byteLength) },
    { hud: mkSim(hudB.byteLength), fof: mkSim(f1.byteLength), wtf: mkSim(wB.byteLength) },
  ];

  device.queue.writeBuffer(bufs[0].wtf, 0, wA);
  const probeBuf = device.createBuffer({ size: 96 * 64 * 5 * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });

  const modSand = device.createShaderModule({ code: SAND });

  const modProbe = device.createShaderModule({ code: PROBE });

@group(0) @binding(0) var srcTex: texture_2d<f32>;
@group(0) @binding(1) var samp: sampler;
struct BOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex
fn vs(@builtin(vertex_index) vi: u32) -> BOut {

@fragment
fn fs(i: BOut) -> @location(0) vec4f { return textureSample(srcTex, samp, i.uv); }

  for (const [n, m] of [['sky', modSky], ['sand', modSand], ['water', modWater], ['swe', modSwe], ['foam', modFoam], ['probe', modProbe], ['blit', modBlit]]) {

    { binding: 2, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT | GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } },

  const skyPipe = device.createRenderPipeline({

    vertex: { module: modSky, entryPoint: 'vs' },
    fragment: { module: modSky, entryPoint: 'fs', targets: [{ format: FORMAT }] },

    layout: layoutRender,
    vertex: { module: modWater, entryPoint: 'vs', buffers: [{ arrayStride: 8, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x2' }] }] },
    fragment: { module: modWater, entryPoint: 'fs', targets: [{ format: FORMAT, blend: {
      color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', op: 'add' },
      alpha: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', op: 'add' },
    } }] },
    primitive: { cullMode: 'none' },
    multisample: { count: MS },
    // no depth test against sand: the sheet extent is decided analytically by
    // alpha; testing vs the sand mesh makes the mesh intersection the shoreline.
    depthStencil: { depthWriteEnabled: false, depthCompare: 'always', format: 'depth32float' },
  });

  const blitSampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear', addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge' });
  const blitPipe = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: modBlit, entryPoint: 'vs' },
    fragment: { module: modBlit, entryPoint: 'fs', targets: [{ format: FORMAT }] },
    primitive: { cullMode: 'none' },
  });

  const SUN = (() => { const v = [-0.18, 0.16, -0.97]; const l = Math.hypot(...v); return v.map(x => x / l); })();

  let t = T0, frames = 0, acc = 0, lastMs = performance.now();
  let running = false, rafId = 0, destroyed = false;
  const ftimes = [];
  let probeData = null, probeBusy = false, probeReq = null, latest = null;
  let runEMA = 0, foamRun = 0;
  const PROBE_EVERY = LITE ? 4 : 3;
  const WG_X = Math.ceil(NX / 8), WG_Z = Math.ceil(NZ / 8);

  // waterline extraction from the probe grid, per alongshore column
  function shoreline(pd) {
    const runs = [], wetLags = [], foamTot = [];
    let n = 0;
    for (let j = 0; j < 64; j++) {
      let lastX = null, lastW = null, foamC = 0;
      for (let i = 0; i < 96; i++) {
        const k = (j * 96 + i) * 5;
        const x = pd[k], d = pd[k + 2], fo = pd[k + 3], wet = pd[k + 4];
        if (d > 0.02) lastX = x;
        if (wet > 0.45) lastW = x;
        if (fo > 0.3) foamC++;
      }
      foamTot.push(foamC);
      if (lastX !== null) {
        runs.push(lastX - xsCurve(-60 + j * (120 / 63)));
        wetLags.push(lastW === null ? 0 : lastW - lastX);
        n++;
      }
    }
    const m = a => a.length ? a.reduce((p, c) => p + c, 0) / a.length : 0;
    return { run: m(runs), wetLag: m(wetLags), n, foamCol: foamTot };
  }

  function frame() {
    if (destroyed) return;
    const now = performance.now();
    let dt = (now - lastMs) / 1000;
    lastMs = now;
    ftimes.push(dt * 1000);
    if (ftimes.length > 120) ftimes.shift();
    if (DIAG) {
      diagTimes.push(dt * 1000);
      if (diagTimes.length > 600) diagTimes.shift();
      diagSpan += dt;
    }
    if (FPS_ON && frames % 15 === 0) {
      const avgF = ftimes.reduce((a, b) => a + b, 0) / ftimes.length;
      perfLbl.textContent = `${avgF.toFixed(1)} avg · ${Math.max(...ftimes).toFixed(1)} worst ms · rs ${rs.toFixed(2)} · ${LITE ? 'lite' : 'full'} · nsub ${nsub}${AUTO_PHONE ? ' · auto' : ''}`;
    }
    if (DIAG && diagPanel && frames % 30 === 0) {
      const s = diagTimes.slice().sort((a, b) => a - b);
      const avg = diagTimes.length ? diagTimes.reduce((a, b) => a + b, 0) / diagTimes.length : 0;
      const pk = p => s.length ? s[Math.min(s.length - 1, Math.floor(p * s.length))] : 0;
      const h32 = diagTimes.filter(x => x > 32).length, h100 = diagTimes.filter(x => x > 100).length;
      let line = `diag · ${diagTimes.length} frames/${diagSpan.toFixed(1)}s\n` +
        `avg ${avg.toFixed(1)} · p95 ${pk(.95).toFixed(1)} · worst ${s.length ? s[s.length - 1].toFixed(1) : 0} ms\n` +
        `hitches >32ms ${h32} · >100ms ${h100} · catchups ${diagLost}\n` +
        `rs ${rs.toFixed(2)} ${LITE ? 'lite' : 'full'} nsub ${nsub} dpr ${DPR_CAP.toFixed(1)} ${canvas.width}x${canvas.height}`;
      if (tsHist && tsHist.length) {
        const m = k => (tsHist.reduce((a, b) => a + b[k], 0) / tsHist.length).toFixed(1);
        line += `\nGPU ms · sim ${m(0)} water ${m(1)} blit ${m(2)} total ${m(3)}`;
      } else if (DIAG) {
        line += `\nGPU passes: timestamp-query unavailable`;
      }
      diagPanel.firstChild.textContent = line;
    }
    // #668 notes: an adaptive resolution governor (1 -> 0.9 via the blit
    // targets below) was tried and backed out: under shared-GPU interference it
    // deterministically starved the probe readback and broke shorecheck's
    // swash-trace gates, with no measurable fps win to show for it. The
    // offscreen targets stay (rs=1 => resolve direct to canvas); the wins that
    // shipped are the dpr cap, the per-pixel shader trims and ?rs=?nsub=
    // harness locks. nsub never drops below NSUB: dt 1/120 sits on the CFL
    // edge of the 0.4m grid and let swash blow up.
    const rawDt = dt;
    if (dt > 0.1) dt = 0.1;
    acc += dt;
    const FIXED = 1 / 60;
    let steps = 0;
    while (acc >= FIXED && steps < 4) { t += FIXED; acc -= FIXED; steps++; }
    if (DIAG) diagLost += Math.max(0, rawDt - 0.1) + acc;

    const { fwd, r, u } = camBasis();
    const { msaa: msc, depth: dtx, drs } = ensureTargets();
    const aspect = canvas.width / canvas.height;
    device.queue.writeBuffer(ubuf, 0, new Float32Array([
      ...vpMat(cam.pos, r, u, fwd, aspect),
      cam.pos[0], cam.pos[1], cam.pos[2], t,
      fwd[0], fwd[1], fwd[2], Math.tan(31 * Math.PI / 180),
      r[0], r[1], r[2], aspect,
      SUN[0], SUN[1], SUN[2], 1,
      SLOPE, XS0, G, ZMIN,
      ZSPAN, t, SEED, 1 / tH,
    ]));

    const enc = device.createCommandEncoder();
    const tsLive = TS_OK && !tsBusy;
    if (tsLive) enc.writeTimestamp(tsSet, 0);
    // SWE: nsub substeps ping-ponged; even nsub => final state lands in bufs[0]
    let cur = 0;
    for (let s = 0; s < nsub; s++) {
      device.queue.writeBuffer(suBuf, 0, new Float32Array([t, FIXED / nsub, 0, 0]));
      const cp = enc.beginComputePass();
      cp.setPipeline(swePipe);
      cp.setBindGroup(0, bgSimU); cp.setBindGroup(1, bgSimRead[cur]); cp.setBindGroup(2, bgSimWrite[cur]); cp.setBindGroup(3, bgTT);
      cp.dispatchWorkgroups(WG_X, WG_Z, 1);
      cp.end();
      cur = 1 - cur;
    }
    {
      device.queue.writeBuffer(suBuf, 0, new Float32Array([t, FIXED, 0, 0]));
      const cp = enc.beginComputePass();
      cp.setPipeline(foamPipe);
      cp.setBindGroup(0, bgSimU); cp.setBindGroup(1, bgSimRead[0]); cp.setBindGroup(2, bgSimWrite[0]); cp.setBindGroup(3, bgTT);
      cp.dispatchWorkgroups(WG_X, WG_Z, 1);
      cp.end();
      if (tsLive) enc.writeTimestamp(tsSet, 1);
    }
    const wantProbe = !probeBusy && (probeReq !== null || frames % PROBE_EVERY === 0);
    if (wantProbe) {
      const cp = enc.beginComputePass();
      cp.setPipeline(probePipe);
      cp.setBindGroup(0, bgProbeU); cp.setBindGroup(1, bgSimR); cp.setBindGroup(2, bgProbeOut);
      cp.dispatchWorkgroups(12, 8, 1);
      cp.end();
      enc.copyBufferToBuffer(probeBuf, 0, probeRead, 0, probeBuf.size);
    }
    const rp = enc.beginRenderPass({
      colorAttachments: [{ view: msc.createView(), resolveTarget: drs ? drs.createView() : ctx.getCurrentTexture().createView(), clearValue: { r: 0.5, g: 0.4, b: 0.3, a: 1 }, loadOp: 'clear', storeOp: 'store' }],
      depthStencilAttachment: { view: dtx.createView(), depthClearValue: 1.0, depthLoadOp: 'clear', depthStoreOp: 'discard' },
    });
    rp.setPipeline(skyPipe); rp.setBindGroup(0, bgRender); rp.setBindGroup(1, bgSimR); rp.draw(3);
    rp.setPipeline(sandPipe); rp.setBindGroup(0, bgRender); rp.setBindGroup(1, bgSimR);
    rp.setVertexBuffer(0, gridBuf); rp.setIndexBuffer(idxBuf, 'uint32');
    rp.drawIndexed(idxCount);
    rp.setPipeline(waterPipe); rp.setBindGroup(0, bgRender); rp.setBindGroup(1, bgSimR);
    rp.drawIndexed(idxCount);
    rp.end();
    if (tsLive) enc.writeTimestamp(tsSet, 2);
    if (drs) {
      const bp = enc.beginRenderPass({
        colorAttachments: [{ view: ctx.getCurrentTexture().createView(), clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: 'clear', storeOp: 'store' }],
      });
      bp.setPipeline(blitPipe); bp.setBindGroup(0, bgBlit); bp.draw(3);
      bp.end();
    }
    if (tsLive) enc.writeTimestamp(tsSet, 3);
    device.queue.submit([enc.finish()]);
    if (tsLive) {
      tsBusy = true;
      tsRes.mapAsync(GPUMapMode.READ).then(() => {
        const q8 = new BigInt64Array(tsRes.getMappedRange().slice(0));
        const dms = (a, b) => Number(q8[b] - q8[a]) * TS_PERIOD / 1e6;
        tsPass = [+dms(0, 1).toFixed(2), +dms(1, 2).toFixed(2), +dms(2, 3).toFixed(2), +dms(0, 3).toFixed(2)];
        tsHist = (tsHist || []).concat([tsPass]);
        if (tsHist.length > 60) tsHist.shift();
        tsRes.unmap();
        tsBusy = false;
      }).catch(() => { tsBusy = false; });
    }

    if (wantProbe) {
      probeBusy = true;
      probeRead.mapAsync(GPUMapMode.READ).then(() => {
        probeData = Array.from(new Float32Array(probeRead.getMappedRange().slice(0)));
        probeRead.unmap();
        probeBusy = false;
        latest = shoreline(probeData);
        latest.t = t;
        runEMA += (latest.run - runEMA) * 0.02;
        foamRun += (latest.foamCol.reduce((a, b) => a + b, 0) / (64 * 8) - foamRun) * 0.08;
        runLbl.textContent = Math.max(0, latest.run).toFixed(1);
        foamLbl.textContent = String(Math.round(Math.min(100, foamRun)));
        setLbl.textContent = latest.run > runEMA + 0.55 ? 'BIG' : 'steady';
        if (probeReq) { const rq = probeReq; probeReq = null; rq({ data: probeData, t }); }
      }).catch(() => { probeBusy = false; if (probeReq) { const rq = probeReq; probeReq = null; rq(null); } });
    }
    frames++;
    if (running) rafId = requestAnimationFrame(frame);
  }

  // #702 — a WebGPU page must not keep rendering (or holding the GPU) when the
  // player isn't looking at it. iOS Chrome/Safari keep rAF alive long enough that
  // a hidden or closing SHORE tab kept submitting frames and pinning GPU+memory,
  // which dragged down the whole device (#702: "slow to switch apps or close the
  // tab", "gets slower the longer it runs"). Pause the loop while hidden — and
  // zero the accumulator on resume so a throttled-while-hidden dt doesn't come
  // back as a burst of catch-up substeps (the post-pause "burst" Jon saw).
  function startLoop() {
    if (running || destroyed) return;
    running = true; lastMs = performance.now(); acc = 0;
    rafId = requestAnimationFrame(frame);
  }
  function stopLoop() {
    if (!running) return;
    running = false; cancelAnimationFrame(rafId);
  }
  function releaseGpu() {
    stopLoop();
    if (destroyed) return;
    destroyed = true;
    if (depth) depth.destroy();
    if (msaa) msaa.destroy();
    if (drs) drs.destroy();
    depth = msaa = drs = null;
    device.destroy();
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopLoop(); else startLoop(); });
  addEventListener('pagehide', releaseGpu);
  device.lost.then(() => { running = false; destroyed = true; depth = msaa = drs = null; });
  startLoop();

  // ---- input ----
  let drag = null;
  canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); cam.touched = true; });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    cam.yaw += (e.clientX - drag.x) * 0.0032;
    cam.pitch = Math.max(-1.35, Math.min(0.5, cam.pitch - (e.clientY - drag.y) * 0.0032));
    drag = { x: e.clientX, y: e.clientY };
  });
  addEventListener('pointerup', () => { drag = null; });
  const keys = {};
  addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; cam.touched = true; });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  setInterval(() => {
    if (document.hidden || destroyed) return;
    const { fwd, r } = camBasis();
    const sp = (keys['shift'] ? 14 : 6) * 0.05;
    let dx = 0, dy = 0, dz = 0;
    if (keys['w'] || keys['arrowup']) { dx += fwd[0]; dy += fwd[1]; dz += fwd[2]; }
    if (keys['s'] || keys['arrowdown']) { dx -= fwd[0]; dy -= fwd[1]; dz -= fwd[2]; }
    if (keys['d'] || keys['arrowright']) { dx += r[0]; dz += r[2]; }
    if (keys['a'] || keys['arrowleft']) { dx -= r[0]; dz -= r[2]; }
    if (keys['e']) dy += 1;
    if (keys['q']) dy -= 1;
    if (dx || dy || dz) {
      const l = Math.hypot(dx, dy, dz);
      cam.pos[0] = Math.max(2, Math.min(185, cam.pos[0] + dx / l * sp));
      cam.pos[2] = Math.max(ZMIN, Math.min(ZMIN + ZSPAN, cam.pos[2] + dz / l * sp));
      const gz = Math.max(ZMIN, Math.min(ZMIN + ZSPAN, cam.pos[2]));
      cam.pos[1] = Math.max(cam.pos[1], 0.5 + SLOPE * (cam.pos[0] - xsCurve(gz)));
    }
  }, 16);

  // ---- diag report (#702 slice B) ----
  window.__diagReport = () => {
    const s = diagTimes.slice().sort((a, b) => a - b);
    const avg = diagTimes.length ? diagTimes.reduce((a, b) => a + b, 0) / diagTimes.length : 0;
    const pk = p => s.length ? +s[Math.min(s.length - 1, Math.floor(p * s.length))].toFixed(1) : 0;
    const h = ms => diagTimes.filter(x => x > ms).length;
    let passes = null;
    if (tsHist && tsHist.length) {
      const m = k => +(tsHist.reduce((a, b) => a + b[k], 0) / tsHist.length).toFixed(2);
      passes = { simMs: m(0), waterMs: m(1), blitMs: m(2), totalMs: m(3), samples: tsHist.length };
    }
    return JSON.stringify({
      v: 1,
      t: +t.toFixed(1),
      ua: navigator.userAgent,
      gpu: Object.assign({ tsQuery: TS_OK, tsPeriodNs: TS_PERIOD }, GPU_INFO || {}),
      settings: {
        rs: +rs.toFixed(2), lite: LITE, auto: AUTO_PHONE, nsub,
        dpr: +DPR_CAP.toFixed(2), canvas: [canvas.width, canvas.height],
        view: [innerWidth, innerHeight], grid: { n: NC, dx: SDX },
        query: location.search,
      },
      frames: {
        n: diagTimes.length, spanS: +diagSpan.toFixed(1),
        avgMs: +avg.toFixed(1), p50Ms: pk(.5), p95Ms: pk(.95),
        worstMs: s.length ? +s[s.length - 1].toFixed(1) : 0,
        hitchesGt32: h(32), hitchesGt100: h(100),
        droppedSimS: +diagLost.toFixed(2),
      },
      passes,
      cam: { pos: cam.pos.map(x => +x.toFixed(2)), yaw: +cam.yaw.toFixed(3), pitch: +cam.pitch.toFixed(3) },
    }, null, 1);
  };

  // ---- test hooks ----
  window.__shoreTest = {
    ready: true,
    get frames() { return frames; },
    get time() { return t; },
    grid() { return { sx0: SX0, sx1: SX1, sz0: SZ0, sz1: SZ1, dx: SDX, n: NC, ns: nsub, lite: LITE, auto: AUTO_PHONE }; },
    setPose(p) {
      if (p.pos) cam.pos = p.pos.slice();
      if (typeof p.yaw === 'number') cam.yaw = p.yaw;
      if (typeof p.pitch === 'number') cam.pitch = p.pitch;
      cam.touched = true;
    },
    // GPU-sensed swash: waterline run-up and wet-band lag over probe columns
    swashMean() {
      if (!latest) return { run: 0, wetLag: 0, t };
      return { run: latest.run, wetLag: latest.wetLag, t: latest.t };
    },
    probe() { return probeData; },
    resetPerf() { ftimes.length = 0; },
    perf() {
      if (!ftimes.length) return { n: 0, avg: 0, max: 0 };
      const avg = ftimes.reduce((a, b) => a + b, 0) / ftimes.length;
      return { n: ftimes.length, avg: +avg.toFixed(2), max: +Math.max(...ftimes).toFixed(2), rs: +rs.toFixed(2), nsub };
    },
    probeNow() {
      return new Promise(res => { probeReq = res; });
    },
    ttAt(ci, x, z) {
      const i = Math.min(NTX - 1, Math.max(0, Math.round((x - TX0) / TXS)));
      const j = Math.min(NTZ - 1, Math.max(0, Math.round((z - TZ0) / TZS)));
      return ttJS[ci * NTT + i * NTZ + j];
    },
    ttGrid() { return { tx0: TX0, txs: TXS, tz0: TZ0, tzs: TZS, nt: [NTX, NTZ] }; },
    get running() { return running; },
    get released() { return destroyed; },
    get diagOn() { return DIAG; },
    pause() { stopLoop(); },
    resume() { startLoop(); },
    teardown() { releaseGpu(); },
  };
}
</script>
<script>
window.DEMO_CREDITS = {
  name: 'SHORE', accent: '#ffd27a',
  issues: [521, 616], span: '~6 h', shipped: '2026-10-20',
  assist: 'guided', note: 'rewritten from a guided brief (#616): SWE swash, foam advection, wet-sand optics spelled out',
};
</script>
<script src="credits.js"></script>
</body>
