<body>
<canvas id="c"></canvas>
<div id="hud"><b>SHORE</b> · WebGPU swash sim &nbsp;·&nbsp; drag look &nbsp;·&nbsp; WASD / arrows fly &nbsp;·&nbsp; Q / E down-up &nbsp;·&nbsp; shift = fast</div>
<div id="tide"><b>Surf</b> · set <span id="setLbl">—</span> · run-up <span id="runLbl">0.0</span>m</div>
<div id="fatal"></div>
<script type="module">
'use strict';

const qs = new URLSearchParams(location.search);
const SEED = (qs.get('seed') | 0) || 7;
const LITE = qs.get('lite') === '1';

const LANES = 128;
const SLOPE = 0.052;            // beach slope (rise per metre inland)
const XS0 = 84;                // mean shoreline x
const XMIN = 0, XMAX = 190;    // world extent, x = offshore -> inland
const ZMIN = -70, ZSPAN = 140; // alongshore
const G = 9.81;
const GRIDX = LITE ? 128 : 256;
const GRIDZ = LITE ? 96 : 192;

// swell components: period s, deep amplitude m, alongshore phase tilt
const SW = [
  { T: 7.4, A: 0.21, tilt: 0.010 },
  { T: 5.0, A: 0.13, tilt: -0.008 },
  { T: 3.2, A: 0.075, tilt: 0.014 },
].map(o => ({ ...o, w: 2 * Math.PI / o.T }));

const xsCurve = z => XS0 + 9 * Math.sin(z * 0.043 + 1.7) + 3.5 * Math.sin(z * 0.12 + 0.6);
const hash1 = i => { let x = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453; return x - Math.floor(x); };

// piecewise grid: 25% of points over deep water, 55% over the 50..110 surf
// band (0.43 m spacing), 20% up the back beach.
function fx(u) {
  if (u < 0.25) return XMIN + (u / 0.25) * 50;
  if (u < 0.80) return 50 + ((u - 0.25) / 0.55) * 60;
  return 110 + ((u - 0.80) / 0.20) * (XMAX - 110);
}

// ---- CPU swash lanes: fast uprush / slow backwash + wetting memory ----
const xw = new Float32Array(LANES);   // waterline x
const wet = new Float32Array(LANES);  // wet-limit x (lagging max, dries slowly)
const wvel = new Float32Array(LANES); // d(xw)/dt
const laneZ = new Float32Array(LANES);
const laneAmp = new Float32Array(LANES);
for (let i = 0; i < LANES; i++) {
  laneZ[i] = ZMIN + i / (LANES - 1) * ZSPAN;
  // coherent alongshore amplitude: independent per-lane noise aliases the
  // waterline at the 1.1 m sampling limit (the foam-line sawtooth); real
  // run-up varies in 15-40 m cusp/rip cells.
  laneAmp[i] = 0.95 + 0.24 * Math.sin(laneZ[i] * 0.09 + 0.7) + 0.12 * Math.sin(laneZ[i] * 0.041 + 2.2);
}
const swave = u => {            // skewed oscillator: quick rise, slow drain
  const q = u / (2 * Math.PI) - Math.floor(u / (2 * Math.PI));
  const r = 0.42;
  return (q < r ? 0.5 - 0.5 * Math.cos(Math.PI * q / r) : 0.5 + 0.5 * Math.cos(Math.PI * (q - r) / (1 - r))) * 2 - 1;
};
function swashS(lane, t) {
  const z = laneZ[lane];
  const blk = Math.floor(lane / 6);   // phase jitter in ~6.6 m cells, not per lane
  let s = SW[0].A * 2.6 * laneAmp[lane] * (0.62 + 0.5 * Math.sin(0.087 * t + z * 0.045 + 1.3)) * swave(SW[0].w * t + SW[0].tilt * z - 2.35 + hash1(blk + 500) * 0.3);
  s += SW[1].A * 2.2 * laneAmp[lane] * swave(SW[1].w * t - SW[1].tilt * z + 1.7 + hash1(blk + 900) * 0.3);
  s += SW[2].A * 2.0 * swave(SW[2].w * t + SW[2].tilt * z + 4.1 + hash1(blk + 1300) * 0.3);
  return s;
}
const ZU = z => Math.max(0, Math.min(LANES - 1, Math.round((z - ZMIN) / ZSPAN * (LANES - 1))));
function simStep(dt, t) {
  const dryK = 0.55;  // m/s of dry-down of the wet band
  for (let i = 0; i < LANES; i++) {
    const prev = xw[i];
    const s = swashS(i, t);
    const nx = xsCurve(laneZ[i]) + s * (0.55 / SLOPE);
    wvel[i] = (nx - prev) / dt;
    xw[i] = nx;
    wet[i] = Math.max(nx, wet[i] - dryK * dt);
  }
}

const cam = { pos: [48, 3.0, -18], yaw: -0.55, pitch: -0.15, touched: false };
const canvas = document.getElementById('c');
const fatal = document.getElementById('fatal');
const setLbl = document.getElementById('setLbl');
const runLbl = document.getElementById('runLbl');

if (!navigator.gpu) {
  fatal.style.display = 'grid';
  fatal.textContent = 'WebGPU not available — need Chrome 113+ / Safari 18+ on a GPU device.';
} else {
  boot().catch(e => {
    fatal.style.display = 'grid';
    fatal.textContent = 'WebGPU init failed: ' + e.message;
    console.error(e);
  });
}

// ---------------------------------------------------------------------------
// WGSL. COMMON is the single source of truth for the shore model: the render
// passes and the probe (harness readback) evaluate the SAME functions, so the
// pixel frame, the depth readback and the CPU swash lanes cannot drift apart.
// ---------------------------------------------------------------------------
const COMMON = `
const SLOPE: f32 = ${SLOPE.toFixed(5)};
const XS0: f32 = ${XS0.toFixed(1)};
const GAG: f32 = 9.81;
const PI: f32 = 3.14159265359;
const NLANES: u32 = ${LANES}u;
const ZMINF: f32 = ${ZMIN.toFixed(1)};
const ZSPANF: f32 = ${ZSPAN.toFixed(1)};
const W0: f32 = ${SW[0].w.toFixed(5)};
const W1: f32 = ${SW[1].w.toFixed(5)};
const W2: f32 = ${SW[2].w.toFixed(5)};
const A0: f32 = ${SW[0].A.toFixed(5)};
const A1: f32 = ${SW[1].A.toFixed(5)};
const A2: f32 = ${SW[2].A.toFixed(5)};

fn sq(a: f32) -> f32 { return a * a; }
fn xsCurve(z: f32) -> f32 {
  return XS0 + 9.0 * sin(z * 0.043 + 1.7) + 3.5 * sin(z * 0.12 + 0.6);
}
fn laneIdx(z: f32) -> u32 {
  return u32(clamp(round((z - ZMINF) / ZSPANF * f32(NLANES - 1u)), 0.0, f32(NLANES - 1u)));
}
fn hash21(p: vec2f) -> f32 {
  var q = fract(p * vec2f(127.31, 313.71));
  return fract((q.x + q.y) * q.y);
}
fn gdir(h: f32) -> vec2f { let a = h * 6.28318530718; return vec2f(cos(a), sin(a)); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p);
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let n00 = dot(gdir(hash21(i)), f);
  let n10 = dot(gdir(hash21(i + vec2f(1.0, 0.0))), f - vec2f(1.0, 0.0));
  let n01 = dot(gdir(hash21(i + vec2f(0.0, 1.0))), f - vec2f(0.0, 1.0));
  let n11 = dot(gdir(hash21(i + vec2f(1.0, 1.0))), f - vec2f(1.0, 1.0));
  return clamp(mix(mix(n00, n10, u.x), mix(n01, n11, u.x), u.y) * 0.75 + 0.5, 0.0, 1.0);
}
fn fbm2(p: vec2f) -> f32 {
  return 0.6 * vnoise(p) + 0.4 * vnoise(p * 2.17 + vec2f(13.0, 7.0));
}
// dry sand elevation (0 at the still waterline), ripples + berm + offshore bar
fn terrain(xIn: f32, z: f32) -> f32 {
  let xs = xsCurve(z);
  var h = SLOPE * (xIn - xs);
  // ripple fbm drives texture on the dry beach and bed, but within ~2 m of
  // the waterline its lattice flips coverage at grazing view (the sawtooth);
  // damp it out toward the still line so the contour there is the smooth bed.
  let damp = smoothstep(0.25, 2.0, abs(xIn - xs));
  h = h + (0.055 * fbm2(vec2f(xIn * 0.31, z * 0.31)) + 0.02 * fbm2(vec2f(xIn * 1.2, z * 1.05))) * damp;
  h = h + 0.22 * exp(-sq((xIn - xs - 2.5) / 2.2));
  h = h - 0.16 * exp(-sq((xIn - xs + 9.0) / 5.0));
  // steeper bed seaward so the shelf has real depth (blue) beyond the bar
  if (xIn < xs) {
    let k = xs - xIn;
    h = h - 1.2 * (1.0 - exp(-k / 26.0)) - 1.6 * (1.0 - exp(-k / 55.0));
  }
  return h;
}
// shallow-water phase: constant frequency, local k = w / sqrt(g*d) via the
// travel-time warp on a linear bed (q = sqrt(distance-to-shoreline)) —
// wavelength compresses and waves slow as they shoal.
fn wphase(w: f32, t: f32, x: f32, z: f32, tilt: f32) -> f32 {
  let xs = xsCurve(z);
  let qd = sqrt(max(xs - x, 0.03));
  return w * t - (2.0 * w / sqrt(GAG * SLOPE)) * qd + tilt * z;
}
fn shoalA(a: f32, d0: f32) -> f32 {
  return a * clamp(pow(5.0 / max(d0, 0.30), 0.28), 1.0, 3.0);
}
struct Shore { d: f32, foam: f32, surf: f32, eta: f32, wetF: f32 };
fn shore(xIn: f32, z: f32, t: f32, lane: vec3f) -> Shore {
  var o: Shore;
  let h = terrain(xIn, z);
  if (h < 0.0) {
    let d0 = -h;
    let p0 = wphase(W0, t, xIn, z, ${SW[0].tilt.toFixed(4)});
    let p1 = wphase(W1, t, xIn, z, ${(-SW[1].tilt).toFixed(4)});
    let p2 = wphase(W2, t, xIn, z, ${SW[2].tilt.toFixed(4)});
    let a0 = shoalA(A0, d0); let a1 = shoalA(A1, d0); let a2 = shoalA(A2, d0);
    var eta = a0 * sin(p0) + a1 * sin(p1) + a2 * sin(p2);
    eta = eta + 0.02 * fbm2(vec2f(xIn * 0.9 - t * 0.8, z * 0.9));
    let H = 2.0 * (a0 + a1 + a2);
    let brk = H / max(d0 + min(eta, 0.0), 0.12);
    let fBreak = smoothstep(0.72, 1.05, brk) * (0.45 + 0.55 * vnoise(vec2f(xIn * 0.8 - t * 1.1, z * 0.55)));
    let d = max(d0 + eta, 0.004);
    o.eta = eta;
    o.d = d;
    o.surf = h + d;
    o.foam = clamp(fBreak, 0.0, 1.0);
    o.wetF = 0.0;
  } else {
    let back = max(lane.x - xIn, 0.0);
    let sheet = back * SLOPE * 1.3 * exp(-back / 6.0)
      * (0.78 + 0.22 * sin(z * 0.31 + t * 2.1));
    let film = select(0.018, 0.0, xIn >= lane.y);
    let d = max(sheet, film);
    o.eta = 0.0;
    o.d = d;
    o.surf = h + d;
    let edge = exp(-sq((xIn - lane.x) / 0.38)) * select(0.0, 1.0, lane.z > 0.05)
      * (0.5 + 0.5 * vnoise(vec2f(xIn * 2.2, z * 1.6 + t * 2.0)));
    let ring = exp(-sq((xIn - (lane.y - 0.25)) / 0.38))
      * select(0.0, 1.0, lane.z < -0.04) * select(0.0, 1.0, xIn > lane.x + 0.15)
      * (0.5 + 0.5 * vnoise(vec2f(xIn * 2.6 + 9.0, z * 1.9 - t * 1.4)));
    o.foam = clamp(edge * 0.95 + ring * 0.55, 0.0, 1.0);
    o.wetF = select(0.0, 1.0, xIn < lane.y);
  }
  return o;
}
// Gerstner-style forward push of the wave face while shoaling (steepening).
fn faceShift(xIn: f32, z: f32, t: f32) -> f32 {
  let h = terrain(xIn, z);
  if (h >= 0.0) { return 0.0; }
  let d0 = -h;
  return clamp(0.05 + 0.5 * pow(5.0 / max(d0, 0.30), 0.30), 0.0, 1.8)
    * (A0 * cos(wphase(W0, t, xIn, z, ${SW[0].tilt.toFixed(4)}))
     + A1 * cos(wphase(W1, t, xIn, z, ${(-SW[1].tilt).toFixed(4)})));
}
`;

const UNIF = `
struct U {
  vp: mat4x4f,
  camPos_t: vec4f,
  fwd_tan: vec4f,
  right_aspect: vec4f,
  sun: vec4f,
  pars: vec4f,
  pars2: vec4f,
};
`;

const LANES_DECL = `
struct LanesIn { v: array<vec3f, NLANES> };
@group(1) @binding(0) var<storage, read> lanesIn: LanesIn;
`;
// laneAt: smooth (Catmull-Rom) lane lookup. Nearest/lerp lane reads staircase
// whatever the CPU swash jitters lane-to-lane at 1.1 m — the sawtooth; real
// swash is coherent alongshore, so interpolate through the neighbouring lanes.
const LANEAT = `
fn laneClamp(k: i32) -> u32 { return u32(clamp(f32(k), 0.0, f32(NLANES - 1u))); }
fn laneAt(z: f32) -> vec3f {
  let f = clamp((z - ZMINF) / ZSPANF * f32(NLANES - 1u), 0.0, f32(NLANES - 1u));
  let i = i32(floor(f));
  let t = f - f32(i);
  // low-pass the lane sequence: per-lane phase jitter is unphysical alongshore
  // noise, and reading it straight from the buffer puts a 1.1 m sawtooth on
  // every lane-driven edge (the foam line). Then Catmull-Rom for C1 placement.
  let Lm3 = lanesIn.v[laneClamp(i - 3)]; let Lm2 = lanesIn.v[laneClamp(i - 2)];
  let Lm1 = lanesIn.v[laneClamp(i - 1)]; let L0 = lanesIn.v[laneClamp(i)];
  let Lp1 = lanesIn.v[laneClamp(i + 1)]; let Lp2 = lanesIn.v[laneClamp(i + 2)];
  let p1 = 0.25 * Lm2 + 0.5 * Lm1 + 0.25 * L0;
  let p2 = 0.25 * Lm1 + 0.5 * L0 + 0.25 * Lp1;
  let p3 = 0.25 * L0 + 0.5 * Lp1 + 0.25 * Lp2;
  let p4 = 0.25 * L0 + 0.5 * Lp1 + 0.375 * Lp2 + 0.125 * lanesIn.v[laneClamp(i + 3)];
  let t2 = t * t; let t3 = t2 * t;
  return 0.5 * ((2.0 * p2) + (-p1 + p3) * t
    + (2.0 * p1 - 5.0 * p2 + 4.0 * p3 - p4) * t2
    + (-p1 + 3.0 * p2 - 3.0 * p3 + p4) * t3);
}
`;
const U0 = `@group(0) @binding(0) var<uniform> u: U;`;

const SKY = UNIF + U0 + COMMON + `
struct VOut { @builtin(position) pos: vec4f, @location(0) dir: vec3f };
@vertex
fn vs(@builtin(vertex_index) vi: u32) -> VOut {
  var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  var o: VOut;
  o.pos = vec4f(p[vi], 1.0, 1.0);
  let f = u.fwd_tan.xyz; let r = u.right_aspect.xyz; let uu = cross(r, f);
  o.dir = normalize(f + r * (p[vi].x * u.right_aspect.w * u.fwd_tan.w) + uu * (p[vi].y * u.fwd_tan.w));
  return o;
}
@fragment
fn fs(i: VOut) -> @location(0) vec4f {
  let d = normalize(i.dir);
  let t = u.pars2.y;
  let up = clamp(d.y, 0.0, 1.0);
  let zen = vec3f(0.26, 0.32, 0.46);
  let mid = vec3f(0.78, 0.52, 0.40);
  let hor = vec3f(1.05, 0.68, 0.36);
  var col = mix(hor, mix(mid, zen, pow(up, 0.55)), pow(up, 0.32));
  // low golden-hour sun with a fat warm halo
  let sd = max(dot(d, normalize(u.sun.xyz)), 0.0);
  col += vec3f(1.0, 0.72, 0.36) * (pow(sd, 220.0) * 2.6 + pow(sd, 14.0) * 0.55 + pow(sd, 3.0) * 0.16);
  // stretched cirrus bands
  if (d.y > 0.005) {
    let bu = vec2f(d.x / (d.y + 0.12), d.z / (d.y + 0.12));
    var n = fbm2(vec2f(bu.x * 1.6 + t * 0.012, bu.y * 0.7));
    n = smoothstep(0.52, 0.78, n) * smoothstep(0.02, 0.16, d.y) * (1.0 - smoothstep(0.5, 0.95, d.y));
    col = mix(col, mix(vec3f(1.0, 0.78, 0.66), vec3f(0.95, 0.90, 0.94), 0.35), n * 0.7);
  }
  // horizon haze
  col = mix(vec3f(0.96, 0.74, 0.52), col, smoothstep(0.0, 0.14, d.y));
  return vec4f(col, 1.0);
}
`;

const SAND = UNIF + U0 + COMMON + LANES_DECL + LANEAT + `
struct VOut { @builtin(position) pos: vec4f, @location(0) wp: vec3f };
@vertex
fn vs(@location(0) xz: vec2f) -> VOut {
  var o: VOut;
  let h = terrain(xz.x, xz.y);
  let wp = vec3f(xz.x, h, xz.y);
  o.wp = wp;
  o.pos = u.vp * vec4f(wp, 1.0);
  return o;
}
@fragment
fn fs(i: VOut) -> @location(0) vec4f {
  let p = i.wp;
  let t = u.pars2.y;
  let lane = laneAt(p.z);
  let xs = xsCurve(p.z);
  // dry sand with grain and wind banding
  var dry = vec3f(0.80, 0.66, 0.44);
  dry = dry * (0.90 + 0.16 * fbm2(vec2f(p.x * 0.9, p.z * 0.55)));
  dry = dry * (0.96 + 0.025 * sin(p.x * 2.6 + fbm2(vec2f(p.x * 0.4, p.z * 0.4)) * 6.0));
  // wet sand: fresh dark band trailing the waterline + permanent damp near the still line
  let wr = clamp(exp(-sq((p.x - lane.y) / 2.2)) + 0.35 * exp(-sq((p.x - xs) / 4.0)), 0.0, 1.0);
  var col = mix(dry, dry * vec3f(0.55, 0.47, 0.36) + vec3f(0.02, 0.015, 0.01), wr * 0.9);
  let e = 0.6;
  let gxx = (terrain(p.x + e, p.z) - terrain(p.x - e, p.z)) / (2.0 * e);
  let gzz = (terrain(p.x, p.z + e) - terrain(p.x, p.z - e)) / (2.0 * e);
  let nrm = normalize(vec3f(-gxx, 1.0, -gzz));
  let sun = normalize(u.sun.xyz);
  let ndl = max(dot(nrm, sun), 0.0);
  col = col * (0.58 + 0.72 * ndl);
  let hv = normalize(sun + normalize(u.camPos_t.xyz - p));
  let sheen = pow(max(dot(nrm, hv), 0.0), select(26.0, 60.0, wr > 0.3)) * (0.14 + 0.5 * wr);
  col += vec3f(1.0, 0.75, 0.45) * sheen;
  // thin residual bubbles on the draining sheet
  let resid = exp(-sq((p.x - (lane.y - 0.5)) / 0.5)) * select(0.0, 1.0, p.x > lane.x);
  col = mix(col, vec3f(0.93, 0.92, 0.88), resid * 0.30 * (0.5 + 0.5 * vnoise(vec2f(p.x * 3.1, p.z * 2.2 + t))));
  let dist = length(u.camPos_t.xyz - p);
  col = mix(col, vec3f(0.93, 0.74, 0.55), smoothstep(60.0, 190.0, dist));
  // submerged bed: absorption darkens with depth below the still line
  let sub = smoothstep(0.0, 1.8, max(xs - p.x + 0.16, 0.0));
  col = mix(col, col * vec3f(0.58, 0.66, 0.64) + vec3f(0.012, 0.024, 0.026), sub * 0.85);
  return vec4f(col, 1.0);
}
`;

const WATER = UNIF + U0 + COMMON + LANES_DECL + LANEAT + `
struct VOut { @builtin(position) pos: vec4f, @location(0) wp: vec3f, @location(1) base: vec2f };
@vertex
fn vs(@location(0) xzIn: vec2f) -> VOut {
  var o: VOut;
  var xz = xzIn;
  xz.x = xz.x + faceShift(xzIn.x, xzIn.y, u.pars2.y);
  let s = shore(xz.x, xz.y, u.pars2.y, laneAt(xz.y));
  let wp = vec3f(xz.x, s.surf, xz.y);
  o.wp = wp;
  // the model is evaluated at the UNSHIFTED xz: faceShift interpolated over
  // mesh cells is piecewise-planar, and feeding that warped p back into
  // shore() re-imposed the 0.7 m grid on the foam/waterline contours.
  o.base = xzIn;
  o.pos = u.vp * vec4f(wp, 1.0);
  return o;
}
@fragment
fn fs(i: VOut) -> @location(0) vec4f {
  let p = i.wp;
  let q = i.base;
  let t = u.pars2.y;
  // full-res shore model: foam/depth contours come from the analytic model,
  // not from attributes interpolated over the 0.7 m mesh (that was sawtooth).
  let s0 = shore(q.x, q.y, t, laneAt(q.y));
  let d = s0.d;
  let foam = s0.foam;
  if (d <= 0.0005) { discard; }
  // surface normal from the shore model's height gradient
  let e = 0.2;
  let sx = shore(q.x + e, q.y, t, laneAt(q.y)).surf - shore(q.x - e, q.y, t, laneAt(q.y)).surf;
  let sz = shore(q.x, q.y + e, t, laneAt(q.y + e)).surf - shore(q.x, q.y - e, t, laneAt(q.y - e)).surf;
  var nrm = normalize(vec3f(-sx / (2.0 * e) * 2.0, 1.0, -sz / (2.0 * e) * 2.0));
  let sun = normalize(u.sun.xyz);
  let V = normalize(u.camPos_t.xyz - p);
  let ndv = max(dot(nrm, V), 0.0);
  let deepC = vec3f(0.055, 0.175, 0.245);
  let shallowC = vec3f(0.16, 0.47, 0.46);
  let sandTint = vec3f(0.72, 0.60, 0.42);
  var water = mix(shallowC, deepC, smoothstep(0.0, 1.6, d));
  // see the sand through thin water
  let vis = exp(-d * 2.2);
  water = mix(water, sandTint * 0.85, vis * 0.85);
  // golden-hour sky reflection on the swell faces
  let fres = pow(1.0 - ndv, 3.0);
  water = mix(water, vec3f(0.92, 0.64, 0.38) * (0.55 + 0.45 * max(dot(reflect(-V, nrm), sun), 0.0)), fres * 0.42);
  // subsurface glow where the sun shines through crests toward shore
  let sss = pow(max(dot(V, -sun), 0.0), 3.0) * exp(-d * 2.6);
  water += vec3f(0.06, 0.30, 0.26) * sss * clamp(d, 0.0, 0.9) * 0.9;
  // glitter
  let hv = normalize(sun + V);
  let glint = pow(max(dot(nrm, hv), 0.0), 200.0) * 2.4 + pow(max(dot(nrm, hv), 0.0), 90.0) * 0.55 + pow(max(dot(nrm, hv), 0.0), 22.0) * 0.16;
  water += vec3f(1.0, 0.78, 0.48) * glint * (1.0 - foam);
  water += water * 0.25 * max(dot(nrm, sun), 0.0);
  var col = mix(water, vec3f(0.95, 0.94, 0.90), foam);
  let dist = length(u.camPos_t.xyz - p);
  // analytic distance-to-waterline AA: a sheet thinner than ~2 px of world
  // depth is only partially covered; pxw = world size of a pixel at dist
  // (2*tan(fov/2)*dist/H — no dFdx in this Chrome).
  let pxw = max(2.0 * u.fwd_tan.w * dist * u.pars2.w, 2e-4);
  let filmCov = smoothstep(0.0, pxw * 2.0, d);
  var alpha = clamp((1.0 - exp(-d * 2.2)) * filmCov + foam * 0.6, 0.0, 0.97);
  col = mix(col, vec3f(0.93, 0.74, 0.55), smoothstep(70.0, 200.0, dist));
  return vec4f(col, alpha);
}
`;

const PROBE = UNIF + COMMON + `
struct LanesIn { v: array<vec3f, NLANES> };
@group(0) @binding(0) var<storage, read> lanesIn: LanesIn;
@group(1) @binding(0) var<storage, read_write> outBuf: array<f32>;
@group(2) @binding(0) var<uniform> u: U;
@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
  if (gid.x >= 32u || gid.y >= 32u) { return; }
  let x = 20.0 + f32(gid.x) * (120.0 / 31.0);
  let z = -60.0 + f32(gid.y) * (120.0 / 31.0);
  let s = shore(x, z, u.pars2.y, lanesIn.v[laneIdx(z)]);
  let i = (gid.y * 32u + gid.x) * 4u;
  outBuf[i] = x;
  outBuf[i + 1u] = z;
  outBuf[i + 2u] = s.d;
  outBuf[i + 3u] = s.foam;
}
`;

function matPerspective(fovY, aspect, near, far) {
  const f = 1 / Math.tan(fovY / 2), nf = 1 / (near - far);
  return new Float32Array([
    f / aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, (far + near) * nf, -1,
    0, 0, 2 * far * near * nf, 0,
  ]);
}
function camBasis() {
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const fwd = [Math.cos(cam.yaw) * cp, sp, Math.sin(cam.yaw) * cp];
  const r = [-fwd[2], 0, fwd[0]];
  const rl = Math.hypot(r[0], r[2]); r[0] /= rl; r[2] /= rl;
  const u = [
    r[1] * fwd[2] - r[2] * fwd[1],
    r[2] * fwd[0] - r[0] * fwd[2],
    r[0] * fwd[1] - r[1] * fwd[0],
  ];
  return { fwd, r, u };
}
function vpMat(eye, r, u, fwd, aspect) {
  const P = matPerspective(31 * Math.PI / 180, aspect, 0.1, 400);
  const V = new Float32Array([
    r[0], u[0], -fwd[0], 0,
    r[1], u[1], -fwd[1], 0,
    r[2], u[2], -fwd[2], 0,
    -(r[0] * eye[0] + r[1] * eye[1] + r[2] * eye[2]),
    -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]),
    (fwd[0] * eye[0] + fwd[1] * eye[1] + fwd[2] * eye[2]),
    1,
  ]);
  const out = new Float32Array(16);
  for (let c = 0; c < 4; c++) {
    for (let ro = 0; ro < 4; ro++) {
      out[c * 4 + ro] = P[ro] * V[c * 4] + P[4 + ro] * V[c * 4 + 1] + P[8 + ro] * V[c * 4 + 2] + P[12 + ro] * V[c * 4 + 3];
    }
  }
  return out;
}

async function boot() {
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) throw new Error('no WebGPU adapter');
  const device = await adapter.requestDevice();
  const ctx = canvas.getContext('webgpu');
  const FORMAT = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format: FORMAT, alphaMode: 'opaque' });

  function resize() {
    canvas.width = Math.max(2, Math.min(innerWidth, 1600) * devicePixelRatio) | 0;
    canvas.height = Math.max(2, Math.min(innerHeight, 1000) * devicePixelRatio) | 0;
  }
  resize();
  addEventListener('resize', resize);

  const posArr = new Float32Array((GRIDX + 1) * (GRIDZ + 1) * 2);
  const idxArr = new Uint32Array(GRIDX * GRIDZ * 6);
  for (let iz = 0; iz <= GRIDZ; iz++) {
    const z = ZMIN + iz / GRIDZ * ZSPAN;
    for (let ix = 0; ix <= GRIDX; ix++) {
      const o = (iz * (GRIDX + 1) + ix) * 2;
      posArr[o] = fx(ix / GRIDX); posArr[o + 1] = z;
    }
  }
  let q = 0;
  for (let iz = 0; iz < GRIDZ; iz++) {
    for (let ix = 0; ix < GRIDX; ix++) {
      const a = iz * (GRIDX + 1) + ix, b = a + 1, c = a + GRIDX + 1, d = c + 1;
      idxArr[q++] = a; idxArr[q++] = c; idxArr[q++] = b;
      idxArr[q++] = b; idxArr[q++] = c; idxArr[q++] = d;
    }
  }
  const gridBuf = device.createBuffer({ size: posArr.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(gridBuf, 0, posArr);
  const idxBuf = device.createBuffer({ size: idxArr.byteLength, usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(idxBuf, 0, idxArr);
  const idxCount = GRIDX * GRIDZ * 6;

  const ubuf = device.createBuffer({ size: 16 * 4 + 7 * 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const laneBuf = device.createBuffer({ size: LANES * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const probeBuf = device.createBuffer({ size: 32 * 32 * 4 * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  const probeRead = device.createBuffer({ size: 32 * 32 * 4 * 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  const laneArr = new Float32Array(LANES * 4);

  const modSky = device.createShaderModule({ code: SKY });
  const modSand = device.createShaderModule({ code: SAND });
  const modWater = device.createShaderModule({ code: WATER });
  const modProbe = device.createShaderModule({ code: PROBE });

  const bglU = device.createBindGroupLayout({ entries: [{ binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT | GPUShaderStage.COMPUTE, buffer: {} }] });
  const bglL = device.createBindGroupLayout({ entries: [{ binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT, buffer: { type: 'read-only-storage' } }] });
  const bglLC = device.createBindGroupLayout({ entries: [{ binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } }] });
  const bglP = device.createBindGroupLayout({ entries: [{ binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } }] });
  const bgU = device.createBindGroup({ layout: bglU, entries: [{ binding: 0, resource: { buffer: ubuf } }] });
  const bgL = device.createBindGroup({ layout: bglL, entries: [{ binding: 0, resource: { buffer: laneBuf } }] });
  const bgLC = device.createBindGroup({ layout: bglLC, entries: [{ binding: 0, resource: { buffer: laneBuf } }] });
  const bgP = device.createBindGroup({ layout: bglP, entries: [{ binding: 0, resource: { buffer: probeBuf } }] });
  const layoutU = device.createPipelineLayout({ bindGroupLayouts: [bglU] });
  const layoutUL = device.createPipelineLayout({ bindGroupLayouts: [bglU, bglL] });
  const layoutProbe = device.createPipelineLayout({ bindGroupLayouts: [bglLC, bglP, bglU] });

  // 4x MSAA: the water/sand boundary is a mesh-on-mesh silhouette, so the
  // only way to antialias it is at rasterization; render into a multisample
  // target and resolve-copy into the canvas at the end of the frame.
  const MS = 4;
  let depth = null, msaa = null, tW = 0, tH = 0;
  function ensureTargets() {
    if (depth && msaa && tW === canvas.width && tH === canvas.height) return { msaa, depth };
    if (depth) depth.destroy();
    if (msaa) msaa.destroy();
    depth = device.createTexture({ size: [canvas.width, canvas.height], sampleCount: MS, format: 'depth32float', usage: GPUTextureUsage.RENDER_ATTACHMENT });
    msaa = device.createTexture({ size: [canvas.width, canvas.height], sampleCount: MS, format: FORMAT, usage: GPUTextureUsage.RENDER_ATTACHMENT });
    tW = canvas.width; tH = canvas.height;
    return { msaa, depth };
  }

  const skyPipe = device.createRenderPipeline({
    layout: layoutU,
    vertex: { module: modSky, entryPoint: 'vs' },
    fragment: { module: modSky, entryPoint: 'fs', targets: [{ format: FORMAT }] },
    multisample: { count: MS },
    depthStencil: { depthWriteEnabled: false, depthCompare: 'always', format: 'depth32float' },
  });
  const sandPipe = device.createRenderPipeline({
    layout: layoutUL,
    vertex: { module: modSand, entryPoint: 'vs', buffers: [{ arrayStride: 8, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x2' }] }] },
    fragment: { module: modSand, entryPoint: 'fs', targets: [{ format: FORMAT }] },
    primitive: { cullMode: 'none' },
    multisample: { count: MS },
    depthStencil: { depthWriteEnabled: true, depthCompare: 'less', format: 'depth32float' },
  });
  const waterPipe = device.createRenderPipeline({
    layout: layoutUL,
    vertex: { module: modWater, entryPoint: 'vs', buffers: [{ arrayStride: 8, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x2' }] }] },
    fragment: { module: modWater, entryPoint: 'fs', targets: [{ format: FORMAT, blend: {
      color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', op: 'add' },
      alpha: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', op: 'add' },
    } }] },
    primitive: { cullMode: 'none' },
    multisample: { count: MS },
    // no depth test against sand: the sheet is transparent by design and its
    // extent is decided analytically (alpha) — testing vs the sand mesh made
    // the two meshes' intersection line the visible (zigzag) shoreline.
    depthStencil: { depthWriteEnabled: false, depthCompare: 'always', format: 'depth32float' },
  });
  const probePipe = device.createComputePipeline({ layout: layoutProbe, compute: { module: modProbe, entryPoint: 'main' } });

  const SUN = (() => { const v = [-0.18, 0.16, -0.97]; const l = Math.hypot(...v); return v.map(x => x / l); })();

  let t = 0, frames = 0, acc = 0, lastMs = performance.now();
  const ftimes = [];
  let probeData = null, probeBusy = false, probeReq = null;

  function frame() {
    const now = performance.now();
    let dt = (now - lastMs) / 1000;
    lastMs = now;
    ftimes.push(dt * 1000);
    if (ftimes.length > 120) ftimes.shift();
    if (dt > 0.1) dt = 0.1;
    acc += dt;
    const FIXED = 1 / 60;
    let steps = 0;
    while (acc >= FIXED && steps < 4) { t += FIXED; simStep(FIXED, t); acc -= FIXED; steps++; }
    if (steps) {
      for (let i = 0; i < LANES; i++) {
        laneArr[i * 4] = xw[i]; laneArr[i * 4 + 1] = wet[i]; laneArr[i * 4 + 2] = wvel[i]; laneArr[i * 4 + 3] = 0;
      }
      device.queue.writeBuffer(laneBuf, 0, laneArr);
      let best = 0;
      for (let i = 0; i < LANES; i++) { const r = xw[i] - xsCurve(laneZ[i]); if (r > best) best = r; }
      runLbl.textContent = (best * SLOPE).toFixed(1);
      setLbl.textContent = swave(SW[0].w * t) > 0.75 ? 'BIG' : 'steady';
    }

    const { fwd, r, u } = camBasis();
    const aspect = canvas.width / canvas.height;
    device.queue.writeBuffer(ubuf, 0, new Float32Array([
      ...vpMat(cam.pos, r, u, fwd, aspect),
      cam.pos[0], cam.pos[1], cam.pos[2], t,
      fwd[0], fwd[1], fwd[2], Math.tan(31 * Math.PI / 180),
      r[0], r[1], r[2], aspect,
      SUN[0], SUN[1], SUN[2], 1,
      SLOPE, XS0, G, ZMIN,
      ZSPAN, t, SEED, 1 / canvas.height,
    ]));

    const enc = device.createCommandEncoder();
    const wantProbe = !probeBusy && (probeReq !== null || frames % 90 === 0);
    let laneSnap = null;
    if (wantProbe) {
      const cp = enc.beginComputePass();
      cp.setPipeline(probePipe); cp.setBindGroup(0, bgLC); cp.setBindGroup(1, bgP); cp.setBindGroup(2, bgU);
      cp.dispatchWorkgroups(4, 4, 1);
      cp.end();
      enc.copyBufferToBuffer(probeBuf, 0, probeRead, 0, probeBuf.size);
      laneSnap = { xw: Array.from(xw), wet: Array.from(wet), z: Array.from(laneZ), t };
    }
    const { msaa: msc, depth: dtx } = ensureTargets();
    const rp = enc.beginRenderPass({
      colorAttachments: [{ view: msc.createView(), resolveTarget: ctx.getCurrentTexture().createView(), clearValue: { r: 0.5, g: 0.4, b: 0.3, a: 1 }, loadOp: 'clear', storeOp: 'store' }],
      depthStencilAttachment: { view: dtx.createView(), depthClearValue: 1.0, depthLoadOp: 'clear', depthStoreOp: 'discard' },
    });
    rp.setPipeline(skyPipe); rp.setBindGroup(0, bgU); rp.draw(3);
    rp.setPipeline(sandPipe); rp.setBindGroup(0, bgU); rp.setBindGroup(1, bgL);
    rp.setVertexBuffer(0, gridBuf); rp.setIndexBuffer(idxBuf, 'uint32');
    rp.drawIndexed(idxCount);
    rp.setPipeline(waterPipe); rp.setBindGroup(0, bgU); rp.setBindGroup(1, bgL);
    rp.drawIndexed(idxCount);
    rp.end();
    device.queue.submit([enc.finish()]);

    if (wantProbe) {
      probeBusy = true;
      probeRead.mapAsync(GPUMapMode.READ).then(() => {
        probeData = Array.from(new Float32Array(probeRead.getMappedRange().slice(0)));
        probeRead.unmap();
        probeBusy = false;
        if (probeReq) { const rq = probeReq; probeReq = null; rq({ data: probeData, lanes: laneSnap, t }); }
      }).catch(() => { probeBusy = false; if (probeReq) { const rq = probeReq; probeReq = null; rq(null); } });
    }
    frames++;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- input ----
  let drag = null;
  canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); cam.touched = true; });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    cam.yaw += (e.clientX - drag.x) * 0.0032;
    cam.pitch = Math.max(-1.35, Math.min(0.5, cam.pitch - (e.clientY - drag.y) * 0.0032));
    drag = { x: e.clientX, y: e.clientY };
  });
  addEventListener('pointerup', () => { drag = null; });
  const keys = {};
  addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; cam.touched = true; });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  setInterval(() => {
    const { fwd, r } = camBasis();
    const sp = (keys['shift'] ? 14 : 6) * 0.05;
    let dx = 0, dy = 0, dz = 0;
    if (keys['w'] || keys['arrowup']) { dx += fwd[0]; dy += fwd[1]; dz += fwd[2]; }
    if (keys['s'] || keys['arrowdown']) { dx -= fwd[0]; dy -= fwd[1]; dz -= fwd[2]; }
    if (keys['d'] || keys['arrowright']) { dx += r[0]; dz += r[2]; }
    if (keys['a'] || keys['arrowleft']) { dx -= r[0]; dz -= r[2]; }
    if (keys['e']) dy += 1;
    if (keys['q']) dy -= 1;
    if (dx || dy || dz) {
      const l = Math.hypot(dx, dy, dz);
      cam.pos[0] = Math.max(2, Math.min(185, cam.pos[0] + dx / l * sp));
      cam.pos[2] = Math.max(ZMIN, Math.min(ZMIN + ZSPAN, cam.pos[2] + dz / l * sp));
      const gz = Math.max(ZMIN, Math.min(ZMIN + ZSPAN, cam.pos[2]));
      cam.pos[1] = Math.max(cam.pos[1], 0.5 + SLOPE * (cam.pos[0] - xsCurve(gz)));
    }
  }, 16);

  // ---- test hooks ----
  window.__shoreTest = {
    ready: true,
    get frames() { return frames; },
    get time() { return t; },
    lanes() { return { n: LANES, xw: Array.from(xw), wet: Array.from(wet), vel: Array.from(wvel), z: Array.from(laneZ), xs: Array.from(laneZ).map(xsCurve), slope: SLOPE }; },
    setPose(p) {
      if (p.pos) cam.pos = p.pos.slice();
      if (typeof p.yaw === 'number') cam.yaw = p.yaw;
      if (typeof p.pitch === 'number') cam.pitch = p.pitch;
      cam.touched = true;
    },
    swashMean() {
      let m = 0, wl = 0;
      for (let i = 0; i < LANES; i++) {
        m += xw[i] - xsCurve(laneZ[i]);
        wl += Math.max(0, wet[i] - xw[i]);
      }
      return { run: m / LANES, wetLag: wl / LANES, t };
    },
    probe() { return probeData; },
    resetPerf() { ftimes.length = 0; },
    perf() {
      if (!ftimes.length) return { n: 0, avg: 0, max: 0 };
      const avg = ftimes.reduce((a, b) => a + b, 0) / ftimes.length;
      return { n: ftimes.length, avg: +avg.toFixed(2), max: +Math.max(...ftimes).toFixed(2) };
    },
    probeNow() {
      return new Promise(res => { probeReq = res; });
    },
    modelDepth(x, z) {
      const xs = xsCurve(z);
      const h = SLOPE * (x - xs) - 0.16 * Math.exp(-Math.pow((x - xs + 9.0) / 5.0, 2.0));
      const l = ZU(z);
      if (h < 0) return { h, d: Math.max(-h, 0), wet: 0 };
      return { h, d: Math.max(0, (xw[l] - x) * SLOPE * 1.3), wet: x < wet[l] ? 1 : 0, xw: xw[l], wl: wet[l] };
    },
  };
}
</script>
</body>
