<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MOUNTAINS — raymarched sunrise range in WebGL2</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d14; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #hud {
    position: fixed; left: 14px; bottom: 12px; z-index: 2; pointer-events: none;
    font: 11px/1.7 ui-monospace, Menlo, monospace; letter-spacing: .14em;
    color: rgba(226,220,214,.72); text-shadow: 0 1px 3px rgba(0,0,0,.8);
    text-transform: uppercase;
  }
  #hud b { color: rgba(255,236,214,.94); font-weight: 700; }
  #audiohint {
    position: fixed; top: 12px; right: 14px; z-index: 2;
    background: rgba(14,12,14,.5); border: 1px solid rgba(255,180,110,.26); border-radius: 8px;
    padding: 7px 12px; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    font: 11px/1.5 ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(255,224,190,.85); text-shadow: 0 1px 3px rgba(0,0,0,.8); cursor: pointer;
  }
  #audiohint.off { color: rgba(190,185,180,.5); border-color: rgba(150,150,150,.2); }
  #fatal {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 3;
    font: 14px/1.6 ui-monospace, Menlo, monospace; color: #ecdfd2; background: #101017;
    text-align: center; padding: 2em; white-space: pre;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>MOUNTAINS</b> · raymarched dawn range &nbsp;·&nbsp; drag to look &nbsp;·&nbsp; click = wind &amp; birds</div>
<div id="audiohint">click for dawn ambience</div>
<div id="fatal"></div>
<script>
'use strict';

const qs = new URLSearchParams(location.search);
const LITE = qs.get('lite') === '1';
const SEED = (qs.get('seed') | 0) || 23;
const RETINA = (window.devicePixelRatio || 1) >= 2;
const RENDER_SCALE = LITE ? 0.34 : (RETINA ? 0.72 : 0.70);
const EXT = 40.0;
const TEXW = LITE ? 512 : 1024;
const LAKE_Y = 0.30;

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) {
  const f = document.getElementById('fatal');
  f.style.display = 'grid';
  f.textContent = 'WebGL2 required.\nThis demo needs a WebGL2-capable browser.';
  throw new Error('no webgl2');
}
const HDR_OK = !!gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');

/* ---------------- noise + sky chunk (shared by generation and scene) ------- */

const CHUNK_NOISE = `
float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i), b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0)), d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm2(vec2 p, int oct){
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 6; i++){
    if (i >= oct) break;
    s += a * vnoise(p);
    p = p * 2.07 + vec2(1.7, 3.3);
    a *= 0.5;
  }
  return s;
}
float ridged(vec2 p){
  float a = 0.5, s = 0.0, w = 1.0;
  for (int i = 0; i < 7; i++){
    float n = 1.0 - abs(vnoise(p) * 2.0 - 1.0);
    s += n * n * a * w;
    w = clamp(s * 1.9, 0.0, 1.0);
    p = p * 2.13 + vec2(0.91, 1.73);
    a *= 0.58;
  }
  return s;
}`;

/* ---------------- heightfield generation (baked once to hi/lo R8 pair) ------ */

const VS_QUAD = `#version 300 es
precision highp float;
out vec2 vUv;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FS_HEIGHT = `#version 300 es
precision highp float;
in vec2 vUv;
uniform float uSeed;
out vec4 o;
${CHUNK_NOISE}
void main(){
  vec2 p = (vUv - 0.5) * ${EXT.toFixed(1)};
  vec2 dp = p + vec2(sin(uSeed * 1.7), cos(uSeed * 2.3)) * 1.7;
  vec2 warp = vec2(fbm2(dp * 0.021 + 13.0, 3), fbm2(dp * 0.021 + 91.0, 3)) - 0.5;
  dp += warp * 6.5;
  float s0 = ridged(dp * 0.062);
  float s = s0 * s0 * (3.0 - 2.0 * s0);
  float mask = 0.35 + 0.65 * smoothstep(0.30, 0.74, fbm2(dp * 0.016 + 5.0, 3));
  float massif = smoothstep(0.30, 0.62, fbm2(dp * 0.011 + 3.0, 2));
  float rolls = 0.06 * fbm2(dp * 0.05 + 71.0, 3);
  float north = smoothstep(2.2, 8.5, dp.y);
  north *= 0.42 + 0.58 * smoothstep(0.34, 0.68, fbm2(vec2(dp.x * 0.030, dp.y * 0.010) + 11.0, 2));
  float along = 0.50 + 0.50 * smoothstep(0.30, 0.72, fbm2(vec2(dp.x * 0.017, dp.y * 0.008) + 7.0, 2));
  float h = rolls;
  h += pow(ridged(dp * 0.052 + 55.0), 1.8) * 1.05 * smoothstep(1.4, 6.0, dp.y) * mask;
  h += pow(s0, 1.7) * 2.55 * mask * north * along * (0.55 + 0.45 * massif);
  h += pow(clamp(s0 * mask - 0.50, 0.0, 1.0), 2.2) * 2.8 * north * along;
  h += 0.05 * north * mask;
  float far = smoothstep(8.5, 15.0, dp.y) * (0.55 + 0.45 * smoothstep(0.35, 0.70, fbm2(vec2(dp.x * 0.011, dp.y * 0.006) + 4.0, 2)));
  h += pow(ridged(dp * 0.045 + 20.0), 1.5) * 2.6 * far;
  float r2 = length(vec2(p.x * 0.80, p.y + 0.7));
  float v = smoothstep(2.2, 5.0, r2);
  float bank = (0.075 + 0.030 * (1.0 - smoothstep(3.0, 5.5, r2))) * smoothstep(-2.4, 1.2, p.y);
  h = mix(0.024, max(h, bank), v);
  h = 0.995 * (1.0 - exp(-h * 0.80));
  float x = h * 255.0;
  o = vec4(floor(x) / 255.0, fract(x), 0.0, 1.0);
}`;

/* ---------------- scene: raymarched terrain + sky + lake -------------------- */

const FS_SCENE = `#version 300 es
precision highp float;
in vec2 vUv;
uniform vec2 uRes;
uniform float uTime;
uniform vec3 uCamPos;
uniform mat4 uCamInvRot;
uniform vec3 uSunDir;
uniform vec3 uSunCol;
uniform sampler2D uHi;
uniform sampler2D uLo;
out vec4 fragColor;

${CHUNK_NOISE}

const float FOG_B = 0.032;
const float FOG_H = 0.72;
const float SNOW0 = 2.05;
const float LAKE_Y = ${LAKE_Y.toFixed(2)};
const float HSCALE = 7.5;
const float FLOOR_H = 0.055;

float heightTex(vec2 p, float lod){
  vec2 uv = p / ${EXT.toFixed(1)} + 0.5;
  vec2 e = smoothstep(vec2(0.0), vec2(0.008), uv) * (1.0 - smoothstep(vec2(0.992), vec2(1.0), uv));
#ifdef H16
  float h = textureLod(uHi, uv, lod).r;
#else
  float h = textureLod(uHi, uv, lod).r + textureLod(uLo, uv, lod).r / 255.0;
#endif
  return mix(FLOOR_H, h, e.x * e.y) * HSCALE;
}

vec3 skyColor(vec3 rd, vec3 sunDir){
  float h = rd.y;
  float az = clamp(dot(normalize(vec3(rd.x, 0.0, rd.z)), normalize(vec3(sunDir.x, 0.0, sunDir.z))), 0.0, 1.0);
  vec3 horiz = mix(vec3(0.58, 0.50, 0.47), uSunCol * vec3(0.99, 0.82, 0.63), pow(az, 1.6));
  vec3 low = mix(vec3(0.30, 0.32, 0.46), horiz, smoothstep(0.0, 0.075, h));
  vec3 mid = vec3(0.19, 0.28, 0.50);
  vec3 zen = vec3(0.07, 0.12, 0.30);
  vec3 c = mix(low, mid, smoothstep(0.02, 0.34, h));
  c = mix(c, zen, smoothstep(0.28, 0.85, h));
  c = mix(vec3(0.055, 0.06, 0.095), c, smoothstep(-0.06, 0.0, h));
  float sa = max(dot(rd, sunDir), 0.0);
  c += uSunCol * (smoothstep(0.99972, 0.99988, sa) * 5.5 + pow(sa, 320.0) * 1.1 + pow(sa, 34.0) * 0.28 + pow(sa, 6.0) * 0.08 * smoothstep(0.35, 0.0, h));
  if (h > 0.004){
    vec2 q = rd.xz / (h + 0.14);
    vec2 cw = vec2(fbm2(q * 0.22 + 4.0, 2), fbm2(q * 0.22 + 47.0, 2)) - 0.5;
    vec2 cq = (q + cw * 0.9 + vec2(uTime * 0.008, uTime * 0.0045)) * vec2(1.5, 3.6);
    float b = fbm2(cq, 4);
    float streak = pow(max(0.0, vnoise(cq * vec2(0.55, 2.1) + 3.0)), 1.4);
    float band = smoothstep(0.44, 0.64, b) * smoothstep(0.84, 0.52, b);
    float dens = band * (0.30 + 0.70 * streak) * smoothstep(0.004, 0.05, h) * smoothstep(0.62, 0.22, h);
    vec3 lit = mix(vec3(1.0, 0.66, 0.38), vec3(1.0, 0.86, 0.72), pow(sa, 2.0));
    vec3 belly = mix(vec3(0.16, 0.14, 0.20), vec3(0.30, 0.24, 0.28), az);
    float wrap = 0.35 + 0.65 * pow(max(0.0, dot(rd, sunDir)), 1.5);
    c = mix(c, mix(belly, lit, wrap), clamp(dens, 0.0, 0.85));
  }
  return c;
}

struct Hit { float t; int kind; };

float shadowMarch(vec3 p, vec3 sd){
  float shade = 1.0, t = 0.15;
  for (int i = 0; i < 10; i++){
    vec3 q = p + sd * t;
    if (q.y > 6.3 || length(q.xz) > ${EXT.toFixed(1)} * 0.5) break;
    float lod = clamp(log2(max(t, 0.05) * 2.2), 0.0, 5.0);
    float hd = q.y - heightTex(q.xz, lod);
    if (hd < -0.02){ shade = 0.0; break; }
    shade = min(shade, 2.6 * hd / t);
    t += max(hd * 0.8, 0.10 + t * 0.09);
    if (shade < 0.008) break;
  }
  return clamp(shade, 0.0, 1.0);
}

Hit terrainRayCheap(vec3 ro, vec3 rd){
  Hit miss; miss.t = -1.0; miss.kind = 0;
  if (rd.y > 0.8) return miss;
  float t = 0.02, dt = 0.03;
  for (int i = 0; i < 45; i++){
    vec3 p = ro + rd * t;
    if (p.y > 5.6 || length(p.xz) > ${EXT.toFixed(1)} * 0.5) return miss;
    float lod = clamp(log2(max(max(dt * 9.0, 0.05), 0.22 + t * 0.30)), 1.0, 4.0);
    float hd = p.y - heightTex(p.xz, lod);
    if (hd > 4.8) return miss;
    if (hd <= 0.0){ Hit hit; hit.t = t; hit.kind = 1; return hit; }
    dt = min(dt * 1.08, 0.34 + t * 0.16);
    t += clamp(hd * 1.4, 0.02 + t * 0.004, dt);
  }
  return miss;
}

float fogAmount(float y0, float dy, float t){
  float k = dy / FOG_H;
  float f;
  if (abs(k) < 0.02) f = FOG_B * t * exp(-y0 / FOG_H);
  else f = FOG_B * FOG_H / abs(dy) * abs(exp(-y0 / FOG_H) - exp(-(y0 + dy) / FOG_H));
  f += t * 0.0100;
  return clamp(f, 0.0, 1.0);
}

vec3 shadeTerrain(vec3 p, vec3 n, vec3 rd, vec3 sunDir){
  float h = p.y;
  float slope = n.y;
  float rockN = fbm2(p.xz * 2.6 + 7.0, 4);
  float mass = fbm2(p.xz * 0.45 + 19.0, 3);
  float crack = 1.0 - smoothstep(0.02, 0.07, abs(vnoise(p.xz * 4.5 + 3.0) - 0.5));
  vec3 rock = mix(vec3(0.105, 0.11, 0.13), vec3(0.30, 0.28, 0.27), mass);
  rock = mix(rock, rock * vec3(1.32, 1.24, 1.08), smoothstep(0.55, 0.92, rockN));
  rock *= 1.0 - crack * 0.22;
  rock = mix(rock, vec3(0.24, 0.235, 0.23), smoothstep(0.66, 0.95, rockN) * 0.6);
  rock *= 0.86 + 0.22 * smoothstep(0.25, 0.55, slope);
  float sl = SNOW0 + 0.60 * (fbm2(p.xz * 1.7 + 33.0, 3) - 0.5) * 2.0;
  float snowAlt = smoothstep(sl - 0.12, sl + 0.28, h);
  float snowFlat = smoothstep(0.22, 0.50, slope);
  float driftNoise = smoothstep(0.42, 0.58, fbm2(p.xz * 3.4 + 55.0, 3));
  float brk = 0.55 + 0.70 * fbm2(p.xz * 2.6 + 3.0, 3);
  float snow = clamp(snowAlt * mix(snowFlat, 1.0, driftNoise * 0.55) * brk, 0.0, 1.0);
  float glaze = smoothstep(0.55, 0.78, fbm2(p.xz * 5.0 + 12.0, 3)) * smoothstep(sl + 0.02, sl + 0.16, h) * (1.0 - snow);
  snow = clamp(snow + glaze * 0.5, 0.0, 1.0);
  vec3 snowCol = mix(vec3(0.62, 0.66, 0.74), vec3(0.88, 0.89, 0.93), fbm2(p.xz * 9.0, 3));
  vec3 albedo = mix(rock, snowCol, snow);
  float shore = smoothstep(0.38, 0.30, h) * smoothstep(0.10, 0.30, h);
  albedo = mix(albedo, vec3(0.17, 0.15, 0.115), shore);

  float ndl = max(dot(n, sunDir), 0.0);
  float dcam = length(p - uCamPos);
  float sh = ndl > 0.012 ? (dcam < 9.0 ? shadowMarch(p + n * 0.12, sunDir) : smoothstep(9.0, 14.0, dcam) * 0.35 + 0.65) : 0.0;
  float hemi = 0.5 + 0.5 * n.y;
  vec3 amb = mix(vec3(0.055, 0.05, 0.045), vec3(0.19, 0.24, 0.38), hemi);
  vec3 c = albedo * (uSunCol * ndl * mix(0.22, 1.0, sh) * 1.7 + amb * mix(0.45, 1.0, sh * 0.5 + 0.5 * hemi));
  float above = smoothstep(FOG_H * 0.9, FOG_H * 2.6, p.y);
  c += mix(uSunCol, vec3(1.0, 0.40, 0.28), 0.55) * pow(ndl, 0.7) * sh * snow * above * 0.85;
  float rr = max(dot(reflect(-sunDir, n), -normalize(rd)), 0.0);
  c += uSunCol * pow(rr, 28.0) * sh * snow * 0.25;
  return c;
}

Hit terrainRay(vec3 ro, vec3 rd, float tLimit){
  Hit miss; miss.t = -1.0; miss.kind = 0;
  if (rd.y > 0.8) return miss;
  float t = 0.02, dt = 0.012;
  for (int i = 0; i < 80; i++){
    vec3 p = ro + rd * t;
    if (t > tLimit || p.y > 5.6 || length(p.xz) > ${EXT.toFixed(1)} * 0.9) return miss;
    float lod = clamp(log2(max(max(dt * 9.0, 0.05), 0.22 + t * 0.30)), 0.0, 1.5);
    float hd = p.y - heightTex(p.xz, lod);
    if (rd.y > 0.02 && hd > 2.4) return miss;
    if (hd <= 0.0){
      float lo = t - dt, hi = t;
      for (int k = 0; k < 7; k++){
        float m = 0.5 * (lo + hi);
        vec3 mp = ro + rd * m;
        if (mp.y - heightTex(mp.xz, max(lod - 1.0, 0.0)) < 0.0) hi = m; else lo = m;
      }
      Hit hit; hit.t = hi; hit.kind = 1;
      return hit;
    }
    dt = min(dt * 1.06, 0.10 + t * 0.055);
    t += clamp(hd * 1.4, 0.010 + t * 0.002, dt);
  }
  return miss;
}

void main(){
  vec2 ndc = vUv * 2.0 - 1.0;
  ndc.x *= uRes.x / uRes.y;
  vec3 rd = normalize((uCamInvRot * vec4(ndc, -1.9, 1.0)).xyz);
  vec3 ro = uCamPos;
  vec3 sunDir = uSunDir;

  float tLake = 1e9;
  float lakeDepth = 0.0;
  if (rd.y < -0.0015){
    float tl = (LAKE_Y - ro.y) / rd.y;
    vec3 lp = ro + rd * tl;
    if (tl > 0.0 && tl < 60.0 && length(vec2(lp.x * 0.80, lp.z + 0.7)) < 3.0){
      float th = heightTex(lp.xz, 0.0);
      if (th < LAKE_Y - 0.004){ tLake = tl; lakeDepth = LAKE_Y - th; }
    }
  }

  float tLim = 60.0;
  if (rd.y < -0.0015){ float td = (LAKE_Y - 0.03 - ro.y) / rd.y; if (td > 0.0) tLim = td; }
  Hit terr = terrainRay(ro, rd, tLim);

  vec3 col;
  float fogT;
  if (tLake < 1e8 && (terr.t < 0.0 || tLake < terr.t)){
    vec3 p = ro + rd * tLake;
    float rip = fbm2(p.xz * 5.5 + vec2(uTime * 0.05, uTime * 0.03), 2);
    float ex = vnoise((p.xz + vec2(0.12, 0.0)) * 5.5 + uTime * 0.05) - vnoise((p.xz - vec2(0.12, 0.0)) * 5.5 + uTime * 0.05);
    float ez = vnoise((p.xz + vec2(0.0, 0.12)) * 5.5 + uTime * 0.05) - vnoise((p.xz - vec2(0.0, 0.12)) * 5.5 + uTime * 0.05);
    vec3 n = normalize(vec3(-ex * 0.055 - (rip - 0.75) * 0.010, 1.0, -ez * 0.055));
    vec3 rr = reflect(rd, n);
    vec3 skyR = skyColor(normalize(rr), sunDir);
    Hit refl = terrainRayCheap(p + n * 0.02, rr);
    if (refl.t > 0.0 && refl.t < 30.0){
      vec3 rp = p + rr * refl.t;
      vec2 e2 = vec2(0.30, 0.0);
      float l2 = clamp(log2(0.22 + refl.t * 0.30), 0.0, 2.0);
      float nx = heightTex(rp.xz + vec2(e2.x, 0.0), l2) - heightTex(rp.xz - vec2(e2.x, 0.0), l2);
      float nz = heightTex(rp.xz + vec2(0.0, e2.x), l2) - heightTex(rp.xz - vec2(0.0, e2.x), l2);
      vec3 rn = normalize(vec3(-nx / (2.0 * e2.x) * 0.30, 1.0, -nz / (2.0 * e2.x) * 0.30));
      vec3 tc = shadeTerrain(rp, rn, rr, sunDir);
      float rf = fogAmount(rr.y, rr.y * refl.t, refl.t);
      skyR = mix(skyR, tc * 0.88, clamp(1.0 - rf * 0.30, 0.45, 1.0));
    }
    float fres = pow(1.0 - max(dot(-rd, n), 0.0), 4.0) * 0.82 + 0.16;
    vec3 waterDeep = vec3(0.024, 0.034, 0.052);
    vec3 waterCol = mix(vec3(0.075, 0.085, 0.095), waterDeep + skyColor(rd, sunDir) * 0.16, smoothstep(0.0, 0.33, lakeDepth));
    col = mix(waterCol, skyR, fres);
    float glit = pow(max(dot(reflect(-sunDir, n), -rd), 0.0), 220.0);
    col += uSunCol * glit * 2.4 * smoothstep(0.12, 0.30, lakeDepth);
    fogT = tLake;
  } else if (terr.t > 0.0){
    vec3 p = ro + rd * terr.t;
    float l2 = clamp(log2(0.22 + terr.t * 0.30), 0.0, 2.0);
    float e = 0.22 + terr.t * 0.010;
    float nx = heightTex(p.xz + vec2(e, 0.0), l2) - heightTex(p.xz - vec2(e, 0.0), l2);
    float nz = heightTex(p.xz + vec2(0.0, e), l2) - heightTex(p.xz - vec2(0.0, e), l2);
    vec3 n = normalize(vec3(-nx / (2.0 * e), 1.0, -nz / (2.0 * e)));
    col = shadeTerrain(p, n, rd, sunDir);
    fogT = terr.t;
  } else {
    col = skyColor(rd, sunDir);
    fogT = 0.0;
  }

  float f = fogAmount(ro.y, rd.y * max(fogT, 0.001), max(fogT, 0.001));
  vec3 rdFog = rd;
  vec3 fogCol = skyColor(normalize(vec3(rdFog.x, max(rdFog.y, 0.02), rdFog.z)), sunDir);
  fogCol = mix(fogCol * 1.08, fogCol * vec3(1.16, 0.92, 0.78), pow(max(dot(normalize(vec3(rd.x, 0.0, rd.z)), normalize(vec3(sunDir.x, 0.0, sunDir.z))), 0.0), 2.0) * smoothstep(0.25, 0.0, rd.y));
  col = mix(col, fogCol, f);

  fragColor = vec4(max(col, vec3(0.0)), 1.0);
}`;

const FS_BRIGHT = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
out vec4 o;
void main(){
  vec3 c = texture(uTex, vUv).rgb;
  float b = max(c.r, max(c.g, c.b));
  float k = smoothstep(0.55, 1.4, b);
  o = vec4(c * k, 1.0);
}`;

const FS_BLUR = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uDir;
out vec4 o;
void main(){
  vec3 c = texture(uTex, vUv).rgb * 0.204164;
  c += (texture(uTex, vUv + uDir * 1.4286).rgb + texture(uTex, vUv - uDir * 1.4286).rgb) * 0.304005;
  c += (texture(uTex, vUv + uDir * 3.0).rgb + texture(uTex, vUv - uDir * 3.0).rgb) * 0.093912;
  o = vec4(c, 1.0);
}`;

const FS_COMP = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uHdr;
uniform sampler2D uBloom;
uniform float uGain;
uniform float uTime;
out vec4 o;
vec3 aces(vec3 x){
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}
float h21(vec2 p){ p = fract(p * vec2(213.31, 427.71)); p += dot(p, p + 31.32); return fract(p.x * p.y); }
void main(){
  vec3 c = texture(uHdr, vUv).rgb + texture(uBloom, vUv).rgb * uGain;
  c = aces(c * 1.02);
  c = pow(c, vec3(1.0 / 2.2));
  c = mix(c, c * vec3(1.03, 1.0, 0.97), 0.35);
  vec2 q = vUv - 0.5;
  c *= 1.0 - dot(q, q) * 0.30;
  float g = h21(vUv * vec2(1920.0, 1080.0) + fract(uTime) * 219.0) - 0.5;
  c += g * 0.012;
  o = vec4(c, 1.0);
}`;

/* ---------------- GL helpers ---------------- */

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    console.error('shader compile failed:\n' + log);
    throw new Error('shader: ' + log);
  }
  return s;
}
function program(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  return p;
}

const progHeight = program(VS_QUAD, FS_HEIGHT);
const progBright = program(VS_QUAD, FS_BRIGHT);
const progBlur = program(VS_QUAD, FS_BLUR);
const progComp = program(VS_QUAD, FS_COMP);

const vaoEmpty = gl.createVertexArray();

function byteTarget(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo };
}

let hTexHi = null, hTexLo = null, H16 = false;
function halfTarget(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, w, h, 0, gl.RED, gl.HALF_FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const okF = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if (!okF) return null;
  return { tex, fbo };
}
function bakeHalf(){
  const t = halfTarget(TEXW, TEXW);
  if (!t) return null;
  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
  gl.viewport(0, 0, TEXW, TEXW);
  gl.useProgram(progHeight);
  gl.bindVertexArray(vaoEmpty);
  gl.uniform1f(gl.getUniformLocation(progHeight, 'uSeed'), SEED);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.getExtension('EXT_color_buffer_half_float');
  try {
    gl.bindTexture(gl.TEXTURE_2D, t.tex);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.bindTexture(gl.TEXTURE_2D, null);
  } catch (e) { return null; }
  if (gl.getError() !== gl.NO_ERROR) return null;
  return t;
}
hTexHi = byteTarget(TEXW, TEXW);
hTexLo = byteTarget(TEXW, TEXW);

function bakeHeights(){
  const uh = gl.getUniformLocation(progHeight, 'uSeed');
  gl.useProgram(progHeight);
  gl.bindVertexArray(vaoEmpty);
  gl.uniform1f(uh, SEED);
  const t16 = EXT_HOK ? bakeHalf() : null;
  if (t16){ H16 = true; hTex16 = t16; return; }
  gl.bindFramebuffer(gl.FRAMEBUFFER, hTexHi.fbo);
  gl.viewport(0, 0, TEXW, TEXW);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, hTexLo.fbo);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindTexture(gl.TEXTURE_2D, hTexHi.tex); gl.generateMipmap(gl.TEXTURE_2D);
  gl.bindTexture(gl.TEXTURE_2D, hTexLo.tex); gl.generateMipmap(gl.TEXTURE_2D);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
let hTex16 = null;
const EXT_HOK = !!gl.getExtension('EXT_color_buffer_float');
bakeHeights();
const progScene = program(VS_QUAD, H16 ? '#version 300 es\n#define H16\n' + FS_SCENE.slice(FS_SCENE.indexOf('\n') + 1) : FS_SCENE);

const HDRF = HDR_OK ? gl.RGBA16F : gl.RGBA8;
const HDRType = HDR_OK ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

function makeTarget(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, HDRF, w, h, 0, gl.RGBA, HDRType, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo, w, h };
}

let W = 0, H = 0, hdr = null, b1 = null, b2 = null;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, LITE ? 1 : 1.5);
  const cw = Math.floor(canvas.clientWidth * dpr * RENDER_SCALE);
  const ch = Math.floor(canvas.clientHeight * dpr * RENDER_SCALE);
  if (cw === W && ch === H) return;
  W = Math.max(2, cw); H = Math.max(2, ch);
  canvas.width = W; canvas.height = H;
  hdr = makeTarget(W, H);
  const bw = Math.max(2, W >> 2), bh = Math.max(2, H >> 2);
  b1 = makeTarget(bw, bh);
  b2 = makeTarget(bw, bh);
}
resize();
addEventListener('resize', resize);

/* ---------------- camera ---------------- */

const cam = { yaw: 0.02, pitch: 0.045, tyaw: 0.02, tpitch: 0.045, touched: 0 };
let drag = null;
canvas.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId);
  cam.touched = performance.now();
  unlockAudio();
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  cam.tyaw = Math.max(-1.5, Math.min(1.5, cam.tyaw - (e.clientX - drag.x) * 0.004));
  cam.tpitch = Math.max(-0.28, Math.min(0.30, cam.tpitch - (e.clientY - drag.y) * 0.0035));
  drag = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', () => { drag = null; });

const FOVZ = 1.9;
const CAMPOS = [0.0, 1.15, -3.40];

function camBasis(t){
  const idle = Math.max(0, (performance.now() - cam.touched) / 1000 - 2.0);
  const drift = Math.min(1, idle / 3.0);
  cam.yaw += (cam.tyaw + Math.sin(t * 0.05) * 0.05 * drift - cam.yaw) * 0.035;
  cam.pitch += (cam.tpitch + Math.sin(t * 0.083 + 1.7) * 0.008 * drift - cam.pitch) * 0.035;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const f = [sy * cp, sp, cy * cp];
  let r = [-f[2], 0, f[0]];
  const rl = Math.hypot(r[0], r[2]) || 1;
  r = [r[0] / rl, 0, r[2] / rl];
  const u = [
    r[1] * f[2] - r[2] * f[1],
    r[2] * f[0] - r[0] * f[2],
    r[0] * f[1] - r[1] * f[0],
  ];
  return { pos: CAMPOS, r, u, f };
}

function rotMat(out, r, u, f){
  out[0] = r[0]; out[1] = r[1]; out[2] = r[2]; out[3] = 0;
  out[4] = u[0]; out[5] = u[1]; out[6] = u[2]; out[7] = 0;
  out[8] = -f[0]; out[9] = -f[1]; out[10] = -f[2]; out[11] = 0;
  out[12] = 0; out[13] = 0; out[14] = 0; out[15] = 1;
}

/* ---------------- sun ---------------- */

const SUN_AZ = -0.55;
function sunAt(t){
  const el = (13.0 + Math.min(2.0, t * 0.015)) * Math.PI / 180;
  const dir = [Math.sin(SUN_AZ) * Math.cos(el), Math.sin(el), Math.cos(SUN_AZ) * Math.cos(el)];
  const warm = [1.0, 0.48 + el * 1.0, 0.16 + el * 1.2];
  return { dir, col: warm };
}

/* ---------------- audio: valley wind + dawn birds ---------------- */

let AC = null, master = null, running = false;
const audioHint = document.getElementById('audiohint');
function unlockAudio(){
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination);
    const len = Math.floor(AC.sampleRate * 3);
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++){
      const w = Math.random() * 2 - 1;
      last = (last + 0.012 * w) / 1.012;
      d[i] = last * 3.4;
    }
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 0.5;
    const g = AC.createGain(); g.gain.value = 0.10;
    src.connect(lp).connect(g).connect(master);
    src.start();
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.09;
    const lg = AC.createGain(); lg.gain.value = 180;
    lfo.connect(lg).connect(lp.frequency); lfo.start();
    const lfo2 = AC.createOscillator(); lfo2.frequency.value = 0.037;
    const lg2 = AC.createGain(); lg2.gain.value = 0.05;
    lfo2.connect(lg2).connect(g.gain); lfo2.start();
    running = true;
    scheduleBird();
    audioHint.textContent = 'dawn ambience on';
    audioHint.classList.add('off');
  } catch (e) { /* audio unavailable */ }
}
audioHint.addEventListener('pointerdown', unlockAudio);
addEventListener('keydown', unlockAudio);

function chirp(t0, f0, dur, n){
  for (let k = 0; k < n; k++){
    const t = t0 + k * (dur + 0.03 + Math.random() * 0.05);
    const o = AC.createOscillator(); o.type = 'sine';
    const f = f0 * (0.92 + Math.random() * 0.18);
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * (1.25 + Math.random() * 0.5), t + dur * 0.4);
    o.frequency.exponentialRampToValueAtTime(f * 0.9, t + dur);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05 + Math.random() * 0.08, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
}
function scheduleBird(){
  if (!running || !AC) return;
  const r = Math.random();
  if (r < 0.75) chirp(AC.currentTime + 0.2 + Math.random() * 2, 1600 + Math.random() * 1800, 0.06 + Math.random() * 0.07, 1 + (Math.random() * 3 | 0));
  setTimeout(scheduleBird, 900 + Math.random() * 5200);
}

/* ---------------- frame loop ---------------- */

let t0 = performance.now();
let frames = 0, perfAcc = 0, perfN = 0, perfMax = 0, lastFrame = 0;
let readyFlag = false;

const rot4 = new Float32Array(16);
const U = p => name => gl.getUniformLocation(p, name);
const us = U(progScene), ubr = U(progBright), ubl = U(progBlur), uc = U(progComp);

function frame(){
  const t = (performance.now() - t0) / 1000;
  const now = performance.now();
  if (lastFrame) { const dtms = now - lastFrame; perfAcc += dtms; perfN++; if (dtms > perfMax) perfMax = dtms; }
  lastFrame = now;
  frames++;
  resize();

  const sun = sunAt(t);
  const cb = camBasis(t);
  rotMat(rot4, cb.r, cb.u, cb.f);

  gl.bindFramebuffer(gl.FRAMEBUFFER, hdr.fbo);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(progScene);
  gl.bindVertexArray(vaoEmpty);
  gl.uniform2f(us('uRes'), W, H);
  gl.uniform1f(us('uTime'), t);
  gl.uniform3f(us('uCamPos'), cb.pos[0], cb.pos[1], cb.pos[2]);
  gl.uniformMatrix4fv(us('uCamInvRot'), false, rot4);
  gl.uniform3f(us('uSunDir'), sun.dir[0], sun.dir[1], sun.dir[2]);
  gl.uniform3f(us('uSunCol'), sun.col[0], sun.col[1], sun.col[2]);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, H16 ? hTex16.tex : hTexHi.tex); gl.uniform1i(us('uHi'), 0);
  if (!H16){ gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, hTexLo.tex); gl.uniform1i(us('uLo'), 1); }
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, b1.fbo);
  gl.viewport(0, 0, b1.w, b1.h);
  gl.useProgram(progBright);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, hdr.tex);
  gl.uniform1i(ubr('uTex'), 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.useProgram(progBlur);
  gl.uniform1i(ubl('uTex'), 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b2.fbo);
  gl.bindTexture(gl.TEXTURE_2D, b1.tex);
  gl.uniform2f(ubl('uDir'), 2.4 / b1.w, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b1.fbo);
  gl.bindTexture(gl.TEXTURE_2D, b2.tex);
  gl.uniform2f(ubl('uDir'), 0, 2.4 / b1.h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b2.fbo);
  gl.bindTexture(gl.TEXTURE_2D, b1.tex);
  gl.uniform2f(ubl('uDir'), 5.6 / b1.w, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b1.fbo);
  gl.bindTexture(gl.TEXTURE_2D, b2.tex);
  gl.uniform2f(ubl('uDir'), 0, 5.6 / b1.h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(progComp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, hdr.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, b1.tex);
  gl.uniform1i(uc('uHdr'), 0);
  gl.uniform1i(uc('uBloom'), 1);
  gl.uniform1f(uc('uGain'), 0.85);
  gl.uniform1f(uc('uTime'), t);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  readyFlag = true;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- DEV hooks ---------------- */

window.__mountainsTest = {
  get ready(){ return readyFlag; },
  get frames(){ return frames; },
  get gl2(){ return true; },
  get hdr(){ return HDR_OK; },
  sun(){ const s = sunAt((performance.now() - t0) / 1000); return { elev: Math.asin(s.dir[1]) * 180 / Math.PI, az: SUN_AZ, r: s.col[0], g: s.col[1], b: s.col[2] }; },
  pose(){ return { yaw: cam.yaw, pitch: cam.pitch }; },
  terrain(x, z){
    const px8 = new Uint8Array(4);
    const u = Math.max(0, Math.min(1, x / EXT + 0.5)) * (TEXW - 1);
    const v = Math.max(0, Math.min(1, z / EXT + 0.5)) * (TEXW - 1);
    const s = gl.createSampler ? null : null;
    const hi = new Uint8Array(1), lo = new Uint8Array(1);
    const grab = (rt, dst) => {
      gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fbo);
      const buf = new Uint8Array(TEXW * TEXW * 4);
      gl.readPixels(0, 0, TEXW, TEXW, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      const idx = (Math.round(v) * TEXW + Math.round(u)) * 4;
      dst[0] = buf[idx];
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    };
    grab(hTexHi, hi); grab(hTexLo, lo);
    return +((hi[0] + lo[0] / 255) / 255).toFixed(3);
  },
  perf(){ return { avg: perfN ? +(perfAcc / perfN).toFixed(2) : 0, max: +perfMax.toFixed(2), n: perfN }; },
  renderScale(){ return { scale: RENDER_SCALE, lite: LITE, retina: RETINA, w: W, h: H, css: canvas.clientWidth, dpr: window.devicePixelRatio || 1 }; },
  resetPerf(){ perfAcc = 0; perfN = 0; perfMax = 0; },
  setPose(p){
    if (p.yaw !== undefined) { cam.tyaw = p.yaw; cam.yaw = p.yaw; }
    if (p.pitch !== undefined) { cam.tpitch = p.pitch; cam.pitch = p.pitch; }
    cam.touched = performance.now();
  },
};
