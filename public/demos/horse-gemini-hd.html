'use strict';

/* ============================================================================
 * THOROUGHBRED (horse-gemini-hd)
 * Procedural Smooth-Surface 3D Equine Gallop, Biomechanics & Shadow-Mapped HDR
 * Zero libraries, zero imported meshes, zero image/audio assets.
 * Coordinate frame: +X forward (direction of travel), +Y up (track y = 0),
 * +Z horse's right/near flank (right-handed: X x Y = Z).
 * ========================================================================== */

const qs = new URLSearchParams(location.search);
const IS_COARSE = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
const LITE = qs.get('lite') === '1';

const gl = canvas.getContext('webgl2', {
  antialias: true,

  powerPreference: 'high-performance',
  preserveDrawingBuffer: true,

if (!gl) {
  const f = document.getElementById('fatal');
  f.style.display = 'grid';
  f.textContent = 'WebGL2 required.\nThis demo needs a WebGL2-capable browser.';
  throw new Error('WebGL2 unavailable');

const EXT_FLOAT = gl.getExtension('EXT_color_buffer_float');

/* ---------------- Math & Linear Algebra ---------------- */

const TAU = Math.PI * 2;
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const smoothstep = (e0, e1, x) => {
  const t = clamp((x - e0) / (e1 - e0 || 1e-6), 0, 1);
  return t * t * (3 - 2 * t);
};
const lerp = (a, b, t) => a + (b - a) * t;

function add3(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function sub3(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function scale3(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function mix3(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function dot3(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function dist3(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]); }
function cross3(a, b) {
  return [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0],
  ];
}
function norm3(a) {
  const l = Math.hypot(a[0], a[1], a[2]) || 1;
  return [a[0] / l, a[1] / l, a[2] / l];
}

function mat4Perspective(fovY, aspect, near, far) {
  const f = 1 / Math.tan(fovY * 0.5);
  const nf = 1 / (near - far);
  const m = new Float32Array(16);
  m[0] = f / aspect;
  m[5] = f;
  m[10] = (far + near) * nf;
  m[11] = -1;
  m[14] = 2 * far * near * nf;
  return m;
}

function mat4Ortho(l, r, b, t, n, f) {
  const m = new Float32Array(16);
  m[0] = 2 / (r - l);
  m[5] = 2 / (t - b);
  m[10] = -2 / (f - n);
  m[12] = -(r + l) / (r - l);
  m[13] = -(t + b) / (t - b);
  m[14] = -(f + n) / (f - n);
  m[15] = 1;
  return m;
}

function mat4LookAt(eye, target, up) {
  const z = norm3(sub3(eye, target));
  const x = norm3(cross3(up, z));
  const y = cross3(z, x);
  const m = new Float32Array(16);
  m[0] = x[0]; m[4] = x[1]; m[8] = x[2];   m[12] = -dot3(x, eye);
  m[1] = y[0]; m[5] = y[1]; m[9] = y[2];   m[13] = -dot3(y, eye);
  m[2] = z[0]; m[6] = z[1]; m[10] = z[2];  m[14] = -dot3(z, eye);
  m[15] = 1;
  return m;
}

function mat4Mul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) {
    const b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
    o[c * 4]     = a[0] * b0 + a[4] * b1 + a[8]  * b2 + a[12] * b3;
    o[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9]  * b2 + a[13] * b3;
    o[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
    o[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
  }
  return o;
}

function catmullRom1(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * (
    (2 * p1) +
    (-p0 + p2) * t +
    (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
    (-p0 + 3 * p1 - 3 * p2 + p3) * t3
  );
}

function sampleSpline3(pts, u, out) {
  const n = pts.length - 1;
  const f = clamp(u, 0, 1) * n;
  const i = Math.min(n - 1, Math.floor(f));
  const t = f - i;
  const p0 = pts[Math.max(0, i - 1)];
  const p1 = pts[i];
  const p2 = pts[i + 1];
  const p3 = pts[Math.min(n, i + 2)];
  out[0] = catmullRom1(p0[0], p1[0], p2[0], p3[0], t);
  out[1] = catmullRom1(p0[1], p1[1], p2[1], p3[1], t);
  out[2] = catmullRom1(p0[2], p1[2], p2[2], p3[2], t);
  return out;
}

let coatIdx = 0;

/* ---------------- WebGL2 Shaders (Shadow + HDR PBR/Coat/Hair + Grass + Bloom/ACES) ---------------- */

function compileShader(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(sh);
    gl.deleteShader(sh);
    throw new Error('Shader compile error: ' + log);
  }
  return sh;
}

function linkProgram(vsSrc, fsSrc) {
  const p = gl.createProgram();
  const vs = compileShader(gl.VERTEX_SHADER, vsSrc);
  const fs = compileShader(gl.FRAGMENT_SHADER, fsSrc);
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error('Program link error: ' + gl.getProgramInfoLog(p));
  }
  return p;
}

// 1. Atmospheric Sky & Cloud Deck Shader
const VS_QUAD = `#version 300 es
precision highp float;
out vec2 vUv;
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.9999, 1.0);
}`;

const FS_SKY = `#version 300 es
precision highp float;
in vec2 vUv;
uniform vec3 uCamFwd;
uniform vec3 uCamRight;
uniform vec3 uCamUp;
uniform float uTanHalfFov;
uniform float uAspect;
uniform vec3 uSunDir;
uniform float uTime;
out vec4 fragColor;

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),
    mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x),
    f.y
  );
}
float fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  mat2 rot = mat2(0.80, 0.60, -0.60, 0.80);
  for (int i = 0; i < 4; i++) {
    s += a * vnoise(p);
    p = rot * p * 2.04 + vec2(3.1, 1.7);
    a *= 0.5;
  }
  return s;
}

void main() {
  vec2 ndc = vUv * 2.0 - 1.0;
  vec3 rd = normalize(uCamFwd + ndc.x * uAspect * uTanHalfFov * uCamRight + ndc.y * uTanHalfFov * uCamUp);
  float h = clamp(rd.y, -0.2, 1.0);
  float sDot = max(dot(rd, uSunDir), 0.0);

  // Rayleigh + golden-hour Mie sky gradient
  vec3 zenith  = vec3(0.085, 0.165, 0.36);
  vec3 midSky  = vec3(0.24, 0.35, 0.54);
  vec3 horizon = vec3(0.88, 0.69, 0.48);
  vec3 sunWarm = vec3(1.15, 0.72, 0.36);

  vec3 sky = h >= 0.0
    ? mix(horizon, mix(midSky, zenith, pow(clamp(h * 1.35, 0.0, 1.0), 0.72)), pow(h, 0.44))
    : mix(horizon * 0.82, vec3(0.24, 0.22, 0.18), clamp(-h * 6.0, 0.0, 1.0));

  sky += sunWarm * pow(sDot, 5.0) * (0.28 * (1.0 - 0.55 * max(h, 0.0)));
  sky += vec3(1.35, 0.92, 0.52) * pow(sDot, 36.0) * 0.55;

  // High-altitude sunlit cirrus wisps
  if (rd.y > 0.025) {
    vec2 cUv = rd.xz / (rd.y + 0.16) * 0.65 + vec2(uTime * 0.006, -uTime * 0.003);
    float c1 = fbm(cUv * vec2(1.4, 2.6));
    float c2 = fbm(cUv * vec2(3.2, 5.0) + c1 * 0.9);
    float cloud = smoothstep(0.47, 0.78, 0.55 * c1 + 0.45 * c2) * smoothstep(0.025, 0.22, rd.y);
    vec3 cloudLit = mix(vec3(0.76, 0.78, 0.85), vec3(1.32, 0.96, 0.66), pow(sDot, 2.2) * 0.85 + 0.15);
    sky = mix(sky, cloudLit, cloud * 0.58);
  }

  // Crisp solar disc
  sky += vec3(2.4, 1.85, 1.15) * smoothstep(0.9986, 0.9996, sDot);
  fragColor = vec4(sky, 1.0);
}`;

// 2. Shadow Depth Pass Shader (Vertex layout matches main 14-float interleaved vertex!)

layout(location = 0) in vec3 aPos;

void main() {}`;

// 3. Main HDR Equine Coat / Hair / Highland Terrain & World Shader
// Interleaved vertex (14 floats = 56 bytes):
//   0: aPos (vec3)
//   1: aNorm (vec3)
//   2: aTan (vec3)  — hair/fur direction or surface tangent
//   3: aCol (vec3)  — linear base albedo
//   4: aParam (vec2) — x = matId (0=coat, 1=hair, 2=glossEyeHoof, 3=ground, 4=world), y = roughness/ao packed or coatUV
const VS_MAIN = `#version 300 es
precision highp float;
layout(location = 0) in vec3 aPos;
layout(location = 1) in vec3 aNorm;
layout(location = 2) in vec3 aTan;
layout(location = 3) in vec3 aCol;
layout(location = 4) in vec2 aParam;

uniform mat4 uViewProj;
uniform mat4 uLightVP;

out vec3 vPos;
out vec3 vNorm;
out vec3 vTan;
out vec3 vCol;
out vec2 vParam;
out vec4 vShadowCoord;

void main() {
  vPos = aPos;
  vNorm = aNorm;
  vTan = aTan;
  vCol = aCol;
  vParam = aParam;
  // Slight normal offset for acne-free self-shadowing
  vec3 shadowWorld = aPos + aNorm * 0.008;
  vShadowCoord = uLightVP * vec4(shadowWorld, 1.0);
  gl_Position = uViewProj * vec4(aPos, 1.0);
}`;

const FS_MAIN = `#version 300 es
precision highp float;
in vec3 vPos;
in vec3 vNorm;
in vec3 vTan;
in vec3 vCol;
in vec2 vParam;
in vec4 vShadowCoord;

uniform vec3 uSunDir;
uniform vec3 uCamPos;
uniform vec3 uRefCenter;
uniform vec3 uSubsurface;
uniform vec3 uHairSpec;
uniform float uDappleAmt;
uniform highp sampler2DShadow uShadowMap;
uniform vec4 uPrints[24]; // (x, z, age01, active)

out vec4 fragColor;

float hash31(vec3 p) {
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}

float noise3(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float n000 = hash31(i);
  float n100 = hash31(i + vec3(1, 0, 0));
  float n010 = hash31(i + vec3(0, 1, 0));
  float n110 = hash31(i + vec3(1, 1, 0));
  float n001 = hash31(i + vec3(0, 0, 1));
  float n101 = hash31(i + vec3(1, 0, 1));
  float n011 = hash31(i + vec3(0, 1, 1));
  float n111 = hash31(i + vec3(1, 1, 1));
  return mix(
    mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),
    mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y),
    f.z
  );
}

float sampleShadowPCF(vec4 sc, float ndl) {
  vec3 proj = sc.xyz / max(sc.w, 1e-5) * 0.5 + 0.5;
  if (proj.x <= 0.01 || proj.x >= 0.99 || proj.y <= 0.01 || proj.y >= 0.99 || proj.z >= 0.998) {
    return 1.0;
  }
  float edgeFade = smoothstep(0.01, 0.08, min(min(proj.x, 1.0 - proj.x), min(proj.y, 1.0 - proj.y)));
  float bias = mix(0.0018, 0.00045, clamp(ndl, 0.0, 1.0));
  vec2 texel = vec2(1.0 / 2048.0);
  const vec2 poisson[9] = vec2[9](
    vec2( 0.00,  0.00),
    vec2(-0.84, -0.34),
    vec2( 0.68, -0.62),
    vec2(-0.32,  0.88),
    vec2( 0.88,  0.38),
    vec2(-0.72,  0.46),
    vec2( 0.24, -0.92),
    vec2(-0.18, -0.52),
    vec2( 0.42,  0.74)
  );
  float sum = 0.0;
  for (int i = 0; i < 9; i++) {
    sum += texture(uShadowMap, vec3(proj.xy + poisson[i] * texel * 1.85, proj.z - bias));
  }
  return mix(1.0, sum / 9.0, edgeFade);
}

float ggxSpec(vec3 N, vec3 V, vec3 L, float rough) {
  vec3 H = normalize(V + L);
  float ndh = max(dot(N, H), 0.0);
  float ndv = max(dot(N, V), 0.001);
  float ndl = max(dot(N, L), 0.0);
  if (ndl <= 0.0) return 0.0;
  float a = rough * rough;
  float a2 = a * a;
  float d = (ndh * ndh) * (a2 - 1.0) + 1.0;
  float D = a2 / (3.14159265 * d * d + 1e-5);
  float k = (rough + 1.0) * (rough + 1.0) * 0.125;
  float G = (ndv / (ndv * (1.0 - k) + k)) * (ndl / (ndl * (1.0 - k) + k));
  float F = 0.04 + 0.96 * pow(1.0 - max(dot(H, V), 0.0), 5.0);
  return (D * G * F) / max(4.0 * ndv * ndl, 0.001);
}

void main() {
  int mat = int(vParam.x + 0.5);
  float ao = clamp(vParam.y, 0.15, 1.0);
  vec3 N = normalize(vNorm);
  vec3 T = normalize(vTan - N * dot(vTan, N) + vec3(1e-5, 0.0, 0.0));
  vec3 B = cross(N, T);
  vec3 V = normalize(uCamPos - vPos);
  vec3 L = uSunDir;

  vec3 albedo = vCol;
  float rough = 0.45;

  // Procedural surface micro-detail & horseshoe track prints
  if (mat == 0) {
    // Equine short-coat guard-hair grain + subtle organic dapples on quarters/barrel
    vec3 bodyLocal = vPos - uRefCenter;
    float grain = noise3(vec3(bodyLocal.x * 46.0, bodyLocal.y * 85.0, bodyLocal.z * 85.0)) - 0.5;
    N = normalize(N + B * (grain * 0.045));
    if (uDappleAmt > 0.01) {
      float dp1 = noise3(bodyLocal * 13.5);
      float dp2 = noise3(bodyLocal * 27.0 + 4.3);
      float ring = smoothstep(0.36, 0.66, dp1) * (0.65 + 0.35 * dp2);
      float mask = smoothstep(0.68, 1.08, vPos.y) * (1.0 - smoothstep(1.52, 1.72, vPos.y));
      albedo *= 1.0 + uDappleAmt * (ring - 0.44) * mask;
    }
    rough = 0.34;
  } else if (mat == 2) {
    // Glossy corneal eye / damp nostril / polished hoof horn
    rough = vCol.r < 0.06 ? 0.055 : 0.21;
  } else if (mat == 3) {
    // Packed loam gallop track + emerald highland meadow + indented damp hoofprints
    float g1 = noise3(vec3(vPos.x * 5.2, 0.0, vPos.z * 5.2));
    float g2 = noise3(vec3(vPos.x * 22.0, 0.5, vPos.z * 22.0));
    float g3 = noise3(vec3(vPos.x * 68.0, 1.3, vPos.z * 68.0));
    float bumpX = (g2 - 0.5) * 0.08 + (g3 - 0.5) * 0.05;
    float bumpZ = (noise3(vec3(vPos.x * 22.0 + 7.1, 0.5, vPos.z * 22.0)) - 0.5) * 0.08;
    albedo *= (0.88 + 0.24 * g1) * (0.94 + 0.12 * g2);
    rough = 0.78 - 0.14 * g2;

    // Check world-pinned horseshoe craters on the packed track
    if (abs(vPos.z) < 0.65 && abs(vPos.x - uRefCenter.x) < 16.0) {
      for (int i = 0; i < 24; i++) {
        vec4 pr = uPrints[i];
        if (pr.w < 0.5) continue;
        vec2 d = (vPos.xz - pr.xy) / vec2(0.068, 0.058);
        float r = length(d);
        if (r < 1.35) {
          // Equine U-shaped shoe wall + central frog
          float uRing = exp(-pow((r - 0.78) / 0.24, 2.0)) * smoothstep(-0.85, -0.35, d.x);
          float frog  = exp(-pow(length(d - vec2(-0.18, 0.0)) / 0.32, 2.0)) * 0.55;
          float indent = clamp(uRing + frog, 0.0, 1.0) * (1.0 - pr.z * 0.65);
          albedo *= 1.0 - 0.42 * indent;
          rough = mix(rough, 0.38, indent * 0.7);
          bumpX -= d.x * indent * 0.28;
          bumpZ -= d.y * indent * 0.28;
        }
      }
    }
    N = normalize(N + vec3(bumpX, 0.0, bumpZ));
  } else if (mat == 4) {
    float rk = noise3(vPos * 1.4);
    albedo *= 0.90 + 0.20 * rk;
    rough = 0.72;
  }

  float rawNdl = dot(N, L);
  float ndl = max(rawNdl, 0.0);
  float shadow = sampleShadowPCF(vShadowCoord, ndl);

  // Sun + Hemisphere Sky + Warm Turf Bounce
  vec3 sunColor = vec3(1.68, 1.26, 0.86);
  vec3 skyTop   = vec3(0.18, 0.27, 0.46);
  vec3 groundBounce = vec3(0.20, 0.14, 0.08);
  vec3 hemi = mix(groundBounce, skyTop, clamp(N.y * 0.5 + 0.5, 0.0, 1.0)) * ao;

  vec3 lit;
  if (mat == 1) {
    // Kajiya-Kay Anisotropic Horsehair (Mane, Forelock, Tail)
    vec3 H = normalize(L + V);
    float tdoth1 = clamp(dot(T, H) - 0.14, -1.0, 1.0);
    float tdoth2 = clamp(dot(T, H) + 0.22, -1.0, 1.0);
    float sinTH1 = sqrt(max(0.0, 1.0 - tdoth1 * tdoth1));
    float sinTH2 = sqrt(max(0.0, 1.0 - tdoth2 * tdoth2));
    float spec1 = pow(sinTH1, 64.0) * 0.22;
    float spec2 = pow(sinTH2, 28.0) * 0.15;
    float hairWrap = clamp(rawNdl * 0.55 + 0.45, 0.0, 1.0);
    float backScatter = pow(max(dot(-V, L), 0.0), 4.0) * 0.18;
    float shMix = 0.25 + 0.75 * shadow;
    lit = albedo * (hemi * 0.90 + sunColor * hairWrap * shMix * 0.90)
        + sunColor * shMix * (vec3(spec1) * 0.26 + uHairSpec * spec2)
        + uHairSpec * sunColor * backScatter * 0.18;
  } else {
    float spec = ggxSpec(N, V, L, rough) * ndl * shadow;
    vec3 sss = vec3(0.0);
    vec3 velvet = vec3(0.0);
    if (mat == 0) {
      // Equine coat warm subsurface wrap + grazing satin/velvet sheen
      float wrap = max(0.0, (rawNdl + 0.38) / 1.38);
      sss = uSubsurface * (wrap * (1.0 - ndl) * 0.26) * (0.32 + 0.68 * shadow);
      float rim = pow(1.0 - max(dot(N, V), 0.0), 3.6);
      float sunRim = 0.28 + 0.72 * max(dot(-V, L), 0.0);
      velvet = mix(albedo * 1.65 + vec3(0.016), sunColor * 0.36, 0.40) * rim * sunRim * ao * (0.30 + 0.70 * shadow);
      spec *= 1.25;
    } else if (mat == 2) {
      spec *= 2.20;
      float rim = pow(1.0 - max(dot(N, V), 0.0), 4.2) * 0.22;
      velvet = vec3(0.24, 0.26, 0.32) * rim;
    }
    lit = albedo * (hemi + sunColor * ndl * shadow) + sss * albedo + sunColor * spec + velvet;
  }

  // Atmospheric valley mist & golden aerial perspective
  float dist = length(vPos - uCamPos);
  float heightFactor = exp(-max(vPos.y, 0.0) * 0.08);
  float fogAmt = (1.0 - exp(-max(0.0, dist - 10.0) * 0.0085)) * (0.50 + 0.50 * heightFactor);
  float sView = max(dot(normalize(vPos - uCamPos), L), 0.0);
  vec3 fogCol = mix(vec3(0.38, 0.48, 0.66), vec3(0.92, 0.70, 0.44), pow(sView, 3.0) * 0.68 + 0.16);
  lit = mix(lit, fogCol, clamp(fogAmt, 0.0, 0.84));

  fragColor = vec4(max(lit, vec3(0.0)), 1.0);
}`;

// 4. GPU-Instanced Wind-Rippled Fescue Grass & Wildflower Shader
const VS_GRASS = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aBlade;      // x in [-0.5, 0.5], y in [0, 1] along blade
layout(location = 1) in vec4 aInstPos;    // x, y, z, height
layout(location = 2) in vec4 aInstStyle;  // yaw, bend, phase, tint (tint > 0.86 = wildflower tip!)

uniform mat4 uViewProj;
uniform mat4 uLightVP;
uniform float uCenterX;
uniform float uPeriod;
uniform float uTime;

out vec3 vPos;
out vec3 vNorm;
out vec3 vCol;
out float vTip;
out vec4 vShadowCoord;

void main() {
  // Wrap instance X seamlessly around uCenterX within [-0.5*uPeriod, +0.5*uPeriod)
  float dx = mod(aInstPos.x - uCenterX + 0.5 * uPeriod, uPeriod) - 0.5 * uPeriod;
  vec3 root = vec3(uCenterX + dx, aInstPos.y, aInstPos.z);

  float h = aInstPos.w;
  float v = aBlade.y;
  float taper = 1.0 - 0.86 * v * v;
  float width = 0.024 * taper * (aInstStyle.w > 0.88 && v > 0.78 ? 2.1 : 1.0);

  float yaw = aInstStyle.x;
  vec3 side = vec3(cos(yaw), 0.0, sin(yaw));
  vec3 fwd  = vec3(-sin(yaw), 0.0, cos(yaw));

  float gust = sin(uTime * 2.4 - root.x * 0.35 + root.z * 0.25 + aInstStyle.z) * 0.14
             + sin(uTime * 5.1 + aInstStyle.z * 1.7) * 0.04;
  float arch = (aInstStyle.y + gust) * v * v;

  vec3 pos = root
           + side * (aBlade.x * width)
           + fwd * (arch * h)
           + vec3(0.0, h * v * (1.0 - 0.22 * arch * arch), 0.0);

  vec3 tang = normalize(vec3(fwd.x * 2.0 * (aInstStyle.y + gust) * v, 1.0, fwd.z * 2.0 * (aInstStyle.y + gust) * v));
  vec3 norm = normalize(cross(side, tang) + vec3(0.0, 0.45, 0.0));

  vec3 baseGreen = mix(vec3(0.028, 0.068, 0.016), vec3(0.052, 0.112, 0.024), aInstStyle.w);
  vec3 tipGold   = mix(vec3(0.11, 0.175, 0.036), vec3(0.24, 0.20, 0.048), aInstStyle.w);
  vec3 col = mix(baseGreen, tipGold, pow(v, 0.85));
  if (aInstStyle.w > 0.92 && v > 0.76) {
    col = vec3(0.76, 0.48, 0.05); // Golden highland buttercup
  } else if (aInstStyle.w > 0.87 && aInstStyle.w <= 0.92 && v > 0.76) {
    col = vec3(0.28, 0.16, 0.62); // Wild mountain lupine
  }

  vPos = pos;
  vNorm = norm;
  vCol = col;
  vTip = v;
  vShadowCoord = uLightVP * vec4(pos + vec3(0.0, 0.02, 0.0), 1.0);
  gl_Position = uViewProj * vec4(pos, 1.0);
}`;

const FS_GRASS = `#version 300 es
precision highp float;
in vec3 vPos;
in vec3 vNorm;
in vec3 vCol;
in float vTip;
in vec4 vShadowCoord;

uniform vec3 uSunDir;
uniform vec3 uCamPos;
uniform highp sampler2DShadow uShadowMap;

out vec4 fragColor;

void main() {
  vec3 N = normalize(vNorm);
  vec3 V = normalize(uCamPos - vPos);
  float ndl = max(dot(N, uSunDir), 0.0);

  vec3 proj = vShadowCoord.xyz / max(vShadowCoord.w, 1e-5) * 0.5 + 0.5;
  float sh = 1.0;
  if (proj.x > 0.01 && proj.x < 0.99 && proj.y > 0.01 && proj.y < 0.99 && proj.z < 0.998) {
    sh = texture(uShadowMap, vec3(proj.xy, proj.z - 0.0016));
  }

  vec3 sunCol = vec3(1.48, 1.15, 0.80);
  vec3 skyCol = vec3(0.20, 0.28, 0.44);
  float ao = mix(0.42, 1.0, vTip);
  float trans = pow(max(dot(-V, uSunDir), 0.0), 2.5) * 0.45 * vTip;

  vec3 lit = vCol * (skyCol * ao + sunCol * (ndl * 0.75 + 0.25 + trans) * (0.28 + 0.72 * sh));

  float dist = length(vPos - uCamPos);
  float fade = 1.0 - smoothstep(26.0, 36.0, dist);
  float fogAmt = 1.0 - exp(-max(0.0, dist - 8.0) * 0.0085);
  lit = mix(lit, vec3(0.68, 0.67, 0.68), clamp(fogAmt, 0.0, 0.8));
  fragColor = vec4(lit, fade);
}`;

// 5. Post-Processing: Bright-Pass Bloom Extract & ACES Filmic Composite
const FS_BLOOM = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uHdrTex;
uniform vec2 uTexel;
out vec4 fragColor;

void main() {
  vec3 acc = vec3(0.0);
  const vec2 offs[5] = vec2[5](
    vec2(0.0, 0.0), vec2(-1.5, -1.5), vec2(1.5, -1.5), vec2(-1.5, 1.5), vec2(1.5, 1.5)
  );
  for (int i = 0; i < 5; i++) {
    vec3 c = texture(uHdrTex, vUv + offs[i] * uTexel).rgb;
    float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
    float w = smoothstep(0.92, 2.10, lum);
    acc += c * w;
  }
  fragColor = vec4(acc * 0.2, 1.0);
}`;

const FS_POST = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uHdrTex;
uniform sampler2D uBloomTex;
uniform vec2 uBloomTexel;
out vec4 fragColor;

vec3 acesFilm(vec3 x) {
  float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}

void main() {
  vec3 hdr = texture(uHdrTex, vUv).rgb;
  // Soft 9-tap tent blur on half-res bloom buffer
  vec3 bl = texture(uBloomTex, vUv).rgb * 0.28;
  bl += texture(uBloomTex, vUv + vec2( 2.0,  0.0) * uBloomTexel).rgb * 0.12;
  bl += texture(uBloomTex, vUv + vec2(-2.0,  0.0) * uBloomTexel).rgb * 0.12;
  bl += texture(uBloomTex, vUv + vec2( 0.0,  2.0) * uBloomTexel).rgb * 0.12;
  bl += texture(uBloomTex, vUv + vec2( 0.0, -2.0) * uBloomTexel).rgb * 0.12;
  bl += texture(uBloomTex, vUv + vec2( 1.5,  1.5) * uBloomTexel).rgb * 0.06;
  bl += texture(uBloomTex, vUv + vec2(-1.5,  1.5) * uBloomTexel).rgb * 0.06;
  bl += texture(uBloomTex, vUv + vec2( 1.5, -1.5) * uBloomTexel).rgb * 0.06;
  bl += texture(uBloomTex, vUv + vec2(-1.5, -1.5) * uBloomTexel).rgb * 0.06;

  vec3 col = (hdr + bl * 0.24) * 1.04;
  // Subtle cinematic edge vignette
  vec2 d = vUv - 0.5;
  col *= 1.0 - 0.22 * dot(d, d);
  vec3 mapped = acesFilm(col);
  fragColor = vec4(pow(mapped, vec3(1.0 / 2.2)), 1.0);
}`;

const progSky    = linkProgram(VS_QUAD, FS_SKY);
const progShadow = linkProgram(VS_SHADOW, FS_SHADOW);
const progMain   = linkProgram(VS_MAIN, FS_MAIN);
const progGrass  = linkProgram(VS_GRASS, FS_GRASS);
const progBloom  = linkProgram(VS_QUAD, FS_BLOOM);
const progPost   = linkProgram(VS_QUAD, FS_POST);
const vaoEmpty   = gl.createVertexArray();

const uSky = {
  camFwd: gl.getUniformLocation(progSky, 'uCamFwd'),
  camRight: gl.getUniformLocation(progSky, 'uCamRight'),
  camUp: gl.getUniformLocation(progSky, 'uCamUp'),
  tanHalfFov: gl.getUniformLocation(progSky, 'uTanHalfFov'),
  aspect: gl.getUniformLocation(progSky, 'uAspect'),
  sunDir: gl.getUniformLocation(progSky, 'uSunDir'),

};
const uShadow = {

};
const uMain = {

  sunDir: gl.getUniformLocation(progMain, 'uSunDir'),
  camPos: gl.getUniformLocation(progMain, 'uCamPos'),
  refCenter: gl.getUniformLocation(progMain, 'uRefCenter'),
  subsurface: gl.getUniformLocation(progMain, 'uSubsurface'),
  hairSpec: gl.getUniformLocation(progMain, 'uHairSpec'),
  dappleAmt: gl.getUniformLocation(progMain, 'uDappleAmt'),

const uGrass = {

  centerX: gl.getUniformLocation(progGrass, 'uCenterX'),
  period: gl.getUniformLocation(progGrass, 'uPeriod'),
  time: gl.getUniformLocation(progGrass, 'uTime'),

  bloomTexel: gl.getUniformLocation(progPost, 'uBloomTexel'),
