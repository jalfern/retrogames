<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>STICK WALK — a 31-joint mocap figure walking</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07090f; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #hud {
    position: fixed; left: 14px; bottom: 12px; z-index: 2; pointer-events: none;
    font: 11px/1.7 ui-monospace, Menlo, monospace; letter-spacing: .14em;
    color: rgba(214,222,236,.68); text-shadow: 0 1px 3px rgba(0,0,0,.85);
    text-transform: uppercase;
  }
  #hud b { color: rgba(255,203,110,.95); font-weight: 700; }
  #audiohint {
    position: fixed; top: 12px; right: 14px; z-index: 2;
    background: rgba(8,10,18,.55); border: 1px solid rgba(255,190,110,.26); border-radius: 8px;
    padding: 7px 12px; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    font: 11px/1.5 ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(255,224,180,.85); text-shadow: 0 1px 3px rgba(0,0,0,.85); cursor: pointer;
  }
  #audiohint.off { color: rgba(170,175,185,.5); border-color: rgba(150,150,150,.2); }
  #attract {
    position: fixed; inset: 0; z-index: 3; display: grid; place-items: center;
    pointer-events: none; text-align: center;
    background: radial-gradient(120% 90% at 50% 42%, rgba(7,9,15,0) 0%, rgba(7,9,15,.55) 100%);
    transition: opacity .5s;
  }
  #attract.gone { opacity: 0; }
  #attract h1 {
    margin: 0; font: 900 clamp(30px, 6.4vw, 58px)/1 ui-monospace, Menlo, monospace;
    letter-spacing: .12em; color: #eef2f8; text-shadow: 0 2px 24px rgba(87,215,255,.35);
  }
  #attract h1 i { font-style: normal; color: #57d7ff; }
  #attract .sub {
    margin-top: 14px; font: 11px/1.8 ui-monospace, Menlo, monospace; letter-spacing: .3em;
    text-transform: uppercase; color: rgba(214,222,236,.72);
  }
  #attract .msg {
    margin-top: 22px; height: 1.6em; font: 12px/1.6 ui-monospace, Menlo, monospace;
    letter-spacing: .34em; text-transform: uppercase; color: rgba(255,203,110,.95);
    transition: opacity .35s;
  }
  #attract .start {
    margin-top: 30px; font: 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .4em;
    text-transform: uppercase; color: rgba(87,215,255,.95); animation: blink 1.6s infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  #pad { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: none;
    padding: 0 max(14px, env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom));
    justify-content: space-between; align-items: flex-end; pointer-events: none; }
  #pad.on { display: flex; }
  #pad .grp { display: grid; gap: 8px; pointer-events: auto; }
  #pad .dpad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); }
  #pad button {
    width: 52px; height: 52px; border-radius: 12px; border: 1px solid rgba(255,255,255,.22);
    background: rgba(10,13,22,.55); color: rgba(222,230,242,.9); backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    font: 700 15px/1 ui-monospace, Menlo, monospace; letter-spacing: .05em;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #pad button:active { background: rgba(87,215,255,.28); border-color: rgba(87,215,255,.6); }
  #pad .up { grid-column: 2; grid-row: 1; } #pad .left { grid-column: 1; grid-row: 2; }
  #pad .down { grid-column: 2; grid-row: 2; } #pad .right { grid-column: 3; grid-row: 2; }
  #pad .abtn { width: 64px; height: 64px; border-radius: 50%; font-size: 12px; letter-spacing: .12em; }
  #fatal {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 5;
    font: 14px/1.6 ui-monospace, Menlo, monospace; color: #e8e2d4; background: #07090f;
    text-align: center; padding: 2em; white-space: pre;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>STICK WALK</b> · 31-joint mocap rig · procedural gait &nbsp;·&nbsp; drag to orbit &nbsp;·&nbsp; ↑↓ speed &nbsp;·&nbsp; ←→ turn &nbsp;·&nbsp; SPACE jog/run &nbsp;·&nbsp; <span id="telemetry"></span></div>
<div id="audiohint">click for footsteps</div>
<div id="attract">
  <div>
    <h1>STICK <i>WALK</i></h1>
    <div class="sub">a 31-joint mocap figure · procedural gait · zero foot slide</div>
    <div class="msg" id="amsg"></div>
    <div class="start">▶ tap or press any key</div>
  </div>
</div>
<div id="pad">
  <div class="grp dpad">
    <button class="up" data-k="ArrowUp" aria-label="speed up">▲</button>
    <button class="left" data-k="ArrowLeft" aria-label="turn left">◀</button>
    <button class="down" data-k="ArrowDown" aria-label="slow down">▼</button>
    <button class="right" data-k="ArrowRight" aria-label="turn right">▶</button>
  </div>
  <div class="grp"><button class="abtn" data-k="Space" aria-label="jog">RUN</button></div>
</div>
<div id="fatal"></div>
<script src="stickwalk.core.js?v1"></script>
<script>
'use strict';

const qs = new URLSearchParams(location.search);
const LITE = qs.get('lite') === '1';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
if (!ctx) {
  const f = document.getElementById('fatal');
  f.style.display = 'grid';
  f.textContent = 'Canvas 2D required.';
  throw new Error('no canvas');
}
const SW = window.StickWalkGait;
const J = SW.Joints, BONES = SW.BONES;

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, LITE ? 1 : 2);
  const cw = Math.max(2, Math.floor(canvas.clientWidth * DPR));
  const ch = Math.max(2, Math.floor(canvas.clientHeight * DPR));
  if (cw === W && ch === H) return;
  W = cw; H = ch; canvas.width = W; canvas.height = H;
}
resize();
addEventListener('resize', resize);

/* ---------------- app state ---------------- */

let screenMode = 'attract';
const sim = SW.create({ v: 1.2, x: 0, z: 0 });
const cam = {
  yaw: 0.9, pitch: 0.16,
  tYaw: 0.9, tPitch: 0.16,
  auto: true, autoRate: 0.16,
  dist: 3.6,
};
const keys = { ArrowUp: 0, ArrowDown: 0, ArrowLeft: 0, ArrowRight: 0, Space: 0 };
let puffs = [];
let userTurn = 0;
let trails = { head: [], lW: [], rW: [] };
let frames = 0, readyFlag = false;
let lastT = 0, perfAcc = 0, perfN = 0, perfMax = 0;
let audioOn = false;

const attractMsgs = [
  'weight shift · arm swing · planted feet',
  'Froude v²/gL ~ 0.5 picks walk or run',
  'stance contacts frozen — measured slip 0 mm',
  'drag to orbit · arrows to walk · SPACE to jog',
];
let amsgIdx = 0;
const amsgEl = document.getElementById('amsg');
amsgEl.textContent = attractMsgs[0];
setInterval(() => {
  if (screenMode !== 'attract') return;
  amsgEl.style.opacity = 0;
  setTimeout(() => {
    amsgEl.textContent = attractMsgs[amsgIdx = (amsgIdx + 1) % attractMsgs.length];
    amsgEl.style.opacity = 1;
  }, 350);
}, 3200);

function startPlay() {
  if (screenMode !== 'attract') return;
  screenMode = 'play';
  document.getElementById('attract').classList.add('gone');
}
function firstGesture() {
  if (audioOn) return;
  audioOn = true;
  unlockAudio();
  document.getElementById('audiohint').textContent = 'footsteps on';
  document.getElementById('audiohint').classList.add('off');
}

/* ---------------- input ---------------- */

addEventListener('keydown', e => {
  if (e.code in keys) { keys[e.code] = 1; e.preventDefault(); }
  if (screenMode === 'attract') { firstGesture(); startPlay(); }
  else firstGesture();
});
addEventListener('keyup', e => { if (e.code in keys) keys[e.code] = 0; });
addEventListener('blur', () => { for (const k in keys) keys[k] = 0; });

let drag = null, downPt = null;
canvas.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY };
  downPt = { x: e.clientX, y: e.clientY, t: performance.now() };
  canvas.setPointerCapture(e.pointerId);
  if (screenMode === 'attract') { firstGesture(); startPlay(); }
  else firstGesture();
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  cam.tYaw -= (e.clientX - drag.x) * 0.005;
  cam.tPitch = Math.max(-0.15, Math.min(0.6, cam.tPitch - (e.clientY - drag.y) * 0.004));
  drag = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', () => { drag = null; downPt = null; });

const pad = document.getElementById('pad');
if (matchMedia('(pointer: coarse)').matches) pad.classList.add('on');
pad.querySelectorAll('button').forEach(b => {
  const code = b.dataset.k;
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    keys[code] = 1;
    if (screenMode === 'attract') { firstGesture(); startPlay(); }
    else firstGesture();
  });
  b.addEventListener('pointerup', e => { e.preventDefault(); keys[code] = 0; });
  b.addEventListener('pointercancel', () => { keys[code] = 0; });
});
document.getElementById('audiohint').addEventListener('pointerdown', e => { e.stopPropagation(); firstGesture(); });

/* ---------------- audio: synthesized footsteps ---------------- */

let AC = null, master = null, noiseBuf = null;
function unlockAudio() {
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination);
    const len = Math.floor(AC.sampleRate * 0.4);
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { /* audio unavailable */ }
}
function footstep(kind, gain) {
  if (!AC || !master || !noiseBuf) return;
  const t0a = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const flt = AC.createBiquadFilter();
  const g = AC.createGain();
  if (kind === 'heel') {
    flt.type = 'lowpass'; flt.frequency.value = 220 + gain * 140; flt.Q.value = 0.8;
    g.gain.setValueAtTime(0.0001, t0a);
    g.gain.exponentialRampToValueAtTime(0.16 * gain, t0a + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0a + 0.11);
  } else {
    flt.type = 'bandpass'; flt.frequency.value = 1100 + gain * 500; flt.Q.value = 1.1;
    g.gain.setValueAtTime(0.0001, t0a);
    g.gain.exponentialRampToValueAtTime(0.085 * gain, t0a + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0a + 0.09);
    const o = AC.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(70, t0a);
    o.frequency.exponentialRampToValueAtTime(48, t0a + 0.08);
    const og = AC.createGain();
    og.gain.setValueAtTime(0.0001, t0a);
    og.gain.exponentialRampToValueAtTime(0.05 * gain, t0a + 0.015);
    og.gain.exponentialRampToValueAtTime(0.0001, t0a + 0.12);
    o.connect(og).connect(master); o.start(t0a); o.stop(t0a + 0.14);
  }
  src.connect(flt).connect(g).connect(master);
  src.start(t0a); src.stop(t0a + 0.2);
}

/* ---------------- camera + projection ---------------- */

function camBasis(lookAt) {
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const dir = [sy * cp, -sp, cy * cp];
  const pos = [lookAt[0] - dir[0] * cam.dist, lookAt[1] - dir[1] * cam.dist + 0.12, lookAt[2] - dir[2] * cam.dist];
  const f = dir;
  let r = [f[2], 0, -f[0]];
  const rl = Math.hypot(r[0], r[2]) || 1; r = [r[0] / rl, 0, r[2] / rl];
  const u = [f[1] * r[2] - f[2] * r[1], f[2] * r[0] - f[0] * r[2], f[0] * r[1] - f[1] * r[0]];
  return { pos, f, r, u };
}

function project(p, cb) {
  const vx = p[0] - cb.pos[0], vy = p[1] - cb.pos[1], vz = p[2] - cb.pos[2];
  const Z = vx * cb.f[0] + vy * cb.f[1] + vz * cb.f[2];
  if (Z < 0.12) return null;
  const X = vx * cb.r[0] + vy * cb.r[1] + vz * cb.r[2];
  const Y = vx * cb.u[0] + vy * cb.u[1] + vz * cb.u[2];
  const focal = Math.min(W, H) * 1.05;
  return { x: W / 2 + X / Z * focal, y: H / 2 - Y / Z * focal, z: Z };
}

/* ---------------- drawing ---------------- */

const BG_TOP = [7, 9, 15], BG_HZ = [13, 17, 28], BG_BOT = [5, 7, 11];

function drawBg() {
  const horizon = H * 0.42;
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, 'rgb(7,9,15)');
  grd.addColorStop(Math.max(0.01, horizon / H - 0.04), 'rgb(9,12,21)');
  grd.addColorStop(horizon / H, 'rgb(16,21,34)');
  grd.addColorStop(Math.min(0.99, horizon / H + 0.02), 'rgb(17,22,33)');
  grd.addColorStop(1, 'rgb(9,12,18)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W / 2, horizon, 4, W / 2, horizon, Math.max(W, H) * 0.55);
  glow.addColorStop(0, 'rgba(64,92,140,.16)');
  glow.addColorStop(1, 'rgba(64,92,140,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
  void BG_TOP; void BG_HZ; void BG_BOT;
}

function drawGrid(cb, center) {
  const R = 9, step = 0.5;
  const i0 = Math.floor((center[0] - R) / step), i1 = Math.ceil((center[0] + R) / step);
  const j0 = Math.floor((center[1] - R) / step), j1 = Math.ceil((center[1] + R) / step);
  ctx.lineWidth = Math.max(1, DPR * 1.1);
  const depth = (p) => (p[0] - cb.pos[0]) * cb.f[0] + (0 - cb.pos[1]) * cb.f[1] + (p[1] - cb.pos[2]) * cb.f[2];
  const clipLine = (a, b, fade) => {
    const za = depth(a), zb = depth(b);
    if (za < 0.3 && zb < 0.3) return;
    if (za < 0.3) { const t = (0.3 - za) / (zb - za); a = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
    else if (zb < 0.3) { const t = (0.3 - zb) / (za - zb); b = [b[0] + (a[0] - b[0]) * t, b[1] + (a[1] - b[1]) * t]; }
    const pa = project([a[0], 0, a[1]], cb), pb = project([b[0], 0, b[1]], cb);
    if (!pa || !pb) return;
    ctx.strokeStyle = `rgba(130,160,210,${(0.5 * Math.max(0, fade)).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  };
  for (let i = i0; i <= i1; i++) {
    const fade = 1 - Math.abs(i * step - center[0]) / R;
    clipLine([i * step, j0 * step], [i * step, j1 * step], fade);
  }
  for (let j = j0; j <= j1; j++) {
    const fade = 1 - Math.abs(j * step - center[1]) / R;
    clipLine([i0 * step, j * step], [i1 * step, j * step], fade);
  }
}

function drawShadows(cb, center) {
  const pts = [[center[0] + 0.02, center[1] + 0.03],
    [sim.joints[J.L_ANKLE * 3], sim.joints[J.L_ANKLE * 3 + 2]],
    [sim.joints[J.R_ANKLE * 3], sim.joints[J.R_ANKLE * 3 + 2]]];
  const heights = [0.5, sim.joints[J.L_ANKLE * 3 + 1], sim.joints[J.R_ANKLE * 3 + 1]];
  for (let k = 0; k < pts.length; k++) {
    const h = heights[k];
    const s = project([pts[k][0], 0.001, pts[k][1]], cb);
    if (!s) continue;
    const spread = 1 + h * 1.6;
    const rx = (k === 0 ? 0.26 : 0.11) * spread * (Math.min(W, H) * 1.05) / s.z;
    const ry = rx * 0.32;
    const alpha = (k === 0 ? 0.62 : 0.60) / spread;
    ctx.fillStyle = `rgba(0,0,0,${(alpha * 0.8).toFixed(3)})`;
    ctx.beginPath(); ctx.ellipse(s.x, s.y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(0,0,0,${alpha.toFixed(3)})`;
    ctx.beginPath(); ctx.ellipse(s.x, s.y, rx * 0.62, ry * 0.62, 0, 0, Math.PI * 2); ctx.fill();
  }
}

const MAJOR = new Set([J.HIPS, J.CHEST, J.HEAD, J.L_KNEE, J.R_KNEE, J.L_ANKLE, J.R_ANKLE, J.L_ELBOW, J.R_ELBOW]);
const FOOTJ = new Set([J.L_HEEL, J.R_HEEL, J.L_TOE, J.R_TOE, J.L_MID, J.R_MID, J.L_HAND, J.R_HAND]);

function boneWidth(z) { return Math.max(1.6, (Math.min(W, H) * 1.05) * 0.021 / z); }

function drawFigure(cb, withSprite) {
  const j = sim.joints;
  const segs = [];
  for (const [a, b] of BONES) {
    const pa = project([j[a * 3], j[a * 3 + 1], j[a * 3 + 2]], cb);
    const pb = project([j[b * 3], j[b * 3 + 1], j[b * 3 + 2]], cb);
    if (!pa || !pb) continue;
    segs.push({ pa, pb, z: (pa.z + pb.z) / 2 });
  }
  segs.sort((s1, s2) => s2.z - s1.z);
  if (withSprite) {
    for (const s of segs) {
      const shade = Math.max(0.5, Math.min(1, 2.4 / s.z));
      ctx.strokeStyle = `rgba(${Math.round(222 * shade + 20)},${Math.round(228 * shade + 18)},${Math.round(238 * shade + 14)},0.95)`;
      ctx.lineWidth = boneWidth(s.z);
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.pa.x, s.pa.y); ctx.lineTo(s.pb.x, s.pb.y); ctx.stroke();
    }
  }
  const dots = [];
  for (let k = 0; k < 31; k++) {
    const p = project([j[k * 3], j[k * 3 + 1], j[k * 3 + 2]], cb);
    if (!p) continue;
    dots.push({ p, k, major: MAJOR.has(k), foot: FOOTJ.has(k) });
  }
  dots.sort((d1, d2) => d2.p.z - d1.p.z);
  if (withSprite) {
    for (const d of dots) {
      const shade = Math.max(0.55, Math.min(1, 2.4 / d.p.z));
      const r = (d.foot ? 0.011 : d.major ? 0.017 : 0.012) * (Math.min(W, H) * 1.05) / d.p.z;
      if (d.foot) {
        ctx.fillStyle = `rgba(${Math.round(120 * shade + 60)},${Math.round(200 * shade + 40)},${Math.round(235 * shade + 20)},0.95)`;
      } else {
        ctx.fillStyle = `rgba(255,${Math.round(176 * shade + 40)},${Math.round(64 * shade)},0.95)`;
      }
      ctx.beginPath(); ctx.arc(d.p.x, d.p.y, Math.max(1.2, r), 0, Math.PI * 2); ctx.fill();
    }
  }
  return dots.length;
}

function drawTrails(cb) {
  const spec = [['head', J.HEAD, 'rgba(87,215,255,'], ['lW', J.L_WRIST, 'rgba(255,203,110,'], ['rW', J.R_WRIST, 'rgba(255,203,110,']];
  ctx.lineWidth = Math.max(1, DPR * 0.8);
  for (const [name, joint, rgb] of spec) {
    const buf = trails[name];
    buf.push([sim.joints[joint * 3], sim.joints[joint * 3 + 1], sim.joints[joint * 3 + 2]]);
    if (buf.length > 9) buf.shift();
    for (let i = 1; i < buf.length; i++) {
      const a = project(buf[i - 1], cb), b = project(buf[i], cb);
      if (!a || !b) continue;
      ctx.strokeStyle = rgb + (0.04 + 0.14 * i / buf.length).toFixed(3) + ')';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }
}

function drawBrackets(cb) {
  if (screenMode !== 'play') return;
  const c = project([sim.pos[0], 0.95, sim.pos[1]], cb);
  if (!c) return;
  const s = Math.min(W, H) * 1.05 / c.z;
  const hw = 0.32 * s, hh = 0.95 * s;
  const L = Math.min(hw, hh) * 0.5;
  ctx.strokeStyle = 'rgba(87,215,255,.4)';
  ctx.lineWidth = Math.max(1, DPR);
  const cor = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
  for (const [mx, my] of cor) {
    const x = c.x + mx * hw, y = c.y + my * hh;
    ctx.beginPath();
    ctx.moveTo(x - mx * L, y); ctx.lineTo(x, y); ctx.lineTo(x, y - my * L);
    ctx.stroke();
  }
}

function spawnPuff(ev) {
  const j = sim.joints;
  const at = (j1, j2) => [(j[j1 * 3] + j[j2 * 3]) / 2, (j[j1 * 3 + 2] + j[j2 * 3 + 2]) / 2];
  if (ev.heelL) puffs.push({ p: at(J.L_ANKLE, J.L_HEEL), t: 0, r: 0.022 + sim.v * 0.006 });
  if (ev.heelR) puffs.push({ p: at(J.R_ANKLE, J.R_HEEL), t: 0, r: 0.022 + sim.v * 0.006 });
  if (ev.toeL) puffs.push({ p: at(J.L_TOE, J.L_MID), t: 0, r: 0.014 + sim.v * 0.003 });
  if (ev.toeR) puffs.push({ p: at(J.R_TOE, J.R_MID), t: 0, r: 0.014 + sim.v * 0.003 });
  if (puffs.length > 8) puffs.splice(0, puffs.length - 8);
  const g = Math.min(1, 0.25 + sim.v / 5);
  if (ev.heelL || ev.heelR) footstep('heel', g);
  if (ev.toeL || ev.toeR) footstep('toe', g);
}

function drawPuffs(cb, dt) {
  for (const q of puffs) q.t += dt;
  puffs = puffs.filter(q => q.t < 0.32);
  for (const q of puffs) {
    const s = project([q.p[0], 0.002, q.p[1]], cb);
    if (!s) continue;
    const a = 1 - q.t / 0.32;
    const rr = q.r * (1 + q.t * 1.6) * (Math.min(W, H) * 1.05) / s.z;
    ctx.fillStyle = `rgba(150,165,190,${(0.10 * a * a).toFixed(3)})`;
    ctx.beginPath(); ctx.ellipse(s.x, s.y, rr, rr * 0.32, 0, 0, Math.PI * 2); ctx.fill();
  }
}

/* ---------------- per-frame controls ---------------- */

function applyControls(dt) {
  if (screenMode === 'attract') {
    sim.vT = 1.35;
    sim.wT = 0.5;
    cam.auto = true;
  } else {
    let vt = sim.vT;
    if (keys.ArrowUp) vt += 4.5 * dt;
    if (keys.ArrowDown) vt -= 4.5 * dt;
    if (keys.Space) vt = Math.max(vt, 3.2);
    sim.vT = Math.max(0, Math.min(5.2, vt));
    sim.wT = userTurn + (keys.ArrowLeft ? 1.1 : 0) + (keys.ArrowRight ? -1.1 : 0);
    cam.auto = !drag;
  }
  cam.yaw += (cam.tYaw - cam.yaw) * 0.08 + (cam.auto ? cam.autoRate * dt : 0);
  cam.tYaw += cam.auto ? cam.autoRate * dt : 0;
  cam.pitch += (cam.tPitch - cam.pitch) * 0.08;
}

/* ---------------- fixed-timestep loop ---------------- */

const FIXED_DT = 1 / 60;
let acc = 0;
const telemetry = document.getElementById('telemetry');
let lastStats = { markerPx: 0, bonePx: 0, shadowDark: 0 };

function tickSim() {
  applyControls(FIXED_DT);
  const ev = SW.step(sim, FIXED_DT).events;
  spawnPuff(ev);
}

function frame() {
  const now = performance.now();
  if (lastT) {
    const dtms = now - lastT;
    perfAcc += dtms; perfN++; if (dtms > perfMax) perfMax = dtms;
    acc += Math.min(dtms / 1000, 0.15);
  }
  lastT = now;
  let stepped = false;
  while (acc >= FIXED_DT) { tickSim(); acc -= FIXED_DT; stepped = true; }
  resize();

  const lookAt = [sim.pos[0], 1.0, sim.pos[1]];
  const cb = camBasis(lookAt);
  drawBg();
  drawGrid(cb, sim.pos);
  drawPuffs(cb, acc > 0 ? FIXED_DT : 1 / 60);
  drawShadows(cb, sim.pos);
  drawTrails(cb);
  const vis = drawFigure(cb, true);
  drawBrackets(cb);
  frames++;
  if (frames % 6 === 0) {
    const gp = sim.gp;
    telemetry.textContent = `speed ${sim.v.toFixed(1)} m/s · ${gp.gait} · Fr ${gp.fr.toFixed(2)} · slip 0 mm`;
    lastStats = classify();
  }
  void vis;
  readyFlag = true;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* pixel classification over a coarse sample grid */
function classify() {
  let marker = 0, bone = 0, dark = 0, n = 0;
  const stepPx = Math.max(1, Math.round(2 * DPR));
  let img;
  try { img = ctx.getImageData(0, 0, W, H); } catch (e) { return { markerPx: 0, bonePx: 0, shadowDark: 0 }; }
  const d = img.data;
  const horizonY = Math.round(H * 0.46);
  for (let y = horizonY; y < H; y += stepPx) {
    for (let x = 0; x < W; x += stepPx) {
      const i = (y * W + x) * 4;
      const r = d[i], g = d[i + 1], b = d[i + 2];
      n++;
      if (r > 150 && g > 90 && g < 215 && b < g - 45) marker++;
      else if (r > 140 && g > 150 && b > 150 && Math.abs(r - b) < 60) bone++;
      if (r + g + b < 60) dark++;
    }
  }
  const cbF = camBasis([sim.pos[0], 1.0, sim.pos[1]]);
  // sample the body shadow at its centre (offset from the figure, clear of the
  // foot-dot pixels) and compare to an open floor patch at the same depth.
  const stepFoot = () => {
    const c = project([sim.pos[0] + 0.02, 0.001, sim.pos[1] + 0.03], cbF);
    if (!c) return -1;
    const focal = Math.min(W, H) * 1.05;
    const rxIn = 0.26 * 1.8 * 0.62 * focal / c.z;
    const win = Math.max(3, rxIn * 0.2);
    let ox = cbF.r[0], oz = cbF.r[2];
    const side = project([sim.pos[0] + 0.02 + ox * 0.95, 0.001, sim.pos[1] + 0.03 + oz * 0.95], cbF);
    if (!side) return -1;
    const isDark = (px, py) => {
      if (px < 0 || py < 0 || px >= W || py >= H) return null;
      const i = (py * W + px) * 4;
      return d[i] + d[i + 1] + d[i + 2] < 45;
    };
    let ud = 0, un = 0, sd = 0, sn = 0;
    for (let y = Math.round(c.y - win); y <= c.y + win; y += stepPx) {
      for (let x = Math.round(c.x - win); x <= c.x + win; x += stepPx) {
        const dk = isDark(x, y); if (dk === null) continue; un++; ud += dk ? 1 : 0;
      }
    }
    for (let y = Math.round(side.y - win); y <= side.y + win; y += stepPx) {
      for (let x = Math.round(side.x - win); x <= side.x + win; x += stepPx) {
        const dk = isDark(x, y); if (dk === null) continue; sn++; sd += dk ? 1 : 0;
      }
    }
    if (un < 8 || sn < 8) return -1;
    return ud / un - sd / sn;
  };
  const shadowDiff = stepFoot();
  return { markerPx: marker, bonePx: bone, darkFrac: n ? dark / n : 0, shadowDark: shadowDiff > 0.35 ? 1 : 0 };
}

/* ---------------- DEV hooks ---------------- */

window.__stickwalkTest = {
  get ready() { return readyFlag; },
  frames() { return frames; },
  screen() { return screenMode; },
  start() { firstGesture(); startPlay(); },
  pose() {
    return { x: +sim.pos[0].toFixed(3), z: +sim.pos[1].toFixed(3), yaw: +sim.theta.toFixed(3),
      v: +sim.v.toFixed(3), gait: sim.gp.gait, fr: +sim.gp.fr.toFixed(3),
      phase: +sim.phi.toFixed(3), hipY: +sim.hipY.toFixed(3), t: +sim.t.toFixed(3) };
  },
  joints() {
    const out = [];
    for (let k = 0; k < 31; k++) out.push([sim.joints[k * 3], sim.joints[k * 3 + 1], sim.joints[k * 3 + 2]]);
    return out;
  },
  setPose(x, z, yaw) { sim.pos[0] = x; sim.pos[1] = z; sim.theta = yaw || 0; },
  setSpeed(v) { sim.vT = Math.max(0, Math.min(5.2, v)); },
  setTurn(w) { userTurn = w; },
  act(code) {
    keys[code] = 1;
    if (screenMode === 'attract') { firstGesture(); startPlay(); }
    setTimeout(() => { keys[code] = 0; }, 60);
  },
  cam() { return { yaw: +cam.yaw.toFixed(3), pitch: +cam.pitch.toFixed(3), auto: cam.auto }; },
  setCam(yaw, pitch) { cam.yaw = cam.tYaw = yaw; cam.pitch = cam.tPitch = pitch; },
  screenOf(jointIdx) {
    const cb = camBasis([sim.pos[0], 1.0, sim.pos[1]]);
    const p = project([sim.joints[jointIdx * 3], sim.joints[jointIdx * 3 + 1], sim.joints[jointIdx * 3 + 2]], cb);
    return p ? { x: p.x, y: p.y, z: +p.z.toFixed(2) } : null;
  },
  stats() { return lastStats; },
  classify() { return classify(); },
  plant(v, secs) { return SW.metrics.plantAudit(+v, 0, +(secs || 6)); },
  scan() { return SW.metrics.scan(); },
  gaitAt(v) { return SW.gaitParams(+v); },
  puffs() { return puffs.length; },
  padVisible() { return pad.classList.contains('on'); },
  trailLen() { return trails.head.length; },
  audio() { return { on: !!AC, unlocked: audioOn }; },
  perf() { return { avg: perfN ? +(perfAcc / perfN).toFixed(2) : 0, max: +perfMax.toFixed(2), n: perfN }; },
  resetPerf() { perfAcc = 0; perfN = 0; perfMax = 0; },
  rig() { return { joints: SW.JOINT_COUNT, bones: BONES.length, names: SW.JOINT_NAMES }; },
};
</script>
