<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VOLCANO — erupting at night, live in WebGL2</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060a; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #hud {
    position: fixed; left: 14px; bottom: 12px; z-index: 2; pointer-events: none;
    font: 11px/1.7 ui-monospace, Menlo, monospace; letter-spacing: .14em;
    color: rgba(232,210,196,.62); text-shadow: 0 1px 3px rgba(0,0,0,.8);
    text-transform: uppercase;
  }
  #hud b { color: rgba(255,228,208,.92); font-weight: 700; }
  #audiohint {
    position: fixed; top: 12px; right: 14px; z-index: 2;
    background: rgba(14,8,6,.55); border: 1px solid rgba(255,150,80,.28); border-radius: 8px;
    padding: 7px 12px; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    font: 11px/1.5 ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(240,214,196,.85); text-shadow: 0 1px 3px rgba(0,0,0,.8); cursor: pointer;
  }
  #audiohint.off { color: rgba(198,176,160,.5); border-color: rgba(160,140,125,.2); }
  #fatal {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 3;
    font: 14px/1.6 ui-monospace, Menlo, monospace; color: #f4ece6; background: #0a0806;
    text-align: center; padding: 2em; white-space: pre;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>VOLCANO</b> · an eruption at night &nbsp;·&nbsp; drag to look &nbsp;·&nbsp; click for rumble + blasts</div>
<div id="audiohint">click for volcano sound</div>
<div id="fatal"></div>
<script>
'use strict';

/* VOLCANO (#1043) — a demoscene night eruption, one-file WebGL2.
   Engine notes:
   · one fullscreen raymarch pass: a strato-cone heightfield (pow profile + gully
     fBm, crater bowl with a raised rim) ringed by dark plains and a far ridge;
   · lava: an animated channel mask on the cone (flow drifts downslope toward the
     crater pool); blackbody emission white-hot at the vent, cooling red at the
     toes; crust flicker; an 8-sample LOS walk toward the vent paints warm pools
     of light onto the slopes with terrain occlusion;
   · plume: a raymarched volumetric column above the crater — rising, wind-sheared
     domain-warped fBm, 3-step below-lighting from the vent + hot-base incandescence
     + occasional internal flash pulses;
   · embers: deterministic JS particle fountain fired from the vent — closed-form
     ballistic arcs with wind, flickering additive sprites dying orange to dark red;
   · sky: hash-star field with twinkle + a faint galactic band, warm ember glow
     toward the volcano on the horizon;
   · post: HDR float target, screen-space heat shimmer around the projected vent
     (rising warped-noise refraction), quarter-res bloom, ACES, vignette, grain.
      Audio: deep rumble + low growl tracking the pulse + eruption roar + faint
      crackle + periodic blasts + delayed distant thunder after flashes
      (unlocks on first click). */

const qs = new URLSearchParams(location.search);
const LITE = qs.get('lite') === '1';
let hazeOn = qs.get('nohaze') !== '1';
const SEED = (qs.get('seed') | 0) || 7;
const RENDER_SCALE = LITE ? 0.5 : 0.72;

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) {
  const f = document.getElementById('fatal');
  f.style.display = 'grid';
  f.textContent = 'WebGL2 required.\nThis demo needs a WebGL2-capable browser.';
  throw new Error('no webgl2');
}
const HDR_OK = !!gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');

/* ---------------- shaders ---------------- */

const VS_QUAD = `#version 300 es
precision highp float;
out vec2 vUv;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FS_SCENE = `#version 300 es
precision highp float;
in vec2 vUv;
uniform vec2 uRes;
uniform float uTime;
uniform float uSeed;
uniform vec3 uCamPos;
uniform mat4 uCamInvRot;
uniform float uPulse;      // eruption intensity (JS surges)
uniform float uFlash;      // plume lightning flash envelope
uniform float uDbg;        // 1 = lava mask, 2 = plume density
out vec4 fragColor;

#define PI 3.14159265
#define HC 196.0
#define RB 380.0
#define RC 58.0
#define RP 30.0
#define VENT_Y 165.0
#define PLUME_TOP 683.0

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash12(i);
  float b = hash12(i + vec2(1,0));
  float c = hash12(i + vec2(0,1));
  float d = hash12(i + vec2(1,1));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm2(vec2 p){
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 3; i++){ s += a * vnoise(p); p = p * 2.03 + vec2(1.7, 3.1); a *= 0.5; }
  return s;
}

/* dark foreground boulders on the near plain (anchor the scale, break the flat horizon) */
float rocks(vec2 xz){
  float s = 0.0;
  for (int i = 0; i < 7; i++){
    float fi = float(i);
    float ra = hash12(vec2(fi * 1.7, uSeed + 2.0)) * 6.2831853;
    float rr2 = 400.0 + hash12(vec2(fi * 3.1, uSeed + 5.0)) * 360.0;
    vec2 c = vec2(cos(ra), sin(ra)) * rr2;
    float wid = 26.0 + hash12(vec2(fi * 1.3, uSeed + 9.0)) * 34.0;
    float hgt = (26.0 + hash12(vec2(fi + 5.0, uSeed + 13.0)) * 44.0)
              * (0.72 + 0.28 * vnoise((xz - c) * 0.06 + fi));
    float d = length(xz - c);
    s = max(s, hgt * exp(-pow(d / wid, 4.0)));
  }
  return s;
}

/* volcano + surrounding land height */
float terrainH(vec2 xz){
  float r = length(xz);
  float ang = atan(xz.y, xz.x);
  float k = clamp(1.0 - r / RB, 0.0, 1.0);
  float cone = HC * pow(k, 1.15);
  cone += (fbm2(vec2(ang * 4.0, r * 0.014)) - 0.5) * 16.0 * k * k;
  cone += exp(-pow((r - RC) / 14.0, 2.0)) * 7.0;
  cone -= smoothstep(RC, RC * 0.35, r) * 24.0;
  float plain = (fbm2(xz * 0.004 + 13.0) - 0.5) * 14.0 + 2.0;
  plain *= smoothstep(RB * 0.8, RB * 1.4, r);
  float ridge = exp(-pow((r - 1250.0) / 300.0, 2.0)) * (140.0 * fbm2(vec2(ang * 2.0, 3.7)) + 60.0);
  ridge *= smoothstep(900.0, 1150.0, r);
  return cone + plain + ridge + rocks(xz);
}

/* lava channel mask on the cone + crater pool, 0..1 */
float lavaMask(vec2 xz, float r, float t){
  if (r > RB * 0.96) return 0.0;
  float ang = atan(xz.y, xz.x);
  float warp = fbm2(vec2(r * 0.02, ang * 1.3));
  float ch = fbm2(vec2(ang * 3.4 + warp * 0.9, r * 0.016 - t * 0.10));
  float aa = fwidth(ch) * 1.5 + 0.012;
  float wid = 0.13 * (1.0 - smoothstep(RC * 1.1, RB * 0.95, r));
  float m = smoothstep(0.60 - wid - aa, 0.60 + aa, ch);
  m *= smoothstep(RB, RB * 0.70, r) * smoothstep(RC * 0.9, RC * 1.7, r);
  float rim = 2.5 * uPulse * (0.5 + 0.5 * sin(ang * 3.0 - t * 0.9));
  float pool = 1.0 - smoothstep(RP - 6.0, RP + 6.0 + rim, r);
  return clamp(max(m, pool), 0.0, 1.0);
}

/* lava emission at surface point; heat out = 0..1 brightness gate */
vec3 lavaColor(vec2 xz, float r, float t, out float heat){
  float m = lavaMask(xz, r, t);
  float ang = atan(xz.y, xz.x);
      float flick = 0.72 + 0.28 * vnoise(vec2(r * 0.08 - t * 0.55, ang * 3.0 + t * 0.3));
  heat = m * flick;
  float temp = smoothstep(RB * 0.85, RC, r);
  float crust = 0.55 + 0.45 * smoothstep(0.35, 0.65, vnoise(xz * 0.05 + vec2(0.0, t * 0.4)));
  vec3 c = mix(vec3(0.55, 0.06, 0.01), vec3(1.0, 0.30, 0.05), temp);
  c = mix(c, vec3(1.0, 0.78, 0.40), pow(temp, 2.0) * flick);
  return c * heat * crust * (1.3 + 2.3 * pow(temp, 2.0)) * (0.55 + 0.45 * uPulse);
}

/* plume density at p, 0..1 */
float plumeDensity(vec3 p, float t){
  float dy = p.y - VENT_Y;
  if (dy < -6.0 || dy > 520.0) return 0.0;
  float cx = pow(max(dy, 0.0), 1.3) * 0.06;
  float rad = length(p.xz - vec2(cx, 0.0));
  float PRy = 34.0 + dy * 0.52;
  PRy *= 1.0 + 0.45 * smoothstep(240.0, 430.0, dy);   // mushroom umbrella in the top third
  float radial = 1.0 - smoothstep(PRy * 0.30, PRy, rad);
  float hfade = smoothstep(-4.0, 40.0, dy) * (1.0 - smoothstep(170.0, 470.0, dy));
  if (radial * hfade < 0.02) return 0.0;
  vec3 q = p - vec3(cx * 0.4, -t * 26.0, 0.0);
  float tb = fbm2(vec2(q.x, q.z) * 0.007 + vec2(q.y * 0.005 + t * 0.03, t * 0.02));
  if (dy > 140.0){
    vec3 q2 = p - vec3(cx * 0.75 + dy * 0.35, -t * 15.0, 0.0);
    float tb2 = fbm2(vec2(q2.x, q2.z) * 0.0045 + vec2(q2.y * 0.004 + t * 0.02, t * 0.015));
    tb = mix(tb, tb2, smoothstep(140.0, 320.0, dy));
  }
  float d = radial * hfade * smoothstep(0.40, 0.76, tb) - 0.05;
  d *= 1.0 - 0.60 * smoothstep(240.0, 400.0, dy);    // umbrella thins as it entrains air
  return clamp(d * (0.62 + 0.75 * uPulse), 0.0, 1.0);
}

vec3 plumeLight(vec3 p, float t, float dens){
  vec3 vp = vec3(0.0, VENT_Y + 4.0, 0.0);
  vec3 L = vp - p;
  float dL = max(length(L), 1.0);
  vec3 vdir = L / dL;
  float sh = 0.0;
  for (int j = 1; j <= 2; j++) sh += plumeDensity(p + vdir * float(j) * 34.0, t);
  float occ = exp(-sh * 0.55);
  float att = 1.0 / (1.0 + dL * dL * 0.000055);
  vec3 hot = mix(vec3(0.80, 0.20, 0.04), vec3(1.0, 0.50, 0.14), clamp(dens + 0.2, 0.0, 1.0));
  vec3 sc = hot * occ * att * dens * 3.2 * exp(-max(0.0, p.y - VENT_Y) / 110.0);
  sc *= exp(-max(0.0, p.y - VENT_Y - 170.0) / 50.0);   // vent glow can't reach the canopy: silhouette up top
  float base = exp(-max(0.0, p.y - VENT_Y) / 60.0) * smoothstep(95.0, 18.0, length(p.xz));
  sc += vec3(1.0, 0.50, 0.15) * base * dens * (0.35 + 0.65 * uPulse);
  float cx = pow(max(p.y - VENT_Y, 0.0), 1.3) * 0.06;
  float fl = uFlash * exp(-pow(length(p.xz - vec2(cx, 0.0)) /(75.0 + 30.0 * uPulse), 2.0))
           * smoothstep(60.0, 170.0, p.y - VENT_Y) * (1.0 - smoothstep(280.0, 430.0, p.y - VENT_Y));
  sc += vec3(0.72, 0.78, 1.0) * fl * (0.35 + 0.65 * dens) * 3.0;
  sc += vec3(0.028, 0.034, 0.058) * dens * 0.14 * (0.3 + 0.7 * exp(-max(0.0, p.y - VENT_Y) / 160.0));
  return sc;
}

void main(){
  vec2 ndc = vUv * 2.0 - 1.0;
  ndc.x *= uRes.x / uRes.y;
  vec3 rd = normalize((uCamInvRot * vec4(ndc, -1.75, 1.0)).xyz);
  vec3 ro = uCamPos;
  float t = uTime;

  /* raymarch the land + cone */
  float jit = hash12(gl_FragCoord.xy + vec2(uSeed, floor(t * 60.0) * 0.17));
  float tt = 1.0 + jit * 6.0;
  float tHit = 1e9;
  float hitY = 0.0;
  for (int i = 0; i < 110; i++){
    if (tt > 2600.0) break;
    vec3 p = ro + rd * tt;
    float h = terrainH(p.xz);
    if (p.y <= h){ tHit = tt; hitY = h; break; }
    tt += clamp(max(2.0, (p.y - h) * 0.55), 2.0, 46.0);
    if (rd.y < 0.0 && p.y < -20.0) break;
  }

  vec3 col;
  if (tHit < 1e8){
    vec3 p = ro + rd * tHit;
    float r = length(p.xz);
    vec2 ex = vec2(2.5, 0.0), ez = vec2(0.0, 2.5);
    vec3 n = normalize(vec3(
      terrainH(p.xz - ex) - terrainH(p.xz + ex),
      5.0,
      terrainH(p.xz - ez) - terrainH(p.xz + ez)));
    /* dark basalt with only the eruption lighting it */
    vec3 albedo = mix(vec3(0.030, 0.028, 0.032), vec3(0.052, 0.046, 0.048), fbm2(p.xz * 0.02));
    vec3 L = vec3(0.0);
    if (r > 4.0){
      vec2 dirv = -p.xz / r;
      for (int k2 = 1; k2 <= 8; k2++){
        float s = float(k2) * 17.0;
        if (s > r + 12.0) s = r;
        vec2 q = p.xz + dirv * s;
        float qr = length(q);
        float hs = terrainH(q);
        float sightY = mix(p.y + 3.0, VENT_Y + 24.0, s / r);
        float vis = smoothstep(3.0, 16.0, sightY - hs);
        float hh;
        L += lavaColor(q, qr, t, hh) * vis / (1.0 + s * s * 0.00028);
        if (s >= r) break;
      }
    }
    L *= 0.42 + 0.58 * max(0.0, n.y);
    vec3 amb = vec3(0.012, 0.014, 0.026) * (0.45 + 0.55 * max(0.0, n.y));
    col = albedo * (amb + L * 0.34);
    float lh;
    col += lavaColor(p.xz, r, t, lh);
    /* distance haze toward the horizon */
    float fogK = 1.0 - exp(-tHit * 0.00042);
    col = mix(col, vec3(0.016, 0.014, 0.026), fogK);
  } else {
    col = vec3(0.008, 0.009, 0.018);
    if (rd.y > 0.0){
      col = mix(vec3(0.016, 0.012, 0.030), vec3(0.006, 0.007, 0.016), pow(clamp(rd.y, 0.0, 1.0), 0.5));
      /* hash stars */
      vec2 suv = vec2(atan(rd.z, rd.x) * 0.1591549 + 0.5, asin(clamp(rd.y, -1.0, 1.0)) * 0.3183099 + 0.5);
      vec2 gsz = vec2(1100.0, 550.0);
      vec2 cell = floor(suv * gsz);
      float hs2 = hash12(cell + uSeed);
      if (hs2 > 0.9962){
        vec2 cc = fract(suv * gsz) - 0.5;
        float tw = 0.62 + 0.38 * sin(t * (1.4 + hs2 * 9.0) + hs2 * 61.0);
        float mag = (hs2 - 0.9962) / 0.0038;
        float s = exp(-dot(cc, cc) * 7.0) * (0.18 + mag * 1.1) * tw * smoothstep(0.0, 0.10, rd.y);
        vec3 tint = mix(vec3(0.72, 0.80, 1.0), vec3(1.0, 0.86, 0.70), hash12(cell + 9.1));
        col += tint * s;
      }
      /* faint galactic band */
      float milky = fbm2(suv * vec2(26.0, 15.0) + vec2(suv.y * 7.0, 0.0));
      col += vec3(0.05, 0.05, 0.085) * smoothstep(0.58, 0.92, milky) * exp(-pow((rd.y - 0.52) / 0.26, 2.0)) * 0.22;
    }
    /* warm ember glow on the horizon toward the volcano */
    float hz = exp(-max(0.0, abs(rd.y) - 0.02) * 6.0);
    float towards = max(0.0, dot(normalize(rd.xz + vec2(1e-5)), normalize(-ro.xz + vec2(1e-5))));
    col += vec3(0.55, 0.17, 0.05) * pow(towards, 7.0) * hz * 0.11 * (0.5 + 0.5 * uPulse);
  }

  /* plume volume between camera and the terrain hit */
  float tau = 0.0;
  if (rd.y > 0.0015 || (rd.y > -0.0015 && ro.y < PLUME_TOP)){
    float t1 = (VENT_Y - 8.0 - ro.y) / max(rd.y, 1e-5);
    float t2 = (PLUME_TOP - ro.y) / max(rd.y, 1e-5);
    if (rd.y < 0.0){ float s = t1; t1 = t2; t2 = s; }
    float pa = max(t1, 2.0), pb = min(t2, min(tHit, 2400.0));
    if (pb > pa){
      float stp = min((pb - pa) / 26.0, 26.0);
      float tp = pa + jit * stp;
      for (int i = 0; i < 52; i++){
        if (tp > pb) break;
        vec3 p = ro + rd * tp;
        float d = plumeDensity(p, t);
        if (d > 0.012){
          col += plumeLight(p, t, d) * exp(-tau) * stp * 0.10;
          tau += d * stp * 0.022;
        }
        tp += stp;
      }
    }
  }

  if (uDbg > 0.5 && uDbg < 1.5){
    float hh = 0.0;
    vec2 dp = (ro + rd * min(tHit, 900.0)).xz;
    lavaColor(dp, length(dp), t, hh);
    col = clamp(vec3(hh * 0.35, hh * 0.8, hh), 0.0, 1.0);
  } else if (uDbg > 1.5 && uDbg < 2.5){
    float dd = plumeDensity(ro + rd * min(max(tHit, 1.0), 500.0), t);
    col = clamp(vec3(dd * 0.5, dd * 0.7, dd), 0.0, 1.0);
  }
  fragColor = vec4(max(col, vec3(0.0)), 1.0);
}`;

const VS_EMBER = `#version 300 es
precision highp float;
uniform mat4 uVP;
uniform float uPxPerM;
uniform float uSize;
in vec3 aPos;
in vec3 aCol;
in float aA;
out vec3 vCol;
out float vA;
void main(){
  vec4 cp = uVP * vec4(aPos, 1.0);
  gl_Position = cp;
  gl_PointSize = clamp(uSize * uPxPerM / max(cp.w, 1.0), 1.5, 42.0);
  vCol = aCol;
  vA = aA;
}`;

const FS_EMBER = `#version 300 es
precision highp float;
in vec3 vCol;
in float vA;
out vec4 o;
void main(){
  vec2 q = gl_PointCoord * 2.0 - 1.0;
  float r2 = dot(q, q);
  if (r2 > 1.0) discard;
  float g = exp(-r2 * 3.2);
  o = vec4(vCol * g * vA, 1.0);
}`;

const FS_HAZE = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
uniform float uTime;
uniform float uHazeOn;
uniform vec2 uCraterSS;    // projected vent, uv (y-up)
uniform float uHazeR;      // shimmer radius, uv
out vec4 o;
float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vn(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1,0)), u.x), mix(h21(i + vec2(0,1)), h21(i + vec2(1,1)), u.x), u.y);
}
void main(){
  vec3 base = texture(uTex, vUv).rgb;
  float lum = dot(base, vec3(0.299, 0.587, 0.114));
  float d = distance((vUv - uCraterSS) * vec2(1.0, 1.15), vec2(0.0));
  float above = smoothstep(-0.05, 0.12, vUv.y - uCraterSS.y);
  float m = (1.0 - smoothstep(uHazeR * 0.30, uHazeR * 1.05, d)) * (0.30 + 0.70 * above)
          * smoothstep(0.05, 0.55, lum) * uHazeOn;
  vec2 q = vUv * vec2(22.0, 17.0) + vec2(sin(vUv.y * 24.0 + uTime * 2.3) * 0.6, -uTime * 0.55);
  vec2 n = vec2(vn(q), vn(q + vec2(4.7, 8.3))) - 0.5;
  vec2 uv = vUv + n * 0.03 * m;
  o = vec4(mix(base, texture(uTex, uv).rgb, clamp(m * 1.4, 0.0, 1.0)), 1.0);
}`;

const FS_BRIGHT = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
uniform float uThresh;
out vec4 o;
void main(){
  vec3 c = texture(uTex, vUv).rgb;
  float b = max(c.r, max(c.g, c.b));
  float k = smoothstep(uThresh, uThresh + 0.5, b);
  o = vec4(c * k, 1.0);
}`;

const FS_BLUR = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uDir;
out vec4 o;
void main(){
  vec3 c = texture(uTex, vUv).rgb * 0.227027;
  c += (texture(uTex, vUv + uDir * 1.3846).rgb + texture(uTex, vUv - uDir * 1.3846).rgb) * 0.3162162;
  c += (texture(uTex, vUv + uDir * 3.2307).rgb + texture(uTex, vUv - uDir * 3.2307).rgb) * 0.0702702;
  o = vec4(c, 1.0);
}`;

const FS_COMP = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uHdr;
uniform sampler2D uBloom;
uniform float uGain;
uniform float uTime;
out vec4 o;
vec3 aces(vec3 x){
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}
float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
void main(){
  vec3 c = texture(uHdr, vUv).rgb + texture(uBloom, vUv).rgb * uGain;
  c = aces(c * 1.06);
  float l = dot(c, vec3(0.299, 0.587, 0.114));

function frame(){
  const t = freezeT !== null ? freezeT : (performance.now() - t0) / 1000;
  const now = performance.now();
  let dt = 1 / 60;
  if (lastFrame) { const dtms = now - lastFrame; dt = Math.min(0.05, dtms / 1000); perfAcc += dtms; perfN++; if (dtms > perfMax) perfMax = dtms; }
  lastFrame = now;
  frames++;
  resize();

  camAz += dt * 0.021 * speedMul;
  const cb = camState(t);
  rotMat(rot4, cb.r, cb.u, cb.f);
  vpMat(vp4, cb.r, cb.u, cb.f, cb.pos, W / H);
  const puls = pulse(t);
  const flash = flashEnv(t);
  const css = craterScreen(cb);
  lastCraterSS = [css[0], css[1]]; lastHazeR = css[2];

  gl.bindFramebuffer(gl.FRAMEBUFFER, hdr.fbo);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.disable(gl.BLEND);
  gl.useProgram(progScene);
  gl.bindVertexArray(vaoEmpty);
  gl.uniform2f(usc('uRes'), W, H);
  gl.uniform1f(usc('uTime'), t);
  gl.uniform1f(usc('uSeed'), SEED);
  gl.uniform3f(usc('uCamPos'), cb.pos[0], cb.pos[1], cb.pos[2]);
  gl.uniformMatrix4fv(usc('uCamInvRot'), false, rot4);
  gl.uniform1f(usc('uPulse'), puls);
  gl.uniform1f(usc('uFlash'), flash);
  gl.uniform1f(usc('uDbg'), +(qs.get('dbg') || 0));
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const embers = buildEmberVerts(t, cb);
  if (embers.n){
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(progEmber);
    gl.bindVertexArray(vaoEmber);
    gl.uniformMatrix4fv(uem('uVP'), false, vp4);
    gl.uniform1f(uem('uPxPerM'), H * FOVZ * 0.5);
    gl.uniform1f(uem('uSize'), 1.1);
    gl.drawArrays(gl.POINTS, 0, embers.n);
    gl.disable(gl.BLEND);
  }

  /* heat shimmer: HDR -> hz with vent-masked refraction */
  gl.bindFramebuffer(gl.FRAMEBUFFER, hz.fbo);
  gl.viewport(0, 0, W, H);
  gl.useProgram(progHaze);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, hdr.tex);
  gl.uniform1i(uhz('uTex'), 0);
  gl.uniform1f(uhz('uTime'), t);
  gl.uniform1f(uhz('uHazeOn'), hazeOn ? 1.0 : 0.0);
  gl.uniform2f(uhz('uCraterSS'), css[0], css[1]);
  gl.uniform1f(uhz('uHazeR'), css[2]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, b1.fbo);
  gl.viewport(0, 0, b1.w, b1.h);
  gl.useProgram(progBright);
  gl.bindTexture(gl.TEXTURE_2D, hz.tex);
  gl.uniform1i(ubr('uTex'), 0);
  gl.uniform1f(ubr('uThresh'), 0.40);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.useProgram(progBlur);
  gl.uniform1i(ubl('uTex'), 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b2.fbo);
  gl.bindTexture(gl.TEXTURE_2D, b1.tex);
  gl.uniform2f(ubl('uDir'), 2.4 / b1.w, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b1.fbo);
  gl.bindTexture(gl.TEXTURE_2D, b2.tex);
  gl.uniform2f(ubl('uDir'), 0, 2.4 / b1.h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b2.fbo);
  gl.bindTexture(gl.TEXTURE_2D, b1.tex);
  gl.uniform2f(ubl('uDir'), 5.4 / b1.w, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b1.fbo);
  gl.bindTexture(gl.TEXTURE_2D, b2.tex);
  gl.uniform2f(ubl('uDir'), 0, 5.4 / b1.h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(progComp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, hz.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, b1.tex);
  gl.uniform1i(uc('uHdr'), 0);
  gl.uniform1i(uc('uBloom'), 1);
  gl.uniform1f(uc('uGain'), 0.62);
  gl.uniform1f(uc('uTime'), t);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  if (running && roarGain) roarGain.gain.setTargetAtTime(0.02 + 0.05 * puls + 0.06 * flash, AC.currentTime, 0.25);
  if (running && growlGain) growlGain.gain.setTargetAtTime(0.04 + 0.14 * puls, AC.currentTime, 0.3);
  if (running && crackleGain) crackleGain.gain.setTargetAtTime(0.004 + 0.008 * puls, AC.currentTime, 0.2);
  if (flash > 0.9 && t > lastThunder + 3.0){
    thunders.push({ at: t + 1.6 + rr(Math.floor(t * 7)) * 1.2, s: 0.5 + flash * 0.5 });
    lastThunder = t;
  }
  while (thunders.length && t >= thunders[0].at) thunder(thunders.shift().s);
  if (flash > 0.9 && t > nextBlast){
    blast(0.7 + flash * 0.3);
    nextBlast = t + 4;
  }
  const cyc = t % 13.0;
  if (cyc < 0.05 && t > nextBlast){
    blast(0.5 + 0.5 * puls);
    nextBlast = t + 6;
  }

  if (pendingGrab){
    const res = pendingGrab; pendingGrab = null;
    const x0 = (W * 0.25) | 0, bw = (W * 0.5) | 0;
    const y0 = Math.min(H - 8, Math.max(4, Math.round((1 - lastCraterSS[1]) * H) - 8));
    const bh = Math.max(8, Math.min(H - y0 - 4, Math.round(lastHazeR * H * 1.6)));
    const buf = new Uint8Array(bw * bh * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.readPixels(x0, y0, bw, bh, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    let s = 0, c = 0;
    for (let i = 0; i < buf.length; i += 4){ s += 0.299 * buf[i] + 0.587 * buf[i + 1] + 0.114 * buf[i + 2]; c++; }
    res(+(s / c).toFixed(2));
  }
  if (pendingEdges){
    const res = pendingEdges; pendingEdges = null;
    const x0 = (W * 0.30) | 0, bw = (W * 0.40) | 0;
    const y0 = Math.min(H - 8, Math.max(4, Math.round((1 - lastCraterSS[1]) * H)));
    const bh = Math.max(8, Math.min(H - y0 - 4, Math.round(H * 0.34)));
    const buf = new Uint8Array(bw * bh * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.readPixels(x0, y0, bw, bh, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    const L = i => 0.299 * buf[i] + 0.587 * buf[i + 1] + 0.114 * buf[i + 2];
    let s = 0, c = 0;
    for (let y = 1; y < bh - 1; y++) for (let x = 1; x < bw - 1; x++){
      const i = (y * bw + x) * 4;
      s += Math.abs(L(i) - L(i + 4)) + Math.abs(L(i) - L(i + bw * 4));
      c++;
    }
    res(c ? +(s / c).toFixed(3) : 0);
  }
  if (pendingDiff){
    const bw = (W * 0.28) | 0, bh = Math.round(H * 0.16);
    const x0 = (W * 0.36) | 0;
    const y0 = Math.min(H - 8, Math.max(4, Math.round((1 - lastCraterSS[1]) * H) - 4));
    const h = Math.min(bh, H - y0 - 4);
    const buf = new Uint8Array(bw * h * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.readPixels(x0, y0, bw, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    const lum = new Float32Array(bw * h);
    for (let i = 0; i < bw * h; i++) lum[i] = 0.299 * buf[i * 4] + 0.587 * buf[i * 4 + 1] + 0.114 * buf[i * 4 + 2];
    if (diffPrev === null){
      hazeOn = diffWant;
      diffPrev = lum;
    } else {
      let s = 0;
      for (let i = 0; i < bw * h; i++) s += Math.abs(lum[i] - diffPrev[i]);
      pendingDiff(+(s / (bw * h)).toFixed(3));
      pendingDiff = null; diffPrev = null;
    }
  }
  readyFlag = true;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- DEV hooks ---------------- */

window.__volcanoTest = {
  get ready(){ return readyFlag; },
  get frames(){ return frames; },
  get gl2(){ return true; },
  get hdr(){ return HDR_OK; },
  state(){
    const t = (performance.now() - t0) / 1000;
    const live = [];
    for (let i = 0; i < EMB_N && live.length < 40; i++){
      const e = emberAt(i, t);
      if (e) live.push({ i, p: e.pos.map(v => +v.toFixed(1)), v: e.vel.map(v => +v.toFixed(1)), age: +e.age.toFixed(2) });
    }
    return {
      t: +t.toFixed(2),
      camAz: +(camAz * 180 / Math.PI).toFixed(2),
      yaw: +cam.yaw.toFixed(3),
      pulse: +pulse(t).toFixed(3),
      flash: +flashEnv(t).toFixed(3),
      embers: live,
      emberLive: live.length >= 40 ? '40+' : live.length,
      emberSprites: emberDrawN,
      hazeOn,
      audioOn: running,
      craterSS: lastCraterSS.map(v => +v.toFixed(3)),
      hazeR: +lastHazeR.toFixed(3),
      speedMul,
    };
  },
  pulse(t){ return +pulse(t).toFixed(4); },
  lavaHeat(x, z){ return +lavaHeatJS(x, z, (performance.now() - t0) / 1000).toFixed(3); },
  lavaHeatAt(x, z, t){ return +lavaHeatJS(x, z, +t).toFixed(3); },
  lavaTemp(x, z){ return +lavaTempJS(x, z).toFixed(3); },
  plumeAt(y){ return +plumeDensityJS(+y, (performance.now() - t0) / 1000).toFixed(3); },
  plumeBand(y){
    const dy = +y - VENT_Y;
    return +((34 + dy * 0.52) * (1 + 0.45 * smoothstepJS(240, 430, dy))).toFixed(1);
  },
  emberCount(t){ let n = 0; for (let i = 0; i < EMB_N; i++) if (emberAt(i, +t)) n++; return n; },
  audio(){ return { growl: growlGain ? +growlGain.gain.value.toFixed(4) : 0, crackle: crackleGain ? +crackleGain.gain.value.toFixed(4) : 0, thunderPending: thunders.length }; },
  ember(i, t){ const e = emberAt(i, +t); return e ? { p: e.pos.map(v => +v.toFixed(2)), v: e.vel.map(v => +v.toFixed(2)) } : null; },
  setSpeed(v){ speedMul = Math.max(0, +v); },
  setHaze(v){ hazeOn = !!v; },
  setFreeze(v){ freezeT = v === true ? (performance.now() - t0) / 1000 : (v ? +v : null); },
  grab(){ return new Promise(res => { pendingGrab = res; }); },
  grabEdges(){ return new Promise(res => { pendingEdges = res; }); },
  diffHaze(want){ return new Promise(res => { pendingDiff = res; diffPrev = null; diffWant = !!want; }); },
  perf(){ return { avg: perfN ? +(perfAcc / perfN).toFixed(2) : 0, max: +perfMax.toFixed(2), n: perfN }; },
  resetPerf(){ perfAcc = 0; perfN = 0; perfMax = 0; },
  setPose(p){
    if (p.yaw !== undefined) { cam.tyaw = p.yaw; cam.yaw = p.yaw; }
    if (p.pitch !== undefined) { cam.tpitch = p.pitch; cam.pitch = p.pitch; }
    cam.touched = performance.now();
  },
};
</script>
