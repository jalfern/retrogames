<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OCEAN — WebGPU ocean & sky</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #hud {
    position: fixed; left: 14px; bottom: 12px; z-index: 2; pointer-events: none;
    font: 11px/1.7 ui-monospace, Menlo, monospace; letter-spacing: .14em;
    color: rgba(255,225,190,.8); text-shadow: 0 1px 3px rgba(0,0,0,.85);
    transition: opacity 2s; text-transform: uppercase;
  }
  #hud b { color: rgba(255,240,215,.95); font-weight: 700; }
  #fatal {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 3;
    font: 14px/1.6 ui-monospace, Menlo, monospace; color: #ffd9b0; background: #10131f;
    text-align: center; padding: 2em;
  }
  #sea {
    position: fixed; top: 12px; right: 14px; z-index: 2; width: 196px;
    background: rgba(8,10,22,.6); border: 1px solid rgba(255,215,175,.28); border-radius: 8px;
    padding: 9px 11px 10px; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    font: 11px/1.5 ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(255,225,190,.85); text-shadow: 0 1px 3px rgba(0,0,0,.8);
    transition: background .4s, border-color .4s;
  }
  #sea .row { display: flex; justify-content: space-between; }
  #sea b { color: rgba(255,240,215,.95); font-weight: 700; }
  #sea input[type=range] {
    width: 100%; height: 24px; margin-top: 7px; accent-color: #ffb060;
    touch-action: none; cursor: ew-resize;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>OCEAN</b> · WebGPU FFT &nbsp;·&nbsp; drag look &nbsp;·&nbsp; WASD / arrows move &nbsp;·&nbsp; Q / E down-up</div>
<div id="sea">
  <div class="row"><b>Sea state</b><span id="seaLbl">Calm</span></div>
  <div class="row"><span>Wind</span><span id="windLbl">3 m/s</span></div>
  <input id="storm" type="range" min="0" max="100" step="1" value="0" aria-label="Sea state, calm to storm">
  <div class="row" style="margin-top:7px"><b>Time</b><span id="todLbl">Sunset</span></div>
  <input id="tod" type="range" min="0" max="100" step="1" value="100" aria-label="Time of day, night to sunrise to midday to sunset">
  <div class="row" style="margin-top:7px"><b>Clouds</b><span id="cloudLbl">Clear</span></div>
  <input id="cloud" type="range" min="0" max="100" step="1" value="0" aria-label="Cloud cover, clear to overcast">
  <div class="row" style="margin-top:7px"><b>Meteors</b><span id="shootLbl">Off</span></div>
  <input id="shoot" type="range" min="0" max="100" step="1" value="0" aria-label="Shooting-star frequency, off to meteor shower">
  <div class="row" style="margin-top:7px"><b>Aurora</b><span id="auroraLbl">Off</span></div>
  <input id="aurora" type="range" min="0" max="100" step="1" value="0" aria-label="Aurora intensity, off to vivid">
</div>
<div id="fatal"></div>
<script src="ocean.stars.js"></script>
<script type="module">
'use strict';

const NI = 64, LOGN = 6;
const SEG = 288, EXTENT = 520;
const qs = new URLSearchParams(location.search);
const SEED = (qs.get('seed') | 0) || 1337;
const LITE = qs.get('lite') === '1';

const SUN_EL_K = [-0.21, 0.05, 0.73, 0.045];
const MOON_EL_K = [0.60, 0.10, -0.40, 0.05];
const smooth01 = x => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const lerpKeys = (K, v) => { const k = Math.max(0, Math.min(1, v)) * 3; const i = Math.min(Math.floor(k), 2); return K[i] + (K[i + 1] - K[i]) * smooth01(k - i); };
const WIND_AZ = 0.0;

// ---- real night sky: Yale Bright Star Catalogue v5 (J2000), see ocean.stars.js ----
// ~500 brightest stars + a faint Milky Way band, as seen from LAT_DEG N / LON_DEG E.
// Positions are celestial (RA/Dec); they rotate with the time slider via local sidereal
// time, AND obey the calendar (#611): the date (today, or ?date=YYYY-MM-DD) enters the
// LST, so the same clock time shows a sky ~1° further west each night — Orion rules the
// midnight meridian in January, Vega sits near the zenith at midnight in early July.
const SKY = (typeof OCEAN_STARS !== 'undefined') ? OCEAN_STARS : { BSC: [], MILKY: [], STAR_PAL: [[1, 1, 1]], LAT_DEG: 38.6, LON_DEG: -122.577 };
const PHI = SKY.LAT_DEG * Math.PI / 180;          // latitude -> celestial pole altitude
const LON_DEG = (typeof SKY.LON_DEG === 'number') ? SKY.LON_DEG : -122.577;
// #611 — the slider reads local clock time: NIGHT = 00:00 .. SUNSET = 18:00.
const TIME_SPAN = 18;
const QS_DATE = /^\d{4}-\d{2}-\d{2}$/.test(qs.get('date') || '') ? qs.get('date') : null;
const localIso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const skyDate = () => (QS_DATE ? new Date(QS_DATE + 'T00:00:00') : new Date());
// US daylight saving: 2nd Sunday of March 02:00 -> 1st Sunday of November 02:00, local.
function isDst(y, m, d, h) {
  if (m < 3 || m > 11) return false;
  if (m > 3 && m < 11) return true;
  const firstDow = new Date(y, m - 1, 1).getDay();
  const nth = Math.floor((d - 1 - firstDow + 7) / 7) + 1;
  return m === 3 ? (nth > 2 || (nth === 2 && h >= 2)) : (nth === 1 && h < 2);
}
const julianDay = (y, m, d) => {
  if (m <= 2) { y -= 1; m += 12; }
  const a = Math.floor(y / 100);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + 2 - a + Math.floor(a / 4) - 1524.5;
};
// local sidereal time in degrees at slider time t (fraction of NIGHT..SUNSET) on skyDate()
function lstDeg(t) {
  const dt = skyDate();
  const h = t * TIME_SPAN;
  const ut = h + 8 - (isDst(dt.getFullYear(), dt.getMonth() + 1, dt.getDate(), h) ? 1 : 0);  // PST = UTC-8
  const D = julianDay(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()) + ut / 24 - 2451545.0;
  return (((280.46061837 + 360.98564736629 * D + LON_DEG) % 360) + 360) % 360;
}
// #704 — phone-faithful night sky. Sizes are CSS-px radii; the vertex pass scales
// them by the render dpr so a star reads the same on a DPR-1.75 phone (a 1.1-canvas-px
// faint star is sub-pixel there — the field barely showed). The Milky Way is a field of
// large, very dim, heavily overlapping soft billboards — a continuous glow, never dots.
const STAR_MIN = 1.5, STAR_RANGE = 3.2;   // CSS-px radius, faint (mag 5.5) → bright end
const MW_SIZE = 24, MW_GAIN = 0.13;      // CSS-px blob radius + per-blob brightness (vs a star)
const STAR_D = (() => {
  const out = [];
  const mn = -1.46, mx = 5.5, sp = mx - mn;           // V-mag range of the embedded catalog (#607: to 5.5 so the sky fills)
  for (let i = 0; i < SKY.BSC.length; i++) {
    const s = SKY.BSC[i];
    const p = Math.max(0, Math.min(1, (mx - s[2]) / sp));   // 0 faint .. 1 brightest
    const sizePx = STAR_MIN + STAR_RANGE * Math.pow(p, 1.7); // angular size (CSS-px radius) by brightness
    const br = 0.5 + 2.1 * Math.pow(p, 2.2);                // additive brightness by brightness
    const c = SKY.STAR_PAL[s[3]] || [1, 1, 1];              // spectral color O..M
    out.push({ ra: s[0], dec: s[1], sizePx, br, c, tw: (i * 0.6180339887) % 1, gain: 1.0 });
  }
  for (const m of SKY.MILKY) out.push({ ra: m[0], dec: m[1], sizePx: MW_SIZE, br: m[2] * 5.0, c: [0.56, 0.63, 0.80], tw: Math.random(), gain: MW_GAIN });
  return out;
})();

const OCT = [
  { L: 95,  A: 130.0, kc: 0.010, chop: 1.25 },
  { L: 14,  A: 55.0, kc: 0.07,  chop: 0.75 },
];
const AMP0 = 0.31, AMP1 = 0.94;
// #462 item 1 — lee-face foam dissolve + sub-meter edge breakup (fs_main).
// [ kw band (oct-graded along-wind slope) , max dissolve at the steep lee foot ]
const FOAM_LEE = [0.04, 0.28, 0.45];
// rad/m → ~0.95 m ripple wavelength, the sub-meter scale foam breaks into
const FOAM_FINE = 6.6;

function seaParams(s) {
  // oct-0 dsp is capped so its x-shear between two adjacent mesh vertices
  // (~1.8 m apart) stays below their spacing at storm=1 — measured min Jacobian
  // of x -> x - Dx at mesh spacing: -0.83 at the old 4.0 base (folds/spikes),
  // +0.12 at 2.0 with the fill kMax band-limit (see oceanfold). Octave 1 is
  // shading-only, so its dsp can stay high.
  return OCT.map((o, i) => i === 0
    ? { A: o.A * (0.75 + 5.5 * s * s), spread: 6.0 - 4.0 * s, dsp: 2.0 * (0.50 + 0.18 * s), amp: AMP0 * (1.35 + 2.6 * s * s) }
    : { A: o.A * (0.75 + 16.0 * s * s), spread: 6.0 - 4.0 * s, dsp: 2.4 * (0.55 + 0.45 * s), amp: AMP1 * (1.35 + 3.4 * s * s) });
}

const cam = { pos: [0, 3.1, -14], yaw: 0, pitch: -0.05, touched: false };

let storm = Math.max(0, Math.min(1, parseFloat(qs.get('storm')) || 0));
const clamp01 = v => Math.max(0, Math.min(1, v));
let tod = Number.isFinite(parseFloat(qs.get('tod'))) ? clamp01(parseFloat(qs.get('tod'))) : 1;
let cloud = Number.isFinite(parseFloat(qs.get('cloud'))) ? clamp01(parseFloat(qs.get('cloud'))) : 0;
let needSpec = true;
// slider SET point; the rendered `storm` eases toward it over ~1s so amplitude
// grows/shrinks smoothly instead of a hard cut (round-two #462 item 6)
let stormTarget = storm;
let lastStorm = storm;
const STORM_TAU = 0.30;
// #609 — shooting-star frequency. `shootTarget` is the slider set point; the
// rendered `shoot` eases toward it, so nudging the slider ramps the meteor rate
// over ~1s instead of cutting. 0 = OFF (byte-identical to the pre-#609 sky).
let shootTarget = Number.isFinite(parseFloat(qs.get('shoot'))) ? clamp01(parseFloat(qs.get('shoot'))) : 0;
let shoot = shootTarget;
// #612 — aurora intensity. Eases like the meteors; 0 = OFF and the sky is
// byte-identical to the pre-#612 build (the shader skips the curtains entirely).
let auroraTarget = Number.isFinite(parseFloat(qs.get('aurora'))) ? clamp01(parseFloat(qs.get('aurora'))) : 0;
let aurora = auroraTarget;
const windU = (s = storm) => 3 + 21 * s;
// #462 item 3 — gusts: a slow fbm over time breathes wind, wave height and foam
// around the slider set point. Amplitude scales with sea state, so calm stays
// glassy (gust == 0 at s=0) and storm swells/eases over ~10 s.
const GUST_AMP = 0.30;
const GUST_RATE = 0.09;
// a slow ~12 s carrier gives the gusts a provable rhythm (pure fbm can stall for
// tens of seconds — a harness gate on it would flake); the fbm breaks the metronome.
const gustSignal = t => Math.max(-1, Math.min(1, 0.62 * Math.sin(t * 0.52) + 0.5 * (fbm1(t * GUST_RATE + 5.0) * 2 - 1)));
const hash1 = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const vnoise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hash1(i) * (1 - u) + hash1(i + 1) * u; };
const fbm1 = x => { let v = 0, a = 0.5, xx = x; for (let k = 0; k < 3; k++) { v += a * vnoise1(xx); xx = xx * 2.07 + 13.0; a *= 0.5; } return v / 0.875; };
// streak advection phase: integral of wind speed (a constant times t when calm-
// constant, but gusts must not teleport the streak pattern, so integrate instead
// of time*U). gustV/gfV mirror the per-frame gust for the test hook.
let advPhase = 0, gustV = 0, gfV = 1;
const SEA_NAMES = [[0.12, 'CALM'], [0.3, 'SLIGHT'], [0.5, 'MODERATE'], [0.7, 'ROUGH'], [0.85, 'VERY ROUGH'], [1.01, 'STORM']];
const TOD_NAMES = ['NIGHT', 'SUNRISE', 'MIDDAY', 'SUNSET'];
const CLOUD_NAMES = [[0.15, 'CLEAR'], [0.45, 'SCATTERED'], [0.75, 'BROKEN'], [1.01, 'OVERCAST']];

const canvas = document.getElementById('c');
const hud = document.getElementById('hud');
const fatal = document.getElementById('fatal');
const seaLbl = document.getElementById('seaLbl');
const windLbl = document.getElementById('windLbl');
const stormSl = document.getElementById('storm');
const todSl = document.getElementById('tod');
const cloudSl = document.getElementById('cloud');
const todLbl = document.getElementById('todLbl');
const cloudLbl = document.getElementById('cloudLbl');
const shootSl = document.getElementById('shoot');
const shootLbl = document.getElementById('shootLbl');
const auroraSl = document.getElementById('aurora');
const auroraLbl = document.getElementById('auroraLbl');

const SHOOT_NAMES = [[0.001, 'OFF'], [0.2, 'LOW'], [0.5, 'OCCASIONAL'], [0.8, 'ACTIVE'], [1.01, 'SHOWER']];
const AURORA_NAMES = [[0.001, 'OFF'], [0.3, 'FAINT'], [0.65, 'ACTIVE'], [1.01, 'VIVID']];

function updateSeaUI() {
  seaLbl.textContent = SEA_NAMES.find(x => stormTarget < x[0])[1];
  windLbl.textContent = Math.round(windU(stormTarget)) + ' m/s';
  stormSl.value = String(Math.round(stormTarget * 100));
  todLbl.textContent = TOD_NAMES[Math.round(tod * 3)];
  cloudLbl.textContent = CLOUD_NAMES.find(x => cloud < x[0])[1];
  todSl.value = String(Math.round(tod * 100));
  cloudSl.value = String(Math.round(cloud * 100));
  shootLbl.textContent = SHOOT_NAMES.find(x => shootTarget < x[0])[1];
  shootSl.value = String(Math.round(shootTarget * 100));
  auroraLbl.textContent = AURORA_NAMES.find(x => auroraTarget < x[0])[1];
  auroraSl.value = String(Math.round(auroraTarget * 100));
}
function setStorm(v) {
  stormTarget = Math.max(0, Math.min(1, v));
  updateSeaUI();
}
function setTod(v) { tod = clamp01(v); updateSeaUI(); }
function setCloud(v) { cloud = clamp01(v); updateSeaUI(); }
function setShoot(v) { shootTarget = clamp01(v); updateSeaUI(); }
function setAurora(v) { auroraTarget = clamp01(v); updateSeaUI(); }
stormSl.addEventListener('input', () => setStorm(+stormSl.value / 100));
todSl.addEventListener('input', () => setTod(+todSl.value / 100));
cloudSl.addEventListener('input', () => setCloud(+cloudSl.value / 100));
shootSl.addEventListener('input', () => setShoot(+shootSl.value / 100));
auroraSl.addEventListener('input', () => setAurora(+auroraSl.value / 100));
stormSl.addEventListener('keydown', e => e.stopPropagation());
todSl.addEventListener('keydown', e => e.stopPropagation());
cloudSl.addEventListener('keydown', e => e.stopPropagation());
shootSl.addEventListener('keydown', e => e.stopPropagation());
auroraSl.addEventListener('keydown', e => e.stopPropagation());
document.getElementById('sea').addEventListener('pointerdown', e => e.stopPropagation());
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === '[') setStorm(stormTarget - 0.1);
  if (e.key === ']') setStorm(stormTarget + 0.1);
  if (e.key === ',') setTod(tod - 0.05);
  if (e.key === '.') setTod(tod + 0.05);
  if (e.key === 'c') setCloud(cloud + 0.1);
  if (e.key === 'x') setCloud(cloud - 0.1);
  if (e.key === 'm') setShoot(shootTarget + 0.1);
  if (e.key === 'n') setShoot(shootTarget - 0.1);
  if (e.key === 'z') setAurora(auroraTarget + 0.1);
  if (e.key === 'v') setAurora(auroraTarget - 0.1);
});
updateSeaUI();

if (!navigator.gpu) {
  fatal.style.display = 'grid';
  fatal.textContent = 'WebGPU not available — need Chrome 113+ / Safari 18+ on a GPU device.';
} else {
  boot().catch(e => {
    fatal.style.display = 'grid';
    fatal.textContent = 'WebGPU init failed: ' + e.message;
    console.error(e);
  });
}

const HDR = `
const NI: u32 = ${NI}u;
const PI: f32 = 3.14159265359;
fn cmul(a: vec2f, b: vec2f) -> vec2f { return vec2f(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x); }
fn rev(vIn: u32) -> u32 {
  var v = vIn; var r: u32 = 0u;
  for (var i: u32 = 0u; i < ${LOGN}u; i = i + 1u) { r = (r << 1u) | (v & 1u); v = v >> 1u; }
  return r;
}
fn kOf(i: u32, L: f32) -> f32 {
  let c: f32 = select(f32(i), f32(i) - f32(NI), i >= NI / 2u);
  return c * (2.0 * PI) / L;
}
fn hash21(p: vec2f) -> vec2f {
  var q = fract(p * vec2f(123.34, 456.21));
  q += dot(q, q + 45.32);
  return fract((q.x + q.y) * q.yx) * 2.0 - 1.0;
}
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p);
  let u = f * f * (3.0 - 2.0 * f);
  let ga = dot(hash21(i), f);
  let gb = dot(hash21(i + vec2f(1.0, 0.0)), f - vec2f(1.0, 0.0));
  let gc = dot(hash21(i + vec2f(0.0, 1.0)), f - vec2f(0.0, 1.0));
  let gd = dot(hash21(i + vec2f(1.0, 1.0)), f - vec2f(1.0, 1.0));
  return mix(mix(ga, gb, u.x), mix(gc, gd, u.x), u.y) * 0.72 + 0.5;
}
fn fbm(pIn: vec2f, octs: i32) -> f32 {
  var p = pIn; var v = 0.0; var a = 0.5;
  for (var i: i32 = 0; i < octs; i = i + 1) { v += a * vnoise(p); p = p * 2.07 + vec2f(13.0, 7.0); a *= 0.5; }
  return v;
}
var<private> g_storm: f32 = 0.0;
var<private> g_tod: f32 = 1.0;
var<private> g_cloud: f32 = 0.0;
var<private> g_day: f32 = 1.0;
var<private> g_night: f32 = 0.0;
var<private> g_sun: vec3f = vec3f(1.0, 0.045, 0.0);
var<private> g_moon: vec3f = vec3f(1.0, 0.6, 0.0);
var<private> g_zen: vec3f = vec3f(0.040, 0.070, 0.190);
var<private> g_mid: vec3f = vec3f(0.30, 0.185, 0.360);
var<private> g_horiz: vec3f = vec3f(1.08, 0.425, 0.155);
var<private> g_glow: vec3f = vec3f(1.0, 0.60, 0.26);
var<private> g_disk: vec3f = vec3f(1.0, 0.84, 0.60);
var<private> g_cldD: vec3f = vec3f(0.14, 0.11, 0.20);
var<private> g_cldL: vec3f = vec3f(0.98, 0.56, 0.30);
var<private> g_foamC: vec3f = vec3f(0.93, 0.90, 0.85);
var<private> g_deepK: f32 = 0.85;
var<private> g_sssK: f32 = 0.80;
var<private> g_aurora: f32 = 0.0;

// night, sunrise, midday, sunset
const P_ZEN: array<vec3f, 4> = array<vec3f, 4>(vec3f(0.010, 0.016, 0.048), vec3f(0.075, 0.130, 0.300), vec3f(0.085, 0.26, 0.60), vec3f(0.040, 0.070, 0.190));
const P_MID: array<vec3f, 4> = array<vec3f, 4>(vec3f(0.028, 0.045, 0.095), vec3f(0.50, 0.33, 0.40), vec3f(0.28, 0.50, 0.78), vec3f(0.30, 0.185, 0.360));
const P_HOR: array<vec3f, 4> = array<vec3f, 4>(vec3f(0.050, 0.068, 0.115), vec3f(1.02, 0.52, 0.24), vec3f(0.60, 0.72, 0.84), vec3f(1.08, 0.425, 0.155));
const P_GLO: array<vec3f, 4> = array<vec3f, 4>(vec3f(0.42, 0.52, 0.78), vec3f(1.0, 0.62, 0.36), vec3f(1.0, 0.94, 0.80), vec3f(1.0, 0.60, 0.26));
const P_DIS: array<vec3f, 4> = array<vec3f, 4>(vec3f(0.95, 0.97, 1.00), vec3f(1.0, 0.88, 0.72), vec3f(1.0, 1.0, 0.96), vec3f(1.0, 0.84, 0.60));
const P_CDD: array<vec3f, 4> = array<vec3f, 4>(vec3f(0.030, 0.038, 0.062), vec3f(0.15, 0.12, 0.19), vec3f(0.40, 0.44, 0.50), vec3f(0.14, 0.11, 0.20));
const P_CDL: array<vec3f, 4> = array<vec3f, 4>(vec3f(0.30, 0.36, 0.50), vec3f(1.0, 0.62, 0.42), vec3f(1.0, 1.0, 0.98), vec3f(0.98, 0.56, 0.30));
const P_FO: array<vec3f, 4> = array<vec3f, 4>(vec3f(0.40, 0.48, 0.62), vec3f(0.88, 0.80, 0.72), vec3f(0.95, 0.95, 0.92), vec3f(0.93, 0.90, 0.85));
const P_KS: array<vec2f, 4> = array<vec2f, 4>(vec2f(0.30, 0.22), vec2f(0.72, 0.75), vec2f(1.0, 1.0), vec2f(1.0, 0.80));

fn setupSkyPal(todIn: f32, stIn: f32) {
  let k = clamp(todIn, 0.0, 1.0) * 3.0;
  let i = min(u32(floor(k)), 2u);
  let j = min(i + 1u, 3u);
  let f0 = k - f32(i);
  let f = f0 * f0 * (3.0 - 2.0 * f0);
  g_zen = mix(P_ZEN[i], P_ZEN[j], f);
  g_mid = mix(P_MID[i], P_MID[j], f);
  g_horiz = mix(P_HOR[i], P_HOR[j], f);
  g_glow = mix(P_GLO[i], P_GLO[j], f);
  g_disk = mix(P_DIS[i], P_DIS[j], f);
  g_cldD = mix(P_CDD[i], P_CDD[j], f);
  g_cldL = mix(P_CDL[i], P_CDL[j], f);
  g_foamC = mix(P_FO[i], P_FO[j], f);

// #612 — the curtains. Three thin layers raymarched along the view ray between two

// along a fixed horizontal axis, slow along d.y and the perpendicular axis, so the
// iso-density features stretch into vertical ribbons. A second slow fbm folds the
// axis (rippling folds) and every layer drifts at its own rate. Colour by height:

fn auroraGlow(d: vec3f, t: f32) -> vec3f {

    let fold = fbm(vec2f(perp * 0.10 + t * 0.010 + fi * 4.3, fi * 2.7 + 1.1), 3) * 2.0 - 1.0;
    let u = along * (0.32 + 0.10 * fi) + fold * (1.4 + 0.5 * fi) + t * (0.055 + 0.030 * fi);

    // square — bright ribbons with dark gaps between them (auroral arcs).

    ribbon *= smoothstep(b0, b0 + 0.05, d.y) * (1.0 - smoothstep(b1 - 0.09, b1, d.y));

    // is what keeps the curtains reading GREEN over a blue-dominant night sky instead
    // of saturating to wash-white); crown ramps through magenta to violet.
    let col = mix(vec3f(0.08, 1.0, 0.14), vec3f(0.62, 0.14, 0.92), smoothstep(0.30, 0.72, ht));

      let rim = 1.0 - smoothstep(${EXTENT * 0.40}, ${EXTENT * 0.5}, length(off));
      let vd = length(world.xz - su.camPos.xz);
      let yk = mix(0.15, 1.0, 1.0 - smoothstep(150.0, 340.0, vd));
      world.y = h0v * rim * yk;
      var o: VOut;
      o.pos = su.vp * vec4f(world, 1.0);
      o.world = world;
      o.nrm = vec3f(-(gd0.r * dsp0 + gd1.r * dsp1) * rim * yk, 1.0, -(gd0.g * dsp0 + gd1.g * dsp1) * rim * yk);
      o.h = hh * rim * yk;
      return o;
    }


    @fragment
    fn fs_main(in: VOut) -> @location(0) vec4f {
      g_storm = su.wind.y;
      let s = su.wind.y;
      // #462 item 3 — gust (pre-scaled by sea state): raises the effective wind
      // for foam/streaks only; sky and colour stay on s so the horizon does not
      // flicker with the gusts.
      let eg = su.wind.w;
      let se = clamp(s + eg, 0.0, 1.0);
      g_tod = su.sky.x; g_cloud = su.sky.y; g_day = su.sky.z; g_night = su.sky.w;
      g_aurora = su.oct.w;
      g_sun = normalize(su.sunD.xyz);
      g_moon = normalize(su.moonD.xyz);
      setupSkyPal(g_tod, g_storm);
      let cc = g_cloud;
      let V = normalize(su.camPos - in.world);
      var n = normalize(in.nrm);
      let dist = length(su.camPos - in.world);
      let det = exp(-dist * 0.012);
      let sp1 = vec2f(vnoise(in.world.xz * 1.7 + vec2f(su.time * 0.9, -su.time * 0.6)),
                      vnoise(in.world.xz * 1.7 + vec2f(su.time * 0.9, -su.time * 0.6) + vec2f(57.3, 91.7))) * 2.0 - 1.0;
      let sp2 = vec2f(vnoise(in.world.xz * 5.1 - vec2f(su.time * 0.5, su.time * 1.15)),
                      vnoise(in.world.xz * 5.1 - vec2f(su.time * 0.5, su.time * 1.15) + vec2f(23.1, 17.9))) * 2.0 - 1.0;
      n.x += (sp1.x * (0.10 + 0.08 * s) + sp2.x * (0.05 + 0.06 * s)) * det;
      n.z += (sp1.y * (0.10 + 0.08 * s) + sp2.y * (0.05 + 0.06 * s)) * det;
      n = normalize(n);
      let cosT = max(dot(n, V), 0.0);
      let F = 0.02 + 0.98 * pow(1.0 - cosT, 5.0);
      let r = reflect(-V, n);
      var refl = skyColor(r, su.time);
      refl *= mix(0.28, 1.0, smoothstep(0.0, 0.30, r.y));
      let deep = mix(mix(vec3f(0.008, 0.035, 0.062), vec3f(0.018, 0.095, 0.120), smoothstep(-1.0, 1.5, in.h)), vec3f(0.045, 0.070, 0.085), s * 0.55) * mix(1.0, 0.88, s) * g_deepK * (1.0 - 0.30 * cc);
      let sss = vec3f(0.03, 0.24, 0.26) * pow(max(dot(V, g_sun), 0.0), 3.0) * smoothstep(0.0, 1.1, in.h) * g_sssK * (1.0 - 0.7 * s);
      var col = mix(deep + sss, refl, F);
      let mu = max(dot(r, g_sun), 0.0);
      let mmu = max(dot(r, g_moon), 0.0);
      let gmask = smoothstep(0.30, 0.72, fbm(in.world.xz * 0.22 + vec2f(su.time * 0.05, 0.0), 4));
      col += mix(g_disk, vec3f(0.62, 0.52, 0.50), s) * (pow(mu, 520.0) * 4.0 + pow(mu, 90.0) * 0.5 + pow(mu, 14.0) * 0.06) * det * (0.25 + 0.75 * gmask) * (1.0 - 0.92 * smoothstep(0.15, 0.75, s)) * g_day * (1.0 - 0.90 * cc);
      col += vec3f(0.72, 0.80, 0.95) * (pow(mmu, 520.0) * 2.4 + pow(mmu, 90.0) * 0.30 + pow(mmu, 14.0) * 0.035) * det * (0.25 + 0.75 * gmask) * (1.0 - 0.88 * smoothstep(0.15, 0.75, s)) * g_night * (1.0 - 0.92 * cc);
      let ds0 = su.oct.x / f32(NI);
      let ds1 = su.oct2.x / f32(NI);
      let uv0 = vec2f(in.world.x / su.oct.x, in.world.z / su.oct.x);
      let uv1 = vec2f(in.world.x / su.oct2.x, in.world.z / su.oct2.x);
      let gx0a = textureSampleLevel(g0, samp, uv0 + vec2f(1.0 / f32(NI), 0.0), 0.0).r;
      let gx0b = textureSampleLevel(g0, samp, uv0 - vec2f(1.0 / f32(NI), 0.0), 0.0).r;
      let gz0a = textureSampleLevel(g0, samp, uv0 + vec2f(0.0, 1.0 / f32(NI)), 0.0).g;
      let gz0b = textureSampleLevel(g0, samp, uv0 - vec2f(0.0, 1.0 / f32(NI)), 0.0).g;
      let gx1a = textureSampleLevel(g1, samp, uv1 + vec2f(1.0 / f32(NI), 0.0), 0.0).r;
      let gx1b = textureSampleLevel(g1, samp, uv1 - vec2f(1.0 / f32(NI), 0.0), 0.0).r;
      let gz1a = textureSampleLevel(g1, samp, uv1 + vec2f(0.0, 1.0 / f32(NI)), 0.0).g;
      let gz1b = textureSampleLevel(g1, samp, uv1 - vec2f(0.0, 1.0 / f32(NI)), 0.0).g;
      let a0 = su.oct.y;
      let a1 = su.oct2.y;
      let gx0c = textureSampleLevel(g0, samp, uv0, 0.0).r;
      let gz0c = textureSampleLevel(g0, samp, uv0, 0.0).g;
      let gx1c = textureSampleLevel(g1, samp, uv1, 0.0).r;
      let gz1c = textureSampleLevel(g1, samp, uv1, 0.0).g;
      let steep = abs(gx0c) + abs(gz0c) + 0.7 * (abs(gx1c) + abs(gz1c));
      let J0 = (1.0 + a0 * (gx0a - gx0b) / (2.0 * ds0)) * (1.0 + a0 * (gz0a - gz0b) / (2.0 * ds0))
             - pow(a0 * (gx0a - gx0b) / (2.0 * ds0), 2.0) * pow(a0 * (gz0a - gz0b) / (2.0 * ds0), 2.0);
      let J1 = (1.0 + a1 * (gx1a - gx1b) / (2.0 * ds1)) * (1.0 + a1 * (gz1a - gz1b) / (2.0 * ds1))
             - pow(a1 * (gx1a - gx1b) / (2.0 * ds1), 2.0) * pow(a1 * (gz1a - gz1b) / (2.0 * ds1), 2.0);
      var f = smoothstep(1.06 - 0.012 * s, 1.16, J0) * 0.45
            + smoothstep(1.025 - 0.010 * s, 1.08, J1);
      let wdir = vec2f(cos(su.wind.z), sin(su.wind.z));
      // advection phase comes from the integrated wind (oct.z), not time*U:
      // gusts change U every frame and time*U would teleport the streaks.
      let walong = dot(in.world.xz, wdir) - su.oct.z * 0.045;
      let wperp = dot(in.world.xz, vec2f(-wdir.y, wdir.x));
      let streak = smoothstep(0.42 - 0.10 * se, 0.74 - 0.08 * se,
                             vnoise(vec2f(walong * (0.08 + 0.04 * se), wperp * (0.75 + 1.10 * se))));
      let foamP = smoothstep(0.32, 0.72, fbm(in.world.xz * 3.2 + vec2f(su.time * 0.30, su.time * 0.10), 3));
      f *= smoothstep(0.10, 0.6, steep) * (0.25 + 0.75 * vnoise(in.world.xz * 1.5 + vec2f(su.time * 0.25, 0.0)))
           * (0.18 + 0.82 * streak) * (0.55 + 0.85 * se);
      f = smoothstep(0.14, 0.75, pow(clamp(f, 0.0, 1.0), 1.6));
      f *= (0.35 + 0.65 * foamP) * clamp(1.0 - dist / 320.0, 0.0, 1.0);
      // #462 item 1 — foam edges close-up: crest foam read as painted blobs.
      // Where the surface drops along the wind it is the wave's lee face
      // (kw < 0): foam born on the crest dissolves down that slope, and its
      // edge breaks into sub-meter ripples before vanishing. Both effects ride
      // det, so distant foam stays unaliased; windward faces keep the cap.
      let kw = (gx0c + 0.7 * gx1c) * wdir.x + (gz0c + 0.7 * gz1c) * wdir.y;
      let leeK = smoothstep(${FOAM_LEE[0]}, ${FOAM_LEE[1]}, -kw) * det;
      let rip = smoothstep(0.30, 0.62, fbm(in.world.xz * ${FOAM_FINE} + vec2f(walong * 0.5, wperp * 0.5), 2));
      f *= mix(1.0, 1.0 - ${FOAM_LEE[2]}, leeK) * mix(1.0, 0.35 + 1.3 * rip, leeK);
      let Ldir = normalize(g_sun * g_day + g_moon * g_night);
      let foamLit = mix(g_foamC, vec3f(0.72, 0.75, 0.78), s * 0.45)
                  * (0.30 + 0.70 * (0.25 + 0.75 * max(dot(n, Ldir), 0.0)))
                  * mix(0.38, 1.0, g_day) * (1.0 - 0.30 * cc);
      col = mix(col, foamLit, f);
      let fogD = normalize(vec3f(in.world.x - su.camPos.x, 0.0, in.world.z - su.camPos.z));
      let haze = skyColor(vec3f(fogD.x, 0.012, fogD.z), su.time);
      let fogF = 1.0 - exp(-pow(max(dist - 30.0, 0.0) / 250.0, 2.0));
      col = mix(col, haze, clamp(fogF, 0.0, 1.0));
      return vec4f(tonemap(col), 1.0);
    }`;

  const M_SKY = `
    struct SkyU {
      fwd: vec3f, aspect: f32,
      right: vec3f, tanF: f32,
      up: vec3f, time: f32,
      storm: f32, p0: f32, p1: f32, p2: f32,
      sky: vec4f,
      sunD: vec4f,
      moonD: vec4f,
    };
    @group(0) @binding(0) var<uniform> ku: SkyU;
    struct VOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
    @vertex
    fn vs_sky(@location(0) vid: vec2f) -> VOut {
      var o: VOut;
      o.pos = vec4f(vid, 0.5, 1.0);
      o.uv = vid;
      return o;
    }
    @fragment
    fn fs_sky(in: VOut) -> @location(0) vec4f {
      g_storm = ku.storm;
      g_tod = ku.sky.x; g_cloud = ku.sky.y; g_day = ku.sky.z; g_night = ku.sky.w;
      g_aurora = ku.p1;
      g_sun = normalize(ku.sunD.xyz);
      g_moon = normalize(ku.moonD.xyz);
      setupSkyPal(g_tod, g_storm);
      let dir = normalize(ku.fwd + ku.right * (in.uv.x * ku.aspect * ku.tanF) + ku.up * (in.uv.y * ku.tanF));
      var c = skyColor(dir, ku.time);
      c = mix(c * 0.55, c, smoothstep(-0.12, 0.05, dir.y));
      return vec4f(tonemap(c), 1.0);
    }`;

  const modSea = mkMod(M_SEA), modSky = mkMod(M_SKY);

    { binding: 2, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT, texture: { sampleType: 'float' } },
    { binding: 3, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT, texture: { sampleType: 'float' } },
    { binding: 4, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT, texture: { sampleType: 'float' } },

    { binding: 1, resource: samp },
    { binding: 2, resource: resH[0] },
    { binding: 3, resource: { buffer: probeBuf } },

  const eye = [cam.pos[0], cam.pos[1], cam.pos[2]];

  const gridVerts = new Float32Array((SEG + 1) * (SEG + 1) * 2);
  { let k = 0;
    for (let j = 0; j <= SEG; j++) for (let i = 0; i <= SEG; i++) {

  { let k = 0;

      const a = j * (SEG + 1) + i, b = a + 1, c = a + SEG + 1, d = c + 1;

  // Each star is a small constant-SCREEN-size quad (pixel offset in NDC, so it does not
  // swell with depth), additive, depth-tested so the sea occludes low stars. Positions come
  // from the Yale BSC via local sidereal time (rotates with the tod slider).
  const STAR_RADIUS = 900;
  const M_STAR = `
    struct StarU { vp: mat4x4f, radius: f32, px: f32, py: f32, time: f32, night: f32, cloud: f32, p0: f32, p1: f32 };
    @group(0) @binding(0) var<uniform> u: StarU;
    struct SOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f, @location(1) col: vec3f, @location(2) att: f32, @location(3) tw: f32, @location(4) gain: f32 };
    @vertex
    fn vs_star(@location(0) corner: vec2f, @location(1) d4: vec4f, @location(2) c4: vec4f, @location(3) g1: f32) -> SOut {
      // #608: reflected batch mirrors each direction in the horizon plane (p0=1)
      // and rides the sea: dimmer (p1), vertically smeared into glitter, wobbled
      // by a per-star ripple, scintillating faster than the sky copy.
      let refl = u.p0;
      let dir = vec3f(d4.x, mix(d4.y, -d4.y, refl), d4.z);
      let center = dir * u.radius;
      let cc = u.vp * vec4f(center, 1.0);
      var o: SOut;
      o.col = c4.rgb;
      o.gain = g1;
      let twSlow = 0.72 + 0.28 * sin(u.time * (1.5 + 2.5 * fract(c4.w * 17.0)) + c4.w * 43.0);
      let twFast = 0.55 + 0.45 * sin(u.time * (5.5 + 7.0 * fract(c4.w * 7.0)) + c4.w * 29.0);
      o.tw = mix(twSlow, twFast, refl);
      let att = smoothstep(0.02, 0.18, d4.y);   // fade out at the horizon (d4.y = up factor)
      o.att = mix(att, att * u.p1, refl);
      if (cc.w <= 0.0) { o.pos = vec4f(3.0, 3.0, 1.0, 1.0); o.uv = vec2f(0.0); o.att = 0.0; return o; }
      let ndc = cc.xyz / cc.w;
      let ph = c4.w * 43.0;
      let jit = refl * sin(u.time * 3.1 + ph) * (1.5 + 2.5 * sin(u.time * 1.3 + ph * 0.7)) * (2.0 / u.px);
      let ox = corner.x * d4.w * mix(1.0, 0.8, refl) * (2.0 / u.px) + jit;
      let oy = corner.y * d4.w * mix(1.0, 3.2, refl) * (2.0 / u.py);
      o.pos = vec4f(ndc.x + ox, ndc.y + oy, ndc.z, 1.0);
      o.uv = corner;
      return o;
    }

    fn fs_star(in: SOut) -> @location(0) vec4f {
      let r = length(in.uv);
      if (r > 1.0) { discard; }
      let core = smoothstep(0.60, 0.0, r);
      let fall = pow(1.0 - r, 2.0);
      let b = in.att * in.tw * in.gain * u.night * (1.0 - 0.92 * u.cloud);
      return vec4f(in.col * (0.5 + 1.1 * core) * fall * b, 1.0);
    }
  `;

  // Meteors reuse the SAME instanced star billboard pass (and its #608 reflected

  // star, scales with nightfall without extra uniform plumbing, and reflects faintly
  // on the water for free. Each meteor is a short trail of round billboards laid
  // along a near-great-circle path: bright head → dim tail. The count of concurrent
  // meteors tracks the slider (0 => none: the sky is byte-identical to pre-#609),
  // so "on" always shows at least one streak and "off" shows none — provable.
  const METEOR_MAX = 6, METEOR_TRAIL = 16, METEOR_LEN = 0.16;   // rad of trail arc
  const meteorPool = [];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const dirFromAltAz = (alt, az) => {           // alt/az (rad) -> unit ENU
    const cA = Math.cos(alt);
    return [Math.sin(az) * cA, Math.sin(alt), Math.cos(az) * cA];
  };
  const spawnMeteor = () => {
    const alt = rnd(0.5, 1.2);                  // 29°..69°: high sky, clear of the horizon
    const az = rnd(0, Math.PI * 2);
    const head = dirFromAltAz(alt, az);
    const des = rnd(0.35, 0.8);                // descent angle from horizontal
    const hh = az + rnd(-1.1, 1.1);           // heading across the sky
    let vel = [Math.cos(hh) * Math.cos(des), -Math.sin(des), Math.sin(hh) * Math.cos(des)];
    const vl = Math.hypot(vel[0], vel[1], vel[2]); vel = vel.map(v => v / vl);
    const life = rnd(0.7, 1.5);
    return { head, vel, life, maxLife: life, speed: rnd(0.28, 0.55), br: rnd(1.4, 2.6), sizePx: rnd(2.4, 3.6) };
  };
  // advance meteors to `dt` and lay down the frame's trail instances after the
  // static sky (n). Returns the total instance count written into starInstArr.
  function emitMeteors(dt, n) {
    const want = shoot > 0.0001 ? Math.max(1, Math.round(shoot * METEOR_MAX)) : 0;
    while (meteorPool.length < want) meteorPool.push(spawnMeteor());
    while (meteorPool.length > want) meteorPool.pop();
    let m = n;
    for (const mt of meteorPool) {
      mt.life -= dt;
      if (mt.life <= 0) { Object.assign(mt, spawnMeteor()); }
      const env = Math.min(1, mt.life * 5, (mt.maxLife - mt.life) * 8);   // quick fade in/out
      for (let j = 0; j < METEOR_TRAIL; j++) {
        const t = j / (METEOR_TRAIL - 1);
        const back = METEOR_LEN * t;
        let px = mt.head[0] - mt.vel[0] * back, py = mt.head[1] - mt.vel[1] * back, pz = mt.head[2] - mt.vel[2] * back;
        px -= mt.vel[0] * mt.speed * (mt.maxLife - mt.life);   // sweep the whole streak across the sky
        py -= mt.vel[1] * mt.speed * (mt.maxLife - mt.life);
        pz -= mt.vel[2] * mt.speed * (mt.maxLife - mt.life);
        const pl = Math.hypot(px, py, pz) || 1;
        const inv = 1 / pl;
        if (py * inv <= 0.02) continue;                         // keep the trail above the horizon
        const o = m * 9;
        starInstArr[o] = px * inv; starInstArr[o + 1] = py * inv; starInstArr[o + 2] = pz * inv;
        starInstArr[o + 3] = mt.sizePx * (1 - 0.72 * t) * dprCap;
        starInstArr[o + 4] = 1; starInstArr[o + 5] = 0.97; starInstArr[o + 6] = 0.92; starInstArr[o + 7] = j * 0.11;
        starInstArr[o + 8] = mt.br * env * Math.pow(1 - t, 1.7);   // head bright, tail dim
        m++;
      }
    }
    // advance the head along its path for the next frame
    for (const mt of meteorPool) {
      let hx = mt.head[0] + mt.vel[0] * mt.speed * dt, hy = mt.head[1] + mt.vel[1] * mt.speed * dt, hz = mt.head[2] + mt.vel[2] * mt.speed * dt;
      const hl = Math.hypot(hx, hy, hz) || 1;
      mt.head = [hx / hl, hy / hl, hz / hl];
    }
    return m;
  }

  // ---------- matrix helpers ----------
  function lookAt(eye, f, up) {
    const z = norm3([eye[0] - f[0], eye[1] - f[1], eye[2] - f[2]]);
    const x = norm3(cross(up, z));
    const y = cross(z, x);
    return [
      x[0], y[0], z[0], 0,
      x[1], y[1], z[1], 0,
      x[2], y[2], z[2], 0,
      -dot(x, eye), -dot(y, eye), -dot(z, eye), 1,
    ];
  }
  function persp(fovY, asp, near, far) {
    const t = 1 / Math.tan(fovY / 2);
    return [
      t / asp, 0, 0, 0,
      0, t, 0, 0,
      0, 0, (far + near) / (near - far), -1,
      0, 0, 2 * far * near / (near - far), 0,
    ];
  }
  function mul(a, b) {
    const o = new Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
    }
    return o;
  }
  const norm3 = v => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

  // ---------- input ----------
  const keys = new Set();
  const markTouch = () => { if (!cam.touched) { cam.touched = true; hud.style.opacity = '0.25'; } };
  addEventListener('keydown', e => { keys.add(e.code); markTouch(); if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault(); });
  addEventListener('keyup', e => keys.delete(e.code));
  let dragging = false, lastX = 0, lastY = 0;
  canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); markTouch(); });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    cam.yaw -= (e.clientX - lastX) * 0.0032;
    cam.pitch = Math.max(-1.3, Math.min(1.3, cam.pitch - (e.clientY - lastY) * 0.0028));
    lastX = e.clientX; lastY = e.clientY;
  });
  addEventListener('pointerup', () => { dragging = false; });

  // ---------- loop ----------
  let t = qs.get('t0') ? parseFloat(qs.get('t0')) : 8.0;
  let last = performance.now();
  let frames = 0;
  let vw = 0, vh = 0;
  let dprCap = 1;   // #704: render dpr — star sizes are CSS-px, scaled by this at draw time

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, LITE ? 1 : 1.75);
    dprCap = dpr;
    const w = Math.max(2, Math.floor(canvas.clientWidth * dpr));
    const h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
    if (w !== vw || h !== vh) {
      vw = w; vh = h; canvas.width = w; canvas.height = h;
      ctx.configure({ device, format, alphaMode: 'opaque' });
      if (depthTex) depthTex.destroy();
      depthTex = device.createTexture({ size: [w, h], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
      depthView = depthTex.createView();
    }
  }

  function frame() {
    resize();
    const now = performance.now();
    let dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    t += dt; frames++;

    const cp_ = Math.cos(cam.pitch), sp_ = Math.sin(cam.pitch);
    const fwd = [cp_ * Math.cos(cam.yaw), sp_, cp_ * Math.sin(cam.yaw)];
    const right = norm3(cross(fwd, [0, 1, 0]));
    const spd = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
    const str = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
    const ver = (keys.has('KeyE') ? 1 : 0) - (keys.has('KeyQ') ? 1 : 0);
    const turn = (keys.has('KeyJ') || keys.has('BracketLeft') ? 1 : 0) - (keys.has('KeyL') || keys.has('BracketRight') ? 1 : 0);
    if (keys.has('ArrowLeft')) cam.yaw += 0.9 * dt;
    if (keys.has('ArrowRight')) cam.yaw -= 0.9 * dt;
    if (turn) cam.yaw += turn * 0.9 * dt;
    let move = spd * 6 + (cam.touched ? 0 : 1.6);
    cam.pos[0] += (fwd[0] * move + right[0] * str * 6) * dt;
    cam.pos[1] = Math.max(1.2, cam.pos[1] + ver * 5 * dt);
    cam.pos[2] += (fwd[2] * move + right[2] * str * 6) * dt;

    // #462 item 4 — couple the eye to the local swell at camPos: bob with the
    // height, roll/pitch with the patch slope. The probe readback lags ~2 frames,
    // so smooth toward the newest sample; the rendered sea state (and hence the
    // wave amplitude) scales the motion — calm reads still, storm throws the eye.
    if (swellTarget) {
      const k = 1 - Math.exp(-dt / SWELL_TAU);
      swell.h += (swellTarget.h - swell.h) * k;
      swell.pitch += (swellTarget.pitch - swell.pitch) * k;
      swell.roll += (swellTarget.roll - swell.roll) * k;
      swellTarget = null;
    }
    eye[0] = cam.pos[0]; eye[1] = cam.pos[1] + swell.h; eye[2] = cam.pos[2];
    const cpv = Math.cos(cam.pitch + swell.pitch), spv = Math.sin(cam.pitch + swell.pitch);
    const vfwd = [cpv * Math.cos(cam.yaw), spv, cpv * Math.sin(cam.yaw)];
    const vright = norm3(cross(vfwd, [0, 1, 0]));
    const vup0 = cross(vright, vfwd);
    const vup = [
      vup0[0] * Math.cos(swell.roll) + vright[0] * Math.sin(swell.roll),
      vup0[1] * Math.cos(swell.roll) + vright[1] * Math.sin(swell.roll),
      vup0[2] * Math.cos(swell.roll) + vright[2] * Math.sin(swell.roll),
    ];
    const asp = vw / Math.max(1, vh);
    const vp = mul(persp(62 * Math.PI / 180, asp, 0.2, 2500), lookAt(eye, [eye[0] + vfwd[0], eye[1] + vfwd[1], eye[2] + vfwd[2]], vup));

    // ease the rendered sea state toward the slider set point over ~1s (no hard
    // cut, #462 item 6); re-fill the spectra while it moves so wave amplitude tracks
    storm += (stormTarget - storm) * (1 - Math.exp(-dt / STORM_TAU));
    if (Math.abs(stormTarget - storm) < 0.0015) storm = stormTarget;
    if (Math.abs(storm - lastStorm) > 0.001) needSpec = true;
    lastStorm = storm;
    // #612 — the aurora eases like the meteors (#609): nudging the slider ramps the
    // curtains over ~1s instead of cutting.
    aurora += (auroraTarget - aurora) * (1 - Math.exp(-dt / 0.35));
    if (Math.abs(auroraTarget - aurora) < 0.0015) aurora = auroraTarget;
    const s = storm;
    // #462 item 3 — the gust signal (see GUST_AMP): gf scales wave heights,
    // gust (pre-scaled by sea state) nudges wind speed + foam in the shader.
    const gust = GUST_AMP * s * gustSignal(t);
    const gf = 1 + gust;
    gustV = gust; gfV = gf;
    const U = windU() * gf;
    advPhase += U * dt;
    windLbl.textContent = Math.round(U) + ' m/s';
    const pp = seaParams(s);
    const sunEl = lerpKeys(SUN_EL_K, tod);
    const moonEl = lerpKeys(MOON_EL_K, tod);
    const sunDir = [Math.cos(sunEl), Math.sin(sunEl), 0];
    const moonDir = [Math.cos(moonEl), Math.sin(moonEl), 0];
    const dayness = smooth01((sunEl + 0.06) / 0.10);
    const nightness = 1 - dayness;
    const refilling = needSpec;
    if (refilling) {
      needSpec = false;
      for (let i = 0; i < 2; i++) {
        device.queue.writeBuffer(uFill[i], 0, new Float32Array([OCT[i].L, pp[i].A, OCT[i].kc, WIND_AZ, SEED + i * 101, pp[i].spread, KMAX[i]]));
      }
    }

    device.queue.writeBuffer(uSea, 0, new Float32Array([
      ...vp,
      eye[0], eye[1], eye[2], t,
      vfwd[0], vfwd[1], vfwd[2], asp,
      vright[0], vright[1], vright[2], 0,
      OCT[0].L, pp[0].dsp, advPhase, aurora,
      OCT[1].L, pp[1].dsp, 0, 0,
      U, s, WIND_AZ, gust,
      tod, cloud, dayness, nightness,
      sunDir[0], sunDir[1], sunDir[2], 0,
      moonDir[0], moonDir[1], moonDir[2], 0,
    ]));
    device.queue.writeBuffer(uSky, 0, new Float32Array([
      vfwd[0], vfwd[1], vfwd[2], asp,
      vright[0], vright[1], vright[2], Math.tan(31 * Math.PI / 180),
      vup[0], vup[1], vup[2], t, s, 0, aurora, 0,
      tod, cloud, dayness, nightness,
      sunDir[0], sunDir[1], sunDir[2], 0,
      moonDir[0], moonDir[1], moonDir[2], 0,
    ]));

    // real stars: rebuild this frame's billboards from the catalog at LST(date, tod)
    {
      const lst = lstDeg(tod) * Math.PI / 180;
      const sinP = Math.sin(PHI), cosP = Math.cos(PHI);
      let n = 0;
      for (const st of STAR_D) {
        const a = st.ra * Math.PI / 180, d = st.dec * Math.PI / 180, H = lst - a;
        const cD = Math.cos(d);
        const E = -cD * Math.sin(H);
        const N = Math.sin(d) * cosP - cD * sinP * Math.cos(H);
        const Uu = Math.sin(d) * sinP + cD * cosP * Math.cos(H);
        if (Uu <= 0.0) continue;                 // below the horizon
        const inv = 1 / Math.hypot(E, N, Uu);
        const o = n * 9;
        starInstArr[o] = E * inv; starInstArr[o + 1] = Uu * inv; starInstArr[o + 2] = N * inv; starInstArr[o + 3] = st.sizePx * dprCap;
        starInstArr[o + 4] = st.c[0]; starInstArr[o + 5] = st.c[1]; starInstArr[o + 6] = st.c[2]; starInstArr[o + 7] = st.tw; starInstArr[o + 8] = st.gain;
        n++;
      }
      starInstCount = n;
      staticStarCount = n;
      // #609: ease the rendered meteor rate toward the slider, then append the live
      // meteor trails after the static sky. With shoot=0 nothing is appended, so the
      // instance buffer / count / draw is identical to the pre-#609 night sky.
      shoot += (shootTarget - shoot) * (1 - Math.exp(-dt / 0.35));
      if (Math.abs(shootTarget - shoot) < 0.0015) shoot = shootTarget;
      const total = emitMeteors(dt, n);
      starInstCount = total;
      if (total) device.queue.writeBuffer(starInstBuf, 0, starInstArr.subarray(0, total * 9));
      curNight = nightness;
      device.queue.writeBuffer(uStar, 0, new Float32Array([
        ...vp, STAR_RADIUS, vw, vh, t, nightness, cloud, 0, 0,
      ]));
      // #608: reflected star glints — brighter skies give brighter water; a rough
      // sea scatters them away (mirrors break up, same story as the moon glitter).
      curReflK = nightness > 0.02 ? 0.42 * (1.0 - 0.5 * s) : 0;
      device.queue.writeBuffer(uStarR, 0, new Float32Array([
        ...vp, STAR_RADIUS, vw, vh, t, nightness, cloud, 1, curReflK,
      ]));
    }

    // #462 item 4 — feed the swell probe (camPos + view axes XZ in oct-0 domain,
    // sample radius PROBE_R); only written on a probe frame (see readback below).
    if (!probeBusy) device.queue.writeBuffer(uProbe, 0, new Float32Array([
      cam.pos[0], cam.pos[2], fwd[0], fwd[2], right[0], right[2], PROBE_R, OCT[0].L,
    ]));

    const enc = device.createCommandEncoder();
    if (refilling) {
      for (let i = 0; i < 2; i++) {
        const fp = enc.beginComputePass();
        fp.setPipeline(pFill); fp.setBindGroup(0, bgFill[i]);
        fp.dispatchWorkgroups(1, 16, 1);
        fp.end();
      }
    }
    for (let oi = 0; oi < 2; oi++) {
      // #462 item 3 — the gust rides ONLY the height encoder: the displacement
      // spectra (fi 1/2) keep their calibrated amplitude so the mesh Jacobian
      // margin oceanfold proves (+0.12 at storm) is untouched.
      device.queue.writeBuffer(uEnc[oi][0], 0, new Float32Array([0, pp[oi].amp * gf, 0, 0]));
      // chop is already baked into the displacement spectra by cs_prep (× chop·k) —
      // multiplying the encoder amp by chop too applied it twice.
      device.queue.writeBuffer(uEnc[oi][1], 0, new Float32Array([1, pp[oi].amp, 0, 0]));
      device.queue.writeBuffer(uEnc[oi][2], 0, new Float32Array([2, pp[oi].amp, 0, 0]));
      for (const fi of [0, 1, 2]) {
        device.queue.writeBuffer(uPrep[oi][fi], 0, new Float32Array([t, OCT[oi].L, OCT[oi].chop, fi]));
        let p = enc.beginComputePass(); p.setPipeline(pPrep); p.setBindGroup(0, bgPrep[oi][fi]); p.dispatchWorkgroups(1, 16, 1); p.end();
        p = enc.beginComputePass(); p.setPipeline(pRow); p.setBindGroup(0, bgRow); p.dispatchWorkgroups(1, 16, 1); p.end();
        p = enc.beginComputePass(); p.setPipeline(pCol); p.setBindGroup(0, bgCol); p.dispatchWorkgroups(16, 1, 1); p.end();
        p = enc.beginComputePass(); p.setPipeline(pEnc); p.setBindGroup(0, bgEnc[oi][fi]); p.dispatchWorkgroups(1, 16, 1); p.end();
      }
      {
        const p = enc.beginComputePass(); p.setPipeline(pComb); p.setBindGroup(0, bgComb[oi]); p.dispatchWorkgroups(1, 16, 1); p.end();
      }
    }
    // #462 item 4 — dispatch the swell probe + copy its 5 samples out, only on a
    // probe frame so the busy-flagged readback below stays in lockstep (~2-frame lag).
    if (!probeBusy) {
      const ppProbe = enc.beginComputePass(); ppProbe.setPipeline(pProbe); ppProbe.setBindGroup(0, bgProbe); ppProbe.dispatchWorkgroups(1, 1, 1); ppProbe.end();
      enc.copyBufferToBuffer(probeBuf, 0, probeRead, 0, 20);
    }
    const rp = enc.beginRenderPass({ colorAttachments: [{
      view: ctx.getCurrentTexture().createView(),
      clearValue: { r: 0.05, g: 0.04, b: 0.08, a: 1 }, loadOp: 'clear', storeOp: 'store',
    }], depthStencilAttachment: { view: depthView, loadOp: 'clear', storeOp: 'discard', depthLoadOp: 'clear', depthStoreOp: 'discard', depthClearValue: 1.0 } });
    rp.setPipeline(skyPipeline); rp.setBindGroup(0, bgSky);
    rp.setVertexBuffer(0, skyVBuf); rp.draw(3);
    if (starInstCount > 0) {
      rp.setPipeline(starPipeline); rp.setBindGroup(0, bgStar);
      rp.setVertexBuffer(0, starCornerBuf); rp.setVertexBuffer(1, starInstBuf);
      rp.setIndexBuffer(starIdxBuf, 'uint32');
      rp.drawIndexed(starIdx.length, starInstCount, 0, 0);
    }
    rp.setPipeline(seaPipeline); rp.setBindGroup(0, bgSea);
    rp.setVertexBuffer(0, vtxBuf); rp.setIndexBuffer(idxBuf, 'uint32');
    rp.drawIndexed(gridIdx.length);
    if (starInstCount > 0 && curReflK > 0.001) {
      rp.setPipeline(starReflPipeline); rp.setBindGroup(0, bgStarR);
      rp.setVertexBuffer(0, starCornerBuf); rp.setVertexBuffer(1, starInstBuf);
      rp.setIndexBuffer(starIdxBuf, 'uint32');
      rp.drawIndexed(starIdx.length, starInstCount, 0, 0);
    }
    rp.end();
    device.queue.submit([enc.finish()]);
    // #462 item 4 — async readback (no fence, no stall): center height -> bob,
    // fwd slope -> pitch, right slope -> roll; the frame body smooths it into swell.
    if (!probeBusy) {
      probeBusy = true;
      probeRead.mapAsync(GPUMapMode.READ).then(() => {
        const a = new Float32Array(probeRead.getMappedRange().slice(0, 20));
        probeRead.unmap();
        swellTarget = {
          h: a[0],
          pitch: Math.atan2(a[2] - a[1], 2 * PROBE_R),
          roll: Math.atan2(a[4] - a[3], 2 * PROBE_R),
        };
        probeBusy = false;
      }).catch(() => { probeBusy = false; });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  async function readTex(t) {
    const b = device.createBuffer({ size: 32 * 32 * 8, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const e = device.createCommandEncoder();
    e.copyTextureToBuffer({ texture: t, origin: [0, 0] }, { buffer: b, bytesPerRow: 32 * 8 }, { width: 32, height: 32 });
    device.queue.submit([e.finish()]);
    await b.mapAsync(GPUMapMode.READ);
    const a = new Float32Array(b.getMappedRange().slice(0));
    b.unmap(); b.destroy();
    let m = 0; for (const v of a) m += v; m /= a.length;
    let vr = 0, mx = 0; for (const v of a) { vr += (v - m) * (v - m); mx = Math.max(mx, Math.abs(v)); }
    return { mean: +m.toFixed(4), var: +(vr / a.length).toExponential(2), maxAbs: +mx.toFixed(3) };
  }

  window.__oceanTest = {
    ready: true,
    probe: async () => ({
      spec: await readTex(spec[0]),
      resH: await readTex(resH[0]),
      resGX: await readTex(resG[0]),
    }),
    get frames() { return frames; },
    get time() { return t; },
    get storm() { return storm; },
    get tod() { return tod; },
    get cloud() { return cloud; },
    get shoot() { return shootTarget; },
    get aurora() { return aurora; },
    get auroraTarget() { return auroraTarget; },
    get wind() { return windU(); },
    swell() { return { h: eye[1] - cam.pos[1], pitch: swell.pitch, roll: swell.roll, storm }; },
    gust() { return { raw: gustV, factor: gfV, storm, wind: windU() * gfV }; },
    setStorm(v) { setStorm(v); },
    setTod(v) { setTod(v); },
    setCloud(v) { setCloud(v); },
    setShoot(v) { setShoot(v); },
    setAurora(v) { setAurora(v); },
    auroraState() {
      return { value: +aurora.toFixed(3), target: +auroraTarget.toFixed(3), night: +curNight.toFixed(3), cloud };
    },
    setPose(p) {
      if (p.pos) cam.pos = p.pos.slice();
      if (typeof p.yaw === 'number') cam.yaw = p.yaw;
      if (typeof p.pitch === 'number') cam.pitch = p.pitch;
      cam.touched = true;
    },
    async stats() {
      const enc = device.createCommandEncoder();
      enc.copyTextureToBuffer({ texture: resH[0], origin: [0, 0] }, { buffer: statBuf, bytesPerRow: 32 * 8 }, { width: 32, height: 32 });
      device.queue.submit([enc.finish()]);
      await statBuf.mapAsync(GPUMapMode.READ);
      const a = new Float32Array(statBuf.getMappedRange().slice(0));
      statBuf.unmap();
      let m = 0; for (const v of a) m += v; m /= a.length;
      let vr = 0; for (const v of a) vr += (v - m) * (v - m); vr /= a.length;
      return { mean: m, variance: vr, frames, time: t };
    },
    async gustVar() {
      const enc = device.createCommandEncoder();
      enc.copyTextureToBuffer({ texture: resH[0], origin: [0, 0] }, { buffer: gustBuf, bytesPerRow: NI * 8 }, { width: NI, height: NI });
      device.queue.submit([enc.finish()]);
      await gustBuf.mapAsync(GPUMapMode.READ);
      const a = new Float32Array(gustBuf.getMappedRange().slice(0));
      gustBuf.unmap();
      let m = 0; for (const v of a) m += v; m /= a.length;
      let vr = 0; for (const v of a) vr += (v - m) * (v - m); vr /= a.length;
      return vr;
    },
    meteors() {
      return {
        rate: +shoot.toFixed(3), target: +shootTarget.toFixed(3),
        active: meteorPool.length, cap: METEOR_MAX, trail: METEOR_TRAIL,
        statics: staticStarCount, uploaded: starInstCount,
        trailInstances: starInstCount - staticStarCount,
        reflect: +curReflK.toFixed(3),
      };
    },
    stars() {
      const lst = lstDeg(tod) * Math.PI / 180;
      const sinP = Math.sin(PHI), cosP = Math.cos(PHI);
      const toDir = (ra, dec) => {
        const a = ra * Math.PI / 180, d = dec * Math.PI / 180, H = lst - a;
        const cD = Math.cos(d);
        const E = -cD * Math.sin(H);
        const N = Math.sin(d) * cosP - cD * sinP * Math.cos(H);
        const Uu = Math.sin(d) * sinP + cD * cosP * Math.cos(H);
        const inv = 1 / Math.hypot(E, N, Uu);
        const alt = Math.asin(Uu) * 180 / Math.PI;
        const az = (Math.atan2(E, N) * 180 / Math.PI + 360) % 360;
        return { dir: [E * inv, Uu * inv, N * inv], alt: +alt.toFixed(2), az: +az.toFixed(2), above: Uu > 0 };
      };
      const find = (ra, dec) => { let best = null, bd = 1e9; for (const s of SKY.BSC) { const dx = s[0] - ra, dy = s[1] - dec, dd = dx * dx + dy * dy; if (dd < bd) { bd = dd; best = s; } } return best; };
      const wrap = (ra, dec) => { const s = find(ra, dec); return s ? { ra: s[0], dec: s[1], mag: s[2], ...toDir(s[0], s[1]) } : null; };
      const named = {};
      for (const [k, v] of Object.entries({ sirius: [101.29, -16.72], polaris: [37.95, 89.26], vega: [279.24, 38.78], arcturus: [213.92, 19.18], capella: [79.17, 46.0], canopus: [95.99, -52.7] })) named[k] = wrap(v[0], v[1]);
      named.dipper = {};
      for (const [k, v] of Object.entries({ dubhe: [165.93, 61.75], merak: [165.46, 56.38], phecda: [178.46, 53.69], megrez: [183.86, 57.03], alioth: [193.51, 55.96], mizar: [200.98, 54.93], alkaid: [206.89, 49.31] })) named.dipper[k] = wrap(v[0], v[1]);
      named.orion = {};
      for (const [k, v] of Object.entries({ betelgeuse: [88.79, 7.41], rigel: [78.63, -8.2], bellatrix: [81.28, 6.35], mintaka: [83.0, -0.3], alnilam: [84.05, -1.2], alnitak: [85.19, -1.94], saiph: [86.94, -9.67] })) named.orion[k] = wrap(v[0], v[1]);
      return {
        count: SKY.BSC.length, mwCount: SKY.MILKY.length, lat: SKY.LAT_DEG,
        lstDeg: +((((lst * 180 / Math.PI) % 360) + 360) % 360).toFixed(1),
        lonDeg: +LON_DEG.toFixed(3), date: QS_DATE ?? localIso(skyDate()), timeSpan: TIME_SPAN,
        night: +curNight.toFixed(3), uploaded: starInstCount, reflect: +curReflK.toFixed(3),
        starMinCss: STAR_MIN, starMaxCss: +(STAR_MIN + STAR_RANGE).toFixed(2), mwSizeCss: MW_SIZE, mwGain: MW_GAIN, dprCap: +dprCap.toFixed(3),
        pole: [0, +Math.sin(PHI).toFixed(4), +Math.cos(PHI).toFixed(4)],
        named,
      };
    },
  };
}
