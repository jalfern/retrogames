<!DOCTYPE html>
<!--
  Koi Pond (ukiyo-e demo)
  ===================================================================
  A tap-to-ripple koi pond: 7 real-variety koi (Kohaku, Sanke, Showa, Asagi,
  Ogon, Tancho, Bekko) drift in loose flocking under a painted ukiyo-e water
  surface. Tapping the pond drops a ripple; the koi startle and tuck under
  lily pads (some hide until you tap again). Pads bloom flowers; a turtle
  surfaces now and then with a gentle wake; a frog sits on the stone rim and
  occasionally hops. Garden: maple tree, bridge edge, stone rim, paper grain
  and double-rule ink frame.
  How it works: 1200px-wide design space. Landscape (wider than the design
  aspect) is letterboxed and scaled to the window; portrait fills the width
  and adapts the design height so the pond and garden stretch to the frame,
  never leaving a blank band. DPR-aware canvas; Web Audio soft splash; DEV
  hook window.__koiTest with `ready`, `frames`, `tapAt`, `koi()`.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Koi Pond — ukiyo-e demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#efe6d3; }
  #stage { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:pointer; }
  #hud {
    position:fixed; left:max(12px, env(safe-area-inset-left)); bottom:max(12px, env(safe-area-inset-bottom));
    z-index:5; max-width:66vw; font:10px/1.7 Georgia, serif; letter-spacing:.14em; text-transform:uppercase;
    color:#3a2f24; background:rgba(240,232,214,.82); border:1px solid #2b2b35;
    border-radius:999px; padding:8px 14px; pointer-events:none; transition:opacity 1.2s;
    box-shadow:0 2px 0 rgba(20,24,38,.25);
  }
  #hud.gone { opacity:0; }
  @media (max-width: 640px) {
    #hud { font-size: 9px; letter-spacing:.1em; max-width: 62vw; }
  }
  #sound { position:fixed; right:14px; top:14px; z-index:3; display:flex; gap:8px; }
  #hud.night { color:#f3d9ae; background:rgba(24,26,52,.82); border-color:#4a3a24; box-shadow:0 2px 0 rgba(0,0,0,.5); }
  #chips { position:fixed; left:max(12px, env(safe-area-inset-left)); top:max(12px, env(safe-area-inset-top)); z-index:6; display:flex; gap:8px; }
  #chips button { font:10px/1 Georgia, serif; letter-spacing:.12em; text-transform:uppercase; color:#e8d9b4;
    background:rgba(26,28,50,.82); border:1px solid #6b5636; border-radius:999px; padding:7px 12px; cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.45); transition:all .15s; }
  #chips button[aria-pressed="true"] { color:#1e1608; background:#f3d9ae; border-color:#f3d9ae; }
  #chips button:focus-visible { outline:2px solid #f3d9ae; outline-offset:2px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud">tap the pond</div>
<script>
(() => {
'use strict';
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const hintEl = document.getElementById('hud');

// ---------- lantern night mode (#3779) ----------
// ?style=lantern boots the night skin (darkened garden, stars + moon,
// normal-mapped pond floor, sprite-stacked koi); L or the LANTERN chip toggles.
// Day mode is the default and is byte-identical to the pre-lantern build.
const urlParams = new URLSearchParams(location.search);
let style = (urlParams.get('style') === 'lantern' || urlParams.get('normalmap') === '1') ? 'lantern' : 'day';
let normalMode = urlParams.get('normalmap') === '1';
const lanternMode = () => style === 'lantern';
// tiny colour helpers for the night render (day paths untouched)
function hexRGB(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixRGB(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function mulRGB(a, m) { return [a[0] * m, a[1] * m, a[2] * m]; }
function rgbStr(a) { return `rgb(${Math.round(a[0])},${Math.round(a[1])},${Math.round(a[2])})`; }

// ---------- sizing / coordinate model ----------
let VW = 0, VH = 0, DPR = 1, S = 1, OX = 0, OY = 0;
const DESIGN_H0 = 1400; // reference design height (landscape); portrait adapts
let H = DESIGN_H0, K = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = Math.round(VW * DPR); canvas.height = Math.round(VH * DPR);
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (VW / VH < 1200 / DESIGN_H0) {
    // portrait / skinny: design fills the width; height adapts. Nothing
    // letterboxed, nothing blank — the garden and pond stretch to the frame.
    S = VW / 1200;
    H = VH / S;
    OX = 0; OY = 0;
  } else {
    H = DESIGN_H0;
    S = Math.min(VW / 1200, VH / DESIGN_H0);
    OX = (VW - 1200 * S) / 2; OY = (VH - DESIGN_H0 * S) / 2;
  }
  K = H / DESIGN_H0;
  computeLayout();
  syncLanterns();
}
window.addEventListener('resize', resize);

// ---------- layout (design units, origin top-left of screen, 1200xH design) ----------
const L = {};
function computeLayout() {
  const w = 1200, h = H;
  const horizon = h * 0.28;           // bridge band bottom edge
  L.w = w; L.h = h;
  L.horizon = horizon;
  L.pond = { cx: w * 0.5, cy: h * 0.60, rx: w * 0.40, ry: h * 0.30 };
  L.bridge = { y: 0, h: horizon + 30 };
}
// pond path (slight organic wobble, fixed seed points)
function pondPath(c, wobble = 0) {
  const { cx, cy, rx, ry } = L.pond;
  c.beginPath();
  const N = 28;
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * Math.PI * 2;
    const wob = 1 + 0.06 * Math.sin(a * 3 + 1.2) + 0.04 * Math.sin(a * 5 + 3.1) + wobble;
    const x = cx + Math.cos(a) * rx * wob;
    const y = cy + Math.sin(a) * ry * wob;
    i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
  }
  c.closePath();
}
function pondPoint(t) {
  // t in 0..1 around the rim
  const { cx, cy, rx, ry } = L.pond;
  const a = t * Math.PI * 2 - Math.PI / 2;
  const wob = 1 + 0.06 * Math.sin(a * 3 + 1.2) + 0.04 * Math.sin(a * 5 + 3.1);
  return { x: cx + Math.cos(a) * rx * wob, y: cy + Math.sin(a) * ry * wob };
}
function inPond(x, y, margin = 0) {
  const { cx, cy, rx, ry } = L.pond;
  const wob = 1 + 0.06 * Math.sin(Math.atan2(y - cy, x - cx) * 3 + 1.2);
  const dx = (x - cx) / (rx * wob * (1 - margin)), dy = (y - cy) / (ry * wob * (1 - margin));
  return dx * dx + dy * dy < 1;
}

// ---------- ripples ----------
const ripples = [];
function addRipple(x, y, big = false) {
  ripples.push({ x, y, t: 0, max: big ? 2.1 : 1.5, rings: big ? 3 : 2, age: 0 });
}
function updateRipples(dt) {
  for (let i = ripples.length - 1; i >= 0; i--) {
    ripples[i].age += dt;
    ripples[i].t += dt / ripples[i].max;
    if (ripples[i].t >= 1) ripples.splice(i, 1);
  }
  if (ripples.length > 24) ripples.splice(0, ripples.length - 24);
}
function drawPadGlow() {
  pondPath(ctx); ctx.save(); ctx.clip();
  const night = lanternMode();
  for (const p of lilies) {
    const bobY = Math.sin(tNow * 1.1 + p.phase) * 3;
    const flick = night ? 0.85 + 0.15 * Math.sin(tNow * 2.7 + p.phase * 2.3) : 1;
    const glow = ctx.createRadialGradient(p.x, p.y + bobY, p.r * 0.15, p.x, p.y + bobY, p.r * 1.7);
    if (night) {
      glow.addColorStop(0, 'rgba(255,170,80,' + (0.34 * flick).toFixed(3) + ')');
      glow.addColorStop(1, 'rgba(255,160,70,0)');
    } else {
      glow.addColorStop(0, 'rgba(255,240,196,0.30)');
      glow.addColorStop(1, 'rgba(255,240,196,0)');
    }
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(p.x, p.y + bobY, p.r * 1.7, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawRipples() {
  for (const r of ripples) {
    for (let k = 0; k < r.rings; k++) {
      const tt = Math.min(1, Math.max(0, r.t - k * 0.16));
      if (tt <= 0) continue;
      const rad = 14 + tt * 150 * (r.rings === 3 ? 1.15 : 1);
      const a = (1 - tt) * 0.55;
      ctx.strokeStyle = lanternMode() ? `rgba(190,204,232,${a * 0.55})` : `rgba(238,244,236,${a})`;
      ctx.lineWidth = lanternMode() ? 2.2 * (1 - tt) + 0.9 : 3.4 * (1 - tt) + 1;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, rad, rad * 0.62, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

// ---------- water ----------
function drawPondBase() {
  // pond floor
  pondPath(ctx);
  const g = ctx.createRadialGradient(L.pond.cx, L.pond.cy, 40, L.pond.cx, L.pond.cy, L.pond.rx * 1.15);
  g.addColorStop(0, '#143b38');
  g.addColorStop(0.5, '#224f4a');
  g.addColorStop(0.8, '#2f6a5e');
  g.addColorStop(1, '#3d7a68');
  ctx.fillStyle = g; ctx.fill();
  ctx.save();
  pondPath(ctx); ctx.clip();
  // sandy floor speckles
  ctx.fillStyle = 'rgba(214,196,156,0.16)';
  for (let i = 0; i < 70; i++) {
    const a = (i * 2.39996) , rr = ((i * 97.3) % 1) * 0.9 + 0.08;
    const px = L.pond.cx + Math.cos(a) * L.pond.rx * rr;
    const py = L.pond.cy + Math.sin(a) * L.pond.ry * rr * 0.9;
    ctx.beginPath(); ctx.ellipse(px, py, 6 + (i % 3) * 3, 4 + (i % 4) * 2, a, 0, Math.PI * 2); ctx.fill();
  }
  // soft gradient bands (woodblock print-band feel)
  for (let i = 0; i < 4; i++) {
    const yy = L.pond.cy - L.pond.ry * 0.55 + i * L.pond.ry * 0.42;
    const bandH = L.pond.ry * 0.38;
    const band = ctx.createLinearGradient(0, yy - bandH / 2, 0, yy + bandH / 2);
    band.addColorStop(0, 'rgba(12,34,36,0)');
    band.addColorStop(0.5, `rgba(12,34,36,${0.18 - i * 0.025})`);
    band.addColorStop(1, 'rgba(12,34,36,0)');
    ctx.fillStyle = band;
    ctx.fillRect(0, yy - bandH / 2, L.w, bandH);
  }
  ctx.restore();
}
function drawWaterTint() {
  pondPath(ctx); ctx.save(); ctx.clip();
  // translucent water tint
  const tint = ctx.createLinearGradient(0, L.pond.cy - L.pond.ry, 0, L.pond.cy + L.pond.ry);
  tint.addColorStop(0, 'rgba(58,120,108,0.30)');
  tint.addColorStop(0.5, 'rgba(43,96,88,0.28)');
  tint.addColorStop(1, 'rgba(20,54,52,0.40)');
  ctx.fillStyle = tint; ctx.fillRect(0, 0, L.w, L.h);
  // refraction light bands (slow drift)
  ctx.save();
  ctx.globalAlpha = 0.10;
  for (let i = 0; i < 3; i++) {
    const yy = L.pond.cy - L.pond.ry * 0.4 + i * L.pond.ry * 0.5 + Math.sin(tNow * 0.35 + i * 2.1) * 10;
    ctx.fillStyle = '#dff0dc';
    ctx.beginPath();
    ctx.ellipse(L.pond.cx + Math.sin(tNow * 0.2 + i) * 30, yy, L.pond.rx * 0.9, 12 + i * 4, 0.06, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  // caustic-ish sparkle strokes
  ctx.save();
  ctx.globalAlpha = 0.10;
  ctx.strokeStyle = '#eef6e4'; ctx.lineWidth = 2;
  for (let i = 0; i < 26; i++) {
    const a = i * 2.39996 + 0.4;
    const px = L.pond.cx + Math.cos(a) * L.pond.rx * 0.82 * Math.sin(tNow * 0.7 + i);
    const py = L.pond.cy + Math.sin(a) * L.pond.ry * 0.8 + Math.cos(tNow * 0.9 + i * 1.3) * 8;
    ctx.beginPath(); ctx.moveTo(px - 12, py); ctx.quadraticCurveTo(px, py - 3, px + 12, py); ctx.stroke();
  }
  ctx.restore();
  // deep middle, gentler rim
  const edge = ctx.createRadialGradient(L.pond.cx, L.pond.cy, L.pond.rx * 0.05, L.pond.cx, L.pond.cy, L.pond.rx * 1.12);
  edge.addColorStop(0, 'rgba(8,22,26,0.42)');
  edge.addColorStop(0.55, 'rgba(8,22,26,0.18)');
  edge.addColorStop(1, 'rgba(8,22,26,0.06)');
  ctx.fillStyle = edge; ctx.fillRect(0, 0, L.w, L.h);
  ctx.restore();
  // ink rim
  pondPath(ctx);
  ctx.lineWidth = 6; ctx.strokeStyle = '#141a25'; ctx.stroke();
}


// ---------- garden (maple, bridge, stones) ----------
function drawMaple(x, y, scale) {
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  const INK = '#1b2230';
  // trunk
  ctx.fillStyle = '#5c4433';
  ctx.beginPath();
  ctx.moveTo(-22, 250); ctx.lineTo(-13, 120); ctx.lineTo(-4, 60); ctx.lineTo(10, 118); ctx.lineTo(24, 250);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.stroke();
  // branches
  ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(0, 130); ctx.quadraticCurveTo(-46, 84, -78, 52); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2, 108); ctx.quadraticCurveTo(38, 70, 64, 40); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2, 92); ctx.quadraticCurveTo(2, 40, 4, 4); ctx.stroke();
  // canopy blobs
  const leaves = [
    { x: -70, y: 44, r: 52, c: '#b5452c' },
    { x: -8, y: -18, r: 60, c: '#cf6b33' },
    { x: 58, y: 22, r: 48, c: '#a13a2b' },
    { x: 22, y: 74, r: 46, c: '#d98b3a' },
    { x: -38, y: 84, r: 40, c: '#c95e31' },
  ];
  for (const l of leaves) {
    ctx.fillStyle = l.c;
    ctx.beginPath();
    ctx.arc(l.x, l.y, l.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(27,34,48,0.85)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = 'rgba(255,226,170,0.16)';
    ctx.beginPath(); ctx.arc(l.x - l.r * 0.3, l.y - l.r * 0.32, l.r * 0.45, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function drawBridgeEdge(x, y) {
  ctx.save(); ctx.translate(x, y);
  const INK = '#1b2230';
  // planks receding to the right (perspective)
  for (let i = 0; i < 5; i++) {
    const px = i * 70, pw = 58, ph = 40 - i * 2, py = -i * 4;
    ctx.fillStyle = i % 2 === 0 ? '#7d5a3c' : '#8a6540';
    ctx.strokeStyle = INK; ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(px, py); ctx.lineTo(px + pw, py - 2); ctx.lineTo(px + pw - 3, py + ph); ctx.lineTo(px - 3, py + ph + 2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // plank shading
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    ctx.beginPath(); ctx.rect(px - 2, py + ph - 12, pw - 1, 10); ctx.fill();
  }
  // rail posts
  for (const px of [10, 302]) {
    ctx.fillStyle = '#4c3630';
    ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.rect(px, -78, 16, 88); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px - 4, -78); ctx.lineTo(px + 20, -78); ctx.lineTo(px + 16, -62); ctx.lineTo(px, -62); ctx.closePath();
    ctx.fillStyle = '#5c4433'; ctx.fill(); ctx.stroke();
  }
  // rail bar
  ctx.fillStyle = '#6b4e35'; ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(-6, -64); ctx.lineTo(360, -86); ctx.lineTo(360, -96); ctx.lineTo(-6, -76); ctx.closePath(); ctx.fill(); ctx.stroke();
  // link down to water
  ctx.fillStyle = '#4c3630';
  ctx.beginPath(); ctx.moveTo(336, -60); ctx.lineTo(352, -60); ctx.lineTo(352, 62); ctx.lineTo(336, 56); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawStones() {
  const { cx, cy, rx, ry } = L.pond;
  const stoneSpots = [
    { a: Math.PI * 0.28, r: 46 }, { a: Math.PI * 0.42, r: 62 }, { a: Math.PI * 0.56, r: 40 },
    { a: Math.PI * 0.72, r: 58 }, { a: Math.PI * 0.86, r: 44 }, { a: Math.PI * 1.08, r: 50 },
  ];
  for (const s of stoneSpots) {
    const x = cx + Math.cos(s.a) * (rx + 16);
    const y = cy + Math.sin(s.a) * (ry + 10);
    const w = s.r * 1.35, h = s.r * 0.66;
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(8,20,18,0.28)';
    ctx.beginPath(); ctx.ellipse(0, 7, w * 0.92, h * 0.72, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(0, -h * 0.3, 4, 0, 0, w * 0.95);
    if (lanternMode()) {
      g.addColorStop(0, '#4a443c');
      g.addColorStop(0.72, '#332e27');
      g.addColorStop(1, '#221e19');
    } else {
      g.addColorStop(0, '#8d8577');
      g.addColorStop(0.72, '#6e675c');
      g.addColorStop(1, '#4d4740');
    }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, w * 0.92, h * 0.9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = lanternMode() ? '#0d0b08' : '#1a2029'; ctx.lineWidth = 2.6; ctx.stroke();
    ctx.fillStyle = lanternMode() ? 'rgba(255,240,210,0.10)' : 'rgba(255,255,255,0.20)';
    ctx.beginPath(); ctx.ellipse(-w * 0.22, -h * 0.42, w * 0.34, h * 0.20, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// ---------- garden: ground, gravel, moss, stepping stones ----------
function drawGround() {
  ctx.fillStyle = '#e9dfca'; ctx.fillRect(0, 0, L.w, L.h);
  // washi wash banding
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = `rgba(214,198,166,${0.20 - i * 0.03})`;
    ctx.fillRect(0, (40 + i * 260) * K, L.w, 60 * K);
  }
  // soft shade under the maple tree + moss mound at its base
  ctx.fillStyle = 'rgba(40,50,30,0.14)';
  ctx.beginPath(); ctx.ellipse(150, 372 * K, 118, 30 * K, 0, 0, Math.PI * 2); ctx.fill();
  drawMossPatch(150, 368 * K, 100, 22 * K, 0.95);
  drawMossPatch(72, 380 * K, 52, 14 * K, 0.7);
  drawMossPatch(248, 384 * K, 46, 13 * K, 0.65);
  // ---- moss under the bridge legs + gravel under bridge ----
  const bx = 740, by = 120 * K;
  drawMossPatch(bx + 10, by + 100 * K, 36, 19 * K, 0.95);
  drawMossPatch(bx + 302, by + 100 * K, 36, 19 * K, 0.95);
  // dirt mound under the bridge link-post
  ctx.fillStyle = 'rgba(84,62,44,0.42)';
  ctx.beginPath(); ctx.ellipse(bx + 344, by + 108 * K, 50, 22 * K, 0, 0, Math.PI * 2); ctx.fill();
  // gravel strip under bridge deck
  ctx.fillStyle = 'rgba(168,158,140,0.55)';
  ctx.fillRect(bx - 20, by + 100 * K, 400, 58 * K);
  drawGravel(bx - 20, by + 100 * K, 400, 58 * K, 46, 4242);
  // ---- moss along the pond rim (bottom-right and bottom-left) ----
  drawMossPatch(420, 1212 * K, 70, 20 * K, 0.55);
  drawMossPatch(870, 1168 * K, 90, 24 * K, 0.6);
  drawMossPatch(180, 1055 * K, 62, 18 * K, 0.5);
  // ---- stepping stone path (left sliver, from frame edge toward the pond) ----
  const path = [ { x: 58, y: 600 * K, r: 26 }, { x: 84, y: 730 * K, r: 30 }, { x: 56, y: 872 * K, r: 27 }, { x: 92, y: 1016 * K, r: 30 } ];
  for (const s of path) drawSteppingStone(s.x, s.y, s.r);
  drawMossPatch(58, 664 * K, 30, 10 * K, 0.7);
  drawMossPatch(88, 800 * K, 34, 10 * K, 0.7);
  drawMossPatch(56, 946 * K, 30, 10 * K, 0.7);
  // ---- gravel field bottom-right corner ----
  drawGravel(760, 1290 * K, 420, 52 * K, 30, 9777);
  // ---- fallen maple leaves near the tree ----
  ctx.save();
  for (let i = 0; i < 8; i++) {
    const lf = { x: 78 + (i * 79) % 210, y: (350 + ((i * 47) % 28)) * K, c: i % 2 ? '#c2532c' : '#d98b3a' };
    ctx.fillStyle = lf.c;
    ctx.beginPath(); ctx.ellipse(lf.x, lf.y, 12, 6.5, (i * 0.7) % 3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(150,60,25,0.5)'; ctx.lineWidth = 1.1; ctx.stroke();
  }
  ctx.restore();
}
function drawMossPatch(cx, cy, rx, ry, alpha = 0.9) {
  const rng = mulberry(Math.floor(cx * 7 + cy * 13));
  ctx.save();
  ctx.fillStyle = `rgba(88,118,66,${alpha * 0.75})`;
  for (let i = 0; i < 9; i++) {
    const a = rng() * Math.PI * 2, d = rng() * 0.6;
    const px = cx + Math.cos(a) * rx * d, py = cy + Math.sin(a) * ry * d;
    const r = rx * (0.28 + rng() * 0.34);
    ctx.beginPath(); ctx.ellipse(px, py, r, r * 0.45, rng() * 3.14, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = `rgba(60,92,54,${alpha * 0.6})`;
  for (let i = 0; i < 4; i++) {
    const a = rng() * Math.PI * 2, d = rng() * 0.5;
    const px = cx + Math.cos(a) * rx * d, py = cy + Math.sin(a) * ry * d;
    ctx.beginPath(); ctx.ellipse(px, py, rx * 0.22, rx * 0.12, rng() * 3.14, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function drawSteppingStone(x, y, r) {

  const g = ctx.createRadialGradient(-r * 0.2, -r * 0.3, 2, 0, 0, r * 1.15);
  g.addColorStop(0, '#a49a86'); g.addColorStop(0.7, '#7e7767'); g.addColorStop(1, '#57524a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.62, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2a241d'; ctx.lineWidth = 2.4; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.ellipse(-r * 0.2, -r * 0.22, r * 0.5, r * 0.18, -0.2, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}
function drawGravel(x, y, w, h, count, seed) {
  const rng = mulberry(seed);
  for (let i = 0; i < count; i++) {
    const px = x + rng() * w, py = y + rng() * h;
    const r = 1.6 + rng() * 3.2;
    const c = ['#8f8574', '#a89e8a', '#6e675c', '#b3a990'][Math.floor(rng() * 4)];

// ---- lantern night mode (#3779) ----
// Toggle: ?style=lantern or ?normalmap=1 URL param, L key, or the LANTERN / NORMALS chips.
// Day is the default and is untouched. Normals view: purple-ish normals normals pass.
let lanterns = [];
let stars = [];
let glCanvas = null;
let gl = null;
let glU = null;

const GL_VERT = `#version 300 es
layout(location = 0) in vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }`;
const GL_FRAG = `#version 300 es
precision highp float;
uniform float u_time;
uniform vec2 u_size;
uniform vec2 u_center;
uniform vec2 u_radii;
uniform int u_viewNormal;
uniform vec3 u_lights[4];
uniform float u_intens[4];
uniform vec4 u_ripples[6];
uniform vec4 u_pads[12];
out vec4 outColor;
float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float heightAt(vec2 p) {
  float h = 0.10 * sin(p.x * 0.011 + u_time * 0.55) * sin(p.y * 0.014 - u_time * 0.42);
  vec2 cell = floor(p / vec2(96.0, 84.0));
  for (int oy = -1; oy <= 1; oy++) {
    for (int ox = -1; ox <= 1; ox++) {
      vec2 c = cell + vec2(float(ox), float(oy));
      float sel = hash21(c + vec2(0.31, 0.73));
      float px = (c.x + hash21(c + vec2(11.0, 1.0))) * 96.0;
      float py = (c.y + hash21(c + vec2(5.0, 13.0))) * 84.0;
      float rad = 9.0 + sel * 20.0;
      float dd = distance(p, vec2(px, py));
      h += 0.22 * exp(-(dd * dd) / (2.0 * rad * rad));
    }
  }
  for (int i = 0; i < 12; i++) {
    if (u_pads[i].w < 0.5) continue;
    vec2 pp = u_pads[i].xy;
    float pr = u_pads[i].z;
    float dd = distance(p, pp);
    if (dd > pr * 1.32) continue;
    float ang = atan(p.y - pp.y, p.x - pp.x);
    float crest = exp(-pow((dd - pr * 0.92) / 6.5, 2.0)) * 0.30;
    float vein = pow(max(0.0, sin(ang * 6.0 + u_time * 0.12)), 1.6) * exp(-pow((dd - pr * 0.55) / (pr * 0.45), 2.0)) * 0.34;
    h += crest + vein;
  }
  for (int i = 0; i < 6; i++) {
    if (u_ripples[i].w < 0.01) continue;
    float dd = distance(p, u_ripples[i].xy);
    h += u_ripples[i].w * exp(-pow((dd - u_ripples[i].z) / 15.0, 2.0));
  }
  return h;
}
void main() {
  vec2 p = vec2(gl_FragCoord.x, u_size.y - gl_FragCoord.y);
  vec2 d = p - u_center;
  float rr = length(vec2(d.x / u_radii.x, d.y / u_radii.y));
  if (rr > 1.04) discard;
  float h = heightAt(p);
  float eps = 2.5;
  float hx = heightAt(p + vec2(eps, 0.0)) - heightAt(p - vec2(eps, 0.0));
  float hy = heightAt(p + vec2(0.0, eps)) - heightAt(p - vec2(0.0, eps));
  vec3 n3 = normalize(vec3(-hx * 0.55, -hy * 0.55, 0.85));
  if (u_viewNormal == 1) {
    vec3 norm = normalize(vec3(-hx * 2.6, -hy * 2.6, 0.85));
    // amplified purple normals so pebble noise, pad veins and crest rims read
    vec3 col = vec3(0.58 + norm.x * 0.42, 0.44 + norm.y * 0.36, 0.84);
    col = mix(vec3(0.34, 0.26, 0.55), col, 0.78);
    outColor = vec4(col, 1.0);
    return;
  }
  vec3 base = mix(vec3(0.045, 0.105, 0.138), vec3(0.075, 0.140, 0.168), smoothstep(0.1, 1.0, rr));
  vec3 col = base * vec3(0.45, 0.55, 0.68);
  col += vec3(0.045, 0.055, 0.095) * (1.0 - rr * 0.35);  // cold moonlight
  col *= 1.0 + n3.y * 0.26;
  for (int i = 0; i < 4; i++) {
    float falloff = u_lights[i].z;
    float dist = distance(p, u_lights[i].xy);
    float fall = u_intens[i] / (1.0 + (dist / falloff) * (dist / falloff));
    col += vec3(1.00, 0.60, 0.28) * fall * 0.34;
  }
  float spec = pow(max(h, 0.0), 2.2) * 0.78;
  col += vec3(0.95, 0.92, 0.78) * clamp(spec, 0.0, 0.50);
  float rim = smoothstep(0.82, 1.05, rr);
  col *= 1.0 - rim * 0.55;
  outColor = vec4(col, 1.0);
}`;

function syncLanterns() {
  const pond = L.pond;
  const defs = [
    { i: 0, hang: false, drift: true, rxr: 0.44, ryr: 0.46, speed: 0.085, phase: 0.5 },
    { i: 1, hang: false, drift: true, rxr: 0.56, ryr: 0.34, speed: -0.065, phase: 2.7 },
    { i: 2, hang: false, drift: true, rxr: 0.36, ryr: 0.56, speed: 0.050, phase: 4.6 },
    { i: 3, hang: true, drift: false, a: null },
  ];
  const old = lanterns;
  lanterns = defs.map(d => {
    let x, y;
    if (d.hang) {
      x = 915;
      y = 120 * K + 122;
    } else {
      const a = d.phase + tNow * d.speed;
      x = pond.cx + Math.cos(a) * pond.rx * d.rxr;
      y = pond.cy + Math.sin(a) * pond.ry * d.ryr;
    }
    const ol = old.find(o => o.i === d.i);
    return { i: d.i, hang: d.hang, drift: d.drift, a: d.a, rxr: d.rxr, ryr: d.ryr, speed: d.speed, phase: d.phase, x, y, bob: ol ? ol.bob : 0, sway: ol ? ol.sway : 0.4 + Math.random() * 2.2 };
  });
  // stars, seeded, clear the moon disc
  const rng = mulberry(4242);
  const moon = { x: 520, y: 130, r: 46 };
  stars = [];
  const horizon = L.horizon;
  for (let i = 0; i < 34; i++) {
    const x = 30 + rng() * 1140;
    const y = 22 + rng() * Math.max(10, horizon - 48);
    if (Math.hypot(x - moon.x, y - moon.y) < 78) continue;
    stars.push({ x, y, r: 0.9 + rng() * 1.9, tw: rng() * 6.28, twAmp: 0.35 + rng() * 0.55 });
  }
}

function updateLanterns(dt) {
  const pond = L.pond;
  for (const ln of lanterns) {
    if (ln.drift) {
      const a = ln.phase + tNow * ln.speed;
      ln.x = pond.cx + Math.cos(a) * pond.rx * ln.rxr + Math.sin(tNow * 0.5 + ln.i * 2.1) * 13;
      ln.y = pond.cy + Math.sin(a) * pond.ry * ln.ryr + Math.cos(tNow * 0.38 + ln.i * 1.4) * 9;
    }
    let target = 0;
    for (const r of ripples) {
      const tt = Math.min(1, Math.max(0, r.t));
      const rad = 14 + tt * 150 * (r.rings === 3 ? 1.15 : 1);
      const d = Math.hypot(ln.x - r.x, ln.y - r.y);
      target += Math.exp(-((d - rad) * (d - rad)) / (2 * 30 * 30)) * (1 - tt) * 2.6 * (r.rings === 3 ? 1.25 : 1);
    }
    ln.bob += (Math.min(4.2, target) - ln.bob) * Math.min(1, dt * 5.5);
    ln.sway = Math.sin(tNow * 0.9 + ln.i * 1.7) * 0.05;
  }
}

function ensureGL() {
  const wantW = 1200, wantH = Math.round(H);
  if (gl && glCanvas && glCanvas.width === wantW && glCanvas.height === wantH) return true;
  // (re)build canvas + context
  glCanvas = document.createElement('canvas');
  glCanvas.width = wantW; glCanvas.height = wantH;
  glCanvas.style.display = 'none';
  const cgl = glCanvas.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, depth: false, stencil: false, alpha: true });
  if (!cgl) { gl = null; glU = null; return false; }
  const vs = cgl.createShader(cgl.VERTEX_SHADER);
  cgl.shaderSource(vs, GL_VERT); cgl.compileShader(vs);
  if (!cgl.getShaderParameter(vs, cgl.COMPILE_STATUS)) { console.error('koi GL vertex:', cgl.getShaderInfoLog(vs)); gl = null; glU = null; return false; }
  const fs = cgl.createShader(cgl.FRAGMENT_SHADER);
  cgl.shaderSource(fs, GL_FRAG); cgl.compileShader(fs);
  if (!cgl.getShaderParameter(fs, cgl.COMPILE_STATUS)) { console.error('koi GL fragment:', cgl.getShaderInfoLog(fs)); gl = null; glU = null; return false; }
  const prog = cgl.createProgram();
  cgl.attachShader(prog, vs); cgl.attachShader(prog, fs); cgl.linkProgram(prog);
  if (!cgl.getProgramParameter(prog, cgl.LINK_STATUS)) { console.error('koi GL link:', cgl.getProgramInfoLog(prog)); gl = null; glU = null; return false; }
  cgl.useProgram(prog);
  const buf = cgl.createBuffer();
  cgl.bindBuffer(cgl.ARRAY_BUFFER, buf);
  cgl.bufferData(cgl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), cgl.STATIC_DRAW);
  const loc = cgl.getAttribLocation(prog, 'a_pos');
  cgl.enableVertexAttribArray(loc);
  cgl.vertexAttribPointer(loc, 2, cgl.FLOAT, false, 0, 0);
  gl = cgl;
  glU = {
    prog,
    time: cgl.getUniformLocation(prog, 'u_time'),
    size: cgl.getUniformLocation(prog, 'u_size'),
    center: cgl.getUniformLocation(prog, 'u_center'),
    radii: cgl.getUniformLocation(prog, 'u_radii'),
    viewNormal: cgl.getUniformLocation(prog, 'u_viewNormal'),
    lights: cgl.getUniformLocation(prog, 'u_lights'),
    intens: cgl.getUniformLocation(prog, 'u_intens'),
    ripples: cgl.getUniformLocation(prog, 'u_ripples'),
    pads: cgl.getUniformLocation(prog, 'u_pads'),
  };
  // detect context loss handled at the render site
  return true;
}

function drawLanternPond2D() {
  // fallback when WebGL is unavailable
  const pond = L.pond;
  pondPath(ctx);
  const g = ctx.createRadialGradient(pond.cx, pond.cy, 40, pond.cx, pond.cy, pond.rx * 1.1);
  g.addColorStop(0, '#181a2e');
  g.addColorStop(0.55, '#1c2136');
  g.addColorStop(1, '#232a3c');
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); pondPath(ctx); ctx.clip();
  const rng = mulberry(77);
  for (let i = 0; i < 90; i++) {
    const a = rng() * Math.PI * 2, rr = Math.sqrt(rng()) * 0.9;
    const px = pond.cx + Math.cos(a) * pond.rx * rr;
    const py = pond.cy + Math.sin(a) * pond.ry * rr;
    ctx.fillStyle = 'rgba(120,110,95,0.22)';
    ctx.beginPath(); ctx.arc(px, py, 4 + rng() * 9, 0, Math.PI * 2); ctx.fill();
  }
  for (const ln of lanterns) {
    const flick = 1 + Math.sin(tNow * 3.1 + ln.i * 1.9) * 0.10;
    const gr = (ln.hang ? 260 : 210) * flick;
    const gg = ctx.createRadialGradient(ln.x, ln.y - 28, 10, ln.x, ln.y - 28, gr);
    gg.addColorStop(0, 'rgba(255,190,96,0.50)');
    gg.addColorStop(0.6, 'rgba(255,160,70,0.18)');
    gg.addColorStop(1, 'rgba(255,150,60,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(ln.x, ln.y - 28, gr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  pondPath(ctx); ctx.lineWidth = 6; ctx.strokeStyle = '#0d1220'; ctx.stroke();
}

function drawLanternPond() {
  const pond = L.pond;
  if (!ensureGL()) { drawLanternPond2D(); return; }
  const t = tNow;
  const gl0 = gl;
  try {
    gl0.viewport(0, 0, glCanvas.width, glCanvas.height);
    gl0.useProgram(glU.prog);
    gl0.uniform1f(glU.time, t);
    gl0.uniform2f(glU.size, 1200, glCanvas.height);
    gl0.uniform2f(glU.center, pond.cx, pond.cy);
    gl0.uniform2f(glU.radii, pond.rx, pond.ry);
    gl0.uniform1i(glU.viewNormal, normalMode ? 1 : 0);
    const lights = [], intens = [];
    for (const ln of lanterns) {
      const bob = ln.bob || 0;
      const fl = 1 + Math.sin(t * 3.1 + ln.i * 1.9) * 0.14 + Math.sin(t * 7.3 + ln.i * 3.1) * 0.06;
      const x = ln.x;
      const y = ln.hang ? (ln.y - 28 + bob * 0.8) : (ln.y - 30 + bob * 0.8);
      lights.push([x, y, ln.hang ? 150 : 128]);
      intens.push((ln.hang ? 1.05 : 0.88) * fl);
    }
    const ripplesU = [];
    for (let i = 0; i < 6; i++) {
      const src = ripples[Math.max(0, ripples.length - 6 + i)];
      if (!src) { ripplesU.push([0, 0, 0, 0]); continue; }
      const rad = 14 + Math.min(1, Math.max(0, src.t)) * 150 * (src.rings === 3 ? 1.15 : 1);
      // keep shader ripples at zero: the height bump renders as a pale
      // disc under the rings; the drawn rings alone read as water ripples
      ripplesU.push([src.x, src.y, rad, 0.0]);
    }
    const padsU = [];
    for (let i = 0; i < 12; i++) {
      const p = lilies[i];
      if (p) padsU.push([p.x, p.y + Math.sin(t * 0.55 + p.bob) * 5, p.r, 1]);
      else padsU.push([0, 0, 0, 0]);
    }
    gl0.uniform3fv(glU.lights, new Float32Array(lights.flat()));
    gl0.uniform1fv(glU.intens, new Float32Array(intens));
    gl0.uniform4fv(glU.ripples, new Float32Array(ripplesU.flat()));
    gl0.uniform4fv(glU.pads, new Float32Array(padsU.flat()));
    gl0.drawArrays(gl0.TRIANGLES, 0, 3);
  } catch (e) {
    console.error('koi GL render failed:', e);
    gl = null; glU = null;
    drawLanternPond2D();
    return;
  }
  ctx.drawImage(glCanvas, 0, 0, 1200, H);
  pondPath(ctx); ctx.lineWidth = 6; ctx.strokeStyle = '#0d1220'; ctx.stroke();
}

function drawNightDusk() {
  ctx.fillStyle = 'rgba(6,9,24,0.86)';
  ctx.fillRect(0, 0, L.w, L.h);
  const hz = L.horizon;
  const ember = ctx.createLinearGradient(0, hz - 80, 0, hz + 30);
  ember.addColorStop(0, 'rgba(255,140,60,0)');
  ember.addColorStop(0.7, 'rgba(255,130,58,0.14)');
  ember.addColorStop(1, 'rgba(255,130,58,0)');
  ctx.fillStyle = ember;
  ctx.fillRect(0, hz - 80, L.w, 110);
  const moonX = 520, moonY = 130, moonR = 46;
  const mg = ctx.createRadialGradient(moonX, moonY, moonR * 0.4, moonX, moonY, moonR * 1.95);
  mg.addColorStop(0, 'rgba(235,234,220,0.42)');
  mg.addColorStop(1, 'rgba(235,234,220,0)');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(moonX, moonY, moonR * 1.95, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ecdfc4'; ctx.beginPath(); ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(214,205,182,0.8)';
  ctx.beginPath(); ctx.arc(moonX - 12, moonY - 8, moonR * 0.16, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(moonX + 14, moonY + 10, moonR * 0.10, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(moonX + 4, moonY - 16, moonR * 0.08, 0, Math.PI * 2); ctx.fill();
  for (const s of stars) {
    const tw = s.twAmp * (0.55 + 0.45 * Math.sin(tNow * 1.7 + s.tw));
    ctx.fillStyle = 'rgba(235,238,255,' + tw.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
}

function drawWaterTintNight() {
  pondPath(ctx); ctx.save(); ctx.clip();
  const tint = ctx.createLinearGradient(0, L.pond.cy - L.pond.ry, 0, L.pond.cy + L.pond.ry);
  tint.addColorStop(0, 'rgba(20,26,52,0.42)');
  tint.addColorStop(0.5, 'rgba(18,22,44,0.36)');
  tint.addColorStop(1, 'rgba(10,14,32,0.52)');
  ctx.fillStyle = tint; ctx.fillRect(0, 0, L.w, L.h);
  for (const ln of lanterns) {
    if (ln.hang) continue;
    const sx = Math.max(L.pond.cx - L.pond.rx * 0.72, Math.min(L.pond.cx + L.pond.rx * 0.72, ln.x));
    const y0 = Math.max(L.pond.cy - L.pond.ry * 0.66, ln.y - 14);
    const len = 108 + (ln.bob || 0) * 42;
    const flick = 1 + Math.sin(tNow * 3.1 + ln.i * 1.9) * 0.14;
    const rg = ctx.createLinearGradient(0, y0, 0, y0 + len);
    rg.addColorStop(0, 'rgba(255,168,84,' + (0.30 * flick).toFixed(3) + ')');
    rg.addColorStop(1, 'rgba(255,168,84,0)');
    ctx.fillStyle = rg;
    for (const off of [-0.32, 0, 0.32]) {
      const wHalf = 26 * (1 - Math.abs(off) * 0.9);
      const x = sx + off * 52;
      const w = wHalf + Math.sin(tNow * 2.2 + off * 4 + ln.i) * 9;
      ctx.beginPath();
      ctx.moveTo(x - w, y0);
      ctx.lineTo(x + w, y0);
      ctx.lineTo(x + w * 0.55, y0 + len);
      ctx.lineTo(x - w * 0.55, y0 + len);
      ctx.closePath();
      ctx.fill();
    }
  }
  const hang = lanterns.find(l => l.hang);
  if (hang) {
    const flick = 1 + Math.sin(tNow * 2.7 + 1.3) * 0.16;
    const x = Math.max(L.pond.cx - L.pond.rx * 0.55, Math.min(L.pond.cx + L.pond.rx * 0.55, hang.x));
    const y0 = Math.max(L.pond.cy - L.pond.ry * 0.66, hang.y + 14);
    const len = 150 + (hang.bob || 0) * 46;
    const rg = ctx.createLinearGradient(0, y0, 0, y0 + len);
    rg.addColorStop(0, 'rgba(255,168,84,' + (0.26 * flick).toFixed(3) + ')');
    rg.addColorStop(1, 'rgba(255,168,84,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(x - 24, y0); ctx.lineTo(x + 24, y0);
    ctx.lineTo(x + 13, y0 + len); ctx.lineTo(x - 13, y0 + len);
    ctx.closePath(); ctx.fill();
  }
  const edge = ctx.createRadialGradient(L.pond.cx, L.pond.cy, L.pond.rx * 0.05, L.pond.cx, L.pond.cy, L.pond.rx * 1.12);
  edge.addColorStop(0, 'rgba(5,8,18,0.46)');
  edge.addColorStop(0.55, 'rgba(5,8,18,0.20)');
  edge.addColorStop(1, 'rgba(5,8,18,0.06)');
  ctx.fillStyle = edge; ctx.fillRect(0, 0, L.w, L.h);
  ctx.restore();
  pondPath(ctx); ctx.lineWidth = 6; ctx.strokeStyle = '#0d1220'; ctx.stroke();
}

function drawLanterns() {
  for (const ln of lanterns) {
    const bob = ln.bob || 0;
    const sway = Math.sin(tNow * 0.9 + ln.i * 1.7) * 0.05;
    const fl = 1 + Math.sin(tNow * 3.1 + ln.i * 1.9) * 0.14 + Math.sin(tNow * 7.3 + ln.i * 3.1) * 0.06;
    const lx = ln.x, ly = ln.y + bob;
    if (ln.hang) {
      ctx.save();
      ctx.strokeStyle = '#241c12';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(lx, 120 * K + 26); ctx.lineTo(lx, ly - 34); ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(sway);
    // warm radial glow
    const gR = 92 * fl;
    const g = ctx.createRadialGradient(0, -30, 6, 0, -30, gR);
    g.addColorStop(0, 'rgba(255,190,96,0.55)');

// ---------- paper grain / vignette ----------
let grainCanvas = null;
function buildGrain() {
  grainCanvas = document.createElement('canvas');
  grainCanvas.width = 512; grainCanvas.height = 512;
  const g = grainCanvas.getContext('2d');
  const img = g.createImageData(512, 512);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 210 + Math.random() * 45;
    img.data[i] = v; img.data[i+1] = v - 6; img.data[i+2] = v - 22;

function drawGrainAndFrame() {

  ctx.lineWidth = 3;
  roundRectPath(14, 14, VW - 28, VH - 28, 4); ctx.stroke();
  ctx.strokeStyle = night ? 'rgba(74,58,32,0.40)' : 'rgba(34,28,20,0.4)';
  ctx.lineWidth = 1.4;

  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, night ? 'rgba(4,8,18,0.30)' : 'rgba(28,22,14,0.22)');

}
function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- audio (soft splash) ----------
let audio = null;
