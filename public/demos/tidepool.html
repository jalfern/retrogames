<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tide Pool</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1410; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud {
    box-sizing: border-box;
    position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 4; font: 10px/1.7 Georgia, serif; letter-spacing: .16em; text-transform: uppercase;
    color: #f2ecdb; background: rgba(20, 16, 10, .55); border: 1px solid rgba(242, 236, 219, .3);
    border-radius: 999px; padding: 8px 14px; pointer-events: none; transition: opacity 1.2s;
  }
  #hud.gone { opacity: 0; }
  @media (max-width: 640px) { #hud { font-size: 9px; letter-spacing: .12em; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud">tap = ripple · hold = shadow</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const hudEl = document.getElementById('hud');
  let W = 0, H = 0, DPR = 1;

  // ---------- seeded rng ----------
  function mulberry(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry(20261127);
  // sand grain via pixel-noise is expensive per-frame; use hatch/speck instead

  // ---------- layout ----------
  const L = { cx: 0, cy: 0, rx: 0, ry: 0, wobblePh: [Math.PI / 2, Math.PI / 2, Math.PI / 2] };
  function layout() {
    const portrait = H > W;
    // Camera: pool grows toward the viewer so creatures read large inside the frame.
    // Decor (pebbles/weeds) scales with the same zoom; creatures get a further bump.
    const ZOOM = portrait ? 1.18 : 1.12;
    L.cx = W / 2;
    L.cy = portrait ? H * 0.47 : H / 2;
    L.rx = W * 0.46 * ZOOM;
    L.ry = H * 0.44 * ZOOM;
    L.zs = ZOOM * 1.55;   // creatures: ~thumb-width crabs
    L.zd = ZOOM * 1.18;   // decor: pebbles, weeds
  }
  function blobRadiusAt(theta, seedBump) {
    const ph = L.wobblePh;
    return 1 + 0.07 * Math.sin(3 * theta + ph[0] + seedBump) + 0.045 * Math.sin(7 * theta + ph[1]) + 0.03 * Math.sin(13 * theta + ph[2]);
  }
  function blobPath(context, bump = 0) {
    const N = 96;
    context.beginPath();
    for (let i = 0; i <= N; i++) {
      const th = (i / N) * Math.PI * 2;
      const r = blobRadiusAt(th, bump);
      const x = L.cx + Math.cos(th) * L.rx * r;
      const y = L.cy + Math.sin(th) * L.ry * r;
      if (i === 0) context.moveTo(x, y); else context.lineTo(x, y);
    }
    context.closePath();
  }
  function pointInPool(x, y, pad = 0) {
    const dx = (x - L.cx) / (L.rx * (1 - pad));
    const dy = (y - L.cy) / (L.ry * (1 - pad));
    // approximate organic rim: just use the ellipse with a 0.92 tolerance and let the
    // wobble be decorative — creatures stay well inside the drawn blob.
    return dx * dx + dy * dy <= 0.92;
  }
  // rock ledges: small dark rock lumps sitting on the inner rim — where things hide
  const ledges = [];
  function buildLedges() {
    const r2 = mulberry(777);
    ledges.length = 0;
    const spots = [
      { angle: Math.PI * 1.18, size: 0.30 },
      { angle: Math.PI * 1.88, size: 0.26 },
      { angle: Math.PI * 1.45, size: 0.22 },
      { angle: Math.PI * 0.32, size: 0.28 },
      { angle: Math.PI * 0.78, size: 0.24 },
    ];
    for (const s of spots) {
      const rr = blobRadiusAt(s.angle, 0.3);
      const x = L.cx + Math.cos(s.angle) * L.rx * rr * 0.88;
      const y = L.cy + Math.sin(s.angle) * L.ry * rr * 0.88;
      const size = (0.11 + r2() * 0.06) * L.rx;
      ledges.push({ x, y, size, angle: s.angle, shade: r2() });
    }
  }
  // deeper pockets (under ledges): where the pool bottom drops
  const pockets = [];
  function buildPockets() {
    const r2 = mulberry(4242);
    pockets.length = 0;
    for (let i = 0; i < 4; i++) {
      const s = ledges[i % ledges.length];
      const spread = Math.min(W, H) * (0.10 + r2() * 0.06);
      const x = s.x + (r2() - 0.5) * spread;
      const y = s.y + (r2() - 0.5) * spread * 0.6;
      const rr = (0.13 + r2() * 0.08) * L.rx;
      pockets.push({ x, y, r: rr });
    }
  }

  // ---------- static layers ----------
  let rockLayer = null; // offscreen rock + rim
  let poolBase = null;  // offscreen sand + pebbles + weed base
  let causticsTex = null;
  function makeCausticsTexture() {
    const w = 300, h = 300;
    causticsTex = document.createElement('canvas');
    causticsTex.width = w; causticsTex.height = h;
    const c = causticsTex.getContext('2d');
    const img = c.createImageData(w, h);
    const d = img.data;
    // organic web of highlights, not straight bands: hash-based value noise
    const hash = (ix, iy) => {
      const n = Math.sin(ix * 127.1 + iy * 311.7) * 43758.5453;
      return n - Math.floor(n);
    };
    const fade = t => t * t * (3 - 2 * t);
    const vnoise = (x, y) => {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const a = hash(ix, iy), b = hash(ix + 1, iy), cc = hash(ix, iy + 1), dd = hash(ix + 1, iy + 1);
      const ux = fade(fx), uy = fade(fy);
      return a + (b - a) * ux + (cc - a) * uy + (a - b - cc + dd) * ux * uy;
    };
    const octave = (x, y) => vnoise(x, y) + 0.5 * vnoise(x * 2.31 + 3.7, y * 2.31 + 1.3) + 0.28 * vnoise(x * 4.77 + 8.2, y * 4.77 + 5.9);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const v = octave(x / w * 13.0, y / h * 13.0) / 1.78;  // crest field
        // ridged: bright crest lines sit on irregular cell edges
        const ridge = 1 - Math.abs(2 * v - 1);
        const crest = Math.pow(Math.max(0, ridge - 0.46) / 0.54, 2.4);
        const i = (y * w + x) * 4;
        d[i] = 235; d[i + 1] = 246; d[i + 2] = 250; d[i + 3] = Math.floor(Math.min(1, crest) * 255);
      }
    }
    c.putImageData(img, 0, 0);
  }
  function buildRockLayer() {
    rockLayer = document.createElement('canvas');
    rockLayer.width = Math.floor(W * DPR); rockLayer.height = Math.floor(H * DPR);
    const c = rockLayer.getContext('2d');
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    // paper under everything (visible at the very corners)
    c.fillStyle = '#2a241d';
    c.fillRect(0, 0, W, H);
    // rock fill: a dark slate ring (even-odd: frame minus pool)
    const rockGrad = c.createRadialGradient(L.cx, L.cy, Math.min(W, H) * 0.28, L.cx, L.cy, Math.max(W, H) * 0.75);
    rockGrad.addColorStop(0, '#3a3a44');
    rockGrad.addColorStop(0.5, '#2b2b34');
    rockGrad.addColorStop(1, '#1c1a20');
    c.beginPath();
    c.rect(0, 0, W, H);
    blobPath(c, 0);
    c.fillStyle = rockGrad;
    c.fill('evenodd');
    // rock hatching along the ring: short curved ink strokes
    const r3 = mulberry(99173);
    for (let i = 0; i < 260; i++) {
      const ang = r3() * Math.PI * 2;
      const rr = L.rx * blobRadiusAt(ang, 0) * (1.02 + r3() * 0.34);
      const nx = L.cx + Math.cos(ang) * rr;
      const ny = L.cy + Math.sin(ang) * rr * (L.ry / L.rx);
      if (nx < -20 || nx > W + 20 || ny < -20 || ny > H + 20) continue;
      const len = 7 + r3() * 16;
      const dir = ang + Math.PI / 2 + (r3() - 0.5) * 0.9; // tangent-ish
      const curve = (r3() - 0.5) * 5;
      c.strokeStyle = `rgba(12,11,16,${0.28 + r3() * 0.4})`;
      c.lineWidth = 1 + r3() * 1.6;
      c.beginPath();
      c.moveTo(nx, ny);
      c.quadraticCurveTo(
        nx + Math.cos(dir) * len * 0.5 - Math.sin(dir) * curve,
        ny + Math.sin(dir) * len * 0.5 + Math.cos(dir) * curve,
        nx + Math.cos(dir) * len, ny + Math.sin(dir) * len
      );
      c.stroke();
    }
    // speckles: light and dark
    for (let i = 0; i < 620; i++) {
      const ang = r3() * Math.PI * 2;
      const rr = L.rx * blobRadiusAt(ang, 0) * (1.01 + r3() * 0.5);
      const x = L.cx + Math.cos(ang) * rr;
      const y = L.cy + Math.sin(ang) * rr * (L.ry / L.rx);
      if (x < 0 || x > W || y < 0 || y > H) continue;
      const light = r3() < 0.24;
      c.fillStyle = light ? `rgba(210,200,172,${0.10 + r3() * 0.3})` : `rgba(8,8,12,${0.2 + r3() * 0.42})`;
      c.beginPath(); c.arc(x, y, 0.5 + r3() * 1.5, 0, Math.PI * 2); c.fill();
    }
    // ink contour line on the rim: a strong dark stroke plus a thin warm highlight on the outside
    blobPath(c, 0);
    c.strokeStyle = 'rgba(10,9,12,0.85)';
    c.lineWidth = 2.5;
    c.stroke();
    blobPath(c, 0.055);
    c.strokeStyle = 'rgba(233,214,164,0.22)';
    c.lineWidth = 1.4;
    c.stroke();
    // outer ink vignette frame line (field-guide plate feel)
    c.strokeStyle = 'rgba(10,9,12,0.4)';
    c.lineWidth = 2;
    c.strokeRect(7, 7, W - 14, H - 14);
  }
  function buildPoolBase() {
    poolBase = document.createElement('canvas');
    poolBase.width = Math.floor(W * DPR); poolBase.height = Math.floor(H * DPR);
    const c = poolBase.getContext('2d');
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    blobPath(c, 0);
    c.save();
    c.clip();
    // sand base: warm shallow sand shading toward deeper teal
    const sandGrad = c.createRadialGradient(L.cx, L.cy, 0, L.cx, L.cy, Math.max(L.rx, L.ry) * 1.1);
    sandGrad.addColorStop(0, '#d2bd82');
    sandGrad.addColorStop(0.45, '#c2a96e');
    sandGrad.addColorStop(0.8, '#a8894f');
    sandGrad.addColorStop(1, '#86703f');
    c.fillStyle = sandGrad;
    c.fillRect(0, 0, W, H);
    // water tint: shallow aqua wash over the sand
    const waterWash = c.createRadialGradient(L.cx, L.cy, 0, L.cx, L.cy, Math.max(L.rx, L.ry) * 1.05);
    waterWash.addColorStop(0, 'rgba(96,152,148,0.16)');
    waterWash.addColorStop(0.7, 'rgba(74,132,132,0.26)');
    waterWash.addColorStop(1, 'rgba(58,104,108,0.32)');
    c.fillStyle = waterWash;
    c.fillRect(0, 0, W, H);
    // olive-algae patches: muted dark spots where weed drift settles
    const rAl = mulberry(6141);
    for (let i = 0; i < 5; i++) {
      const a = rAl() * Math.PI * 2;
      const rr = 0.3 + rAl() * 0.5;
      const x = L.cx + Math.cos(a) * L.rx * rr;
      const y = L.cy + Math.sin(a) * L.ry * rr;
      const r = (0.10 + rAl() * 0.12) * Math.min(W, H);
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(104,106,52,0.30)');
      g.addColorStop(1, 'rgba(104,106,52,0)');
      c.fillStyle = g;
      c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    }
    // watercolour wash: soft irregular splotches in the sand, so the plate sits on paper
    const rWash = mulberry(9099);
    const washPalette = ['#d9c284', '#bfa068', '#8f7a55', '#9db088', '#d2b678', '#8e8c60'];
    for (let i = 0; i < 16; i++) {
      const a = rWash() * Math.PI * 2;
      const rr = 0.15 + rWash() * 0.6;
      const x = L.cx + Math.cos(a) * L.rx * rr;
      const y = L.cy + Math.sin(a) * L.ry * rr;
      const rad = (0.10 + rWash() * 0.16) * Math.min(W, H);
      const col = washPalette[Math.floor(rWash() * washPalette.length)];
      const g = c.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, col + '2e');
      g.addColorStop(1, col + '00');
      c.fillStyle = g;
      c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2); c.fill();
    }
    // organic rim-following shallow shading: soft layers hug the pool edge, never a straight band
    for (const [lw, al] of [[56, 0.10], [34, 0.09], [18, 0.11]]) {
      blobPath(c, 0);
      c.strokeStyle = `rgba(66,106,90,${al})`;
      c.lineWidth = lw;
      c.stroke();
    }
    // warm sun light pooling on the lower-right rim (field-guide plate feel)
    const sunLight = c.createRadialGradient(L.cx + L.rx * 0.45, L.cy + L.ry * 0.62, 0, L.cx + L.rx * 0.45, L.cy + L.ry * 0.62, L.ry * 0.85);
    sunLight.addColorStop(0, 'rgba(238,214,150,0.13)');
    sunLight.addColorStop(1, 'rgba(238,214,150,0)');
    c.fillStyle = sunLight;
    c.fillRect(0, 0, W, H);
    // deeper pockets under the ledges
    for (const p of pockets) {
      const pg = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 1.75);
      pg.addColorStop(0, 'rgba(14,58,64,0.96)');
      pg.addColorStop(0.5, 'rgba(28,80,84,0.62)');
      pg.addColorStop(1, 'rgba(28,80,84,0)');
      c.fillStyle = pg;
      c.beginPath(); c.arc(p.x, p.y, p.r * 1.75, 0, Math.PI * 2); c.fill();
      // teal rim light around the pocket edge
      c.strokeStyle = 'rgba(140,188,176,0.30)';
      c.lineWidth = 1.4;
      c.beginPath(); c.arc(p.x, p.y, p.r * 0.95, 0, Math.PI * 2); c.stroke();
    }
    // scattered pebbles (deterministic)
    const r4 = mulberry(5150);
    for (let i = 0; i < 30; i++) {
      let x = 0, y = 0, tries = 0;
      do {
        const a = r4() * Math.PI * 2;
        const rr = 0.25 + r4() * 0.62;
        x = L.cx + Math.cos(a) * L.rx * rr;
        y = L.cy + Math.sin(a) * L.ry * rr;
        tries++;
      } while (tries < 20 && !pointInPool(x, y, 0.12));
      const s = (3.5 + r4() * 8) * L.zd;
      const tone = r4();
      c.fillStyle = tone < 0.33 ? '#7d6e58' : tone < 0.66 ? '#655a49' : '#6b6470';
      c.strokeStyle = 'rgba(22,19,14,0.72)';
      c.lineWidth = 1.3;
      c.beginPath();
      c.ellipse(x, y, s, s * (0.55 + r4() * 0.4), r4() * Math.PI, 0, Math.PI * 2);
      c.fill(); c.stroke();
      // a little shade tick
      c.strokeStyle = 'rgba(244,238,220,0.5)';
      c.lineWidth = 1;
      c.beginPath();
      c.ellipse(x - s * 0.25, y - s * 0.28, s * 0.45, s * 0.3, 0, Math.PI * 1.0, Math.PI * 1.9);
      c.stroke();
    }
    // small sand ripple marks (faint, static)
    for (let i = 0; i < 14; i++) {
      const a = r4() * Math.PI * 2;
      const rr = 0.3 + r4() * 0.6;
      const x = L.cx + Math.cos(a) * L.rx * rr;
      const y = L.cy + Math.sin(a) * L.ry * rr;
      if (!pointInPool(x, y, 0.1)) continue;
      c.strokeStyle = 'rgba(122,96,54,0.22)';
      c.lineWidth = 1.6;
      c.beginPath();
      c.moveTo(x - 12, y);
      c.quadraticCurveTo(x - 6, y - 4 - r4() * 4, x + 4, y);
      c.stroke();
    }
    // rim shadow: the pool is carved into the rock — a soft band just inside the edge
    blobPath(c, 0);
    c.strokeStyle = 'rgba(16,32,32,0.55)';
    c.lineWidth = 15;
    c.stroke();
    blobPath(c, 0.018);
    c.strokeStyle = 'rgba(238,232,214,0.26)';
    c.lineWidth = 2;
    c.stroke();
    c.restore();
  }

  // ---------- dynamic state ----------
  let time = 0;
  let frames = 0;
  const creatures = { anemones: [], hermits: [], shores: [], starfish: null, fish: [] };
  const ripples = [];
  const shadow = { active: false, x: 0, y: 0, strength: 0, grow: 0 };
  const wave = { active: false, t: 0, dur: 4.6 };
  let nextWaveIn = 5 + rng() * 4;
  let holdTimer = 0;
  let pressed = false;
  let pointer = { x: 0, y: 0, down: false };

  function buildCreatures() {
    const r5 = mulberry(1617);
    creatures.anemones.length = 0;
    for (let i = 0; i < 4; i++) {
      let x = 0, y = 0, tries = 0;
      do {
        const a = (i / 4) * Math.PI * 2 + r5() * 1.2;
        const rr = 0.35 + r5() * 0.45;
        x = L.cx + Math.cos(a) * L.rx * rr;
        y = L.cy + Math.sin(a) * L.ry * rr;
        tries++;
      } while (tries < 30 && !pointInPool(x, y, 0.18));
      creatures.anemones.push({ x, y, r: 11 + r5() * 7, open: 1, pinch: 0, petals: 11 + Math.floor(r5() * 4), phase: r5() * Math.PI * 2, hue: r5() });
    }
    creatures.hermits.length = 0;
    for (let i = 0; i < 2; i++) {
      // start near a ledge on the rim, walking sideways along the ring
      const a = 0.5 + i * 2.4 + r5() * 0.6;
      const rr = 0.86;
      const x = L.cx + Math.cos(a) * L.rx * rr;
      const y = L.cy + Math.sin(a) * L.ry * rr;
      creatures.hermits.push({ x, y, angle: a, r: 0.86, mode: 'walk', walkPhase: r5() * 9, speed: 0.05 + r5() * 0.02, dir: r5() < 0.5 ? 1 : -1, pauseT: 0, duck: 0, hidden: false, hideAt: 0, wob: r5() * Math.PI * 2, shellHue: r5() });
    }
    creatures.shores.length = 0;
    for (let i = 0; i < 2; i++) {
      const a = 2.3 + i * 1.8 + r5();
      const rr = 0.45 + r5() * 0.25;
      const x = L.cx + Math.cos(a) * L.rx * rr;
      const y = L.cy + Math.sin(a) * L.ry * rr;
      creatures.shores.push({ x, y, angle: a, r: rr, mode: 'walk', walkPhase: r5() * 9, pauseT: 0, duck: 0, dir: r5() < 0.5 ? 1 : -1, flee: 0, wob: r5() * Math.PI * 2, shellHue: r5() });
    }
    creatures.starfish = { x: L.cx + L.rx * 0.86, y: L.cy, angle: 0, r: 0.86, a: 2.8, paused: 0, creepPhase: 0, moveDir: 1, wob: r5() * Math.PI * 2 };
    creatures.fish.length = 0;
    for (let i = 0; i < 3; i++) {
      const li = i % ledges.length;
      const spot = ledges[li];
      creatures.fish.push({ x: spot.x, y: spot.y, home: { x: spot.x, y: spot.y }, state: 'hidden', waitT: 1 + r5() * 4, glanceT: 0, tx: 0, ty: 0, t: 0, dur: 0.7 + r5() * 0.4, kind: r5() < 0.5 ? 'blenny' : 'goby', hue: r5(), dartSide: r5() < 0.5 ? 1 : -1 });
    }
  }
  function startleAt(x, y, radius, strength) {
    // anemones pinched
    for (const a of creatures.anemones) {
      const d = Math.hypot(a.x - x, a.y - y);
      if (d < radius) a.pinch = Math.min(1, strength * (1 - d / radius) * 1.15 + 0.35);
    }
    for (const h of creatures.hermits) {
      const d = Math.hypot(h.x - x, h.y - y);
      if (d < radius * 1.5 && !h.hidden) {
        h.mode = 'flee';
      }
    }
    for (const s of creatures.shores) {
      const d = Math.hypot(s.x - x, s.y - y);
      if (d < radius * 1.4 && !s.duck) {
        s.flee = 1; s.pauseT = 0;
      }
    }
    if (creatures.starfish && Math.hypot(creatures.starfish.x - x, creatures.starfish.y - y) < radius) {
      creatures.starfish.paused = 2.2;
    }
    for (const f of creatures.fish) {
      const d = Math.hypot(f.x - x, f.y - y);
      if (d < radius * 1.7 || f.state === 'hidden') f.waitT = Math.min(f.waitT, 0.25 + rng() * 0.4);
    }
  }

  // ---------- audio (synthesized, unlocked on first gesture) ----------
  let audioCtx = null;
  function ensureAudio() {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; }
  }
  function tone(freq, dur, gain, type = 'sine') {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function blip() { tone(740 + rng() * 120, 0.22, 0.045); tone(392, 0.3, 0.02); }
  function crash() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const dur = 1.4;
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
    const ch = buf.getChannelData(0);

  // ---------- input ----------
  function pointerPos(e) {

  // ---------- DEV hooks ----------
  const DEV = {
    ready: false,
    frames: 0,
    // force an immediate wave (check determinism)
    startWave: () => { wave.active = true; wave.t = 0; crash(); },
    waveT: () => wave.active ? wave.t : (wave.t >= 1 ? 1 : -1),
    // pin shadow (dev-only) for the pixel gate
    setShadow: (x, y, s) => { shadow.active = true; shadow.x = x; shadow.y = y; shadow.strength = s; shadow.grow = s; },
    releaseShadow: () => { shadow.active = false; },
    state: () => ({ frames, time, wave: { active: wave.active, t: wave.t }, shadow: { active: shadow.active, s: shadow.strength }, ripples: ripples.length }),

  // ---------- wave ----------
  function startWave() { wave.active = true; wave.t = 0; crash(); }
  function updateWave(dt) {
    if (wave.active) {
      wave.t += dt / wave.dur;
      if (wave.t >= 1) { wave.active = false; wave.t = 1; nextWaveIn = 9 + rng() * 7; }
      return;
    }
    nextWaveIn -= dt;
    if (nextWaveIn <= 0) startWave();
  }

  // ---------- update ----------
  function update(dt) {
    time += dt;
    frames++;
    updateWave(dt);
    // hold/shadow
    if (pointer.down) {
      holdTimer += dt;
      if (holdTimer > 0.32 && !shadow.active) {
        shadow.active = true;
        shadow.x = pointer.x; shadow.y = pointer.y;
        shadow._startled = false;
      }
      if (shadow.active) {
        shadow.x = pointer.x; shadow.y = pointer.y;
        shadow.grow = Math.min(1, shadow.grow + dt * 2.6);
        shadow.strength = shadow.grow;
        // startle once as the shadow fills in
        if (!shadow._startled && shadow.grow > 0.55) {
          shadow._startled = true;
          startleAt(shadow.x, shadow.y, 150, 1.2);
        }
      }
    } else {
      if (shadow.active) {
        shadow.grow = Math.max(0, shadow.grow - dt * 3.2);
        shadow.strength = shadow.grow;
        if (shadow.grow <= 0) shadow.active = false;
      }
    }
    // ripples
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.life -= dt * 1.1;
      r.r += dt * 170;
      if (r.life <= 0) ripples.splice(i, 1);
    }
    // anemones
    for (const a of creatures.anemones) {
      // pinch close, then slowly reopen
      a.pinch = Math.max(0, a.pinch - dt * 0.22);
      a.open = Math.max(0.12, 1 - a.pinch * 1.15);
    }
    // hermit crabs
    for (const h of creatures.hermits) {
      h.wob += dt * 3;
      if (h.hidden) {
        h.hideAt -= dt;
        if (h.hideAt <= 0) h.hidden = false;
        continue;
      }
      h.duck = Math.max(0, h.duck - dt * 2);
      if (h.mode === 'flee') {
        // scuttle toward the nearest ledge
        let best = null, bd = Infinity;
        for (const lg of ledges) {
          const d = Math.hypot(lg.x - h.x, lg.y - h.y);
          if (d < bd) { bd = d; best = lg; }
        }
        const dx = best.x - h.x, dy = best.y - h.y;
        const d = Math.hypot(dx, dy);

        h.angle += h.dir * h.speed * dt * (1 + 0.2 * Math.sin(h.wob));
        if (h.angle > Math.PI * 2) h.angle -= Math.PI * 2;
        if (h.angle < 0) h.angle += Math.PI * 2;
        const rr = L.rx * 0.86 * blobRadiusAt(h.angle, 0);

    }

    for (const s of creatures.shores) {
      s.wob += dt * 3;

        s.flee = Math.max(0, s.flee - dt * 0.5);

        const tangent = away + Math.PI / 2;
        const sp = 120 * dt;

        s.y += Math.sin(tangent) * sp * s.dir;
        if (!pointInPool(s.x, s.y, 0.2)) {
          // nudged back inside
          const nx = L.cx + (s.x - L.cx) * 0.7;
          const ny = L.cy + (s.y - L.cy) * 0.7;
          s.x = nx; s.y = ny;
          s.dir = -s.dir;
        }
        continue;
      }
      if (s.pauseT > 0) { s.pauseT -= dt; continue; }
      s.walkPhase += dt * 5;
      const a = Math.atan2(s.y - L.cy, s.x - L.cx);
      const tangent = a + Math.PI / 2;
      const sp = 22 * dt;
      s.x += Math.cos(tangent) * sp * s.dir;
      s.y += Math.sin(tangent) * sp * s.dir;

        s.y += Math.sin(tangent) * -sp * s.dir * 2;
      }

    }
    // starfish
    const st = creatures.starfish;
    if (st) {
      st.wob += dt * 2;
      if (st.paused > 0) st.paused -= dt;
      if (st.paused <= 0) {
        // creep along the rim ring very slowly
        st.a += st.moveDir * 0.018 * dt;
        if (st.a > Math.PI * 2) st.a -= Math.PI * 2;
        if (st.a < 0) st.a += Math.PI * 2;
        const rr = L.rx * 0.80 * blobRadiusAt(st.a, 0);
        st.x = L.cx + Math.cos(st.a) * rr;
        st.y = L.cy + Math.sin(st.a) * (rr * L.ry / L.rx);
        st.creepPhase += dt * 1.6;
      }
    }
    // fish
    for (const f of creatures.fish) {
      if (f.state === 'hidden') {
        f.waitT -= dt;
        f.glanceT = Math.max(0, f.glanceT - dt);
        if (f.waitT <= 0) {
          // pick a new hide spot (a different ledge)
          const others = ledges.filter(lg => lg !== f.home);
          const lg = others[Math.floor(rng() * others.length)] || ledges[0];
          f.tx = lg.x; f.ty = lg.y;
          f.state = 'darting';
          f.t = 0;
          f.dur = 0.55 + rng() * 0.5;
          f.home = { x: lg.x, y: lg.y };
        }
      } else if (f.state === 'darting') {
        f.t += dt;
        const k = Math.min(1, f.t / f.dur);
        const ease = 1 - Math.pow(1 - k, 3);

        // store start pos at first dart frame
        if (f._sx === undefined) { f._sx = f.x; f._sy = f.y; }

        const ey = f._sy + (f.ty - f._sy) * ease;
        f.x = ex; f.y = ey;

        }

  }

  function drawWeed(c, t) {
    c.save();
    blobPath(c, 0);
    c.clip();
    const r = mulberry(80808);
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2 + r() * 0.8;
      const rr = 0.68 + r() * 0.22;
      const x = L.cx + Math.cos(a) * L.rx * rr;

      // antennae
      c.strokeStyle = 'rgba(46,22,12,0.8)';
      c.lineWidth = 1;
      c.beginPath(); c.moveTo(-6.4, -1.6); c.quadraticCurveTo(-10, -3.6, -11.4, -1.8); c.stroke();
      c.beginPath(); c.moveTo(-6.4, 1.2); c.quadraticCurveTo(-10.4, 1.8, -11.6, 3.4); c.stroke();
      // eye dots
      c.fillStyle = '#1d130c';
      c.beginPath(); c.arc(-6.6, -1.4, 1, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(-6.6, 1.2, 1, 0, Math.PI * 2); c.fill();
      c.restore();
    }
  }
  function drawStarfish(c, t) {
    const st = creatures.starfish;
    if (!st) return;
    c.save();
    c.translate(st.x, st.y);
    // skrunch slightly when paused
    const pausedScale = st.paused > 0 ? 0.9 : 1;
    c.rotate(Math.sin(st.wob) * 0.05);
    c.scale(pausedScale * L.zs, pausedScale * L.zs);
    const arms = 5;
    const r = 11;
    c.fillStyle = '#e07b3e';
    c.strokeStyle = 'rgba(70,28,14,0.9)';
    c.lineWidth = 1.6;
    c.beginPath();
    for (let i = 0; i < arms * 2; i++) {
      const ang = (i / (arms * 2)) * Math.PI * 2;
      const rad = i % 2 === 0 ? r : r * 0.45;
      const x = Math.cos(ang) * rad, y = Math.sin(ang) * rad;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.closePath(); c.fill(); c.stroke();
    // speckles
    c.fillStyle = 'rgba(90,36,18,0.55)';
    const r2 = mulberry(77);
    for (let i = 0; i < 7; i++) {
      const a = r2() * Math.PI * 2;
      const rr = r2() * r * 0.75;
      c.beginPath(); c.arc(Math.cos(a) * rr, Math.sin(a) * rr, 0.9, 0, Math.PI * 2); c.fill();
    }
    c.restore();
  }
  function drawFish(c, t) {
    for (const f of creatures.fish) {
      if (f.state === 'hidden' && f.glanceT <= 0) continue;
      const darting = f.state === 'darting';
      const glance = f.glanceT > 0 && f.state === 'hidden';
      const alpha = darting ? 1 : (glance ? 0.35 + 0.65 * Math.min(1, f.glanceT / 0.6) : 0);
      c.save();
      c.translate(f.x, f.y);
      c.scale(L.zs, L.zs);
      if (darting) {
        const dir = Math.atan2(f.ty - f._sy || 0, f.tx - f._sx || 1);
        c.rotate(dir);
      }
      c.globalAlpha = alpha;
      const L2 = f.kind === 'blenny' ? 11 : 9.5;
      const W2 = f.kind === 'blenny' ? 4.2 : 5.6;
      // body
      c.fillStyle = f.kind === 'blenny' ? '#5f7d52' : '#3f6f78';
      c.strokeStyle = 'rgba(24,26,18,0.9)';
      c.lineWidth = 1.2;
      c.beginPath();
      c.ellipse(0, 0, L2, W2, 0, 0, Math.PI * 2);
      c.fill(); c.stroke();
      // stripes for blenny
      if (f.kind === 'blenny') {
        c.strokeStyle = 'rgba(34,44,24,0.6)';
        c.lineWidth = 1.4;
        for (let i = -1; i <= 1; i++) {
          c.beginPath(); c.moveTo(i * 3.2, -3.2); c.lineTo(i * 3.2, 3.2); c.stroke();
        }
      } else {
        // goby spot dots
        c.fillStyle = 'rgba(24,34,30,0.65)';
        for (let i = -1; i <= 1; i++) { c.beginPath(); c.arc(i * 3.4, -1.4, 1.1, 0, Math.PI * 2); c.fill(); }
      }
      // tail fin
      c.fillStyle = 'rgba(44,60,34,0.85)';
      c.beginPath();
      c.moveTo(-L2, 0);
      c.lineTo(-L2 - 5.5, -3.6);
      c.lineTo(-L2 - 5.5, 3.6);
      c.closePath();
      c.fill();
      // dorsal fin
      c.fillStyle = 'rgba(56,84,40,0.7)';
      c.beginPath();
      c.moveTo(-2.5, -W2 + 0.6); c.lineTo(0.5, -W2 - 2.6); c.lineTo(3.5, -W2 + 0.8); c.closePath();
      c.fill();
      // eye
      c.fillStyle = '#f4f0e2';
      c.beginPath(); c.arc(L2 - 2.8, -1.1, 1.9, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#141210';
      c.beginPath(); c.arc(L2 - 2.4, -1.1, 1.1, 0, Math.PI * 2); c.fill();
      c.restore();
    }
  }
  function drawRipples(c) {
    for (const r of ripples) {
      const a = Math.max(0, r.life) * 0.55;
      c.strokeStyle = `rgba(240,246,238,${a})`;
      c.lineWidth = 1.8;
      c.beginPath(); c.arc(r.x, r.y, r.r, 0, Math.PI * 2); c.stroke();
      c.strokeStyle = `rgba(30,70,80,${a * 0.5})`;
      c.lineWidth = 1.2;
      c.beginPath(); c.arc(r.x, r.y, r.r * 0.8, 0, Math.PI * 2); c.stroke();
    }
  }
  function drawWave(c) {
    if (!wave.active) return;
    const t = wave.t;
    // organic ragged leading sheet sweeping across the pool
    const frontY = L.cy - L.ry + (t * 1.35) * (L.ry * 2.35);
    const waveAlpha = t < 0.15 ? t / 0.15 : (t > 0.8 ? (1 - t) / 0.2 : 1);
    const edgeY = x => frontY
      + Math.sin(x * 0.045 + t * 7) * 7
      + Math.sin(x * 0.11 + t * 4.3) * 3
      + Math.sin(x * 0.021 + t * 3.1) * 9
      + Math.sin(x * 0.017 + 2.2 + t * 5.2) * 5;
    c.save();
    blobPath(c, 0);
    c.clip();
    // teal wash trailing the sheet: fades ahead of the line, never a hard edge
    const grad = c.createLinearGradient(0, Math.max(0, frontY - L.ry * 1.5), 0, frontY + L.ry * 0.55);
    grad.addColorStop(0, 'rgba(120,180,186,0)');
    grad.addColorStop(0.68, `rgba(96,162,170,${0.18 * waveAlpha})`);
    grad.addColorStop(1, `rgba(96,162,170,${0.02 * waveAlpha})`);
    c.fillStyle = grad;
    c.fillRect(0, 0, W, frontY + L.ry * 0.55);
    // inching into the foam: two semi-transparent skins + bright ragged core
    for (const [lw, al] of [[15, 0.20], [7, 0.38], [2.6, 0.85]]) {
      c.beginPath();
      for (let x = -10; x <= W + 10; x += 5) {
        const y = edgeY(x) + Math.sin(x * 0.7 + t * 9.2) * 1.6;
        if (x <= -10) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.strokeStyle = `rgba(242,250,240,${al * waveAlpha})`;
      c.lineWidth = lw;
      c.lineCap = 'round';
      c.stroke();
    }
    // foam flecks scattered along the sheet and slightly ahead — an irregular froth line
    const r = mulberry(999);
    c.fillStyle = `rgba(246,250,238,${0.62 * waveAlpha})`;
    for (let i = 0; i < 44; i++) {
      const x = r() * W;
      const taper = Math.min(1, Math.min(x, W - x) / (W * 0.14));
      if (r() > taper) continue;
      const ahead = r() < 0.42 ? -6 - r() * 12 : (r() - 0.5) * 14;
      const yy = edgeY(x) + ahead;
      const rr = 0.6 + r() * 1.9;
      c.beginPath(); c.arc(x, yy, rr, 0, Math.PI * 2); c.fill();
      // faint crest tail behind each fleck
      if (r() > 0.62) {
        c.fillStyle = `rgba(238,246,232,${0.18 * waveAlpha})`;
        c.beginPath(); c.arc(x + (r() - 0.5) * 10, yy + rr + 3 + r() * 7, rr * 0.6, 0, Math.PI * 2); c.fill();
        c.fillStyle = `rgba(246,250,238,${0.62 * waveAlpha})`;
      }
    }
    // sand stir: tiny specks riding the front
    c.fillStyle = `rgba(228,214,168,${0.45 * waveAlpha})`;
    for (let i = 0; i < 30; i++) {
      const x = r() * W;
      const yy = edgeY(x) + (r() - 0.6) * 24;
      c.fillRect(x, yy, 1.6, 1.2);
    }
    c.restore();
  }
  function drawShadow(c, t) {
    if (!shadow.active || shadow.grow <= 0.01) return;
    const s = shadow.grow;
    c.save();
    c.globalCompositeOperation = 'multiply';
    const g = c.createRadialGradient(shadow.x, shadow.y, 0, shadow.x, shadow.y, 84 * s);
    g.addColorStop(0, `rgba(52,48,44,${0.52 * s})`);
    g.addColorStop(1, 'rgba(52,48,44,0)');
    c.fillStyle = g;
    c.beginPath(); c.ellipse(shadow.x, shadow.y, 78 * s, 64 * s, 0, 0, Math.PI * 2); c.fill();
    c.restore();
    // fingertip rim
    c.fillStyle = `rgba(20,17,12,${0.5 * s})`;
    c.beginPath(); c.ellipse(shadow.x, shadow.y, 12, 12, 0, 0, Math.PI * 2); c.fill();
  }
  function drawVignette(c) {
    const g = c.createRadialGradient(L.cx, L.cy, Math.min(W, H) * 0.42, L.cx, L.cy, Math.max(W, H) * 0.78);
    g.addColorStop(0, 'rgba(10,8,6,0)');
    g.addColorStop(1, 'rgba(10,8,6,0.42)');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
  }

  function render(dt) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawRock(ctx);
    drawPoolBase(ctx);
    drawCaustics(ctx, time);
    drawLedgeShadows(ctx);
    drawWeed(ctx, time);
    drawLedges(ctx);
    drawAnemones(ctx, time);
    drawHermits(ctx, time);
    drawShoreCrabs(ctx, time);
    drawStarfish(ctx, time);
    drawFish(ctx, time);
    drawSheen(ctx, time);
    drawWave(ctx);
    drawRipples(ctx);
    drawShadow(ctx, time);
    drawVignette(ctx);
  }
  function loop(now) {
    requestAnimationFrame(loop);
    const t = now / 1000;
    let dt = t - (loop.last || t);
    dt = Math.min(dt, 0.05);
    loop.last = t;
    if (dt <= 0) return;
    update(dt);
    DEV.frames = frames;
    render(dt);
  }

  // ---------- resize / init ----------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    layout();
    buildLedges();
    buildPockets();
    makeCausticsTexture();
    rockLayer = null;
    poolBase = null;
    buildCreatures();
  }
  window.addEventListener('resize', resize);
  resize();

  requestAnimationFrame(loop);
  setTimeout(() => { DEV.ready = true; }, 80);
})();
</script>
