<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BLACK HOLE — flight past an event horizon</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #010208; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #hud {
    position: fixed; left: 14px; bottom: 12px; z-index: 2; pointer-events: none;
    font: 11px/1.7 ui-monospace, Menlo, monospace; letter-spacing: .14em;
    color: rgba(214,222,236,.68); text-shadow: 0 1px 3px rgba(0,0,0,.85);
    text-transform: uppercase;
  }
  #hud b { color: rgba(255,228,190,.92); font-weight: 700; }
  #audiohint {
    position: fixed; top: 12px; right: 14px; z-index: 2;
    background: rgba(8,10,18,.55); border: 1px solid rgba(255,190,110,.26); border-radius: 8px;
    padding: 7px 12px; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    font: 11px/1.5 ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(255,224,180,.85); text-shadow: 0 1px 3px rgba(0,0,0,.85); cursor: pointer;
  }
  #audiohint.off { color: rgba(170,175,185,.5); border-color: rgba(150,150,150,.2); }
  #fatal {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 3;
    font: 14px/1.6 ui-monospace, Menlo, monospace; color: #e8e2d4; background: #010208;
    text-align: center; padding: 2em; white-space: pre;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>BLACK HOLE</b> · gravitational lensing · Keplerian disk &nbsp;·&nbsp; drag to look &nbsp;·&nbsp; click = drone &nbsp;·&nbsp; tap = drop probe</div>
<div id="audiohint">click for gravitational drone</div>
<div id="fatal"></div>
<script>
'use strict';

const qs = new URLSearchParams(location.search);
const LITE = qs.get('lite') === '1';
const SEED = (qs.get('seed') | 0) || 903;
const RETINA = (window.devicePixelRatio || 1) >= 2;
const RENDER_SCALE = LITE ? 0.5 : (RETINA ? 0.8 : 0.92);

/* physics constants, Schwarzschild units: rs = 1 (M = 0.5) */
const RS = 1.0;
const B_CRIT = 2.598;               // 3*sqrt(3)*M — photon capture cone
const R_IN = 3.0;                  // ISCO = 3 rs
const R_OUT = 13.0;
const ESC_R = 26.0;

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) {
  const f = document.getElementById('fatal');
  f.style.display = 'grid';
  f.textContent = 'WebGL2 required.\nThis demo needs a WebGL2-capable browser.';
  throw new Error('no webgl2');
}
const HDR_OK = !!gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');

/* ---------------- shaders ---------------- */

const VS_QUAD = `#version 300 es
precision highp float;
out vec2 vUv;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FS_SCENE = `#version 300 es
precision highp float;
in vec2 vUv;
uniform vec2 uRes;
uniform float uTime;
uniform int uSteps;
uniform vec3 uCamPos;
uniform mat3 uCamBasis;      // columns: right, up, forward
uniform float uProx;         // 0..1 proximity to the hole (drives audio-reactive glow)
out vec4 fragColor;

#define RS ${RS.toFixed(1)}
#define R_IN ${R_IN.toFixed(1)}
#define R_OUT ${R_OUT.toFixed(1)}
#define ESC_R ${ESC_R.toFixed(1)}
#define B_CRIT ${B_CRIT.toFixed(3)}

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p){ p = fract(p * 0.1031); p += dot(p, p.yzx + 33.33); return fract((p.x + p.y) * p.z); }

float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float n000 = hash13(i), n100 = hash13(i + vec3(1,0,0));
  float n010 = hash13(i + vec3(0,1,0)), n110 = hash13(i + vec3(1,1,0));
  float n001 = hash13(i + vec3(0,0,1)), n101 = hash13(i + vec3(1,0,1));
  float n011 = hash13(i + vec3(0,1,1)), n111 = hash13(i + vec3(1,1,1));
  return mix(mix(mix(n000,n100,f.x), mix(n010,n110,f.x), f.y),
             mix(mix(n001,n101,f.x), mix(n011,n111,f.x), f.y), f.z);
}
float fbm2(vec2 p){
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 4; i++){ s += a * vnoise(vec3(p, 3.7)); p = p * 2.17 + vec2(1.9, 0.7); a *= 0.5; }
  return s;
}

vec3 blackbody(float t){
  vec3 c = mix(vec3(0.42, 0.10, 0.02), vec3(1.0, 0.38, 0.05), smoothstep(0.10, 0.42, t));
  c = mix(c, vec3(1.0, 0.66, 0.22), smoothstep(0.42, 0.68, t));
  c = mix(c, vec3(1.0, 0.92, 0.72), smoothstep(0.68, 0.88, t));
  c = mix(c, vec3(0.80, 0.88, 1.0), smoothstep(0.95, 1.35, t));
  c = mix(c, vec3(0.62, 0.76, 1.0), smoothstep(1.35, 2.1, t));
  return c;
}

/* ---------- starfield: sparse bright stars + faint dust + milky way ---------- */
vec3 starfield(vec3 rd, float focus, vec2 sdir){
  vec3 c = vec3(0.0016, 0.0020, 0.0038);
  vec2 sv = vec2(atan(rd.z, rd.x), asin(clamp(rd.y, -1.0, 1.0)));

  // galactic band: dim great-circle haze with dust lanes
  vec3 mw = normalize(vec3(0.55, 0.40, -0.73));
  float lat = acos(clamp(dot(rd, mw), -1.0, 1.0));
  float band = exp(-lat * lat * 6.5);
  float lon = atan(dot(rd, normalize(cross(vec3(0,1,0), mw))), dot(rd, normalize(vec3(1,0,0))));
  float haze = fbm2(vec2(lon * 2.2, lat * 3.0));
  float rift = smoothstep(0.48, 0.82, fbm2(vec2(lon * 4.5 + 8.0, lat * 6.0)));
  c += mix(vec3(0.016, 0.014, 0.026), vec3(0.052, 0.046, 0.070), haze) * band * (1.0 - rift * 0.65);

  // two star layers: bright sparse, faint dense
  for (int L = 0; L < 2; L++){
    float N = L == 0 ? 190.0 : 380.0;
    vec2 sc = vec2(sv.x * N * 0.63662, (sv.y + 1.5708) * N * 0.31831);
    vec2 cell = floor(sc);
    vec2 fc = fract(sc);
    float h = hash12(cell + float(L) * 71.3 + ${(SEED % 997).toFixed(1)});
    float thresh = L == 0 ? 0.952 : 0.915;
    if (h > thresh){
      vec2 jit = vec2(hash12(cell + 3.1), hash12(cell + 7.7)) * 0.7 + 0.15;
      vec2 dd = fc - jit;
      dd.x *= max(cos(sv.y), 0.18);                       // round stars at high declination
      float mag = (h - thresh) / (1.0 - thresh);
      float tw = 0.72 + 0.28 * sin(uTime * (1.3 + mag * 5.0) + h * 61.0);
      float K = L == 0 ? 300.0 : 190.0;
      // Jacobian focusing near the shadow limb: magnified stars stretch tangentially
      float drp = dd.x * sdir.x + dd.y * sdir.y;
      float dtp = dd.x * sdir.y - dd.y * sdir.x;
      float glow = exp(-(drp * drp * K * 1.15 + dtp * dtp * K / focus));
      vec3 tint = mix(vec3(0.72, 0.80, 1.0), vec3(1.0, 0.82, 0.62), hash12(cell + 13.7));
      c += tint * glow * tw * (L == 0 ? (0.5 + mag * 2.6) : 0.28);
    }
  }
  return c;
}

/* ---------- accretion disk sample at equatorial crossing q ---------- */
vec3 diskEmission(vec3 q, vec3 towardCam, out float opacity){
  float r = length(q.xz);
  float ang = atan(q.z, q.x);
  float om = sqrt(0.5 / (r * r * r));                    // Keplerian Omega (M=0.5)
  float a2 = ang - uTime * om * 2.6;                     // sheared pattern
  float lr = log(r);
  float n = fbm2(vec2(a2 * 2.6 + lr * 3.4, lr * 5.5 - uTime * 0.10));
  float streaks = 0.5 + 0.5 * sin(a2 * 7.0 + sin(a2 * 3.0 + lr * 4.0) * 1.6 - lr * 9.0 + n * 2.6);
  float radial = smoothstep(R_IN * 1.02, R_IN * 2.0, r) * smoothstep(R_OUT, R_OUT * 0.60, r);
  float dens = pow(max(n * 1.45 - 0.34, 0.0), 1.5) * (0.28 + 0.72 * pow(streaks, 1.3)) * radial;
  opacity = clamp(dens * 0.8, 0.0, 0.9);

  float temp = pow(R_IN / r, 0.72);                      // thin-disk thermal gradient
  // relativistic Doppler: beta = sqrt(M/(r-2M)) local orbital speed
  float beta = min(0.72, sqrt(0.5 / max(r - RS, 0.8)));
  float gam = 1.0 / sqrt(max(1.0 - beta * beta, 1e-4));
  vec3 vd = normalize(cross(vec3(0, 1, 0), q));         // orbital velocity direction
  float cs = dot(vd, normalize(towardCam));
  float dlt = 1.0 / (gam * (1.0 - beta * cs));          // Doppler factor
  float g = sqrt(max(1.0 - RS / r, 0.02));              // gravitational redshift
  float bright = pow(dlt, 3.0) * g * g;                  // relativistic beaming
  bright = bright / (1.0 + max(bright - 3.0, 0.0) * 0.22);  // soft knee: turbulence survives the beamed core
  // observed colour temperature rides delta*g: approaching side whitens/blues,
  // receding side reddens — one physical colour law, not a painted tint
  float tobs = clamp((temp * 0.9 + 0.30) * dlt * g, 0.12, 1.9);
  return blackbody(tobs) * dens * bright * (1.25 + uProx * 0.45);
}

void main(){
  vec2 ndc = vUv * 2.0 - 1.0;
  ndc.x *= uRes.x / uRes.y;
  vec3 rd = normalize(uCamBasis * vec3(ndc.x, ndc.y, 1.9));
  vec3 ro = uCamPos;

  float r0 = length(ro);
  vec3 e1 = ro / r0;
  float a = dot(rd, e1);
  vec3 e2v = rd - a * e1;
  float b = r0 * length(e2v);                  // impact parameter (rs units)
  vec3 e2 = b > 1e-4 ? e2v / length(e2v) : vec3(0.0, 1.0, 0.0);

  // exact null geodesic in the orbital plane: u'' + u = 1.5*RS*u^2, u = 1/r.
  // Leapfrog in phi; escape direction rebuilt from conserved h = b.
  float u = 1.0 / r0;
  float w = b > 1e-4 ? -a / b : 1.0;
  float phi = 0.0;
  vec3 pPrev = ro;
  vec3 col = vec3(0.0);
  float T = 1.0;
  bool captured = !(b > 1e-4);
  for (int i = 0; i < 240; i++){
    if (i >= uSteps || captured) break;
    float r = 1.0 / u;
    float dlam = clamp(0.06 * r, 0.015, 0.9);           // affine step ~ 6% of range
    float dphi = min((r < 2.0 ? 0.055 : 0.2), b * u * u * dlam);   // finer near-critical steps: kills edge scalloping
    // RK4 on (u, w): Euler pumps orbital energy and over-bends near the hole
    float f1 = -u + 1.5 * RS * u * u;
    float uh1 = u + 0.5 * dphi * w,        wh1 = w + 0.5 * dphi * f1;
    float f2 = -uh1 + 1.5 * RS * uh1 * uh1;
    float uh2 = u + 0.5 * dphi * wh1,     wh2 = w + 0.5 * dphi * f2;
    float f3 = -uh2 + 1.5 * RS * uh2 * uh2;
    float u4 = u + dphi * wh2,            w4 = w + dphi * f3;
    float f4 = -u4 + 1.5 * RS * u4 * u4;
    u += dphi * (w + 2.0 * wh1 + 2.0 * wh2 + w4) / 6.0;
    w += dphi * (f1 + 2.0 * f2 + 2.0 * f3 + f4) / 6.0;
    phi += dphi;
    float rn = 1.0 / u;
    if (rn < RS){ captured = true; break; }
    vec3 rhat = cos(phi) * e1 + sin(phi) * e2;
    vec3 p = rn * rhat;
    if (pPrev.y * p.y < 0.0 && T > 0.015){    // crossed the disk plane
      float f = pPrev.y / (pPrev.y - p.y);
      vec3 q = mix(pPrev, p, f);
      float rr = length(q.xz);
      if (rr > R_IN && rr < R_OUT){
        float vr = clamp(-w * b, -1.0, 1.0);
        vec3 phihat = -sin(phi) * e1 + cos(phi) * e2;
        vec3 vstep = normalize(vr * rhat + b * u * phihat);
        float op;
        col += T * diskEmission(q, vstep, op);
        T *= 1.0 - op;
      }
    }
    pPrev = p;
    if (rn > ESC_R && w < 0.0) break;
  }

  vec3 v = normalize(-w * b * (cos(phi) * e1 + sin(phi) * e2) + b * u * (-sin(phi) * e1 + cos(phi) * e2));
  float focus = captured ? 1.0 : clamp(1.0 + 2.2 * exp(-max(b - B_CRIT, 0.0) * 2.2), 1.0, 3.4);
  vec2 sdir = length(ndc) > 1e-4 ? normalize(ndc) : vec2(1.0, 0.0);
  vec3 bg = captured ? vec3(0.0) : starfield(v, focus, sdir);

  // photon ring: rays escaping just outside the critical impact parameter
  // skim their last orbits before flying away — a thin bright line hugging
  // the shadow edge from OUTSIDE. Captured rays stay pure black (#1046).
  if (!captured){
    float ring = exp(-max(b - B_CRIT, 0.0) * 14.0);
    col += vec3(1.0, 0.85, 0.62) * ring * 0.5;
  }
  col += bg * T;
  fragColor = vec4(max(col, vec3(0.0)), 1.0);
}`;

const FS_BRIGHT = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
uniform float uThresh;
out vec4 o;
void main(){
  vec3 c = texture(uTex, vUv).rgb;
  float m = max(c.r, max(c.g, c.b));
  float k = smoothstep(uThresh, uThresh + 0.6, m);
  o = vec4(c * k, 1.0);
}`;

const FS_BLUR = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uDir;
out vec4 o;
void main(){
  vec3 c = texture(uTex, vUv).rgb * 0.227027;
  c += (texture(uTex, vUv + uDir * 1.3846).rgb + texture(uTex, vUv - uDir * 1.3846).rgb) * 0.3162162;
  c += (texture(uTex, vUv + uDir * 3.2307).rgb + texture(uTex, vUv - uDir * 3.2307).rgb) * 0.0702702;
  o = vec4(c, 1.0);
}`;

const FS_COMP = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uHdr;
uniform sampler2D uBloom;
uniform float uGain;
uniform float uTime;
out vec4 o;
vec3 aces(vec3 x){
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}
float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
void main(){
  vec3 c = texture(uHdr, vUv).rgb + texture(uBloom, vUv).rgb * uGain;
  c = aces(c * 1.12);
  c = pow(c, vec3(1.0 / 2.2));
  vec2 q = vUv - 0.5;
  c *= 1.0 - dot(q, q) * 0.38;
  float g = h21(vUv * vec2(1920.0, 1080.0) + fract(uTime) * 137.0) - 0.5;
  c += g * 0.014;
  o = vec4(c, 1.0);
}`;

/* probe beacons (#1047): additive screen-space glow sprites, drawn into HDR
   before the bloom tap so a falling probe blooms like the disk does.
   #1074: heads + decaying motion-trail sprites in one pass, plus expanding
   launch-puff rings (uQ) so the release reads as an event, not a spawn. */
const SPRITE_MAX = 42;
const FS_PROBE = `#version 300 es
precision highp float;
in vec2 vUv;
uniform vec2 uRes;
uniform vec4 uP[${SPRITE_MAX}];
uniform vec3 uC[${SPRITE_MAX}];
uniform vec4 uQ[4];
uniform vec3 uQC[4];
uniform int uNP;
uniform int uNQ;
out vec4 o;
void main(){
  vec2 f = vUv * uRes;
  vec3 c = vec3(0.0);
  for (int i = 0; i < ${SPRITE_MAX}; i++){
    if (i >= uNP || uP[i].w <= 0.0) continue;
    vec2 d = f - uP[i].xy;
    float r2 = dot(d, d);
    float s2 = uP[i].z * uP[i].z;
    c += uC[i] * uP[i].w * (exp(-r2 / s2) + 2.4 * exp(-r2 / (s2 * 0.11)));
  }
  for (int j = 0; j < 4; j++){
    if (j >= uNQ || uQ[j].w <= 0.0) continue;
    vec2 d = f - uQ[j].xy;
    float dr = length(d) - uQ[j].z;
    c += uQC[j] * uQ[j].w * exp(-dr * dr / 110.0);
  }
  o = vec4(c, 1.0);
}`;

/* ---------------- GL helpers ---------------- */

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    console.error('shader compile failed:\n' + log);
    throw new Error('shader: ' + log);
  }
  return s;
}
function program(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  return p;
}

const progScene = program(VS_QUAD, FS_SCENE);
const progBright = program(VS_QUAD, FS_BRIGHT);
const progBlur = program(VS_QUAD, FS_BLUR);
const progComp = program(VS_QUAD, FS_COMP);
const progProbe = program(VS_QUAD, FS_PROBE);
const vaoEmpty = gl.createVertexArray();

const HDRF = HDR_OK ? gl.RGBA16F : gl.RGBA8;
const HDRType = HDR_OK ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

function makeTarget(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, HDRF, w, h, 0, gl.RGBA, HDRType, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo, w, h };
}

let W = 0, H = 0, hdr = null, b1 = null, b2 = null, qCap = 1;
function effScale(){ return RENDER_SCALE * qCap; }
function stepsFor(){ return Math.max(LITE ? 110 : 180, STEPS_TOP - dropSteps); }

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, LITE ? 1 : 1.5);
  const cw = Math.floor(canvas.clientWidth * dpr * effScale());
  const ch = Math.floor(canvas.clientHeight * dpr * effScale());
  if (cw === W && ch === H) return;
  W = Math.max(2, cw); H = Math.max(2, ch);
  canvas.width = W; canvas.height = H;
  hdr = makeTarget(W, H);
  const bw = Math.max(2, W >> 2), bh = Math.max(2, H >> 2);
  b1 = makeTarget(bw, bh);
  b2 = makeTarget(bw, bh);
}
resize();
addEventListener('resize', resize);

/* ---------------- camera: slow flight past the hole ---------------- */

const STEPS_TOP = 240;
let dropSteps = 0;
const cam = { yaw: 0, pitch: 0, tyaw: 0, tpitch: 0, touched: 0 };
let drag = null;
let downPt = null;
canvas.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY };
  downPt = { x: e.clientX, y: e.clientY, t: performance.now() };
  canvas.setPointerCapture(e.pointerId);
  cam.touched = performance.now();
  unlockAudio();
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  cam.tyaw = Math.max(-1.2, Math.min(1.2, cam.tyaw - (e.clientX - drag.x) * 0.0035));
  cam.tpitch = Math.max(-0.5, Math.min(0.55, cam.tpitch - (e.clientY - drag.y) * 0.003));
  drag = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', e => {
  if (downPt && performance.now() - downPt.t < 300 &&
      Math.hypot(e.clientX - downPt.x, e.clientY - downPt.y) < 12) dropProbe(e.clientX, e.clientY);
  drag = null;
  downPt = null;
});

function flight(t){
  const th = t * 0.05 + Math.sin(t * 0.021 + 0.6) * 0.22 + cam.yaw;
  const R = 14.5 + 7 * Math.sin(t * 0.045 + 1.9);       // close pass to ~7.5 rs at mid-loop (#956)
  const el = 0.13 + 0.09 * Math.sin(t * 0.028 + 0.8) + cam.pitch * 0.55;
  const ce = Math.cos(el), se = Math.sin(el);
  const pos = [R * ce * Math.sin(th), R * se, R * ce * Math.cos(th)];
  let f = [-pos[0], -pos[1], -pos[2]];
  const fl = Math.hypot(f[0], f[1], f[2]);
  f = [f[0] / fl, f[1] / fl, f[2] / fl];
  const pitchTilt = cam.pitch * 0.75;
  const up0 = [0, 1, 0];
  let r = [up0[1] * f[2] - up0[2] * f[1], up0[2] * f[0] - up0[0] * f[2], up0[0] * f[1] - up0[1] * f[0]];
  const rl = Math.hypot(r[0], r[1], r[2]) || 1;
  r = [r[0] / rl, r[1] / rl, r[2] / rl];
  let u = [f[1] * r[2] - f[2] * r[1], f[2] * r[0] - f[0] * r[2], f[0] * r[1] - f[1] * r[0]];
  const cp = Math.cos(pitchTilt), sp = Math.sin(pitchTilt);
  const f2 = [f[0] * cp + u[0] * sp, f[1] * cp + u[1] * sp, f[2] * cp + u[2] * sp];
  const u2 = [u[0] * cp - f[0] * sp, u[1] * cp - f[1] * sp, u[2] * cp - f[2] * sp];
  const prox = Math.max(0, Math.min(1, (21.5 - Math.hypot(pos[0], pos[1], pos[2])) / 14));
  return { pos, f: f2, u: u2, r, prox, R, th };
}

/* ---------------- probes (#1047): glowing beacons dropped toward the hole ----- *
 * A tap releases a beacon from the camera, inheriting the drone's orbital
 * velocity plus an inward shove — so it's a real infalling test particle:
 * motion stays in the (position, velocity) plane; we integrate the exact
 * Schwarzschild geodesic in PROPER time,
 *   dv_r/dtau = -(rs/2r^2)(1 + L^2/r^2) + (1 - rs/r) L^2/r^3,
 *   dphi/dtau = L/r^2,   dt/dtau = e/f,   e^2 = f0^2/(f0 - v0^2),
 * then convert to coordinate time (the camera's clock): the (1 - rs/r) factor
 * is gravitational time dilation, so the beacon asymptotically freezes above
 * the horizon, which is what an outside observer actually sees. Observed light
 * rides g = sqrt(1 - rs/r): colour blackbody(T0*g), intensity ~ g^3 — reddens
 * into infra-red and dims to nothing. Its apparent position is NOT the straight
 * projection: light from the probe reaches the camera along a null geodesic,
 * and by reflection symmetry through the camera-probe-hole plane the primary
 * image lies in that plane — so a golden-section search over a single in-plane
 * launch angle through the same RK4 light-bender finds where the beacon is
 * actually seen. Near the horizon that solution pins to the shadow rim.       */

const PROBE_MAX = 6
const PROBE_T0 = 1.15
const PROBE_SPEED = 0.7          // Schwarzschild coordinate seconds per real second
const PROBE_SHOVE = 0.8          // launch speed added along the aim (rs/s)
const PROBE_KILL = 0.02          // retire once the g^3 sink drops below this
const TRAIL_MAX = 6              // solved image samples kept for the motion trail (#1074)
const PUFF_MAX = 4
const PUFF_DUR = 0.55          // launch puff ring lifetime (s)
let probes = []
let puffs = []
let lastCb = null

/* off-screen fade (#1074): a beacon leaving the frame dims along the rim over
   the last 15% instead of popping out at the vis cutoff. */
function edgeFade(nx, ny){
  const e = Math.max(Math.abs(nx), Math.abs(ny))
  return e <= 1 ? 1 : Math.max(0, 1 - (e - 1) / 0.15)
}

function blackbodyJS(t){
  let c = [0.42, 0.10, 0.02]
  const mix = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]
  const ss = (e0, e1, x) => { const u = Math.max(0, Math.min(1, (x - e0) / (e1 - e0))); return u * u * (3 - 2 * u) }
  c = mix(c, [1.0, 0.38, 0.05], ss(0.10, 0.42, t))
  c = mix(c, [1.0, 0.66, 0.22], ss(0.42, 0.68, t))
  c = mix(c, [1.0, 0.92, 0.72], ss(0.68, 0.88, t))
  c = mix(c, [0.80, 0.88, 1.0], ss(0.95, 1.35, t))
  c = mix(c, [0.62, 0.76, 1.0], ss(1.35, 2.1, t))
  return c
}

function dropProbe(cssX, cssY){
  const cb = lastCb
  if (!cb) return
  const t = (performance.now() - t0) / 1000
  const pA = flight(t + 0.06), pB = flight(t - 0.06)
  const camV = [(pA.pos[0] - pB.pos[0]) / 0.12, (pA.pos[1] - pB.pos[1]) / 0.12, (pA.pos[2] - pB.pos[2]) / 0.12]
  const aspect = W / Math.max(1, H)
  const nx = ((cssX / Math.max(1, canvas.clientWidth)) * 2 - 1) * aspect
  const ny = -((cssY / Math.max(1, canvas.clientHeight)) * 2 - 1)
  let aim = [cb.r[0] * nx + cb.u[0] * ny + cb.f[0] * 1.9,
             cb.r[1] * nx + cb.u[1] * ny + cb.f[1] * 1.9,
             cb.r[2] * nx + cb.u[2] * ny + cb.f[2] * 1.9]
  const al = Math.hypot(aim[0], aim[1], aim[2])
  aim = [aim[0] / al, aim[1] / al, aim[2] / al]
  const v = [camV[0] * 0.95 + aim[0] * PROBE_SHOVE, camV[1] * 0.95 + aim[1] * PROBE_SHOVE, camV[2] * 0.95 + aim[2] * PROBE_SHOVE]
  const C = cb.pos
  const p = [C[0] + aim[0] * 2.2, C[1] + aim[1] * 2.2, C[2] + aim[2] * 2.2]
  const pr0 = Math.hypot(p[0], p[1], p[2])
  if (pr0 < RS * 1.8) return
  const ex0 = p[0] / pr0, ex1 = p[1] / pr0, ex2 = p[2] / pr0
  const vr0raw = v[0] * ex0 + v[1] * ex1 + v[2] * ex2
  let vt = [v[0] - vr0raw * ex0, v[1] - vr0raw * ex1, v[2] - vr0raw * ex2]
  const vtl = Math.hypot(vt[0], vt[1], vt[2])
  if (vtl < 1e-6) return
  const sgn = Math.sign(vt[0] * camV[0] + vt[1] * camV[1] + vt[2] * camV[2]) || 1
  // the drone's scripted path is powered, not geodesic: inherit its tangential
  // drift only up to the capture threshold L ~ 2.3 rs (above that the beacons
  // ride centrifugal orbits instead of falling in), and always shove inward.
  const vr0 = Math.min(vr0raw, -0.45)
  const f0 = 1 - RS / pr0
  let v2 = vr0 * vr0 + Math.min(vtl, 0.3) * Math.min(vtl, 0.3)
  let e = Math.sqrt(f0 * f0 / Math.max(f0 - v2, 1e-4))
  let vt0 = sgn * Math.min(vtl, 2.3 * f0 / (pr0 * e))
  v2 = vr0 * vr0 + vt0 * vt0
  if (v2 > 0.85 * f0) v2 = 0.85 * f0
  e = Math.sqrt(f0 * f0 / Math.max(f0 - v2, 1e-4))
  const ex = [ex0, ex1, ex2]
  const ey = [vt[0] / vtl, vt[1] / vtl, vt[2] / vtl]
  const L = pr0 * vt0 * e / f0
  const pr = { ex, ey, r: pr0, r0: pr0, phi: 0, vr: vr0 * e / f0, e, L, t: 0, trail: [], dlt: 1 }
  probes.push(pr)
  if (probes.length > PROBE_MAX) probes.shift()
  const im0 = probeImage(pr, cb)
  if (im0.vis) puffs.push({ x: im0.x, y: im0.y, t: 0 })
  if (puffs.length > PUFF_MAX) puffs.shift()
  probeBlip()
}

/* launch blip (#1074): a short radio-ping on the drone's receiver — downward
   chirp, quiet, synthesized on the existing drone AudioContext. */
function probeBlip(){
  if (!running || !AC) return
  const t0a = AC.currentTime
  const o = AC.createOscillator(); o.type = 'sine'
  o.frequency.setValueAtTime(760, t0a)
  o.frequency.exponentialRampToValueAtTime(150, t0a + 0.32)
  const g = AC.createGain()
  g.gain.setValueAtTime(0.0001, t0a)
  g.gain.exponentialRampToValueAtTime(0.05, t0a + 0.015)
  g.gain.exponentialRampToValueAtTime(0.0001, t0a + 0.34)
  o.connect(g).connect(master)
  o.start(t0a); o.stop(t0a + 0.36)
}

function probeWorld(pr){
  const c = Math.cos(pr.phi), s = Math.sin(pr.phi)
  return [pr.r * (c * pr.ex[0] + s * pr.ey[0]), pr.r * (c * pr.ex[1] + s * pr.ey[1]), pr.r * (c * pr.ex[2] + s * pr.ey[2])]
}

function stepProbes(dt){
  let budget0 = Math.min(dt, 0.05) * PROBE_SPEED
  for (const pr of probes){
    pr.t += dt
    let budget = budget0
    for (let n = 0; n < 500 && budget > 1e-6; n++){
      const f = Math.max(1 - RS / pr.r, 1e-9)
      const k = Math.min(0.004, budget * f / pr.e)
      if (k <= 0) break
      const l2 = pr.L * pr.L
      const ar = -(RS / (2 * pr.r * pr.r)) * (1 + l2 / (pr.r * pr.r)) + f * l2 / (pr.r * pr.r * pr.r)
      pr.vr += ar * k
      pr.r += pr.vr * k
      pr.phi += pr.L / (pr.r * pr.r) * k
      budget -= k * pr.e / f
      if (pr.r < RS + 1e-7){ pr.r = RS + 1e-7; pr.vr = 0 }
    }
  }
  probes = probes.filter(pr =>
    Math.pow(Math.max(1 - RS / pr.r, 0), 1.5) >= PROBE_KILL && pr.r < pr.r0 + 6 && pr.t < 90)
}

function probeGlow(pr){
  const g = Math.sqrt(Math.max(1 - RS / pr.r, 0))
  return { g, w: g * g * g * Math.min(1, pr.t / 0.3) }
}

/* Primary-image solve: null geodesic from the camera that passes through the
   probe world point. Search one in-plane launch angle; miss = closest the
   bent ray comes to the probe. */
function probeImage(pr, cb){
  const C = cb.pos
  const rC = Math.hypot(C[0], C[1], C[2])
  const eC = [C[0] / rC, C[1] / rC, C[2] / rC]
  const P = probeWorld(pr)
  const pR = pr.r
  const cp = (P[0] * eC[0] + P[1] * eC[1] + P[2] * eC[2]) / pR
  const sp = Math.sqrt(Math.max(1 - cp * cp, 1e-9))
  const eP = [(P[0] / pR - cp * eC[0]) / sp, (P[1] / pR - cp * eC[1]) / sp, (P[2] / pR - cp * eC[2]) / sp]
  const psi = Math.acos(Math.max(-1, Math.min(1, cp)))
  const chord = [P[0] - C[0], P[1] - C[1], P[2] - C[2]]
  const cl = Math.hypot(chord[0], chord[1], chord[2]) || 1
  const a0 = (chord[0] * eC[0] + chord[1] * eC[1] + chord[2] * eC[2]) / cl
  const b0 = (chord[0] * eP[0] + chord[1] * eP[1] + chord[2] * eP[2]) / cl

  const missOf = (al) => {
    const ca = Math.cos(al), sa = Math.sin(al)
    const aa = a0 * ca - b0 * sa, bb = a0 * sa + b0 * ca
    let d = [eC[0] * aa + eP[0] * bb, eC[1] * aa + eP[1] * bb, eC[2] * aa + eP[2] * bb]
    const dl = Math.hypot(d[0], d[1], d[2])
    d = [d[0] / dl, d[1] / dl, d[2] / dl]
    const a = d[0] * eC[0] + d[1] * eC[1] + d[2] * eC[2]
    const e2v = [d[0] - a * eC[0], d[1] - a * eC[1], d[2] - a * eC[2]]
    const b = rC * Math.hypot(e2v[0], e2v[1], e2v[2])
    if (b < 1e-4) return 1e9
    const e2l = Math.hypot(e2v[0], e2v[1], e2v[2])
    const e2 = [e2v[0] / e2l, e2v[1] / e2l, e2v[2] / e2l]
    let u = 1 / rC, w = -a / b, phi = 0
    let best = Math.hypot(P[0] - C[0], P[1] - C[1], P[2] - C[2])
    for (let i = 0; i < 130; i++){
      const r = 1 / u
      const dlam = Math.min(0.9, Math.max(0.015, 0.06 * r))
      const dphi = Math.min(r < 2 ? 0.05 : 0.16, b * u * u * dlam)
      const f1 = -u + 1.5 * RS * u * u
      const uh1 = u + 0.5 * dphi * w, wh1 = w + 0.5 * dphi * f1
      const f2 = -uh1 + 1.5 * RS * uh1 * uh1
      const uh2 = u + 0.5 * dphi * wh1, wh2 = w + 0.5 * dphi * f2
      const f3 = -uh2 + 1.5 * RS * uh2 * uh2
      const u4 = u + dphi * wh2, w4 = w + dphi * f3
      const f4 = -u4 + 1.5 * RS * u4 * u4
      u += dphi * (w + 2 * wh1 + 2 * wh2 + w4) / 6
      w += dphi * (f1 + 2 * f2 + 2 * f3 + f4) / 6
      phi += dphi
      const rn = 1 / u
      if (rn < RS) return best
      const cph = Math.cos(phi), sph = Math.sin(phi)
      const p = [rn * (cph * eC[0] + sph * e2[0]), rn * (cph * eC[1] + sph * e2[1]), rn * (cph * eC[2] + sph * e2[2])]
      const md = Math.hypot(p[0] - P[0], p[1] - P[1], p[2] - P[2])
      if (md < best) best = md
      if (phi > psi + 0.5 && rn > pr.r) break
    }
    return best
  }

  let lo = -0.7, hi = 0.7
  const gr = (gr0, gr1, n) => { let bm = 1e9, bx = 0
    for (let i = 0; i <= n; i++){ const x = gr0 + (gr1 - gr0) * i / n; const m = missOf(x); if (m < bm){ bm = m; bx = x } }
    return [bx, bm] }
  let [xb, mb] = gr(lo, hi, 7)
  const phiG = 0.6180339887
  for (let i = 0; i < 9; i++){
    const a1 = hi - (hi - lo) * phiG, a2 = lo + (hi - lo) * phiG
    const m1 = missOf(a1), m2 = missOf(a2)
    if (m1 < m2){ hi = a2; if (m1 < mb){ mb = m1; xb = a1 } } else { lo = a1; if (m2 < mb){ mb = m2; xb = a2 } }
    if (hi - lo < 0.004) break
  }
  const ca = Math.cos(xb), sa = Math.sin(xb)
  const d = [eC[0] * (a0 * ca - b0 * sa) + eP[0] * (a0 * sa + b0 * ca),
             eC[1] * (a0 * ca - b0 * sa) + eP[1] * (a0 * sa + b0 * ca),
             eC[2] * (a0 * ca - b0 * sa) + eP[2] * (a0 * sa + b0 * ca)]
  const zf = d[0] * cb.f[0] + d[1] * cb.f[1] + d[2] * cb.f[2]
  if (zf <= 0.05) return { vis: false, fade: 0, miss: mb, alpha: xb }
  const k = 1.9 / zf
  const nx = (d[0] * cb.r[0] + d[1] * cb.r[1] + d[2] * cb.r[2]) * k
  const ny = (d[0] * cb.u[0] + d[1] * cb.u[1] + d[2] * cb.u[2]) * k
  const aspect = W / Math.max(1, H)
  return { vis: Math.abs(nx / aspect) < 1.15 && Math.abs(ny) < 1.15,
    fade: edgeFade(nx / aspect, ny),
    x: ((nx / aspect + 1) / 2) * W, y: ((1 - ny) / 2) * H, miss: mb, alpha: xb }
}

/* coordinate-time velocity of a probe in world space (#1074): dv/dt from the
   proper-time state (dr/dt = vr*f/e, dphi/dt = L*f/(r^2*e)). */
function probeVelocity(pr){
  const f = Math.max(1 - RS / pr.r, 1e-9)
  const vrt = pr.vr * f / pr.e
  const rtpt = pr.L * f / (pr.r * pr.e)
  const c = Math.cos(pr.phi), s = Math.sin(pr.phi)
  return [vrt * (c * pr.ex[0] + s * pr.ey[0]) + rtpt * (-s * pr.ex[0] + c * pr.ey[0]),
          vrt * (c * pr.ex[1] + s * pr.ey[1]) + rtpt * (-s * pr.ex[1] + c * pr.ey[1]),
          vrt * (c * pr.ex[2] + s * pr.ey[2]) + rtpt * (-s * pr.ex[2] + c * pr.ey[2])]
}

/* the beacon's own Doppler hue (#1074): the disk law applied to the probe's
   line-of-sight velocity — approaching infall legs blueshift slightly,
   receding ones redden, on top of the gravitational redshift g. */
function probeDopplerHue(pr, cb){
  const v = probeVelocity(pr)
  const sp = Math.hypot(v[0], v[1], v[2])
  if (sp < 1e-6) return 1
  const P = probeWorld(pr)
  const nx = cb.pos[0] - P[0], ny = cb.pos[1] - P[1], nz = cb.pos[2] - P[2]
  const nl = Math.hypot(nx, ny, nz) || 1
  const beta = Math.min(0.45, sp)
  const gam = 1 / Math.sqrt(Math.max(1 - beta * beta, 1e-4))
  const cs = (v[0] * nx + v[1] * ny + v[2] * nz) / (sp * nl)
  return Math.max(0.55, Math.min(1.8, 1 / (gam * (1 - beta * cs))))
}

/* ---------------- JS mirror of the geodesic integrator (harness probes) ------- */

function traceRayJS(pIn, dIn, maxSteps){
  const r0 = Math.hypot(pIn[0], pIn[1], pIn[2]);
  const e1 = [pIn[0] / r0, pIn[1] / r0, pIn[2] / r0];
  const a = dIn[0] * e1[0] + dIn[1] * e1[1] + dIn[2] * e1[2];
  const e2v = [dIn[0] - a * e1[0], dIn[1] - a * e1[1], dIn[2] - a * e1[2]];
  const b = r0 * Math.hypot(e2v[0], e2v[1], e2v[2]);
  const e2l = Math.hypot(e2v[0], e2v[1], e2v[2]) || 1;
  const e2 = [e2v[0] / e2l, e2v[1] / e2l, e2v[2] / e2l];
  let u = 1 / r0, w = b > 1e-4 ? -a / b : 1, phi = 0;
  let pPrev = pIn.slice();
  let captured = !(b > 1e-4), escaped = false, hits = 0, rMin = r0;
  for (let i = 0; i < maxSteps; i++){
    if (captured) break;
    const r = 1 / u;
    rMin = Math.min(rMin, r);
    const dlam = Math.min(0.9, Math.max(0.015, 0.06 * r));
    const dphi = Math.min(r < 2 ? 0.055 : 0.2, b * u * u * dlam);
    const f1 = -u + 1.5 * RS * u * u;
    const uh1 = u + 0.5 * dphi * w, wh1 = w + 0.5 * dphi * f1;
    const f2 = -uh1 + 1.5 * RS * uh1 * uh1;
    const uh2 = u + 0.5 * dphi * wh1, wh2 = w + 0.5 * dphi * f2;
    const f3 = -uh2 + 1.5 * RS * uh2 * uh2;
    const u4 = u + dphi * wh2, w4 = w + dphi * f3;
    const f4 = -u4 + 1.5 * RS * u4 * u4;
    u += dphi * (w + 2 * wh1 + 2 * wh2 + w4) / 6;
    w += dphi * (f1 + 2 * f2 + 2 * f3 + f4) / 6;
    phi += dphi;
    const rn = 1 / u;
    if (rn < RS){ captured = true; break; }
    const rhat = [Math.cos(phi) * e1[0] + Math.sin(phi) * e2[0], Math.cos(phi) * e1[1] + Math.sin(phi) * e2[1], Math.cos(phi) * e1[2] + Math.sin(phi) * e2[2]];
    const p = [rn * rhat[0], rn * rhat[1], rn * rhat[2]];
    if (pPrev[1] * p[1] < 0){
      const f = pPrev[1] / (pPrev[1] - p[1]);
      const rr = Math.hypot(pPrev[0] + (p[0] - pPrev[0]) * f, pPrev[2] + (p[2] - pPrev[2]) * f);
      if (rr > R_IN && rr < R_OUT) hits++;
    }
    pPrev = p;
    if (rn > ESC_R && w < 0){ escaped = true; break; }
  }
  const vr = Math.max(-1, Math.min(1, -w * b));
  const ph = [-Math.sin(phi) * e1[0] + Math.cos(phi) * e2[0], -Math.sin(phi) * e1[1] + Math.cos(phi) * e2[1], -Math.sin(phi) * e1[2] + Math.cos(phi) * e2[2]];
  const rh = [Math.cos(phi) * e1[0] + Math.sin(phi) * e2[0], Math.cos(phi) * e1[1] + Math.sin(phi) * e2[1], Math.cos(phi) * e1[2] + Math.sin(phi) * e2[2]];
  const v = [vr * rh[0] + b * u * ph[0], vr * rh[1] + b * u * ph[1], vr * rh[2] + b * u * ph[2]];
  const vl = Math.hypot(v[0], v[1], v[2]) || 1;
  v[0] /= vl; v[1] /= vl; v[2] /= vl;
  const dot = Math.max(-1, Math.min(1, v[0] * dIn[0] + v[1] * dIn[1] + v[2] * dIn[2]));
  return { captured, escaped, hits, b: +b.toFixed(3), rMin: +rMin.toFixed(3), bend: +Math.acos(dot).toFixed(4) };
}

function probeBend(bWant){
  const p0 = [bWant, 0, ESC_R - 0.5];
  const d0 = [0, 0, -1];
  const res = traceRayJS(p0, d0, 240);
  return { b: res.b, bend: res.bend, captured: res.captured, rMin: res.rMin };
}

function probeDoppler(){
  const cb = flight((performance.now() - t0) / 1000);
  const out = [];
  for (const side of [-1, 1]){
    const q = [side * 6.5, 0, 0];
    const n = [cb.pos[0] - q[0], cb.pos[1] - q[1], cb.pos[2] - q[2]];
    const nl = Math.hypot(n[0], n[1], n[2]);
    const vd = [0, 0, -side];
    const cs = (vd[0] * n[0] + vd[1] * n[1] + vd[2] * n[2]) / nl;
    const beta = Math.min(0.72, Math.sqrt(0.5 / (6.5 - RS)));
    const gam = 1 / Math.sqrt(1 - beta * beta);
    const dlt = 1 / (gam * (1 - beta * cs));
    out.push({ side, dlt: +dlt.toFixed(3), cs: +cs.toFixed(3) });
  }
  const hi = out[0].dlt > out[1].dlt ? out[0] : out[1];
  const lo = hi === out[0] ? out[1] : out[0];
  return { left: out[0].dlt, right: out[1].dlt, ratio: +Math.pow(hi.dlt / lo.dlt, 3).toFixed(2), brightSide: hi.side, blueSide: hi.side };
}

function probeHalo(){
  const cb = flight((performance.now() - t0) / 1000);
  for (let k = 0.05; k <= 1.2; k += 0.05){
    const d = [cb.f[0] + cb.u[0] * k, cb.f[1] + cb.u[1] * k, cb.f[2] + cb.u[2] * k];
    const dl = Math.hypot(d[0], d[1], d[2]);
    const res = traceRayJS(cb.pos.slice(), [d[0] / dl, d[1] / dl, d[2] / dl], 240);
    if (!res.captured && res.escaped && res.hits >= 1 && res.b > B_CRIT) return { lifted: true, k: +k.toFixed(2), b: res.b, hits: res.hits };
  }
  return { lifted: false };
}

/* ---------------- audio: deep drone + proximity swell ---------------- */

let AC = null, master = null, running = false, droneLP = null, droneGain = null;
let whineOsc = null, whineGain = null, whinePan = null;
const audioHint = document.getElementById('audiohint');
function unlockAudio(){
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination);
    const len = Math.floor(AC.sampleRate * 3);
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++){
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      d[i] = last * 3.2;
    }
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    droneLP = AC.createBiquadFilter(); droneLP.type = 'lowpass'; droneLP.frequency.value = 55; droneLP.Q.value = 0.7;
    droneGain = AC.createGain(); droneGain.gain.value = 0.10;
    src.connect(droneLP).connect(droneGain).connect(master);
    src.start();
    const sub = AC.createOscillator(); sub.type = 'sine'; sub.frequency.value = 34;
    const sg = AC.createGain(); sg.gain.value = 0.055;
    sub.connect(sg).connect(master); sub.start();
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.05;
    const lg = AC.createGain(); lg.gain.value = 0.02;
    lfo.connect(lg).connect(droneGain.gain); lfo.start();
    whineOsc = AC.createOscillator(); whineOsc.type = 'triangle'; whineOsc.frequency.value = 180;
    whineGain = AC.createGain(); whineGain.gain.value = 0.004;
    whinePan = AC.createStereoPanner ? AC.createStereoPanner() : null;
    if (whinePan){ whineOsc.connect(whineGain).connect(whinePan).connect(master); whinePan.pan.value = 0; }
    else whineOsc.connect(whineGain).connect(master);
    whineOsc.start();
    running = true;
    scheduleShimmer();
    audioHint.textContent = 'gravitational drone on';
    audioHint.classList.add('off');
  } catch (e) { /* audio unavailable */ }
}
audioHint.addEventListener('pointerdown', unlockAudio);
addEventListener('keydown', unlockAudio);

function scheduleShimmer(){
  if (!running || !AC) return;
  const t0a = AC.currentTime + 0.5 + Math.random() * 5;
  const f0 = 240 + Math.random() * 220;
  for (let k = 0; k < 3; k++){
    const o = AC.createOscillator(); o.type = 'sine';
    o.frequency.value = f0 * (1 + k * 0.5 + (Math.random() - 0.5) * 0.01);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0a);
    g.gain.exponentialRampToValueAtTime(0.012 / (1 + k), t0a + 1.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t0a + 4.2);
    o.connect(g).connect(master);
    o.start(t0a); o.stop(t0a + 4.4);
  }
  setTimeout(scheduleShimmer, 6000 + Math.random() * 8000);
}
function updateDrone(prox, R, th){
  if (!running || !AC) return;
  droneLP.frequency.setTargetAtTime(55 + prox * 90, AC.currentTime, 0.4);
  droneGain.gain.setTargetAtTime(0.10 + prox * 0.075, AC.currentTime, 0.4);
  if (whineOsc){
    const om = Math.sqrt(0.5 / (R * R * R));
    whineOsc.frequency.setTargetAtTime(46 + om * 3200, AC.currentTime, 0.5);
    whineGain.gain.setTargetAtTime(0.004 + prox * 0.016, AC.currentTime, 0.5);
    if (whinePan) whinePan.pan.setTargetAtTime(Math.max(-1, Math.min(1, Math.sin(th) * prox)), AC.currentTime, 0.6);
  }
}

/* ---------------- frame loop ---------------- */

let t0 = performance.now();
let frames = 0, perfAcc = 0, perfN = 0, perfMax = 0, lastFrame = 0, lastDt = 0;
let ema = 0, busyEma = 0, workEma = 0, prevFence = null, proxNow = 0, orbitR = 21.5;
let readyFlag = false;

const U = p => name => gl.getUniformLocation(p, name);
const us = U(progScene), ubr = U(progBright), ubl = U(progBlur), uc = U(progComp), upr = U(progProbe);

function frame(){
  const now = performance.now();
  const t = (now - t0) / 1000;
  if (lastFrame){ const dtms = now - lastFrame; lastDt = dtms; perfAcc += dtms; perfN++; if (dtms > perfMax) perfMax = dtms; ema = ema ? ema * 0.9 + dtms * 0.1 : dtms; }
  lastFrame = now;
  frames++;
  // honest GPU cost: how long was last frame's fence still unsignalled when we ask?
  // (rAF dt measures compositor delivery, not our cost — reef lesson)
  if (prevFence){
    const w0 = performance.now();
    const st = gl.clientWaitSync(prevFence, 0, 1000000000);
    const busy = performance.now() - w0;
    if (st !== gl.WAIT_FAILED) busyEma = busyEma ? busyEma * 0.85 + busy * 0.15 : busy;
    gl.deleteSync(prevFence);
    prevFence = null;
  }
  resize();

  cam.yaw += (cam.tyaw - cam.yaw) * 0.05;
  cam.pitch += (cam.tpitch - cam.pitch) * 0.05;

  const cb = flight(t);
  proxNow = cb.prox;
  orbitR = cb.R;
  updateDrone(proxNow, cb.R, cb.th);
  const basis = new Float32Array([
    cb.r[0], cb.r[1], cb.r[2],
    cb.u[0], cb.u[1], cb.u[2],
    cb.f[0], cb.f[1], cb.f[2],
  ]);

  gl.bindFramebuffer(gl.FRAMEBUFFER, hdr.fbo);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  gl.useProgram(progScene);
  gl.bindVertexArray(vaoEmpty);
  gl.uniform2f(us('uRes'), W, H);
  gl.uniform1f(us('uTime'), t);
  gl.uniform1i(us('uSteps'), stepsFor());
  gl.uniform3f(us('uCamPos'), cb.pos[0], cb.pos[1], cb.pos[2]);
  gl.uniformMatrix3fv(us('uCamBasis'), false, basis);
  gl.uniform1f(us('uProx'), proxNow);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // probes (#1047): drop the clock forward in coordinate time, solve where each
  // beacon is actually seen (null geodesics), additive into HDR so they bloom.
  lastCb = cb;
  stepProbes(lastDt > 0 ? lastDt / 1000 : 1 / 60);
  const pdbt = lastDt > 0 ? lastDt / 1000 : 1 / 60;
  for (const pf of puffs) pf.t += pdbt;
  puffs = puffs.filter(pf => pf.t < PUFF_DUR);
  if (probes.length){
    const pArr = new Float32Array(SPRITE_MAX * 4), cArr = new Float32Array(SPRITE_MAX * 3)
    let nS = 0
    for (const pr of probes){
      const im = probeImage(pr, cb)
      const { g, w } = probeGlow(pr)
      pr.dlt = probeDopplerHue(pr, cb)
      const wf = w * im.fade
      if (!im.vis || wf <= 0.0005) continue
      const col = blackbodyJS(PROBE_T0 * probeGlow(pr).g * pr.dlt)
      pArr[nS * 4] = im.x; pArr[nS * 4 + 1] = im.y
      pArr[nS * 4 + 2] = 5 + 26 * wf; pArr[nS * 4 + 3] = wf * 2.4
      cArr[nS * 3] = col[0]; cArr[nS * 3 + 1] = col[1]; cArr[nS * 3 + 2] = col[2]
      nS++
      pr.trail.push({ x: im.x, y: im.y, w: wf, col })
      if (pr.trail.length > TRAIL_MAX) pr.trail.shift()
      for (let k = 0; k < pr.trail.length - 1 && nS < SPRITE_MAX; k++){
        const tr = pr.trail[k]
        const tw = tr.w * 0.55 * Math.pow(0.6, pr.trail.length - 1 - k)
        if (tw < 0.004) continue
        pArr[nS * 4] = tr.x; pArr[nS * 4 + 1] = tr.y
        pArr[nS * 4 + 2] = 3 + 12 * tr.w; pArr[nS * 4 + 3] = tw * 2.0
        cArr[nS * 3] = tr.col[0]; cArr[nS * 3 + 1] = tr.col[1]; cArr[nS * 3 + 2] = tr.col[2]
        nS++
      }
    }
    const qArr = new Float32Array(16), qcArr = new Float32Array(12)
    let nQ = 0
    for (const pf of puffs){
      if (nQ >= PUFF_MAX) break
      const a = pf.t / PUFF_DUR
      const q = (1 - a) * (1 - a)
      qArr[nQ * 4] = pf.x; qArr[nQ * 4 + 1] = pf.y
      qArr[nQ * 4 + 2] = 4 + 95 * a; qArr[nQ * 4 + 3] = q * 1.6
      qcArr[nQ * 3] = 1.0; qcArr[nQ * 3 + 1] = 0.84; qcArr[nQ * 3 + 2] = 0.58
      nQ++
    }
    gl.useProgram(progProbe);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.uniform2f(upr('uRes'), W, H);
    gl.uniform4fv(upr('uP'), pArr);
    gl.uniform3fv(upr('uC'), cArr);
    gl.uniform4fv(upr('uQ'), qArr);
    gl.uniform3fv(upr('uQC'), qcArr);
    gl.uniform1i(upr('uNP'), nS);
    gl.uniform1i(upr('uNQ'), nQ);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.disable(gl.BLEND);
  }

  gl.useProgram(progBright);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b1.fbo);
  gl.viewport(0, 0, b1.w, b1.h);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, hdr.tex);
  gl.uniform1i(ubr('uTex'), 0);
  gl.uniform1f(ubr('uThresh'), 0.6);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.useProgram(progBlur);
  gl.uniform1i(ubl('uTex'), 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b2.fbo);
  gl.bindTexture(gl.TEXTURE_2D, b1.tex);
  gl.uniform2f(ubl('uDir'), 2.4 / b1.w, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b1.fbo);
  gl.bindTexture(gl.TEXTURE_2D, b2.tex);
  gl.uniform2f(ubl('uDir'), 0, 2.4 / b1.h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b2.fbo);
  gl.bindTexture(gl.TEXTURE_2D, b1.tex);
  gl.uniform2f(ubl('uDir'), 5.4 / b1.w, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b1.fbo);
  gl.bindTexture(gl.TEXTURE_2D, b2.tex);
  gl.uniform2f(ubl('uDir'), 0, 5.4 / b1.h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(progComp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, hdr.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, b1.tex);
  gl.uniform1i(uc('uHdr'), 0);
  gl.uniform1i(uc('uBloom'), 1);
  gl.uniform1f(uc('uGain'), 1.05);
  gl.uniform1f(uc('uTime'), t);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // adaptive ladder driven by real GPU busy time (fence wait), not rAF delivery:
  // drop geodesic steps first (the lever that moves it), then pixels.
  if (busyEma > 14){
    if (dropSteps < STEPS_TOP - (LITE ? 110 : 180)) dropSteps += 15;
    else if (qCap > 0.55){ qCap *= 0.82; resize(); }
    busyEma = 0;
  }

  prevFence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
  const workMs = performance.now() - now;
  workEma = workEma ? workEma * 0.9 + workMs * 0.1 : workMs;
  readyFlag = true;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- DEV hooks ---------------- */

window.__holeTest = {
  get ready(){ return readyFlag; },
  get frames(){ return frames; },
  get gl2(){ return true; },
  get hdr(){ return HDR_OK; },
  mode(){ return { gl2: true, lite: LITE, retina: RETINA }; },
  renderScale(){ return { scale: effScale(), base: RENDER_SCALE, cap: +qCap.toFixed(2), lite: LITE, retina: RETINA, steps: stepsFor(), w: W, h: H, css: canvas.clientWidth, dpr: window.devicePixelRatio || 1 }; },
  pose(){ return { yaw: +cam.yaw.toFixed(3), pitch: +cam.pitch.toFixed(3), prox: +proxNow.toFixed(2) }; },
  get flightR(){ return +orbitR.toFixed(2); },
  orbit(){
    let mn = 1e9, mx = 0;
    for (let t = 0; t <= 600; t += 0.1){ const rr = flight(t).R; if (rr < mn) mn = rr; if (rr > mx) mx = rr; }
    return { min: +mn.toFixed(2), max: +mx.toFixed(2) };
  },
  starFocusAt(b){ return +Math.max(1, Math.min(3.4, 1 + 2.2 * Math.exp(-Math.max(b - B_CRIT, 0) * 2.2))).toFixed(2); },
  setPose(p){
    if (p.yaw !== undefined){ cam.tyaw = p.yaw; cam.yaw = p.yaw; }
    if (p.pitch !== undefined){ cam.tpitch = p.pitch; cam.pitch = p.pitch; }
    cam.touched = performance.now();
  },
  bendAt(b){ return probeBend(b); },
  doppler(){ return probeDoppler(); },
  halo(){ return probeHalo(); },
  perf(){ return { avg: perfN ? +(perfAcc / perfN).toFixed(2) : 0, max: +perfMax.toFixed(2), n: perfN, busy: +busyEma.toFixed(1), work: +workEma.toFixed(1), steps: stepsFor(), cap: +qCap.toFixed(2) }; },
  resetPerf(){ perfAcc = 0; perfN = 0; perfMax = 0; ema = 0; },
  physics(){ return { rs: RS, bCrit: B_CRIT, rIn: R_IN, rOut: R_OUT, escR: ESC_R }; },
  dropAt(x, y){ dropProbe(x, y); },
  probeInfo(){ return { max: PROBE_MAX, speed: PROBE_SPEED, t0: PROBE_T0, kill: PROBE_KILL, rs: RS, trail: TRAIL_MAX, puffDur: PUFF_DUR }; },
  puffs(){ return puffs.length; },
  edgeFade(x, y){ return +edgeFade(x, y).toFixed(3); },
  probes(){
    if (!lastCb) return [];
    return probes.map(pr => {
      const im = probeImage(pr, lastCb);
      const { g, w } = probeGlow(pr);
      return { r: +pr.r.toFixed(4), r0: +pr.r0.toFixed(2), e: +pr.e.toFixed(4), t: +pr.t.toFixed(2),
        g: +g.toFixed(4), glow: +w.toFixed(5),
        x: im.vis ? +im.x.toFixed(1) : -1, y: im.vis ? +im.y.toFixed(1) : -1,
        vis: !!im.vis, miss: +im.miss.toFixed(3),
        pin: +Math.abs(im.alpha).toFixed(3),
        dlt: +pr.dlt.toFixed(3), fade: +im.fade.toFixed(3), trail: pr.trail.length };
    });
  },
};
</script>

window.DEMO_CREDITS = {

  assist: 'solo', note: '“Qwen picks how” — approach chosen by the builder',
};
