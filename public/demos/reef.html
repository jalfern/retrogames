<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CORAL REEF — drifting through a raymarched reef</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04222e; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #hud {
    position: fixed; left: 14px; right: 178px; bottom: 12px; z-index: 2; pointer-events: none;
    font: 11px/1.7 ui-monospace, Menlo, monospace; letter-spacing: .14em;
    color: rgba(214,236,232,.72); text-shadow: 0 1px 3px rgba(0,20,30,.8);
    text-transform: uppercase;
  }
  #hud b { color: rgba(210,255,244,.95); font-weight: 700; }
  @media (max-width: 620px) {
    /* keep the caption clear of the bottom-right BUILT BY tag (it used to cover it, #1038) */
    #hud { right: 14px; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 44px); }
  }
  #audiohint {
    position: fixed; top: 12px; right: 14px; z-index: 2;
    background: rgba(6,22,34,.5); border: 1px solid rgba(110,230,210,.26); border-radius: 8px;
    padding: 7px 12px; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    font: 11px/1.5 ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(190,240,230,.85); text-shadow: 0 1px 3px rgba(0,20,30,.8); cursor: pointer;
  }
  #audiohint.off { color: rgba(160,180,180,.5); border-color: rgba(150,150,150,.2); }
  #fatal {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 3;
    font: 14px/1.6 ui-monospace, Menlo, monospace; color: #d2ece8; background: #04222e;
    text-align: center; padding: 2em; white-space: pre;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>CORAL REEF</b> · raymarched drift &nbsp;·&nbsp; drag to look &nbsp;·&nbsp; click = ambience</div>
<div id="audiohint">click for underwater ambience</div>
<div id="fatal"></div>
<script>
'use strict';

const qs = new URLSearchParams(location.search);
const LITE = qs.get('lite') === '1';
const SEED = (qs.get('seed') | 0) || 902;
const RETINA = (window.devicePixelRatio || 1) >= 2;
const RENDER_SCALE = LITE ? 0.55 : (RETINA ? 0.8 : 0.92);

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) {
  const f = document.getElementById('fatal');
  f.style.display = 'grid';
  f.textContent = 'WebGL2 required.\nThis demo needs a WebGL2-capable browser.';
  throw new Error('no webgl2');
}
const HDR_OK = !!gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');
let RENDERER = 'unknown';
try {
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  if (dbg) RENDERER = String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
  else RENDERER = String(gl.getParameter(gl.RENDERER));
} catch (e) { /* leave unknown */ }

/* ---------------- shaders ---------------- */

const VS_QUAD = `#version 300 es
precision highp float;
out vec2 vUv;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FS_SCENE = `#version 300 es
precision highp float;
in vec2 vUv;
uniform vec2 uRes;
uniform float uTime;
uniform int uSteps;
uniform vec3 uCamPos;
uniform mat3 uCamBasis;
uniform vec4 uCorals[18];    // x, y, z, height
uniform vec4 uCoralB[18];    // type, phase, coarse radius, 0
uniform vec4 uCoralC[18];    // colA rgb, 0
uniform vec4 uCoralD[18];    // colB rgb, 0
uniform vec4 uFish[40];      // x, y, z, heading
uniform vec4 uFishB[40];     // species, phase, size, aspect
out vec4 fragColor;

#define N_CORALS 18
#define N_FISH 40
#define SIGMA vec3(0.26, 0.15, 0.08)   // water absorption per metre: red dies first
#define SURFACE_Y 2.0

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p){ p = fract(p * 0.1031); p += dot(p, p.yzx + 33.33); return fract((p.x + p.y) * p.z); }

float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float n000 = hash13(i), n100 = hash13(i + vec3(1,0,0));
  float n010 = hash13(i + vec3(0,1,0)), n110 = hash13(i + vec3(1,1,0));
  float n001 = hash13(i + vec3(0,0,1)), n101 = hash13(i + vec3(1,0,1));
  float n011 = hash13(i + vec3(0,1,1)), n111 = hash13(i + vec3(1,1,1));
  return mix(mix(mix(n000,n100,f.x), mix(n010,n110,f.x), f.y),
             mix(mix(n001,n101,f.x), mix(n011,n111,f.x), f.y), f.z);
}
float fbm3(vec3 p){
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 3; i++){ s += a * vnoise(p); p = p * 2.13 + vec3(1.7, 9.2, 4.1); a *= 0.5; }
  return s;
}
float fbm2(vec2 p){
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 3; i++){ s += a * vnoise(vec3(p, 5.2)); p = p * 2.17 + vec2(1.9, 0.7); a *= 0.5; }
  return s;
}

/* ---------- terrain ---------- */

float floorHeight(vec2 xz){
  float h = -7.0;
  h += (fbm3(vec3(xz * 0.16, 3.3)) - 0.5) * 1.7;
  h += 0.22 * sin(xz.x * 0.47 + xz.y * 0.31);
  h += 0.12 * sin(xz.x * 1.31 - xz.y * 0.83);
  return h;
}

/* ---------- coral SDFs ---------- */

float sdCone(vec3 p, vec3 a, vec3 b, float rA, float rB){
  vec3 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-5), 0.0, 1.0);
  return length(pa - ba * h) - mix(rA, rB, h);
}

/* one coral at local origin (base on the floor). type: 0 branch, 1 tube, 2 brain, 3 fan, 4 anemone */
float coralSDF(vec3 q, float type, float hgt, float phase){
  float sw = sin(uTime * 0.62 + phase) * 0.14 + sin(uTime * 0.27 + phase * 2.1) * 0.05;
  float d = 1e5;
  if (type < 0.5){
    // branching coral: a main stem + two limbs from the mid-height
    float L = hgt;
    vec3 mid = vec3(0.0, L * 0.5, 0.0);
    d = min(d, sdCone(q, vec3(0,0,0), vec3(sw * 0.5, L, 0), 0.15, 0.045));
    d = min(d, sdCone(q, mid * 0.9, mid + vec3(-0.34 * hgt, 0.52 * hgt, 0.16 * hgt) + sw * vec3(0.3, 0, 0), 0.11, 0.04));
    d = min(d, sdCone(q, mid * 0.95, mid + vec3(0.30 * hgt, 0.55 * hgt, -0.18 * hgt) + sw * vec3(0.3, 0, 0), 0.10, 0.04));
  } else if (type < 1.5){
    // tube coral: a ring of slender tubes, tips flaring with the current
    for (int i = 0; i < 4; i++){
      float fi = float(i);
      float an = fi * 1.5708 + 0.4;
      vec2 c2 = vec2(cos(an), sin(an)) * 0.24;
      vec3 tip = vec3(c2.x + sw * 0.35, (0.9 + 0.2 * sin(fi * 2.3 + phase)) * hgt, c2.y);
      d = min(d, sdCone(q, vec3(c2.x * 0.6, 0, c2.y * 0.6), tip, 0.075, 0.05));
    }
  } else if (type < 2.5){
    // brain coral: a domed blob with ridge folds
    float R = hgt * 0.46;
    vec3 c0 = vec3(0.0, R * 0.72, 0.0);
    vec3 rq = q - c0;
    float ang = atan(rq.z, rq.x);
    float fold = 0.05 * sin(ang * 5.0 + 1.3) * sin(rq.y * 4.2 / max(R, 0.2) + 0.6);
    d = length(rq) - (R + fold);
  } else if (type < 3.5){
    // sea fan: a thin tilted lens with a sway
    vec3 q2 = vec3(q.x + sw * q.y * 0.8 + q.y * 0.30, q.y * 0.94, q.z);
    float rr = length(q2 / (hgt * vec3(0.42, 0.85, 0.045))) - 1.0;
    d = max(rr, -q2.y - 0.05);
  } else {
    // anemone: a mound + five fanned tentacles
    d = length(q - vec3(0, 0.10, 0)) - 0.20;
    for (int i = 0; i < 5; i++){
      float fi = float(i);
      float an = fi * 1.2566 + 0.5;
      vec2 dir2 = vec2(cos(an), sin(an));
      float w2 = sin(uTime * 1.9 + phase + fi * 1.1) * 0.06 + sw * 0.10;
      vec3 tip = vec3(dir2.x * (0.30 + 0.10 * sin(fi * 3.1)) , (0.42 + 0.16 * sin(fi * 2.2 + phase)) * hgt, dir2.y * (0.30 + 0.10 * cos(fi * 2.7)));
      d = min(d, sdCone(q, vec3(0, 0.12, 0), tip + w2 * vec3(1, 0, 0.6), 0.035, 0.016));
    }
  }
  return d;
}

/* ---------- lighting helpers ---------- */

vec3 sunDir(){ return normalize(vec3(0.25, 1.0, 0.12)); }

float caustic(vec2 xz, float t){
  // warped interference web — the warp breaks the grid, so it reads as light
  // through moving water instead of a tiled floor (#1038)
  vec2 w = vec2(fbm3(vec3(xz * 0.30, t * 0.31)), fbm3(vec3(xz * 0.30 + 7.7, t * 0.27 + 3.1))) - 0.5;
  vec2 p = xz * 1.35 + w * 2.6 + vec2(t * 0.22, -t * 0.13);
  float a = sin(p.x + 2.2 * sin(p.y * 0.83 + t * 0.4));
  float b = sin(p.y * 1.13 + 2.2 * sin(p.x * 0.91 - t * 0.33));
  float c = 0.5 + 0.5 * sin(0.6 * (a + b) + t * 0.21);
  return pow(c, 5.0);
}

float shafts(vec2 xz, float t){
  // light columns slanting down from the surface
  float u = xz.x * 0.85 + xz.y * 0.30 + t * 0.06;
  float band = 0.5 + 0.5 * sin(u * 2.7 + 2.1 * sin(u * 1.13 + t * 0.24) + t * 0.11);
  float core = smoothstep(0.70, 0.985, band);
  float spread = 0.55 + 0.45 * fbm2(vec2(xz.x * 0.12 + t * 0.02, xz.y * 0.12));
  return core * spread;
}

vec3 shadeSand(vec3 p, vec3 n, vec3 rd, float t){
  vec3 T = exp(-SIGMA * t);
  vec3 L = sunDir();
  float dif = max(dot(n, L), 0.0);
  vec3 albedo = vec3(0.60, 0.55, 0.40) * (0.85 + 0.3 * fbm2(p.xz * 1.7));
  vec3 col = albedo * (0.30 + 0.75 * dif);
  // caustic sheet on the sand: brighter where the floor is shallower and nearer
  float depthBelow = SURFACE_Y - p.y;
  float ca = caustic(p.xz, uTime) * exp(-depthBelow * 0.16) * exp(-t * 0.045);
  col += vec3(0.55, 1.25, 1.15) * ca * 2.1 * (0.45 + 0.55 * dif);
  // direct god-ray spill on the sand
  col += vec3(0.6, 1.2, 1.2) * shafts(p.xz, uTime) * 0.5 * exp(-depthBelow * 0.30);
  return col * T;
}

vec3 shadeCoral(vec3 p, vec3 n, vec3 rd, float t, float mat, float cid){
  vec3 T = exp(-SIGMA * t);
  vec3 L = sunDir();
  float dif = max(dot(n, L), 0.0);
  float type = floor(mat);
  vec3 colA = uCoralC[int(cid) + 0].rgb;
  vec3 colB = uCoralD[int(cid) + 0].rgb;
  vec3 albedo = mix(colA, colB, 0.5 + 0.5 * sin(p.y * 5.0 + p.x * 2.0 + uCoralB[int(cid) + 0].y));
  vec3 col = albedo * (0.34 + 0.85 * dif);
  float ca = caustic(p.xz, uTime) * exp(-(SURFACE_Y - p.y) * 0.16) * exp(-t * 0.045);
  col += vec3(0.5, 1.15, 1.05) * ca * 0.9 * (0.4 + 0.6 * dif);
  col += vec3(0.25, 0.5, 0.55) * pow(1.0 - max(dot(n, -rd), 0.0), 2.0) * 0.35;
  return col * T;
}

vec3 surfaceGlow(vec3 rd, float tS){
  // the sunlit surface as a bright emitter, seen from below
  float rip = 0.78 + 0.5 * fbm3(vec3(rd.xz * 13.0, uTime * 0.4));
  vec3 col = vec3(1.75, 2.35, 2.45) * rip * exp(-max(0.0, tS - 3.0) * 0.13);
  vec3 L = sunDir();
  float sd = max(dot(rd, L), 0.0);
  col += vec3(2.8, 2.7, 2.3) * pow(sd, 60.0) * 1.6;
  col += vec3(1.5, 1.7, 1.8) * pow(sd, 9.0) * 0.35;
  return col;
}

void main(){
  vec2 ndc = vUv * 2.0 - 1.0;
  ndc.x *= uRes.x / uRes.y;
  vec3 rd = normalize(uCamBasis * vec3(ndc.x, ndc.y, 1.7));
  vec3 ro = uCamPos;

  /* ----- march the scene ----- */
  float t = 0.0;
  float mat = -2.0;           // -2 open water, -1 fogged out, 0 sand, 1.. coral
  vec3 hitP = ro + rd * 100.0;
  float hitId = -1.0;
  bool fogged = false;
  for (int i = 0; i < 160; i++){
    if (i >= uSteps) break;
    vec3 p = ro + rd * t;
    if (exp(-t * SIGMA.y) < 0.012){ fogged = true; break; }
    float dSeabed = p.y - floorHeight(p.xz);
    float dC = 1e5; int cid = -1;
    for (int k = 0; k < N_CORALS; k++){
      vec3 cen = uCorals[k].xyz + vec3(0.0, uCorals[k].w * 0.55, 0.0);
      float dc = length(p - cen) - uCoralB[k].z;
      if (dc < dC){ dC = dc; cid = k; }
    }
    float d = min(dSeabed, dC);
    int matId = 0;
    if (dC < 0.55 && dC < dSeabed && cid >= 0){
      float dd = coralSDF(p - uCorals[cid].xyz, uCoralB[cid].x, uCorals[cid].w, uCoralB[cid].y);
      if (dd < dSeabed){ d = dd; matId = 1; }
    }
    if (d < 0.0025 + t * 0.00015){
      hitP = p;
      if (matId == 1){ mat = uCoralB[cid].x + 1.0; hitId = float(cid); }
      else { mat = 0.0; }
      break;
    }
    t += clamp(d * 0.55, 0.02, 0.45);
  }
  float tEnd = fogged ? t : t;

  /* ----- background: surface, sky or solid ----- */
  vec3 T = exp(-SIGMA * tEnd);
  vec3 deep = vec3(0.016, 0.058, 0.108);
  vec3 bg;
  if (mat >= 0.0){
    // normal from the scene SDF (seabed gradient + coral is enough at this scale)
    vec3 n;
    if (mat < 0.5){
      float e = 0.07;
      float fx = floorHeight(hitP.xz + vec2(e, 0)) - floorHeight(hitP.xz - vec2(e, 0));
      float fz = floorHeight(hitP.xz + vec2(0, e)) - floorHeight(hitP.xz - vec2(0, e));
      n = normalize(vec3(-fx, 2.0 * e, -fz));
      bg = shadeSand(hitP, n, rd, tEnd);
    } else {
      n = normalize(rd);
      bg = shadeCoral(hitP, n, rd, tEnd, mat, hitId);
    }
  } else if (fogged){
    bg = deep * 2.6;
  } else if (rd.y > 0.0){
    float tS = (SURFACE_Y - ro.y) / rd.y;
    bg = surfaceGlow(rd, tS);
  } else {
    bg = deep * 2.2;
  }
  vec3 col = deep * (1.0 - T) + bg * T;

  /* ----- god-ray in-scatter along the ray ----- */
  {
    vec3 L = sunDir();
    float align = 0.55 + 0.45 * max(dot(rd, -L) * -1.0, 0.0);
    for (int k = 1; k <= 3; k++){
      float tk = tEnd * float(k) / 3.0;
      vec3 pk = ro + rd * tk;
      float below = max(0.0, SURFACE_Y - pk.y);
      float s = shafts(pk.xz, uTime) * exp(-below * 0.38) * exp(-tk * 0.05) * align;
      col += vec3(0.75, 1.55, 1.55) * s * 0.62;
    }
  }

  /* ----- fish: real 3D boids (JS), bodies drawn here ----- */
  for (int i = 0; i < N_FISH; i++){
    vec3 fc = uFish[i].xyz;
    float tf = dot(fc - ro, rd);
    if (tf < 0.3 || tf > tEnd + 0.5) continue;
    vec3 q = ro + rd * tf - fc;
    float d2 = dot(q, q);
    float size = uFishB[i].z;
    if (d2 > 2.4 * size * size) continue;
    float h = uFish[i].w;
    vec3 fw = vec3(cos(h), 0.0, sin(h));
    vec3 sd = vec3(-sin(h), 0.0, cos(h));
    float a = dot(q, fw);      // forward (head +)
    float b = dot(q, sd);      // side
    float c = q.y;             // up
    float L = 0.34 * size;
    float W = L * uFishB[i].w * 0.5 + 0.05;
    float wag = sin(uTime * 9.0 + uFishB[i].y) * 0.30 * L;
    float side = b - wag * smoothstep(-0.8 * L, 0.0, -a);
    float bodyX = a / max(L, 1e-4);
    float width = W * (0.30 + 0.70 * sqrt(max(1.0 - 0.92 * bodyX * bodyX, 0.0)));
    float body = smoothstep(1.0, 0.80, abs(bodyX)) * smoothstep(width, width * 0.55, abs(side));
    float tail = smoothstep(0.34 * L, 0.15 * L, abs(side - wag * 1.4)) * smoothstep(0.44 * L, 0.18 * L, a) * step(a, 0.0);
    float alpha = clamp(max(body, tail * 0.85), 0.0, 1.0);
    if (alpha < 0.02) continue;
    float species = floor(uFishB[i].x);
    vec3 fcol;
    if (species < 0.5)      fcol = vec3(0.25, 0.55, 0.85);
    else if (species < 1.5) fcol = vec3(0.95, 0.75, 0.25);
    else                    fcol = vec3(0.30, 0.75, 0.55);
    fcol = mix(fcol * 1.2, fcol * 0.62, smoothstep(-0.2, 0.5, c / (0.35 * L + 1e-4)));
    float eye = smoothstep(0.05 * size, 0.035 * size, length(q - (fw * 0.78 * L + vec3(0.0, 0.08 * L, 0.0))));
    fcol = mix(fcol, vec3(0.05), eye * 0.8);
    fcol *= exp(-SIGMA * tf) * 2.6;
    col = mix(col, fcol, alpha * 0.96);
  }

  /* ----- marine snow: soft motes drifting past ----- */
  for (int i = 0; i < 22; i++){
    float fi = float(i);
    vec3 seed = vec3(fi * 17.23, fi * 9.71, fi * 5.13);
    float fx = fract(hash13(seed) + uTime * 0.006);
    float fy = fract(hash13(seed + 1.7) + uTime * (0.016 + 0.01 * fract(hash13(seed + 2.9))));
    float fz = hash13(seed + 4.3) - 0.5;
    vec3 sp = vec3(ro.x - 13.0 + fx * 26.0, ro.y + 4.5 - fy * 9.0, ro.z - 8.0 + fz * 16.0);
    float tf = dot(sp - ro, rd);
    if (tf < 0.2 || tf > tEnd) continue;
    vec3 q = ro + rd * tf - sp;
    float glow = exp(-dot(q, q) * 110.0) * (0.6 + 0.4 * sin(uTime * 1.6 + fi * 2.7));
    col += vec3(0.75, 0.95, 0.95) * glow * 0.16 * exp(-tf * SIGMA.y);
  }

  /* ----- bubbles: soft rising rings (no hard glyphs, #1038) ----- */
  for (int i = 0; i < 8; i++){
    float fi = float(i);
    vec3 seed = vec3(fi * 31.7, fi * 13.3, fi * 7.9);
    float fx = fract(hash13(seed) + uTime * 0.004);
    float rise = fract(hash13(seed + 3.1) + uTime * (0.028 + 0.02 * fract(hash13(seed + 5.5))));
    float fz = hash13(seed + 7.7) - 0.5;
    vec3 sp = vec3(ro.x - 12.0 + fx * 24.0 + sin(uTime * 2.6 + fi * 3.0) * 0.06,
                   -7.2 + rise * 8.6, ro.z - 7.0 + fz * 14.0);
    float tf = dot(sp - ro, rd);
    if (tf < 0.2 || tf > tEnd) continue;
    vec3 q = ro + rd * tf - sp;
    float d2 = dot(q, q);
    float ring = exp(-d2 * 320.0) - 0.72 * exp(-d2 * 150.0);
    col += vec3(0.7, 0.95, 0.95) * max(ring, 0.0) * 0.22 * exp(-tf * SIGMA.y);
  }

  fragColor = vec4(max(col, vec3(0.0)), 1.0);
}`;

const FS_BRIGHT = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
uniform float uThresh;
out vec4 o;
void main(){
  vec3 c = texture(uTex, vUv).rgb;
  float m = max(c.r, max(c.g, c.b));
  float k = smoothstep(uThresh, uThresh + 0.6, m);
  o = vec4(c * k, 1.0);
}`;

const FS_BLUR = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uDir;
out vec4 o;
void main(){
  vec3 c = texture(uTex, vUv).rgb * 0.227027;
  c += (texture(uTex, vUv + uDir * 1.3846).rgb + texture(uTex, vUv - uDir * 1.3846).rgb) * 0.3162162;
  c += (texture(uTex, vUv + uDir * 3.2307).rgb + texture(uTex, vUv - uDir * 3.2307).rgb) * 0.0702702;
  o = vec4(c, 1.0);
}`;

const FS_COMP = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uHdr;
uniform sampler2D uBloom;
uniform float uGain;
uniform float uTime;
out vec4 o;
vec3 aces(vec3 x){
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}
float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
void main(){
  vec3 c = texture(uHdr, vUv).rgb + texture(uBloom, vUv).rgb * uGain;
  c = aces(c * 1.15);
  c = pow(c, vec3(1.0 / 2.2));
  vec2 q = vUv - 0.5;
  c *= 1.0 - dot(q, q) * 0.34;
  float g = h21(vUv * vec2(1920.0, 1080.0) + fract(uTime) * 137.0) - 0.5;
  c += g * 0.013;
  o = vec4(c, 1.0);
}`;

/* ---------------- GL helpers ---------------- */

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    console.error('shader compile failed:\n' + log);
    throw new Error('shader: ' + log);
  }
  return s;
}
function program(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  return p;
}

const progScene = program(VS_QUAD, FS_SCENE);
const progBright = program(VS_QUAD, FS_BRIGHT);
const progBlur = program(VS_QUAD, FS_BLUR);
const progComp = program(VS_QUAD, FS_COMP);

const HDRF = HDR_OK ? gl.RGBA16F : gl.RGBA8;
const HDRType = HDR_OK ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

function makeTarget(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, HDRF, w, h, 0, gl.RGBA, HDRType, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo, w, h };
}

const STEPS_TOP = LITE ? 52 : 88;
const STEPS_FLOOR = LITE ? 40 : 60;
let dropSteps = 0;
let qCap = 1;
function effScale(){ return RENDER_SCALE * qCap; }
function stepsFor(){ return STEPS_TOP - dropSteps; }

const SURFACE_Y = 2.0;
const CAM_Y = -3.4;
const DRIFT = 1.5;

const cam = { yaw: 0, pitch: 0, tyaw: 0, tpitch: 0, touched: 0 };
let drag = null;
canvas.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId);
  cam.touched = performance.now();
  unlockAudio();
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  cam.touched = performance.now();
  cam.tyaw = Math.max(-60, Math.min(60, cam.tyaw - (e.clientX - drag.x) * 0.6));
  cam.tpitch = Math.max(-30, Math.min(30, cam.tpitch + (e.clientY - drag.y) * 0.5));
  drag = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', () => { drag = null; });

function camState(t){
  // idle drift: the camera rolls its own slow yaw/pitch wander when untouched
  let yawAuto = Math.sin(t * 0.05) * 0.22 + Math.sin(t * 0.023) * 0.12;
  let pitchAuto = 0.10 + Math.sin(t * 0.07 + 0.4) * 0.05;
  if (performance.now() - cam.touched > 2500){
    yawAuto += Math.sin(t * 0.23) * 0.14;
    pitchAuto += Math.sin(t * 0.61 + 1.3) * 0.055;
  }
  const yaw = yawAuto + cam.yaw * Math.PI / 180;
  const pitch = pitchAuto + cam.pitch * Math.PI / 180;
  const x = DRIFT * t;
  const y = CAM_Y + Math.sin(t * 0.21) * 0.45;
  const z = Math.sin(t * 0.11) * 2.1 + Math.cos(t * 0.047) * 1.4;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const f = [Math.sin(yaw) * cp, sp, Math.cos(yaw) * cp];
  const r = [cy, 0, -sy];
  const u = [sy * sp, cp, -cy * sp];
  return { pos: [x, y, z], f, u, r, yaw: cam.yaw, pitch: cam.pitch };
}

/* ---------------- coral field (static per cell window, sways in-shader) ----- */

function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const CORAL_PAL = [
  [[0.92, 0.38, 0.34], [0.78, 0.28, 0.30]],   // pink/purple branch
  [[0.85, 0.55, 0.30], [0.70, 0.42, 0.22]],   // tan brain
  [[0.90, 0.45, 0.55], [0.62, 0.30, 0.45]],   // magenta tube
  [[0.55, 0.62, 0.30], [0.38, 0.50, 0.28]],   // green fan
  [[0.95, 0.60, 0.30], [0.80, 0.42, 0.22]],   // orange anemone
];

const uCorals = new Float32Array(18 * 4);
const uCoralB = new Float32Array(18 * 4);
const uCoralC = new Float32Array(18 * 4);
const uCoralD = new Float32Array(18 * 4);
let coralCell0 = null;

function floorH(x, z){
  // JS mirror of the shader's low-frequency term is unnecessary: corals sit on
  // the shader floor, so we estimate the same fbm-free base and let the SDF
  // blend through — the floor never moves, this is only a spawn height.
  return -7.0 + 0.22 * Math.sin(x * 0.47 + z * 0.31) + 0.12 * Math.sin(x * 1.31 - z * 0.83);
}

function buildCorals(camX){
  const i0 = Math.floor((camX - 6) / 7);
  if (i0 === coralCell0) return;
  coralCell0 = i0;
  for (let i = 0; i < 6; i++){
    const ci = i0 + i;
    for (let k = 0; k < 3; k++){
      const rnd = mulberry32(SEED * 7919 + ci * 31 + k * 1013);
      const x = ci * 7 + 1 + rnd() * 5;
      const z = (rnd() - 0.5) * 18;
      const type = Math.floor(rnd() * 5);
      const h = 1.0 + rnd() * 1.7;
      const phase = rnd() * Math.PI * 2;
      const o = (i * 3 + k) * 4;
      uCorals[o] = x; uCorals[o + 1] = floorH(x, z); uCorals[o + 2] = z; uCorals[o + 3] = h;
      uCoralB[o] = type; uCoralB[o + 1] = phase; uCoralB[o + 2] = h * 0.75 + 0.4; uCoralB[o + 3] = 0;
      const pal = CORAL_PAL[type];
      uCoralC[o] = pal[0][0]; uCoralC[o + 1] = pal[0][1]; uCoralC[o + 2] = pal[0][2]; uCoralC[o + 3] = 0;
      uCoralD[o] = pal[1][0]; uCoralD[o + 1] = pal[1][1]; uCoralD[o + 2] = pal[1][2]; uCoralD[o + 3] = 0;
    }
  }
}

/* ---------------- fish school: real 3D boids (the sim the hook senses) ------ */

const NFISH = 40;
const SPECIES = [
  { hue: 205, ar: 0.40, len: 1.00 },
  { hue: 46,  ar: 0.55, len: 0.80 },
  { hue: 152, ar: 0.32, len: 1.15 },
];
const fish = [];
{
  const rnd = mulberry32(SEED * 104729 + 7);
  for (let i = 0; i < NFISH; i++){
    const sp = rnd();
    const species = sp < 0.52 ? 0 : sp < 0.82 ? 1 : 2;
    const cls = 0.75 + (rnd() < 0.35 ? 0 : rnd() < 0.6 ? 0.45 : 0.9);
    const a = rnd() * Math.PI * 2;
    fish.push({
      x: 6 + Math.cos(a) * 5, y: CAM_Y + (rnd() - 0.5) * 4, z: (rnd() - 0.5) * 10,
      vx: Math.cos(a) * 1.4, vy: (rnd() - 0.5) * 0.3, vz: Math.sin(a) * 1.4,
      d: 0, size: cls * (0.85 + rnd() * 0.3),
      wob: rnd() * Math.PI * 2, species,
    });
  }
}
const uFish = new Float32Array(NFISH * 4);
const uFishB = new Float32Array(NFISH * 4);

function stepFish(dt, t){
  const SEPR = 0.9, NEIGH = 2.6, ALGN = 1.2, COH = 0.5;
  const camX = DRIFT * t, camY = CAM_Y, camZ = Math.sin(t * 0.11) * 2.1;
  const wheel = Math.sin(t * 0.14) * 1.1 + Math.sin(t * 0.043) * 0.8;
  const wx = Math.cos(wheel), wz = Math.sin(wheel);
  for (let i = 0; i < fish.length; i++){
    const f = fish[i];
    let ax = 0, ay = 0, az = 0, cx = 0, cy = 0, cz = 0, avx = 0, avy = 0, avz = 0, n = 0;
    for (let j = 0; j < fish.length; j++){
      if (j === i) continue;
      const o = fish[j];
      const dx = o.x - f.x, dy = o.y - f.y, dz = o.z - f.z;
      const d2 = dx * dx + dy * dy + dz * dz;
      if (d2 < NEIGH * NEIGH){
        n++;
        cx += dx; cy += dy; cz += dz;
        avx += o.vx; avy += o.vy; avz += o.vz;
        if (d2 < SEPR * SEPR && d2 > 0.001){
          const inv = 1 / Math.sqrt(d2);
          ax -= dx * inv * 1.7; ay -= dy * inv * 1.7; az -= dz * inv * 1.7;
        }
      }
    }
    if (n){
      ax += (avx / n - f.vx) * ALGN + (cx / n) * COH * 0.10;
      ay += (avy / n - f.vy) * ALGN + (cy / n) * COH * 0.10;
      az += (avz / n - f.vz) * ALGN + (cz / n) * COH * 0.10;
    }
    // wheel: the whole school turns on a drifting heading
    const sp = Math.hypot(f.vx, f.vz) || 1;
    ax += (wx * sp - f.vx) * 0.35;
    az += (wz * sp - f.vz) * 0.35;
    ay += (Math.sin(t * 0.3 + i) * 0.25 - f.vy) * 0.18;
    // containment: stay in a box that follows the camera
    const HX = 14, HY = 4.6, HZ = 8, FX = 7;
    const rx = f.x - (camX + FX), ry = f.y - camY, rz = f.z - camZ;
    if (rx > HX) ax -= (rx - HX) * 1.4;
    if (rx < -HX) ax += (-HX - rx) * 1.4;
    if (ry > HY) ay -= (ry - HY) * 1.6;
    if (ry < -HY) ay += (-HY - ry) * 1.6;
    if (rz > HZ) az -= (rz - HZ) * 1.4;
    if (rz < -HZ) az += (-HZ - rz) * 1.4;
    // never dive into the sand or through the surface
    const fl = floorH(f.x, f.z) + 0.8;
    if (f.y < fl) ay += (fl - f.y) * 3.0;
    if (f.y > SURFACE_Y - 0.6) ay -= (f.y - (SURFACE_Y - 0.6)) * 3.0;

    f.vx += ax * dt; f.vy += ay * dt; f.vz += az * dt;
    const s = Math.hypot(f.vx, f.vy, f.vz) || 1;
    const want = Math.max(0.9, Math.min(2.3, s));
    f.vx = f.vx / s * want; f.vy = f.vy / s * want; f.vz = f.vz / s * want;
    f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
  }
  for (let i = 0; i < fish.length; i++){
    const f = fish[i];
    const o = i * 4;
    uFish[o] = f.x; uFish[o + 1] = f.y; uFish[o + 2] = f.z;
    uFish[o + 3] = Math.atan2(f.vz, f.vx);
    uFishB[o] = f.species; uFishB[o + 1] = f.wob;
    uFishB[o + 2] = f.size * (0.75 + SPECIES[f.species].len * 0.45);
    uFishB[o + 3] = SPECIES[f.species].ar;
  }
}
function fishOrder(){
  let sx = 0, sy = 0, sz = 0;
  for (const f of fish){
    const s = Math.hypot(f.vx, f.vy, f.vz) || 1;
    sx += f.vx / s; sy += f.vy / s; sz += f.vz / s;
  }
  return Math.hypot(sx, sy, sz) / fish.length;
}

/* ---------------- audio: muffled water + bubbles + distant whale ----------- */

let AC = null, master = null, running = false;
const audioHint = document.getElementById('audiohint');
function unlockAudio(){
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination);
    const len = Math.floor(AC.sampleRate * 3);
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++){
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      d[i] = last * 3.2;
    }
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 190; lp.Q.value = 0.6;
    const g = AC.createGain(); g.gain.value = 0.075;
    src.connect(lp).connect(g).connect(master);
    src.start();
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.07;
    const lg = AC.createGain(); lg.gain.value = 60;
    lfo.connect(lg).connect(lp.frequency); lfo.start();
    running = true;
    scheduleBubbleSound();
    scheduleWhale();
    scheduleCrackle();
    audioHint.textContent = 'reef ambience on';
    audioHint.classList.add('off');
  } catch (e) { /* audio unavailable */ }
}
audioHint.addEventListener('pointerdown', unlockAudio);
addEventListener('keydown', unlockAudio);

function bubbleSound(t0){
  const o = AC.createOscillator(); o.type = 'sine';
  const f = 700 + Math.random() * 900;
  o.frequency.setValueAtTime(f, t0);
  o.frequency.exponentialRampToValueAtTime(f * 0.35, t0 + 0.09);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.05 + Math.random() * 0.05, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.1);
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 2.5;
  o.connect(bp).connect(g).connect(master);
  o.start(t0); o.stop(t0 + 0.12);
}
function scheduleBubbleSound(){
  if (!running || !AC) return;
  const n = 1 + (Math.random() * 3 | 0);
  for (let k = 0; k < n; k++) bubbleSound(AC.currentTime + 0.1 + Math.random() * 1.8 + k * 0.07);
  setTimeout(scheduleBubbleSound, 1400 + Math.random() * 4200);
}
function scheduleWhale(){
  if (!running || !AC) return;
  const t0 = AC.currentTime + 1 + Math.random() * 6;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(135, t0);
  o.frequency.linearRampToValueAtTime(96, t0 + 2.2);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.028, t0 + 0.7);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.4);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
  o.connect(lp).connect(g).connect(master);
  o.start(t0); o.stop(t0 + 2.5);
  setTimeout(scheduleWhale, 9000 + Math.random() * 9000);
}
let crackleN = 0;
function crackle(t0){
  crackleN++;
  if (!AC) return;
  const dur = Math.ceil(AC.sampleRate * (0.015 + Math.random() * 0.03));
  const buf = AC.createBuffer(1, dur, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < dur; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / dur, 3);
  const src = AC.createBufferSource(); src.buffer = buf;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600 + Math.random() * 2400; bp.Q.value = 1.5;
  const g = AC.createGain(); g.gain.value = 0.045 + Math.random() * 0.05;
  src.connect(bp).connect(g).connect(master); src.start(t0);
}
function scheduleCrackle(){
  if (!running) return;
  const n = 2 + (Math.random() * 4 | 0);
  for (let k = 0; k < n; k++) crackle(AC.currentTime + Math.random() * 1.2 + k * 0.04);
  setTimeout(scheduleCrackle, 600 + Math.random() * 1400);
}
let whooshN = 0, lastWhoosh = 0;
function fishWhoosh(t){
  if (t - lastWhoosh < 3.5) return;
  lastWhoosh = t; whooshN++;
  if (!AC) return;
  const t0 = AC.currentTime + 0.02, dur = Math.ceil(AC.sampleRate * 0.5);
  const buf = AC.createBuffer(1, dur, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < dur; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(i / dur * Math.PI);
  const src = AC.createBufferSource(); src.buffer = buf;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(950, t0);
  bp.frequency.exponentialRampToValueAtTime(320, t0 + 0.45);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.05, t0 + 0.14);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
  src.connect(bp).connect(g).connect(master); src.start(t0);
}

/* ---------------- frame loop ---------------- */

let t0 = performance.now();
let frames = 0, perfAcc = 0, perfN = 0, perfMax = 0, lastFrame = 0;
let busyEma = 0, workEma = 0, prevFence = null;
let readyFlag = false;

const us = gl.getUniformLocation(progScene, 'uRes');
const ut = gl.getUniformLocation(progScene, 'uTime');
const ust = gl.getUniformLocation(progScene, 'uSteps');
const ucp = gl.getUniformLocation(progScene, 'uCamPos');
const ucb = gl.getUniformLocation(progScene, 'uCamBasis');
const uco = gl.getUniformLocation(progScene, 'uCorals');
const ucb0 = gl.getUniformLocation(progScene, 'uCoralB');
const ucc = gl.getUniformLocation(progScene, 'uCoralC');
const ucd = gl.getUniformLocation(progScene, 'uCoralD');
const ufi = gl.getUniformLocation(progScene, 'uFish');
const ufib = gl.getUniformLocation(progScene, 'uFishB');
const ubr = gl.getUniformLocation(progBright, 'uTex');
const uthr = gl.getUniformLocation(progBright, 'uThresh');
const ubl = gl.getUniformLocation(progBlur, 'uTex');
const ubd = gl.getUniformLocation(progBlur, 'uDir');
const uhdr = gl.getUniformLocation(progComp, 'uHdr');
const ubloom = gl.getUniformLocation(progComp, 'uBloom');
const ugain = gl.getUniformLocation(progComp, 'uGain');
const uct = gl.getUniformLocation(progComp, 'uTime');

let prev = t0;

function frame(){
  const now = performance.now();
  const t = (now - t0) / 1000;
  let dt = (now - prev) / 1000;
  prev = now;
  dt = Math.min(dt, 0.05);
  if (lastFrame){ const dtms = now - lastFrame; perfAcc += dtms; perfN++; if (dtms > perfMax) perfMax = dtms; }
  lastFrame = now;
  frames++;
  if (prevFence){
    const w0 = performance.now();
    const st = gl.clientWaitSync(prevFence, 0, 1000000000);
    const busy = performance.now() - w0;
    if (st !== gl.WAIT_FAILED) busyEma = busyEma ? busyEma * 0.85 + busy * 0.15 : busy;
    gl.deleteSync(prevFence);
    prevFence = null;
  }
  resize();

  cam.yaw += (cam.tyaw - cam.yaw) * 0.08;
  cam.pitch += (cam.tpitch - cam.pitch) * 0.08;

  const cb = camState(t);
  buildCorals(cb.pos[0]);
  stepFish(dt, t);
  for (const f of fish){
    const dx = f.x - cb.pos[0], dy = f.y - cb.pos[1], dz = f.z - cb.pos[2];
    if (dx * dx + dy * dy + dz * dz < 9) { fishWhoosh(t); break; }
  }

  const basis = new Float32Array([
    cb.r[0], cb.r[1], cb.r[2],
    cb.u[0], cb.u[1], cb.u[2],
    cb.f[0], cb.f[1], cb.f[2],
  ]);

  gl.bindFramebuffer(gl.FRAMEBUFFER, hdr.fbo);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  gl.useProgram(progScene);
  gl.bindVertexArray(vaoEmpty);
  gl.uniform2f(us, W, H);
  gl.uniform1f(ut, t);
  gl.uniform1i(ust, stepsFor());
  gl.uniform3f(ucp, cb.pos[0], cb.pos[1], cb.pos[2]);
  gl.uniformMatrix3fv(ucb, false, basis);
  gl.uniform4fv(uco, uCorals);
  gl.uniform4fv(ucb0, uCoralB);
  gl.uniform4fv(ucc, uCoralC);
  gl.uniform4fv(ucd, uCoralD);
  gl.uniform4fv(ufi, uFish);
  gl.uniform4fv(ufib, uFishB);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.useProgram(progBright);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b1.fbo);
  gl.viewport(0, 0, b1.w, b1.h);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, hdr.tex);
  gl.uniform1i(ubr, 0);
  gl.uniform1f(uthr, 0.6);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.useProgram(progBlur);
  gl.uniform1i(ubl, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b2.fbo);
  gl.bindTexture(gl.TEXTURE_2D, b1.tex);
  gl.uniform2f(ubd, 2.4 / b1.w, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b1.fbo);
  gl.bindTexture(gl.TEXTURE_2D, b2.tex);
  gl.uniform2f(ubd, 0, 2.4 / b1.h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b2.fbo);
  gl.bindTexture(gl.TEXTURE_2D, b1.tex);
  gl.uniform2f(ubd, 5.4 / b1.w, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b1.fbo);
  gl.bindTexture(gl.TEXTURE_2D, b2.tex);
  gl.uniform2f(ubd, 0, 5.4 / b1.h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(progComp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, hdr.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, b1.tex);
  gl.uniform1i(uhdr, 0);
  gl.uniform1i(ubloom, 1);
  gl.uniform1f(ugain, 1.0);
  gl.uniform1f(uct, t);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // adaptive ladder on honest GPU busy time (fence wait), like BLACK HOLE:
  // drop raymarch steps first, then pixels.
  if (busyEma > 14){
    if (dropSteps < STEPS_TOP - STEPS_FLOOR) dropSteps += 8;
    else if (qCap > 0.55){ qCap *= 0.82; resize(); }
    busyEma = 0;
  }

  prevFence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
  const workMs = performance.now() - now;
  workEma = workEma ? workEma * 0.9 + workMs * 0.1 : workMs;
  readyFlag = true;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- DEV hooks ---------------- */

window.__reefTest = {
  get ready(){ return readyFlag; },
  get frames(){ return frames; },
  renderer(){ return RENDERER; },
  mode(){ return { gl2: true, lite: LITE, retina: RETINA }; },
  renderScale(){ return { scale: effScale(), base: RENDER_SCALE, cap: +qCap.toFixed(2), lite: LITE, retina: RETINA, w: W, h: H, css: canvas.clientWidth, dpr: window.devicePixelRatio || 1, steps: stepsFor() }; },
  pose(){ return { yaw: +cam.yaw.toFixed(3), pitch: +cam.pitch.toFixed(3) }; },
  setPose(p){
    if (p.yaw !== undefined) cam.tyaw = Math.max(-60, Math.min(60, p.yaw));
    if (p.pitch !== undefined) cam.tpitch = Math.max(-30, Math.min(30, p.pitch));
    cam.touched = performance.now();
  },
  water(){ return { sigma: [0.26, 0.15, 0.08], surfaceY: SURFACE_Y, camY: CAM_Y, camX: DRIFT * ((performance.now() - t0) / 1000) }; },
  fish(){ return { n: fish.length, order: +fishOrder().toFixed(3), species: new Set(fish.map(f => f.species)).size }; },
  corals(){ return { n: 18, cells: 6 }; },
  particles(){ return { snow: 22, bubbles: 8 }; },
  audio(){ return { crackles: crackleN, whooshes: whooshN }; },
  perf(){ return { avg: perfN ? +(perfAcc / perfN).toFixed(2) : 0, max: +perfMax.toFixed(2), n: perfN, busy: +busyEma.toFixed(1), work: +workEma.toFixed(1), steps: stepsFor(), cap: +qCap.toFixed(2) }; },
  resetPerf(){ perfAcc = 0; perfN = 0; perfMax = 0; },
};
