<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CORAL REEF — a GPU drift through the living shallows</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04182a; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #hud {
    position: fixed; left: 14px; bottom: 12px; z-index: 2; pointer-events: none;
    font: 11px/1.7 ui-monospace, Menlo, monospace; letter-spacing: .14em;
    color: rgba(214,236,232,.72); text-shadow: 0 1px 3px rgba(0,20,30,.8);
    text-transform: uppercase;
  }
  #hud b { color: rgba(210,255,244,.95); font-weight: 700; }
  #audiohint {
    position: fixed; top: 12px; right: 14px; z-index: 2;
    background: rgba(6,22,34,.5); border: 1px solid rgba(110,230,210,.26); border-radius: 8px;
    padding: 7px 12px; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    font: 11px/1.5 ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(190,240,230,.85); text-shadow: 0 1px 3px rgba(0,20,30,.8); cursor: pointer;
  }
  #audiohint.off { color: rgba(160,180,180,.5); border-color: rgba(150,150,150,.2); }
  #fatal {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 3;
    font: 14px/1.6 ui-monospace, Menlo, monospace; color: #d2ece8; background: #04182a;
    text-align: center; padding: 2em; white-space: pre;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>CORAL REEF</b> · GPU drift · drag to look · tap = ambience</div>
<div id="audiohint">click for underwater ambience</div>
<div id="fatal"></div>
<script>
'use strict';

const qs = new URLSearchParams(location.search);
const LITE = qs.get('lite') === '1';
const SEED = (qs.get('seed') | 0) || 902;
const RETINA = (window.devicePixelRatio || 1) >= 2;
const RENDER_SCALE = LITE ? 0.5 : (RETINA ? 0.8 : 0.92);

/* world: periodic period-128 drift world, y-up, surface at SURF, seabed ~1..8 */
const WORLD_L = 128.0;
const SURF = 26.0;
const DRIFT = 1.7;                       // u/s forward along +x
const SUN = (() => { const v = [0.30, 0.90, 0.32]; const m = Math.hypot(...v); return v.map(x => x / m); })();

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) {
  const f = document.getElementById('fatal');
  f.style.display = 'grid';
  f.textContent = 'WebGL2 required.\nThis reef needs a WebGL2-capable browser.';
  throw new Error('no webgl2');
}

const FISH_MAX = LITE ? 56 : 96;

/* ---------------- shaders ---------------- */

const VS_QUAD = `#version 300 es
precision highp float;
out vec2 vUv;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

/* Scene pass: raymarch seabed + coral + boulders, water absorption, caustics,
   volumetric god rays, water surface. Alpha carries the fogged hit distance
   (1-exp(-k*d)) so the fish pass can depth-test against it. */
const FS_SCENE = `#version 300 es
precision highp float;
in vec2 vUv;
uniform vec2 uRes;
uniform float uTime;
uniform int uSteps;
uniform vec3 uCamPos;
uniform mat3 uCamBasis;
out vec4 fragColor;

#define SURF ${SURF.toFixed(1)}
#define L ${WORLD_L.toFixed(1)}

const vec3 SUNDIR = normalize(vec3(${SUN.map(v => v.toFixed(3)).join(',')}));
const vec3 SIGMA = vec3(0.022, 0.014, 0.008);   // per-channel absorption: red drains first
const float FOGK = 0.030;

float h21(vec2 p){ p = fract(p * vec2(127.1, 311.7)); p += dot(p, p + 74.7); return fract(p.x * p.y); }
float h31(vec3 p){ p = fract(p * 0.1031); p += dot(p, p.yzx + 33.33); return fract((p.x + p.y) * p.z); }

float vn2(vec3 p){
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = h31(i), b = h31(i + vec3(1,0,0)), c = h31(i + vec3(0,1,0)), d = h31(i + vec3(1,1,0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

/* tileable 2D noise: lattice wraps every per cells -> world period L */
float vn2P(vec2 p, float per){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  vec2 m = mod(i + vec2(0.0), vec2(per));
  float a = h21(m);
  float b = h21(mod(i + vec2(1,0), vec2(per)));
  float c = h21(mod(i + vec2(0,1), vec2(per)));
  float d = h21(mod(i + vec2(1,1), vec2(per)));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

/* seabed: 4-octave tileable fbm + a long dune ridge; ~1..8 units high */
float terrain(vec2 p){
  vec2 w = vec2(vn2P(p / 34.0, 4.0), vn2P(p / 30.0 + 7.3, 4.0)) - 0.5;
  float h = 0.0, a = 1.0, s = 1.0 / 16.0, per = 8.0, tot = 0.0;
  for(int o = 0; o < 4; o++){
    h += a * vn2P((p + w * 9.0) * s, per);
    tot += a; a *= 0.5; s *= 2.0; per *= 2.0;
  }
  h /= tot;
  float rn = vn2P(p / 32.0 + 3.1, 4.0);
  float ridge = 1.0 - abs(rn * 2.0 - 1.0);
  return 1.1 + 5.0 * h * h + 1.8 * ridge * ridge;
}

float sdSphere(vec3 p, float r){ return length(p) - r; }
float sdCap(vec3 p, vec3 a, vec3 b, float r){
  vec3 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - r;
}
float smin(float a, float b, float k){ float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
vec3 opRotX(vec3 p, float a){ float c = cos(a), s = sin(a); return vec3(p.x, c * p.y - s * p.z, s * p.y + c * p.z); }
vec3 opRotY(vec3 p, float a){ float c = cos(a), s = sin(a); return vec3(c * p.x + s * p.z, p.y, -s * p.x + c * p.z); }

/* one coral/rock structure at its cell slot; returns (sd, mat).
   kinds: 0 branch, 1 tube sponge cluster, 2 sea fan, 3 boulder */
vec2 structure(vec3 p, float hs, float kind, float y0, float sc){
  if(kind < 0.5){                       // branching coral
    float d = sdCap(p, vec3(0.0, 0.0, 0.0), vec3(0.0, 1.5, 0.0), 0.34 * sc);
    d = smin(d, sdCap(p, vec3(0.0, 0.5, 0.0), vec3(0.75, 1.9, 0.15), 0.22 * sc), 0.25);
    d = smin(d, sdCap(p, vec3(0.02, 0.8, -0.05), vec3(-0.6, 2.3, -0.35), 0.20 * sc), 0.25);
    d = smin(d, sdCap(p, vec3(0.05, 1.2, 0.02), vec3(0.25, 2.9, 0.3), 0.16 * sc), 0.2);
    d = smin(d, sdSphere(p - vec3(0.25, 2.9, 0.3), 0.22 * sc), 0.18);
    return vec2(d, 2.0 + step(0.55, hs));       // two warm coral hues
  } else if(kind < 1.5){                // tube sponge cluster
    float d = sdCap(p, vec3(0.0, 0.0, 0.0), vec3(0.1, 1.9, 0.0), 0.30 * sc);
    d = smin(d, sdCap(p, vec3(0.5, 0.0, 0.2), vec3(0.62, 1.35, 0.28), 0.24 * sc), 0.22);
    d = smin(d, sdCap(p, vec3(-0.42, 0.0, -0.15), vec3(-0.5, 1.1, -0.2), 0.21 * sc), 0.22);
    d = smin(d, sdSphere(p - vec3(0.1, 1.9, 0.0), 0.30 * sc), 0.15);
    return vec2(d, 5.0);
  } else if(kind < 2.5){                // sea fan: trunk + thin tilted blade
    vec3 q = opRotY(p, hs * 6.2831);
    float d = sdCap(p, vec3(0.0, 0.0, 0.0), vec3(0.0, 0.9, 0.0), 0.16 * sc);
    vec3 b = q - vec3(0.0, 1.7, 0.0);
    b = opRotX(b, 0.35);
    b.z /= 0.16;                                   // flatten to a blade
    d = smin(d, (length(vec3(b.x / (1.05 * sc), b.y / (1.15 * sc), b.z)) - 1.0) * 0.55, 0.2);
    return vec2(d, 4.0);
  }                                   // boulder: smooth-min blob of three spheres
  float d = sdSphere(p - vec3(0.0, 0.9, 0.0), 1.15 * sc);
  d = smin(d, sdSphere(p - vec3(0.9, 0.6, 0.35), 0.8 * sc), 0.5);
  d = smin(d, sdSphere(p - vec3(-0.7, 0.7, -0.4), 0.7 * sc), 0.45);
  return vec2(d, 6.0);
}

/* map: seabed + coral grid (2x2 cells, 2 slots/cell), period 4 cells = L */
vec2 map(vec3 p){
  float yt = terrain(p.xz);
  float d = (p.y - yt) * 0.82;
  float mat = 1.0;
  if(d < 7.0){
    const float C = 16.0;
    vec2 c0 = floor(p.xz / C);
    for(int dj = 0; dj < 2; dj++){
      for(int di = 0; di < 2; di++){
        vec2 cellIdx = c0 + vec2(float(di), float(dj));
        vec2 cell = mod(cellIdx, 8.0);
        for(int k = 0; k < 4; k++){
          float kf = float(k);
          float hk = h21(cell * 13.7 + vec2(kf * 7.3, 2.9));
          vec2 ctrXZ = (cellIdx + vec2(0.18 + 0.64 * hk, 0.18 + 0.64 * h21(cell + kf * 3.1))) * C;
          float y0 = terrain(ctrXZ);
          float hr = h21(cell * 5.1 + kf * 1.7);
          float kind = floor(hr * 4.0);
          float sc = 1.0 + 1.2 * h21(cell * 2.3 + kf);
          vec3 ctr = vec3(ctrXZ.x, y0 + 1.6 * sc, ctrXZ.y);
          vec2 eA = ctrXZ - cellIdx * C, eB = (cellIdx + 1.0) * C - ctrXZ;
          float rr = min(3.8 * sc, min(min(eA.x, eA.y), min(eB.x, eB.y)));
          if(length(p - ctr) > rr) continue;
          vec2 sm = structure(p - vec3(ctrXZ.x, y0, ctrXZ.y), h21(cell * 9.7 + kf), kind, y0, sc);
          if(sm.x < d){ d = sm.x * 0.9; mat = sm.y; }
        }
      }
    }
  }
  return vec2(d, mat);
}

vec3 calcNormal(vec3 p){
  const vec2 e = vec2(0.012, -0.012);
  return normalize(e.xyy * map(p + e.xyy).x + e.yyx * map(p + e.yyx).x + e.yxy * map(p + e.yxy).x + e.xxx * map(p + e.xxx).x);
}

/* animated caustic web: squared sine interference, 2 octaves */
float caust(vec2 p, float t){
  vec2 q = p * 2.2;
  float v = sin(q.x * 1.9 + t * 1.35) + sin(q.y * 2.3 - t * 1.1) + sin((q.x + q.y) * 1.7 + t * 0.8);
  v = v / 3.0; v = clamp(v * 0.5 + 0.5, 0.0, 1.0);
  float w = sin(q.x * 3.7 - t * 2.1 + v * 3.0) + sin(q.y * 4.1 + t * 1.7 - v * 2.0);
  w = clamp(w / 2.0 * 0.5 + 0.5, 0.0, 1.0);
  return pow(v * v * w, 2.2);
}

/* soft large-scale shaft mask for the volumetric march (wider than caust) */
float shaft(vec2 p, float t){
  vec2 q = p * 0.8;
  float v = sin(q.x * 1.9 + t * 1.35) + sin(q.y * 2.3 - t * 1.1) + sin((q.x + q.y) * 1.7 + t * 0.8);
  v = clamp(v / 3.0 * 0.5 + 0.5, 0.0, 1.0);
  v *= 0.75 + 0.25 * sin(q.x * 6.3 - q.y * 5.1 + t * 2.0);
  return v * v;
}

void main(){
  vec2 ndc = (vUv * 2.0 - 1.0) * vec2(uRes.x / uRes.y, 1.0);
  vec3 rd = normalize(uCamBasis * vec3(ndc, 1.55));
  vec3 ro = uCamPos;

  float t = 0.0, mat = 0.0, hit = 0.0;
  for(int i = 0; i < 320; i++){
    if(i >= uSteps || t > 62.0) break;
    vec3 p = ro + rd * t;
    vec2 m = map(p);
    if(m.x < 0.012 * (1.0 + t * 0.06)){ hit = 1.0; mat = m.y; break; }
    t += m.x * (p.y - terrain(p.xz) > m.x ? 0.75 : 0.55);
  }

  vec3 col;
  float fogd = 62.0;
  if(hit > 0.5){
    vec3 p = ro + rd * t;
    vec3 n = calcNormal(p);
    float sun = max(dot(n, SUNDIR), 0.0);
    float sky = 0.5 + 0.5 * n.y;
    float caustM = 1.0;
    if(sun > 0.01){
      float k = (SURF - p.y) / SUNDIR.y;
      vec2 sp = p.xz + SUNDIR.xz * k;
      caustM = 0.50 + 0.50 * (0.18 + 0.95 * caust(sp, uTime));
    }
    vec3 light = (vec3(0.12, 0.19, 0.28) + vec3(1.20, 0.80, 0.44) * sun) * caustM;
    if(mat < 1.5){                      // sand
      float g = vn2P(p.xz * 0.5, 64.0) * 0.5 + vn2P(p.xz * 2.1, 256.0) * 0.5;
      col = mix(vec3(0.80, 0.60, 0.32), vec3(0.56, 0.44, 0.26), g) * light;
      if(n.y > 0.55) col += vec3(0.03, 0.06, 0.02) * vn2P(p.xz * 0.22, 16.0);  // algae patches
    } else if(mat < 2.5){
      col = vec3(1.00, 0.18, 0.30) * light;                       // warm coral pink
      col *= 0.85 + 0.15 * sin(p.y * 12.0 + mat);                  // polyp bands
      col += vec3(0.10, 0.03, 0.02) * smoothstep(4.0, 8.0, p.y);  // glowing tips
    } else if(mat < 3.5){
      col = vec3(1.00, 0.38, 0.08) * light;                       // coral orange
      col *= 0.85 + 0.15 * sin(p.y * 12.0 + mat);                  // polyp bands
      col += vec3(0.10, 0.05, 0.01) * smoothstep(4.0, 8.0, p.y);  // glowing tips
    } else if(mat < 4.5){
      col = vec3(0.70, 0.20, 0.72) * light;                       // fan purple
      float ribs = 0.8 + 0.2 * sin(p.y * 9.0);
      col *= ribs;
    } else if(mat < 5.5){
      col = vec3(0.88, 0.70, 0.20) * light;                       // sponge yellow
      col *= 0.86 + 0.14 * sin(p.y * 11.0);                       // polyp bands
    } else {
      col = vec3(0.42, 0.40, 0.38) * light;                       // boulder
      col = mix(col, vec3(0.30, 0.45, 0.25), smoothstep(0.55, 0.95, n.y) * vn2P(p.xz * 0.4, 32.0));
    }
    col += vec3(0.015, 0.04, 0.07) * sky;
    fogd = t;
  } else {
    col = vec3(0.02, 0.09, 0.14);
    if(rd.y > 0.02){                    // looking up through the surface
      float ts = (SURF - ro.y) / rd.y;
      vec2 surfP = (ro + rd * ts).xz;
      float rip = caust(surfP * 0.8, uTime * 0.6);
      vec3 sky = mix(vec3(0.55, 0.85, 0.92), vec3(0.10, 0.42, 0.62), clamp(rd.y * 1.6, 0.0, 1.0));
      float tr = 1.0 - exp(-ts * 0.10);
      col = mix(col, sky * (0.90 + 0.50 * rip), tr);
      fogd = ts;
    }
  }

  /* volumetric god rays: coarse march, surface caustic mask as occluder */
  float rays = 0.0;
  for(int i = 0; i < 14; i++){
    float tv = (float(i) + 0.5) * 2.3;
    if(tv > 32.0) break;
    vec3 sp = ro + rd * tv;
    float k = (SURF - sp.y) / SUNDIR.y;
    vec2 su = sp.xz + SUNDIR.xz * k;
    float m = shaft(su + vec2(uTime * 0.25, uTime * 0.12), uTime * 0.5);
    rays += pow(m, 1.5) * exp(-tv * 0.040) * (1.0 - smoothstep(4.0, 32.0, abs(sp.y - SURF * 0.55)));
  }
  rays *= 0.38 * (0.40 + 0.80 * max(rd.y, 0.0)) * (0.30 + 0.90 * max(dot(rd, SUNDIR), 0.0));

  /* water column: surface light attenuates per channel (red first), then the
     medium's teal in-scatter washes the distance; shafts are in-scatter too,
     so they are added after the fog — the fog color is light, not transmitted. */
  col *= exp(-SIGMA * fogd);
  col = mix(col, vec3(0.02, 0.10, 0.18), 1.0 - exp(-fogd * 0.013));
  col += rays * vec3(0.30, 0.60, 0.56);
  float surfGlow = smoothstep(SURF * 0.35, SURF, ro.y + max(rd.y, 0.0) * fogd * 0.5);
  col += surfGlow * vec3(0.04, 0.11, 0.14);

  float fogAlpha = 1.0 - exp(-fogd * FOGK);
  col = 1.0 - exp(-col * 1.5);
  vec2 vg = vUv * 2.0 - 1.0;
  col *= 1.0 - 0.22 * dot(vg, vg);
  fragColor = vec4(pow(col, vec3(1.0 / 2.2)), fogAlpha);
}`;

/* Fish pass: instanced billboards, procedural bodies, depth-tested against the
   scene's fogged hit distance in the alpha channel. */
const VS_FISH = `#version 300 es
precision highp float;
uniform mat3 uCamBasis;
uniform vec3 uCamPos;
uniform float uAspect;
uniform vec4 uFishA[128];   // center.xyz, size
uniform vec4 uFishB[128];   // heading, phase, species, bob
out vec2 vUv;
out vec3 vPos;
out float vKind;
out float vPhase;
void main(){
  int id = gl_InstanceID;
  vec2 q = vec2(float(gl_VertexID & 1), float((gl_VertexID >> 1) & 1)) * 2.0 - 1.0;
  q.x *= 1.5;
  vec4 A = uFishA[id];
  vec4 B = uFishB[id];
  vec3 h = vec3(cos(B.x), 0.0, sin(B.x));
  vec3 R = uCamBasis[0], U = uCamBasis[1];
  vec2 ax = normalize(vec2(dot(h, R), dot(h, U)) + vec2(1e-4, 0.0));
  vec2 ay = vec2(-ax.y, ax.x);
  float s = A.w;
  vec3 wp = A.xyz + (R * ax.x + U * ax.y) * (q.x * s) + (U * ay.y - R * ay.x) * (q.y * s * 0.55);
  vec3 rel = wp - uCamPos;
  float z = dot(rel, uCamBasis[2]);
  if(z < 0.15){ gl_Position = vec4(4.0, 4.0, 1.0, 1.0); vUv = q; vPos = rel; vKind = B.z; vPhase = B.y; return; }
  vec2 nd = vec2(dot(rel, R) * 1.55 / (z * uAspect), dot(rel, U) * 1.55 / z);
  gl_Position = vec4(nd.x, nd.y, clamp(z / 100.0, 0.0, 0.999), 1.0);
  vUv = q; vPos = rel; vKind = B.z; vPhase = B.y;
}`;

const FS_FISH = `#version 300 es
precision highp float;
in vec2 vUv;
in vec3 vPos;
in float vKind;
in float vPhase;
uniform sampler2D uScene;
uniform vec2 uRes;
uniform float uTime;
out vec4 fragColor;

float caustFish(vec2 p, float t){
  float v = sin(p.x * 1.9 + t) + sin(p.y * 2.3 - t * 0.9) + sin((p.x + p.y) * 1.7 + t * 0.7);
  v = clamp(v / 3.0 * 0.5 + 0.5, 0.0, 1.0);
  return pow(v * v, 2.0);
}

void main(){
  vec2 sc = gl_FragCoord.xy / uRes;
  float sceneFog = texture(uScene, sc).a;
  float d = length(vPos);
  float myFog = 1.0 - exp(-d * 0.030);
  if(myFog > sceneFog + 0.06) discard;

  float wig = sin(vUv.x * 3.4 + vPhase + uTime * 9.0) * 0.20;
  float xb = vUv.x + wig * max(-vUv.x + 0.3, 0.0) * 1.6;
  float yb = vUv.y + wig * 0.35;

  float body = 1.0 - smoothstep(0.86, 1.0, sqrt((xb * xb) / 0.44 + (yb * yb) / 0.10));
  float tail = (xb < -0.42) ? 1.0 - smoothstep(0.10, 0.42, abs(yb) - (-xb - 0.42) * 0.75) : 0.0;
  float dorsal = smoothstep(0.8, 1.0, 1.0 - (abs(xb - 0.05) / 0.5)) * smoothstep(0.0, 0.28, 0.24 - yb);
  float a = max(max(body, tail * 0.9), dorsal * 0.8);
  if(a < 0.02) discard;

  vec3 base, fin;
  if(vKind < 0.5){ base = vec3(0.20, 0.42, 0.85); fin = vec3(1.0, 0.82, 0.25); }
  else if(vKind < 1.5){ base = vec3(0.98, 0.50, 0.16); fin = vec3(1.0, 0.75, 0.45); }
  else if(vKind < 2.5){ base = vec3(0.78, 0.84, 0.90); fin = vec3(0.55, 0.62, 0.70); }
  else { base = vec3(1.0, 0.80, 0.20); fin = vec3(0.95, 0.60, 0.15); }
  vec3 c = mix(fin, base, body);
  if(vKind > 0.5 && vKind < 1.5 && abs(xb + 0.05) < 0.07) c = vec3(0.98, 0.95, 0.92);
  float eye = 1.0 - smoothstep(0.02, 0.05, length(vec2(xb - 0.30, yb - 0.06) / vec2(1.0, 1.4)));
  c = mix(c, vec3(0.04, 0.05, 0.07), eye * body);

  float sun = 0.55 + 0.45 * (0.5 + 0.5 * (-yb));
  c *= sun * (0.7 + 0.5 * caustFish(vPos.xz * 0.4, uTime));
  c *= exp(-d * vec3(0.022, 0.014, 0.008));
  c = mix(vec3(0.02, 0.10, 0.18), c, exp(-d * 0.013));
  c = 1.0 - exp(-c * 1.5);
  fragColor = vec4(pow(c, vec3(1.0 / 2.2)), a);
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + '\n' + src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n'));
  return s;
}
function program(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = n => gl.getUniformLocation(p, n);
  return { p, u };
}

const progScene = program(VS_QUAD, FS_SCENE);
const progFish = program(VS_FISH, FS_FISH);

const FS_COPY = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
out vec4 fragColor;
void main(){ fragColor = vec4(texture(uTex, vUv).rgb, 1.0); }`;
const progCopy = program(VS_QUAD, FS_COPY);

const vao = gl.createVertexArray();
const vaoFish = gl.createVertexArray();

const sceneTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, sceneTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
let sceneFbo = null;

let W = 0, H = 0, qCap = 1;
const STEPS_TOP = LITE ? 150 : 200;
let dropSteps = 0;
function effScale(){ return RENDER_SCALE * qCap; }
function stepsFor(){ return Math.max(LITE ? 80 : 120, STEPS_TOP - dropSteps); }

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, LITE ? 1 : 1.5);
  const cw = Math.floor(canvas.clientWidth * dpr * effScale());
  const ch = Math.floor(canvas.clientHeight * dpr * effScale());
  if(cw === W && ch === H) return;
  W = Math.max(2, cw); H = Math.max(2, ch);
  canvas.width = W; canvas.height = H;
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  if(!sceneFbo) sceneFbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
resize();
addEventListener('resize', resize);

/* ---------------- deterministic world census (harness) ---------------- */

function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const RND = mulberry32(SEED);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapL = x => ((x % WORLD_L) + WORLD_L) % WORLD_L;

/* replicate the shader grid: 4x4 cells x 4 slots, minus the continue-culls */
function census(){
  const out = [];
  for(let ix = 0; ix < 8; ix++) for(let iz = 0; iz < 8; iz++){
    for(let k = 0; k < 4; k++){
      const hk = h21js(ix * 13.7 + k * 7.3, iz * 13.7 + 2.9);
      out.push({ kind: Math.floor(hk * 4) });
    }
  }
  return out;
}
function h21js(x, y){
  let px = (x * 127.1) % 1, py = (y * 311.7) % 1;
  px = px - Math.floor(px); py = py - Math.floor(py);
  const d = px * px + py * py + 74.7 * (px + py);
  const s = (px + 1.7) * (py + 2.3) * d;
  return s - Math.floor(s);
}
const STRUCTURES = census();

/* ---------------- camera ---------------- */

const cam = { yaw: 0, pitch: 0, tyaw: 0, tpitch: 0, touched: 0 };
let drag = null, downPt = null;
canvas.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY };
  downPt = { x: e.clientX, y: e.clientY, t: performance.now() };
  canvas.setPointerCapture(e.pointerId);
  cam.touched = performance.now();
  unlockAudio();
});
canvas.addEventListener('pointermove', e => {
  if(!drag) return;
  cam.tyaw = clamp(cam.tyaw - (e.clientX - drag.x) * 0.0038, -1.15, 1.15);
  cam.tpitch = clamp(cam.tpitch - (e.clientY - drag.y) * 0.0032, -0.45, 0.5);
  drag = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', e => {
  if(downPt && performance.now() - downPt.t < 300 && Math.hypot(e.clientX - downPt.x, e.clientY - downPt.y) < 12) tapAmbience();
  drag = null; downPt = null;
});

function camState(t){
  const bx = wrapL(DRIFT * t);
  const bz = Math.sin(t * 0.07) * 6;
  const by = 11.0 + Math.sin(t * 0.13) * 1.4 + Math.sin(t * 0.29) * 0.5;
  const idle = performance.now() - cam.touched > 2500;
  if(idle){ cam.tyaw *= 0.96; cam.tpitch *= 0.96; }
  cam.yaw += (cam.tyaw - cam.yaw) * 0.12;
  cam.pitch += (cam.tpitch - cam.pitch) * 0.12;
  const yaw = cam.yaw, pitch = clamp(cam.pitch, -0.5, 0.55);
  const fwd = [Math.cos(pitch) * Math.cos(yaw), Math.sin(pitch), Math.cos(pitch) * Math.sin(yaw)];
  const up0 = [0, 1, 0];
  const right = norm(cross(up0, fwd));
  const up = cross(fwd, right);
  return { pos: [bx, by, bz], basis: [right[0], right[1], right[2], up[0], up[1], up[2], fwd[0], fwd[1], fwd[2]], by };
}
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const m = Math.hypot(...a) || 1; return a.map(x => x / m); };

/* ---------------- fish: boids in the periodic reef volume ---------------- */

const SEPR = 3.1, ALGN = 0.06, COH = 0.008, CRUISE = 1.55;
const schools = LITE ? 2 : 3;
const fish = [];
for(let s = 0; s < schools; s++){
  const n = Math.floor(FISH_MAX / schools);
  const cx = wrapL(18 + s * 16 + RND() * 12), cz = (RND() - 0.5) * 24, cy = 7 + RND() * 6;
  const dir = (RND() - 0.5) * 0.8;
  const species = s % 4;
  for(let i = 0; i < n; i++){
    const heading = dir + (RND() - 0.5) * 0.6;
    fish.push({
      x: wrapL(cx + (RND() - 0.5) * 14), y: clamp(cy + (RND() - 0.5) * 5, 5, SURF - 4), z: cz + (RND() - 0.5) * 14,
      vx: Math.cos(heading) * CRUISE, vz: Math.sin(heading) * CRUISE, vy: 0,
      species: (species + (RND() < 0.25 ? 1 : 0)) % 4,
      size: 0.5 + RND() * 0.75 + (s === 0 ? 0.35 : 0),
      phase: RND() * 6.283, wheel: RND() * 6.283,
    });
  }
}
let wheel = 0;

function stepFish(dt, t){
  wheel += dt * 0.18;
  const hw = Math.cos(wheel) * 0.012;
  for(const f of fish){
    let sx = 0, sy = 0, sz = 0, ax = 0, ay = 0, az = 0, cx = 0, cy = 0, cz = 0, nn = 0;
    for(const g of fish){
      if(g === f) continue;
      let dx = g.x - f.x; dx = wrapL(dx + WORLD_L / 2) - WORLD_L / 2;
      const dy = g.y - f.y, dz = g.z - f.z;
      const d2 = dx * dx + dy * dy + dz * dz;
      if(d2 > 64 || d2 < 1e-6) continue;
      nn++;
      if(d2 < SEPR * SEPR){ const inv = 1 / Math.sqrt(d2); sx -= dx * inv; sy -= dy * inv * 0.6; sz -= dz * inv; }
      ax += g.vx; ay += g.vy; az += g.vz;
      cx += dx; cy += dy; cz += dz;
    }
    if(nn){
      f.vx += (sx * 0.9 + ax / nn * ALGN * 16 + cx / nn * COH) * dt * 60 * 0.016;
      f.vy += (sy * 0.9 + ay / nn * ALGN * 10 + cy / nn * COH) * dt * 60 * 0.016;
      f.vz += (sz * 0.9 + az / nn * ALGN * 16 + cz / nn * COH) * dt * 60 * 0.016;
    }
    const v = Math.hypot(f.vx, f.vy, f.vz) || 1e-6;
    f.vx += (f.vx / v * CRUISE - f.vx) * dt * 2.2;
    f.vz += (f.vz / v * CRUISE - f.vz) * dt * 2.2 + hw * dt * 60;
    f.vy += (Math.sin(t * 0.9 + f.phase) * 0.35 - f.vy) * dt * 1.5;
    f.x = wrapL(f.x + f.vx * dt);
    f.z = clamp(f.z + f.vz * dt, -40, 40);
    f.y = clamp(f.y + f.vy * dt, 4.5, SURF - 3);
  }
}
function fishOrder(){
  let ux = 0, uz = 0;
  for(const f of fish){ const v = Math.hypot(f.vx, f.vz) || 1e-6; ux += f.vx / v; uz += f.vz / v; }
  return Math.hypot(ux, uz) / Math.max(1, fish.length);
}
const fishA = new Float32Array(128 * 4), fishB = new Float32Array(128 * 4);
function uploadFish(camPos){
  let n = 0;
  for(const f of fish){
    if(n >= FISH_MAX) break;
    let dx = f.x - camPos[0]; dx = wrapL(dx + WORLD_L / 2) - WORLD_L / 2;
    if(dx < -48 || dx > 70) continue;
    fishA[n * 4] = camPos[0] + dx; fishA[n * 4 + 1] = f.y; fishA[n * 4 + 2] = f.z; fishA[n * 4 + 3] = f.size;
    fishB[n * 4] = Math.atan2(f.vz, f.vx); fishB[n * 4 + 1] = f.phase; fishB[n * 4 + 2] = f.species; fishB[n * 4 + 3] = 0;
    n++;
  }
  return n;
}

/* ---------------- audio: ambience, shrimp crackles, bubbles ---------------- */

let AC = null, master = null, running = false, noiseBuf = null;
let crackleN = 0, bubblesN = 0, nextCrackle = 0;
const audiohint = document.getElementById('audiohint');

function unlockAudio(){
  if(AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
  const len = AC.sampleRate * 2;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  let last = 0;
  for(let i = 0; i < len; i++){ last = (last + (Math.random() * 2 - 1) * 0.04) / 1.02; d[i] = last * 3; }
  startAmbience();
  running = true;
  audiohint.textContent = 'ambience on';
}
function startAmbience(){
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320; lp.Q.value = 0.6;
  const g = AC.createGain(); g.gain.value = 0.32;
  src.connect(lp).connect(g).connect(master);
  src.start();
}
function crackle(){
  if(!AC || !running) return;
  crackleN++;
  const t0 = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  src.playbackRate.value = 1.4 + Math.random();
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900 + Math.random() * 2600; bp.Q.value = 7;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.05 + Math.random() * 0.05, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05 + Math.random() * 0.06);
  src.connect(bp).connect(g).connect(master);
  src.start(t0, Math.random()); src.stop(t0 + 0.14);
}
function bubble(){
  if(!AC || !running) return;
  bubblesN++;
  const t0 = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sine';
  const f0 = 380 + Math.random() * 320;
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(f0 * 2.4, t0 + 0.09);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.07, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
  o.connect(g).connect(master);
  o.start(t0); o.stop(t0 + 0.14);
}
function tapAmbience(){
  unlockAudio();
  bubble();
  setTimeout(bubble, 120 + Math.random() * 120);
  setTimeout(bubble, 320 + Math.random() * 200);
  for(let i = 0; i < 3; i++) setTimeout(crackle, i * 90 + Math.random() * 60);
}
audiohint.addEventListener('pointerdown', e => { e.stopPropagation(); unlockAudio(); });

/* ---------------- frame loop ---------------- */

const t0 = performance.now();
let frames = 0, readyFlag = false;
let perfAcc = 0, perfN = 0, perfMax = 0, lastPerfNow = t0;
let busyEma = 0, workEma = 0, rafEma = 0;
let prevFence = null, prevStamp = 0;
let lastT = t0;
let simT = 0;

function frame(){
  const now = performance.now();
  const dt = clamp((now - lastT) / 1000, 0.001, 0.05);
  lastT = now;
  simT += dt;
  const t = (now - t0) / 1000;

  if(prevFence){
    const w0 = performance.now();
    const st = gl.clientWaitSync(prevFence, 0, 1000000000);
    const busy = performance.now() - w0;
    if(st !== gl.WAIT_FAILED){
      busyEma = busyEma ? busyEma * 0.85 + busy * 0.15 : busy;
      gl.deleteSync(prevFence);
      prevFence = null;
    }
  }

  resize();
  stepFish(dt, t);
  if(now > nextCrackle){ crackle(); nextCrackle = now + 500 + Math.random() * 2200; }

  const cs = camState(t);

  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.BLEND);
  gl.useProgram(progScene.p);
  gl.bindVertexArray(vao);
  gl.uniform2f(progScene.u('uRes'), W, H);
  gl.uniform1f(progScene.u('uTime'), t);
  gl.uniform1i(progScene.u('uSteps'), stepsFor());
  gl.uniform3fv(progScene.u('uCamPos'), cs.pos);
  gl.uniformMatrix3fv(progScene.u('uCamBasis'), false, cs.basis);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(progCopy.p);
  gl.bindVertexArray(vao);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.uniform1i(progCopy.u('uTex'), 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const nFish = uploadFish(cs.pos);
  if(nFish){
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(progFish.p);
    gl.bindVertexArray(vaoFish);
    gl.uniformMatrix3fv(progFish.u('uCamBasis'), false, cs.basis);
    gl.uniform3fv(progFish.u('uCamPos'), cs.pos);
    gl.uniform1f(progFish.u('uAspect'), W / H);
    gl.uniform1f(progFish.u('uTime'), t);
    gl.uniform4fv(progFish.u('uFishA'), fishA);
    gl.uniform4fv(progFish.u('uFishB'), fishB);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.uniform1i(progFish.u('uScene'), 0);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, nFish);
    gl.disable(gl.BLEND);
  }

  const over = busyEma > 14 || (busyEma < 1 && rafEma > 30);
  if(over){
    if(dropSteps < STEPS_TOP - (LITE ? 80 : 120)) dropSteps += 15;
    else if(qCap > 0.55){ qCap *= 0.82; resize(); }
    busyEma = 0;
  }

  prevFence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
  prevStamp = now;
  gl.flush();

  const frameMs = now - lastPerfNow;
  lastPerfNow = now;
  perfAcc += frameMs; perfN++; perfMax = Math.max(perfMax, frameMs);
  rafEma = rafEma ? rafEma * 0.9 + frameMs * 0.1 : frameMs;
  const jsMs = performance.now() - now;
  workEma = workEma ? workEma * 0.9 + jsMs * 0.1 : jsMs;
  frames++;
  readyFlag = true;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- DEV hooks ---------------- */

window.__reefTest = {
  get ready(){ return readyFlag; },
  get frames(){ return frames; },
  mode(){ return { canvas: 'webgl2', gl2: true, lite: LITE, retina: RETINA }; },
  renderScale(){ return { scale: +effScale().toFixed(3), base: RENDER_SCALE, cap: +qCap.toFixed(2), lite: LITE, retina: RETINA, steps: stepsFor(), w: W, h: H, css: canvas.clientWidth, dpr: window.devicePixelRatio || 1 }; },
  pose(){ const cs = camState((performance.now() - t0) / 1000); return { look: +(cam.yaw * 180 / Math.PI).toFixed(1), y: +cs.by.toFixed(1), x: +cs.pos[0].toFixed(1) }; },
  setPose(p){
    if(p.look !== undefined){ cam.tyaw = p.look * Math.PI / 180; cam.yaw = cam.tyaw; }
    if(p.y !== undefined){ cam.tpitch = clamp(p.y * Math.PI / 180 * 0.01, -0.45, 0.5); cam.pitch = cam.tpitch; }
    cam.touched = performance.now() + 9999;
  },
  fish(){ return { n: fish.length, order: +fishOrder().toFixed(3), species: new Set(fish.map(f => f.species)).size }; },
  audio(){ return { crackles: crackleN, bubbles: bubblesN }; },
  particles(){ return { snow: 0, bubbles: bubblesN }; },
  corals(){ return { n: STRUCTURES.length, kinds: new Set(STRUCTURES.map(s => s.kind)).size }; },
  perf(){ return { avg: perfN ? +(perfAcc / perfN).toFixed(2) : 0, max: +perfMax.toFixed(2), n: perfN, busy: +busyEma.toFixed(1), work: +workEma.toFixed(1), steps: stepsFor(), cap: +qCap.toFixed(2) }; },
  resetPerf(){ perfAcc = 0; perfN = 0; perfMax = 0; },
};
</script>
